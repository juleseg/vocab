// --- Petits constructeurs de formulaire ---
function formField(labelText, input, required, hint) {
  const f = el("div", "field");
  const lab = el("label", null, labelText);
  if (required) lab.appendChild(el("span", "req", " *"));
  f.append(lab, input);
  if (hint) f.appendChild(el("div", "hint", hint));
  return f;
}
function textInput(value, placeholder, lang) {
  const i = el("input", "input");
  i.type = "text"; i.value = value || ""; i.autocomplete = "off";
  if (placeholder) i.placeholder = placeholder;
  if (lang) i.lang = lang;
  return i;
}
// Listes groupées par dossier (ordre d'affichage) ; withNew : option « + Nouvelle liste ».
function listSelect(selectedId, withNew) {
  const s = el("select", "input");
  const add = (parent, l) => { const o = el("option", null, l.name); o.value = l.id; parent.appendChild(o); };
  const folders = sortedFolders();
  folders.forEach(f => {
    const ls = listsIn(f.id);
    if (!ls.length) return;
    const g = el("optgroup"); g.label = f.name;
    ls.forEach(l => add(g, l));
    s.appendChild(g);
  });
  const loose = listsIn(null);
  if (loose.length) {
    if (folders.length) { const g = el("optgroup"); g.label = t("folders.none"); loose.forEach(l => add(g, l)); s.appendChild(g); }
    else loose.forEach(l => add(s, l));
  }
  if (withNew) { const o = el("option", null, t("bulk.newList")); o.value = "__new__"; s.appendChild(o); }
  if (selectedId && (selectedId === "__new__" ? withNew : getList(selectedId))) s.value = selectedId;
  return s;
}
// Dossiers ("" = sans dossier) ; withNew : option « + Nouveau dossier ».
function folderSelect(selectedId, withNew) {
  const s = el("select", "input");
  const o0 = el("option", null, t("folders.none")); o0.value = ""; s.appendChild(o0);
  sortedFolders().forEach(f => { const o = el("option", null, f.name); o.value = f.id; s.appendChild(o); });
  if (withNew) { const o = el("option", null, t("folders.newOption")); o.value = "__new__"; s.appendChild(o); }
  s.value = selectedId && (selectedId === "__new__" || getFolder(selectedId)) ? selectedId : "";
  return s;
}

// --- Langues : apprise + d'appui (compte, dossier ou liste) ---
// Dossier / liste : « Utiliser le réglage du compte / du dossier » (héritage) ou réglage propre.
function cardsUnder(kind, obj) {
  if (kind === "list") return cardsOf(obj.id);
  if (kind === "folder") { const ids = new Set(listsIn(obj.id).map(l => l.id)); return state.cards.filter(c => ids.has(c.listId)); }
  return state.cards;
}
function unusableIds() { return new Set(state.cards.filter(c => !cardUsable(c)).map(c => c.id)); }
// Après un changement de langue : cartes qui n'ont pas de mot dans la nouvelle langue apprise (pas proposées en révision).
function warnUnusable(before) {
  const n = state.cards.filter(c => !before.has(c.id) && !cardUsable(c)).length;
  if (n) setTimeout(() => toast(t("langs.unusable", { n })), 2300);
}
function langPicker(target, support, onChange) {
  const wrap = el("div");
  const seg = el("div", "seg");
  LANG_CODES.forEach(code => {
    const b = el("button", null, langName(code));
    b.type = "button";
    b.setAttribute("aria-pressed", String(code === target));
    b.addEventListener("click", () => {
      // La nouvelle langue apprise prend la place de l'ancienne dans les langues d'appui (fr ← ko, en  ⇒  ko ← fr, en).
      let sp = support.map(x => x === code ? target : x);
      sp = cleanSupport(sp, code);
      if (!sp.length) sp = defaultSupportFor(code);
      onChange(code, sp);
    });
    seg.appendChild(b);
  });
  wrap.appendChild(formField(t("langs.target"), seg));
  const chips = el("div", "chips");
  LANG_CODES.filter(c => c !== target).forEach(code => {
    const b = el("button", null, langName(code));
    b.type = "button";
    b.setAttribute("aria-pressed", String(support.includes(code)));
    b.addEventListener("click", () => { const sp = support.slice(); toggleIn(sp, code); onChange(target, sp); });
    chips.appendChild(b);
  });
  wrap.appendChild(formField(t("langs.support"), chips, false, t("langs.supportHint")));
  return wrap;
}
function openLangEditor(kind, obj) {
  const parent = kind === "list" ? folderLangs(getFolder(obj.folderId)) : kind === "folder" ? accountLangs() : null;
  const cur = kind === "account" ? accountLangs() : kind === "folder" ? folderLangs(obj) : listLangs(obj);
  let inherit = !!parent && !isLang(obj.target);
  let target = cur.target, support = cur.support.slice();
  const wrap = el("div");
  const draw = () => {
    wrap.textContent = "";
    if (kind !== "account") wrap.appendChild(el("p", "muted", t(kind === "list" ? "langs.forList" : "langs.forFolder", { name: obj.name })));
    if (parent) {
      const lab = el("label", "check-row");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = inherit;
      cb.addEventListener("change", () => { inherit = cb.checked; if (inherit) { target = parent.target; support = parent.support.slice(); } draw(); });
      lab.append(cb, document.createTextNode(t(kind === "list" ? "langs.inheritFolder" : "langs.inheritAccount", { pair: pairLabel(parent) })));
      wrap.appendChild(lab);
    }
    if (!inherit) wrap.appendChild(langPicker(target, support, (tg, sp) => { target = tg; support = sp; draw(); }));
    const n = cardsUnder(kind, obj).filter(c => isVocab(c) && !term(c, inherit ? parent.target : target).trim()).length;
    if (n) wrap.appendChild(el("div", "hint", t("langs.missing", { n, lang: langName(inherit ? parent.target : target) })));
  };
  draw();
  openModal(t("langs.title"), wrap, [
    { label: t("cancel") },
    { label: t("save"), kind: "primary", onClick: () => {
      if (!inherit && !support.length) { toast(t("langs.supportRequired")); return false; }
      const before = unusableIds();
      if (kind === "account") { state.settings.defaultTarget = target; state.settings.defaultSupport = support.slice(); }
      else if (inherit) { delete obj.target; delete obj.support; }
      else { obj.target = target; obj.support = support.slice(); }
      commit();
      warnUnusable(before);
    } }
  ]);
}

// --- Dossiers : créer, renommer, menu, supprimer ---
function openFolderName(id, onCreated) {
  const f = id ? getFolder(id) : null;
  const inp = textInput(f ? f.name : "", "");
  const wrap = el("div");

// --- Cartes : ajouter, modifier, déplacer (choix de la liste), supprimer ---
// Formulaire adapté au type (nouvelle carte : menu « Type » ; carte existante : type fixe).
// Vocabulaire : champs selon les langues de la liste choisie (langue apprise obligatoire, puis langues d'appui) ;
// les autres langues de la carte sont gardées telles quelles. Changer de liste garde ce qui a été tapé.
// Autres types : champs du type, dans la langue apprise de la liste (temps et personnes lus dans LANGUAGES.grammar).
let lastNewType = "vocab";
function openCardEditor(cardId, listId) {
  const c = cardId ? state.cards.find(x => x.id === cardId) : null;
  if (cardId && !c) return;
  if (!state.lists.length) { toast(t("lists.empty")); return; }
  const sel = listSelect(c ? c.listId : listId, false);
  let type = c ? cardType(c) : lastNewType;
  const tags = textInput(c ? c.tags.join(", ") : "", t("type.tagsPh"));
  const body = el("div");
  let form = null;
  const build = () => {
    body.textContent = "";
    form = type === "vocab" ? vocabForm(c, sel) : typedForm(c, sel, type);
    body.appendChild(form.node);
  };
  sel.addEventListener("change", () => form.redraw());
  const wrap = el("div");
  wrap.appendChild(formField(t("card.list"), sel));
  if (!c) {
    const ts = el("select", "input");
    CARD_TYPES.forEach(x => { const o = el("option", null, TYPE_ICON[x] + "  " + t("type." + x)); o.value = x; ts.appendChild(o); });
    ts.value = type;
    ts.addEventListener("change", () => { type = lastNewType = ts.value; build(); });
    wrap.appendChild(formField(t("type.label"), ts));
  } else if (type !== "vocab") {
    const f = el("div", "field"); f.appendChild(typeBadge(type)); wrap.appendChild(f);
  }
  build();
  wrap.append(body, formField(t("card.tags"), tags));
  const save = () => {
    const r = form.save(parseTags(tags.value));
    if (!r) return false;                          // champ manquant : message déjà affiché, fenêtre gardée
    commit();
    if (r.added && r.added.length) {               // journal : cartes ajoutées à la main (regroupées par liste et par heure)
      const per = {};
      r.added.forEach(id => { const x = state.cards.find(y => y.id === id); if (x) per[x.listId] = (per[x.listId] || 0) + 1; });
      Object.keys(per).forEach(l => Activity.cardsAdded(l, per[l]));
    }
    if (r.added && r.added.length && type === "vocab") offerCompletion(r.added); // champs vides : proposer de les compléter
    if (r.msg) toast(r.msg);
  };
  openModal(t(c ? "card.editTitle" : "card.newTitle"), wrap, c
    ? [ { label: t("save"), kind: "primary", onClick: save },
        { label: t("card.delete"), kind: "danger", onClick: () => { confirmDeleteCard(c.id); } },
        { label: t("cancel") } ]
    : [ { label: t("cancel") }, { label: t("save"), kind: "primary", onClick: save } ]);
}

// Formulaire vocabulaire. save(tags) → { added: [ids] } ou null (champ manquant).
function vocabForm(c, sel) {
  const vals = Object.assign({}, c ? c.terms : {});
  const posVals = Object.assign({}, c ? c.pos : {});
  let inputs = {}, posSels = {}, lg = null;
  const termsBox = el("div");
  const ex = el("textarea", "input"); ex.value = c ? c.example : "";
  const exField = formField("", ex);
  const node = el("div");
  node.append(termsBox, exField);
  const draw = () => {
    Object.keys(inputs).forEach(k => { vals[k] = inputs[k].value; });
    Object.keys(posSels).forEach(k => { posVals[k] = posSels[k].value; });
    termsBox.textContent = ""; inputs = {}; posSels = {};
    lg = listLangs(sel.value);
    [lg.target].concat(lg.support).forEach((code, i) => {
      const inp = textInput(vals[code] || "", langSample(code), code);
      inputs[code] = inp;
      // Nature grammaticale du mot dans cette langue (abréviation de la langue + nom dans la langue de l'interface)
      const ps = el("select", "input");
      ps.setAttribute("aria-label", t("pos.label") + " (" + langName(code) + ")");
      const o0 = el("option", null, t("pos.label") + " —"); o0.value = ""; ps.appendChild(o0);
      const codes = posCodesFor(code);
      const cur = posVals[code] || "";
      if (cur && !codes.includes(cur)) codes.push(cur); // valeur importée non reconnue : gardée
      codes.forEach(pc => { const o = el("option", null, posLabel(pc, code) + (POS_CODES.includes(pc) ? " — " + t("pos." + pc) : "")); o.value = pc; ps.appendChild(o); });
      ps.value = cur;
      posSels[code] = ps;
      const row = el("div", "term-row");
      row.append(inp, ps);
      termsBox.appendChild(i === 0 ? formField(langName(code), row, true, t("card.frHint")) : formField(langName(code), row));
    });
    ex.lang = lg.target;
    exField.firstChild.textContent = t("card.exampleIn", { lang: langName(lg.target) });
  };
  draw();
  const save = tagList => {
    Object.keys(inputs).forEach(k => { vals[k] = inputs[k].value.trim(); });
    Object.keys(posSels).forEach(k => { posVals[k] = posSels[k].value; });
    if (!vals[lg.target]) { toast(t("card.targetRequired", { lang: langName(lg.target) })); return null; }
    if (!lg.support.some(code => vals[code])) { toast(t("card.supportRequired", { langs: lg.support.map(x => langName(x)).join(", ") })); return null; }
    const terms = normTerms(vals);
    const pos = normTerms(posVals);
    if (c) {
      // Champ modifié à la main : il n'est plus « généré, non validé »
      c.auto = c.auto.filter(a => !(a.startsWith("terms.") && (terms[a.slice(6)] || "") !== (c.terms[a.slice(6)] || "")) && !(a === "example" && ex.value.trim() !== c.example)
        && !(a.startsWith("pos.") && (pos[a.slice(4)] || "") !== ((c.pos || {})[a.slice(4)] || "")));
      c.listId = sel.value; c.terms = terms; c.pos = pos;
      c.example = ex.value.trim(); c.tags = tagList;
      return { added: [] };
    }
    const nc = newCard(sel.value, terms, ex.value.trim(), tagList, pos);
    state.cards.push(nc);
    return { added: [nc.id] };
  };
  return { node, redraw: draw, save };
}

// Menu « Règle liée » : fiches de règle de la même langue (celles de la liste d'abord).
function ruleSelect(lang, listId, current) {

  s.value = current && [...s.options].some(o => o.value === current) ? current : "";

function taInput(value, placeholder, lang, rows) {
  const ta = el("textarea", "input"); ta.value = value || ""; ta.rows = rows || 2;

  if (lang) ta.lang = lang;

// Formulaire des autres types (conj, cloze, fix, rule). save(tags) → { added: [ids], msg } ou null.
function typedForm(c, sel, type) {
  const node = el("div");
  const v = Object.assign({}, c || {});           // valeurs en cours (gardées quand la liste change)
  let ins = {};                                   // champs affichés : nom → élément
  let conjMode = c ? "one" : "table";             // conjugaison : une forme, ou tableau entier (nouvelle carte)
  let tableVals = {};                             // tableau : id de personne → forme tapée
  let lang = null;
  const keep = () => {
    Object.keys(ins).forEach(k => { if (k.startsWith("p:")) tableVals[k.slice(2)] = ins[k].value; else v[k] = ins[k].value; });
  };
  const add = (key, label, input, required, hint) => { ins[key] = input; node.appendChild(formField(label, input, required, hint)); return input; };
  const draw = () => {
    keep();
    node.textContent = ""; ins = {};
    lang = listLangs(sel.value).target;
    const ln = langName(lang), sup = listLangs(sel.value).support.map(x => langName(x)).join(", ");
    if (type === "conj") {
      add("verb", t("type.conj.verb") + " (" + ln + ")", textInput(v.verb, "", lang), true);
      const ts = el("select", "input");
      tensesOf(lang).forEach(x => { const o = el("option", null, locText(x.names) + (x.optional ? " — " + t("type.optional") : "")); o.value = x.id; ts.appendChild(o); });
      if (tenseOf(lang, v.tense)) ts.value = v.tense; else v.tense = ts.value;
      ts.addEventListener("change", () => { v.tense = ts.value; draw(); });
      node.appendChild(formField(t("type.conj.tense"), ts, true));
      if (!c) {
        const seg = el("div", "seg");
        [["table", "type.conj.modeTable"], ["one", "type.conj.modeOne"]].forEach(([m, k]) => {
          const b = el("button", null, t(k)); b.type = "button";
          b.setAttribute("aria-pressed", String(m === conjMode));
          b.addEventListener("click", () => { keep(); conjMode = m; draw(); });
          seg.appendChild(b);
        });
        node.appendChild(formField(t("type.conj.mode"), seg));
      }
      const ps = personsOf(lang, v.tense);
      if (conjMode === "table") {
        const box = el("div", "conj-grid");
        ps.forEach(p => {
          const inp = textInput(tableVals[p.id] || "", "", lang);
          ins["p:" + p.id] = inp;
          const lab = el("label", null, personLabel(lang, v.tense, p.id));
          box.append(lab, inp);
        });
        node.appendChild(formField(t("type.conj.forms"), box, true, t("type.conj.formsHint")));
      } else {
        const psel = el("select", "input");
        ps.forEach(p => { const o = el("option", null, personLabel(lang, v.tense, p.id)); o.value = p.id; psel.appendChild(o); });
        if (ps.some(p => p.id === v.person)) psel.value = v.person;
        add("person", t("type.conj.person"), psel, true);
        add("answer", t("type.conj.answer"), textInput(v.answer, "", lang), true, t("card.frHint"));
      }
      add("translation", t("type.translation"), textInput(v.translation, sup), false, t("type.conj.trHint"));
      const note = add("note", t("type.note"), textInput(v.note, "", ""), false);
      const dl = el("datalist"); dl.id = "conjNotes-" + uid();
      arr(grammarOf(lang).notes).forEach(n => { const o = el("option"); o.value = locText(n); dl.appendChild(o); });
      note.setAttribute("list", dl.id); node.appendChild(dl);
      if (c) { const b = el("button", "link-btn", t("type.seeTable")); b.type = "button"; b.addEventListener("click", () => openConjTable(c)); node.appendChild(b); }
    } else if (type === "cloze") {
      add("sentence", t("type.cloze.sentence") + " (" + ln + ")", taInput(v.sentence, langSampleCloze(lang), lang), true, t("type.cloze.sentenceHint"));
      add("answer", t("type.cloze.answer"), textInput(v.answer, "", lang), true, t("card.frHint"));
      add("hint", t("type.hint"), textInput(v.hint, "", ""), false);
      add("explanation", t("type.explanation"), taInput(v.explanation, "", ""), false);
      add("translation", t("type.translationSent"), textInput(v.translation, sup), false);
      add("ruleId", t("type.rule.link"), ruleSelect(lang, sel.value, v.ruleId), false);
    } else if (type === "fix") {
      add("wrong", t("type.fix.wrong") + " (" + ln + ")", taInput(v.wrong, "", lang), true);
      add("correct", t("type.fix.correct"), taInput(v.correct, "", lang), true);
      add("explanation", t("type.explanation"), taInput(v.explanation, "", ""), false);
      add("ruleId", t("type.rule.link"), ruleSelect(lang, sel.value, v.ruleId), false);
    } else if (type === "rule") {
      add("title", t("type.rule.title"), textInput(v.title, "", ""), true);
      add("body", t("type.rule.body"), taInput(v.body, "", "", 5), true, t("type.rule.bodyHint"));
      add("examples", t("type.rule.examples") + " (" + ln + ")", taInput(v.examples != null && Array.isArray(v.examples) ? v.examples.join("\n") : (v.examples || ""), "", lang, 3), false, t("type.rule.examplesHint"));
      add("translation", t("type.rule.translation"), taInput(v.translation, sup, ""), false);
    }
  };
  draw();
  const need = (k, msgKey) => { if (!String(v[k] || "").trim()) { toast(t(msgKey || "type.required", { f: k })); return false; } return true; };
  const save = tagList => {
    keep();
    const listId = sel.value;
    if (type === "conj") {
      if (!String(v.verb || "").trim()) { toast(t("type.err.verb")); return null; }
      const base = { lang, verb: v.verb, tense: v.tense, translation: v.translation, note: v.note };
      if (c) {
        if (!String(v.answer || "").trim()) { toast(t("type.err.answer")); return null; }
        Object.assign(c, normTypedFields("conj", Object.assign(base, { person: v.person, answer: v.answer })), { listId, tags: tagList });
        return { added: [] };
      }
      if (conjMode === "one") {
        if (!String(v.answer || "").trim()) { toast(t("type.err.answer")); return null; }
        const nc = newTypedCard(listId, "conj", Object.assign(base, { person: v.person || personsOf(lang, v.tense)[0].id, answer: v.answer }), tagList);
        state.cards.push(nc);
        return { added: [nc.id] };
      }
      // Tableau : une carte par case remplie ; une carte existante (même liste, verbe, temps, personne) est mise à jour.
      const ps = personsOf(lang, v.tense).filter(p => String(tableVals[p.id] || "").trim());
      if (!ps.length) { toast(t("type.err.table")); return null; }
      const added = []; let upd = 0;
      const vk = normText(v.verb);
      ps.forEach(p => {
        const f = Object.assign({}, base, { person: p.id, answer: tableVals[p.id] });
        const ex = state.cards.find(x => cardType(x) === "conj" && x.listId === listId && x.lang === lang && x.tense === v.tense && x.person === p.id && normText(x.verb) === vk);
        if (ex) { Object.assign(ex, normTypedFields("conj", f)); upd++; }
        else { const nc = newTypedCard(listId, "conj", f, tagList); state.cards.push(nc); added.push(nc.id); }
      });
      return { added, msg: t("type.conj.saved", { n: added.length, m: upd }) };
    }
    if (type === "cloze") {
      if (!CLOZE_GAP.test(v.sentence || "")) { toast(t("type.err.gap")); return null; }
      if (!need("answer", "type.err.answer")) return null;
    }
    if (type === "fix" && (!need("wrong", "type.err.wrong") || !need("correct", "type.err.correct"))) return null;
    if (type === "fix" && wrClean(v.wrong) === wrClean(v.correct)) { toast(t("type.err.same")); return null; }
    if (type === "rule" && (!need("title", "type.err.title") || !need("body", "type.err.body"))) return null;
    const f = Object.assign({}, v, { lang });
    if (type === "rule") f.examples = String(v.examples || "").split("\n");
    if (c) { Object.assign(c, normTypedFields(type, f), { listId, tags: tagList }); return { added: [] }; }
    const nc = newTypedCard(listId, type, f, tagList);
    state.cards.push(nc);
    return { added: [nc.id] };
  };
  return { node, redraw: draw, save };
}
// Exemple de phrase à trous pour une langue : celle de sa démo.
function langSampleCloze(code) { const x = arr((LANGUAGES[code] && LANGUAGES[code].demo || {}).cards).find(y => y.type === "cloze"); return x ? x.sentence : "___"; }

function confirmDeleteCard(id) {

    { label: t("cancel") },
    { label: t("delete"), kind: "danger", onClick: () => { state.cards = state.cards.filter(x => x.id !== id); commit(); } }
  ]);

// === IMPORT EN MASSE (TEXTE & FICHIER) ===
// Une ligne par carte, colonnes séparées par ";" (ou tabulation, détectée automatiquement).
// Colonnes par défaut : langues d'appui, langue apprise, exemple, tags, nature (ex. coréen;anglais;français;exemple;tags).
// Ligne d'en-tête reconnue (codes ou noms de langues, exemple, tags, nature) : colonnes associées automatiquement.
// Dans l'aperçu : un menu au-dessus de chaque colonne pour corriger l'association ; le dernier choix est mémorisé
// (localStorage "vocabfr.importMap") et repris si la langue apprise y figure.
// Un seul analyseur pour le collage et les fichiers .txt/.csv : BOM retiré, fins de ligne \r\n / \r / \n, lignes vides ignorées.
const BULK_CHUNK = 2000;   // lignes traitées avant de rendre la main à l'écran
const BULK_PAGE = 100;     // lignes par page dans l'aperçu
const BULK_KINDS = ["example", "tags", "pos", "ignore"]; // en plus des codes de langue
const yieldUI = () => new Promise(r => setTimeout(r, 0));

function bulkLines(text) {
  return String(text || "").replace(/^﻿/, "").split(/\r\n|\r|\n/);
}
function bulkSeparator(lines) {
  let tab = 0, semi = 0, n = 0;
  for (const l of lines) {
    if (!l.trim()) continue;
    if (l.includes("\t")) tab++;
    if (l.includes(";")) semi++;
    if (++n >= 50) break;
  }
  return tab > semi ? "\t" : ";";
}
// Nature d'une cellule d'en-tête : code de langue, "example", "tags", "pos", ou null (non reconnue).
const HEADER_WORDS = {
  example: ["example", "examples", "exemple", "exemples", "예문", "phrase"],
  tags: ["tags", "tag", "태그", "etiquettes"],
  pos: ["nature", "pos", "품사", "nature grammaticale", "part of speech"]
};
function headerKind(cell) {
  const n = normText(cell);
  if (!n) return null;
  for (const code of LANG_CODES) {
    if (n === code || Object.values(LANGUAGES[code].names).some(x => normText(x) === n)) return code;
  }
  for (const k of Object.keys(HEADER_WORDS)) if (HEADER_WORDS[k].includes(n)) return k;
  return null;
}
// En-tête : au moins 2 cellules reconnues et aucune cellule remplie non reconnue.
function parseHeader(cols) {
  const kinds = cols.map(headerKind);
  const known = kinds.filter(Boolean).length;
  if (known < 2 || cols.some((c, i) => c.trim() && !kinds[i])) return null;
  return kinds.map(k => k || "ignore");
}
function countBulkLines(text) { return bulkLines(text).filter(l => l.trim()).length; }
// Association par défaut : langues d'appui, langue apprise, exemple, tags, nature, puis colonnes ignorées.
function defaultBulkMap(n, lg) {
  const base = lg.support.concat([lg.target, "example", "tags", "pos"]);
  const out = [];
  for (let i = 0; i < n; i++) out.push(base[i] || "ignore");
  return out;
}
// Une même association (sauf "ignore") ne peut servir qu'une fois.
function fixBulkMap(map) {
  const used = new Set();
  return map.map(k => {
    if (k !== "ignore" && (used.has(k) || !(isLang(k) || BULK_KINDS.includes(k)))) return "ignore";
    used.add(k); return k;
  });
}
function savedBulkMap(n, lg) {
  try {
    const m = JSON.parse(localStorage.getItem(CONFIG.LS_USER_PREFIX + "importMap") || "null");
    if (m && Array.isArray(m.cols) && m.cols.length === n && m.cols.includes(lg.target)) return fixBulkMap(m.cols.map(String));
  } catch (e) {}
  return null;
}
function rememberBulkMap(map) {
  try { localStorage.setItem(CONFIG.LS_USER_PREFIX + "importMap", JSON.stringify({ cols: map })); } catch (e) {}
}
function bulkKindLabel(k) { return isLang(k) ? langName(k) : t("bulk.kind." + k); }

// --- Lignes d'autres types de cartes ---
// 1re colonne = vocab, conj, conjtab, trou, erreur ou regle (sinon : ligne de vocabulaire, format habituel).
//   conj;verbe;temps;personne;forme;traduction;note
//   conjtab;verbe;temps;forme1|forme2|…;traduction;note   → une carte par personne, dans l'ordre de la langue
//   trou;phrase avec ___;réponse;indice;explication;traduction
//   erreur;phrase fautive;phrase corrigée;explication
//   regle;titre;texte;exemple1|exemple2|…;traduction       (\n dans le texte = retour à la ligne)
// Temps et personnes : id de LANGUAGES.grammar ou nom dans n'importe quelle langue d'interface. Langue = langue apprise de la liste.
const TYPE_PREFIX = { vocab: "vocab", conj: "conj", conjtab: "conjtab", trou: "cloze", cloze: "cloze", erreur: "fix", fix: "fix", regle: "rule", rule: "rule" };
function linePrefix(cols) { return TYPE_PREFIX[normText(cols[0]).replace(/\s+/g, "")] || null; }
function isTypedLine(line, sep) { const p = linePrefix(line.trim().split(sep)); return !!p && p !== "vocab"; }
// Clé de doublon d'une carte d'un autre type (même liste).
function typedKey(type, f) {
  if (type === "conj") return "conj|" + f.lang + "|" + normText(f.verb) + "|" + f.tense + "|" + f.person;
  if (type === "cloze") return "cloze|" + normText(f.sentence);
  if (type === "fix") return "fix|" + normText(f.wrong);
  if (type === "rule") return "rule|" + normText(f.title);
  return "";
}
// → { rows: [{ type, fields }] } ou { err: texte }
function parseTypedLine(kind, cols, lang) {
  const c = i => String(cols[i] || "").trim();
  if (kind === "conj" || kind === "conjtab") {
    if (!c(1)) return { err: t("type.err.verb") };
    const tn = findTense(lang, c(2));
    if (!tn) return { err: t("bulk.err.tense", { v: c(2), lang: langName(lang) }) };
    const ps = personsOf(lang, tn.id);
    if (kind === "conj") {
      const p = findPerson(lang, tn.id, c(3));
      if (!p) return { err: t("bulk.err.person", { v: c(3) }) };
      if (!c(4)) return { err: t("type.err.answer") };
      return { rows: [{ type: "conj", fields: { lang, verb: c(1), tense: tn.id, person: p.id, answer: c(4), translation: c(5), note: c(6) } }] };
    }
    const forms = c(3).split("|").map(x => x.trim());
    if (!forms.some(Boolean)) return { err: t("type.err.table") };
    if (forms.length > ps.length) return { err: t("bulk.err.forms", { n: forms.length, m: ps.length }) };
    return { rows: forms.map((f, i) => f ? { type: "conj", fields: { lang, verb: c(1), tense: tn.id, person: ps[i].id, answer: f, translation: c(4), note: c(5) } } : null).filter(Boolean) };
  }
  if (kind === "cloze") {
    if (!CLOZE_GAP.test(c(1))) return { err: t("type.err.gap") };
    if (!c(2)) return { err: t("type.err.answer") };
    return { rows: [{ type: "cloze", fields: { lang, sentence: c(1), answer: c(2), hint: c(3), explanation: c(4), translation: c(5) } }] };
  }
  if (kind === "fix") {
    if (!c(1)) return { err: t("type.err.wrong") };
    if (!c(2)) return { err: t("type.err.correct") };
    return { rows: [{ type: "fix", fields: { lang, wrong: c(1), correct: c(2), explanation: c(3) } }] };
  }
  if (kind === "rule") {
    if (!c(1)) return { err: t("type.err.title") };
    if (!c(2)) return { err: t("type.err.body") };
    return { rows: [{ type: "rule", fields: { lang, title: c(1), body: c(2).replace(/\\n/g, "\n"), examples: c(3).split("|"), translation: c(4) } }] };
  }
  return { err: "?" };
}
// Exemple de saisie (zone de collage), construit depuis la démo des langues de l'import.
function bulkPlaceholder(lg) {
  const D = (LANGUAGES[lg.target] && LANGUAGES[lg.target].demo) || {};
  const lines = arr(D.words).slice(2, 4).map(w => {
    const tr = lg.support.map(code => { const x = arr((LANGUAGES[code].demo || {}).words).find(y => y.key === w.key); return x ? x.term : ""; });
    return tr.concat([w.term, w.ex || "", arr(w.tags).join(",")]).join(";");
  });
  const cz = arr(D.cards).find(x => x.type === "cloze");
  if (cz) lines.push("trou;" + cz.sentence + ";" + cz.answer);
  const ct = arr(D.cards).find(x => x.type === "conjtab");
  if (ct) lines.push("conjtab;" + ct.verb + ";" + tenseName(lg.target, ct.tense) + ";" + ct.forms.join("|"));
  return lines.join("\n");
}
// Ligne d'aperçu d'une carte d'un autre type.
function typedRowLine(row) {
  const c = Object.assign({ type: row.typed }, row.fields);
  return TYPE_ICON[row.typed] + " " + cardTitle(c) + " → " + (row.typed === "conj" ? conjFull(c) : cardSubtitle(c));
}

// Analyse par paquets (ne bloque pas l'écran). lg = langues de la liste cible ; map = association choisie (ou null).
// Renvoie { fresh, dups, invalid, header, sep, ncols, map, sample }.
async function parseBulk(text, targetId, lg, map, onProgress) {
  const existing = new Map();
  if (targetId !== "__new__") cardsOf(targetId).forEach(c => {
    const k = isVocab(c) ? dupKey(c.terms, lg) : typedKey(c.type, c);
    if (!existing.has(k)) existing.set(k, c);
  });
  const seen = new Map();
  const res = { fresh: [], dups: [], invalid: [], header: false, sep: ";", ncols: 0, map: null, sample: [] };
  const lines = bulkLines(text);
  const sep = res.sep = bulkSeparator(lines);
  // En-tête et nombre de colonnes (sur les 200 premières lignes)
  let start = 0, headerMap = null;
  while (start < lines.length && !lines[start].trim()) start++;
  if (start < lines.length && !isTypedLine(lines[start], sep)) {
    headerMap = parseHeader(lines[start].trim().split(sep).map(s => s.trim()));
    if (headerMap) res.header = true;
  }
  let ncols = headerMap ? headerMap.length : 0;
  for (let i = start + (headerMap ? 1 : 0), n = 0; i < lines.length && n < 200; i++) {
    if (!lines[i].trim() || isTypedLine(lines[i], sep)) continue;   // colonnes : lignes de vocabulaire seulement
    n++;
    const cs = lines[i].trim().split(sep);
    ncols = Math.max(ncols, cs.length - (linePrefix(cs) === "vocab" ? 1 : 0));
  }
  res.ncols = ncols = Math.max(ncols, 1);
  let m = map && map.length === ncols ? map : (headerMap ? headerMap.concat(defaultBulkMap(ncols, lg).slice(headerMap.length).map(() => "ignore")) : (savedBulkMap(ncols, lg) || defaultBulkMap(ncols, lg)));
  res.map = m = fixBulkMap(m);
  const tgCol = m.indexOf(lg.target);

  for (let i = start + (headerMap ? 1 : 0); i < lines.length; i++) {
    if (i && i % BULK_CHUNK === 0) { if (onProgress) onProgress(i / lines.length); await yieldUI(); }
    const lineNo = i + 1;
    const line = lines[i].trim();
    if (!line) continue;
    let cols = line.split(sep).map(s => s.trim());
    const pre = linePrefix(cols);
    if (pre && pre !== "vocab") {
      // Autre type de carte
      const r = parseTypedLine(pre, cols, lg.target);
      if (r.err) { res.invalid.push({ lineNo, raw: line, reason: r.err }); continue; }
      r.rows.forEach(x => {
        const k = typedKey(x.type, x.fields);
        const row = { lineNo, raw: line, typed: x.type, fields: x.fields, tags: [] };
        if (seen.has(k)) { res.invalid.push({ lineNo, raw: line, reason: t("bulk.err.repeat", { n: seen.get(k) }), repeat: true }); return; }
        seen.set(k, lineNo);
        if (existing.has(k)) { row.card = existing.get(k); res.dups.push(row); }
        else res.fresh.push(row);
      });
      continue;
    }
    if (pre === "vocab") cols = cols.slice(1);
    if (res.sample.length < 3) res.sample.push(cols);
    if (cols.length > ncols) { res.invalid.push({ lineNo, raw: line, reason: t("bulk.err.cols", { n: ncols }) }); continue; }
    const row = { lineNo, raw: line, terms: {}, set: [], example: "", tags: [], pos: "" };
    m.forEach((k, j) => {
      const v = cols[j] || "";
      if (isLang(k)) { row.set.push(k); if (v) row.terms[k] = v; }
      else if (k === "example") { row.set.push(k); row.example = v; }
      else if (k === "tags") { row.set.push(k); row.tags = parseTags(v); }
      else if (k === "pos") { row.set.push(k); row.pos = parsePos(v, lg.target) || v; } // code reconnu, sinon texte gardé tel quel
    });
    if (tgCol < 0 || !row.terms[lg.target]) { res.invalid.push({ lineNo, raw: line, reason: t("bulk.err.target", { lang: langName(lg.target) }) }); continue; }
    if (!lg.support.some(c => row.terms[c])) {
      res.invalid.push({ lineNo, raw: line, reason: t("bulk.err.support", { langs: lg.support.map(x => langName(x)).join(", ") }) }); continue;
    }
    const k = dupKey(row.terms, lg);
    if (seen.has(k)) { res.invalid.push({ lineNo, raw: line, reason: t("bulk.err.repeat", { n: seen.get(k) }), repeat: true }); continue; }
    seen.set(k, lineNo);
    if (existing.has(k)) { row.card = existing.get(k); res.dups.push(row); }
    else res.fresh.push(row);
  }
  if (onProgress) onProgress(1);
  return res;
}

// Fenêtre d'attente avec texte mis à jour ; renvoie { set(msg), close() }.
function openBusy(msg) {
  const p = el("p", "muted", msg);
  const close = openModal(t("bulk.wait"), p, []);
  return { set: m => { p.textContent = m; }, close };
}

function autoGrow(ta) {
  try { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; } catch (e) {}
}

function readTextFile(f) {
  return new Promise((ok, ko) => {
    try {
      const r = new FileReader();
      r.onload = () => ok(String(r.result || ""));
      r.onerror = () => ko(r.error || new Error("read"));
      r.readAsText(f, "UTF-8");
    } catch (e) { ko(e); }
  });
}

// Langues de l'import : celles de la liste existante, ou celles choisies pour la nouvelle liste.
function bulkLangs(o) { return o.target === "__new__" ? o.lang : listLangs(o.target); }

// opts : { text, target (id | "__new__"), newName, folder ("" | id | "__new__"), newFolder, lang { target, support } | null,
//          langTouched, file: { name, text, lines } | null, map }
function openBulkImport(opts) {
  opts.file = opts.file || null;
  opts.folder = opts.folder || "";
  const sel = listSelect(opts.target, true);
  const nameInp = textInput(opts.newName, "");
  const nameField = formField(t("bulk.newListName"), nameInp, true);
  const fsel = folderSelect(opts.folder, true);
  const fnameInp = textInput(opts.newFolder || "", "");
  const fnameField = formField(t("folders.newName"), fnameInp, true);
  const folderField = formField(t("folders.folder"), fsel);
  const langBox = el("div");
  // Langues : pré-remplies depuis le dossier (nouvelle liste), ou celles de la liste existante (lecture seule).
  const drawLangs = () => {
    langBox.textContent = "";
    try { ta.placeholder = bulkPlaceholder(sel.value !== "__new__" ? listLangs(sel.value) : (opts.lang || folderLangs(getFolder(fsel.value)))); } catch (e) {}
    if (sel.value !== "__new__") {
      const lg = listLangs(sel.value);
      langBox.appendChild(formField(t("langs.title"), el("div", "lang-ro", pairLabel(lg) + " — " + langName(lg.target)), false, t("bulk.langsOfList")));
      return;
    }
    if (!opts.langTouched || !opts.lang) opts.lang = folderLangs(getFolder(fsel.value));
    langBox.appendChild(langPicker(opts.lang.target, opts.lang.support, (tg, sp) => {
      opts.lang = { target: tg, support: sp }; opts.langTouched = true; opts.map = null; drawLangs();
    }));
  };
  const sync = () => {
    const isNew = sel.value === "__new__";
    nameField.hidden = !isNew; folderField.hidden = !isNew;
    fnameField.hidden = !isNew || fsel.value !== "__new__";
    drawLangs();
  };
  sel.addEventListener("change", () => { opts.map = null; sync(); });
  fsel.addEventListener("change", sync);

  // --- Fichier : bouton + glisser-déposer ---
  // Le bouton est un <label for> lié au vrai input : le navigateur ouvre le sélecteur lui-même (iPhone, Android, ordinateur).
  const fileInp = el("input", "file-input"); fileInp.type = "file"; fileInp.id = "bulkFile-" + uid();
  fileInp.accept = ".txt,.csv,text/plain,text/csv";
  fileInp.tabIndex = -1;
  const pick = el("label", "btn file-pick", t("bulk.fileBtn")); pick.htmlFor = fileInp.id;
  pick.tabIndex = 0; pick.setAttribute("role", "button");
  pick.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInp.click(); } });
  const zone = el("div", "drop-zone");
  const chip = el("div", "file-chip");
  const chipTxt = el("span");
  const rm = el("button", "link-btn", t("bulk.fileRemove")); rm.type = "button";
  chip.append(chipTxt, rm);
  zone.append(fileInp, pick, chip, el("div", "drop-hint", t("bulk.drop")));

  const ta = el("textarea", "bulk-ta");
  ta.value = opts.text;
  ta.placeholder = bulkPlaceholder(bulkLangs({ target: opts.target, lang: opts.lang || accountLangs() }));
  ta.spellcheck = false;
  ta.setAttribute("autocapitalize", "off"); ta.setAttribute("autocorrect", "off");
  ta.addEventListener("input", () => autoGrow(ta));
  const taField = formField(t("bulk.or"), ta, false, t("bulk.format") + " " + t("bulk.formatTypes"));

  const showFile = () => {
    const f = opts.file;
    chip.hidden = !f; pick.hidden = !!f; taField.hidden = !!f;
    if (f) chipTxt.textContent = t("bulk.fileInfo", { name: f.name, n: f.lines });
  };
  rm.addEventListener("click", () => { opts.file = null; opts.map = null; showFile(); setTimeout(() => autoGrow(ta), 0); });

  const loadFile = async f => {
    if (!f) return;
    if (!/\.(txt|csv|tsv)$/i.test(f.name || "") && !/^text\//.test(f.type || "")) { toast(t("bulk.fileType")); return; }
    try {
      const text = await readTextFile(f);
      const base = String(f.name || "").replace(/\.[^.]+$/, "").trim();
      opts.file = { name: f.name, text, lines: countBulkLines(text) };
      opts.map = null;
      sel.value = "__new__"; if (base) nameInp.value = base; sync();
      showFile();
    } catch (e) { toast(t("bulk.fileError")); }
  };
  fileInp.addEventListener("change", () => { const f = fileInp.files && fileInp.files[0]; fileInp.value = ""; loadFile(f); });
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("over");
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(f);
  });

  const wrap = el("div");
  wrap.append(formField(t("bulk.target"), sel), nameField, folderField, fnameField, langBox,
    formField(t("bulk.file"), zone, false, t("bulk.fileHint")), taField);
  sync();
  showFile();
  openModal(t("bulk.title"), wrap, [
    { label: t("cancel") },
    { label: t("bulk.preview"), kind: "primary", onClick: () => {
      const o = Object.assign({}, opts, { text: ta.value, target: sel.value, newName: nameInp.value.trim(),
        folder: fsel.value, newFolder: fnameInp.value.trim() });
      const src = o.file ? o.file.text : o.text;
      if (!src.trim()) { toast(t("bulk.nothing")); return false; }
      if (o.target === "__new__" && !o.newName) { toast(t("lists.nameRequired")); return false; }
      if (o.target === "__new__" && o.folder === "__new__" && !o.newFolder) { toast(t("folders.nameRequired")); return false; }
      if (o.target === "__new__" && (!o.lang || !o.lang.support.length)) { toast(t("langs.supportRequired")); return false; }
      if (o.map && opts.target !== o.target) o.map = null;
      openBulkPreview(o);
    } }
  ]);
  setTimeout(() => autoGrow(ta), 0);
}

// Tableau des colonnes : un menu par colonne (langue, exemple, tags, nature, ignorer) au-dessus de 3 lignes d'exemple.
function bulkColumns(r, lg, onChange) {
  const scroller = el("div", "col-map");
  const table = el("table");
  const hr = el("tr");
  const kinds = LANG_CODES.concat(BULK_KINDS);
  r.map.forEach((k, i) => {
    const th = el("th");
    const s = el("select", "input");
    kinds.forEach(x => { const o = el("option", null, bulkKindLabel(x) + (x === lg.target ? " ★" : "")); o.value = x; s.appendChild(o); });
    s.value = k;
    s.addEventListener("change", () => {
      const m = r.map.slice();
      if (s.value !== "ignore") m.forEach((x, j) => { if (j !== i && x === s.value) m[j] = "ignore"; }); // déjà utilisée ailleurs : l'autre colonne est ignorée
      m[i] = s.value;
      onChange(m);
    });
    th.appendChild(s);
    hr.appendChild(th);
  });
  table.appendChild(hr);
  r.sample.forEach(cols => {
    const tr = el("tr");
    r.map.forEach((k, i) => { const td = el("td", k === "ignore" ? "muted" : null, cols[i] || ""); if (isLang(k)) td.lang = k; tr.appendChild(td); });
    table.appendChild(tr);
  });
  scroller.appendChild(table);
  return formField(t("bulk.columns"), scroller, false, t("bulk.columnsHint", { lang: langName(lg.target) }));
}

async function openBulkPreview(opts) {
  const lg = bulkLangs(opts);
  const busy = openBusy(t("bulk.analyzing", { p: 0 }));
  let r;
  try {
    r = await parseBulk(opts.file ? opts.file.text : opts.text, opts.target, lg, opts.map,
      x => busy.set(t("bulk.analyzing", { p: Math.round(x * 100) })));
  } catch (e) { busy.close(); toast(t("bulk.nothing")); return; }
  busy.close();
  opts.map = r.map;
  let dupMode = "ignore";
  let closeFn = null;
  const wrap = el("div");

  const sum = el("div", "preview-sum");
  const dest = opts.target === "__new__" ? opts.newName : (getList(opts.target) || {}).name;
  sum.appendChild(el("div", "muted", t("bulk.dest", { name: dest || "", pair: pairLabel(lg) })));
  if (opts.file) sum.appendChild(el("div", "muted", t("bulk.fileInfo", { name: opts.file.name, n: opts.file.lines }) + (r.header ? " · " + t("bulk.header") : "")));
  else if (r.header) sum.appendChild(el("div", "muted", t("bulk.header")));
  sum.appendChild(el("div", null, t("bulk.newCount", { n: r.fresh.length })));
  const byType = {};
  r.fresh.forEach(x => { const k = x.typed || "vocab"; byType[k] = (byType[k] || 0) + 1; });
  if (Object.keys(byType).some(k => k !== "vocab")) {
    sum.appendChild(el("div", "muted", CARD_TYPES.filter(k => byType[k]).map(k => t("type." + k) + " : " + byType[k]).join(" · ")));
  }
  if (r.dups.length) sum.appendChild(el("div", null, t("bulk.dupCount", { n: r.dups.length })));
  if (r.invalid.length) sum.appendChild(el("div", null, t("bulk.invalidCount", { n: r.invalid.length })));
  wrap.appendChild(sum);

  wrap.appendChild(bulkColumns(r, lg, m => {
    if (!m.includes(lg.target)) toast(t("bulk.needTarget", { lang: langName(lg.target) }));
    if (closeFn) closeFn();
    openBulkPreview(Object.assign({}, opts, { map: m }));
  }));

  const cardLine = row => row.typed ? typedRowLine(row) : (row.terms[lg.target] || "—") + " — " + lg.support.map(c => row.terms[c]).filter(Boolean).join(" · ");
  // Section paginée (BULK_PAGE lignes par page) : supporte des milliers de lignes.
  const section = (title, rows, cls, fn) => {
    const f = el("div", "field");
    f.appendChild(el("label", null, title));
    const box = el("div", "preview-box");
    f.appendChild(box);
    let page = 0;
    const pages = Math.ceil(rows.length / BULK_PAGE);
    const pager = el("div", "pager");
    const prev = el("button", null, "‹"), next = el("button", null, "›"), info = el("span");
    prev.type = next.type = "button";
    pager.append(prev, info, next);
    const draw = () => {
      box.textContent = "";
      const a = page * BULK_PAGE, b = Math.min(rows.length, a + BULK_PAGE);
      for (let i = a; i < b; i++) box.appendChild(el("div", "pl " + cls, fn(rows[i])));
      box.scrollTop = 0;
      info.textContent = t("bulk.page", { a: a + 1, b, n: rows.length });
      prev.disabled = page === 0; next.disabled = page >= pages - 1;
    };
    prev.addEventListener("click", () => { if (page > 0) { page--; draw(); } });
    next.addEventListener("click", () => { if (page < pages - 1) { page++; draw(); } });
    if (pages > 1) f.appendChild(pager);
    draw();
    return f;
  };

  if (r.invalid.length) {
    wrap.appendChild(section(t("bulk.invalidTitle"), r.invalid, "bad",
      row => t("bulk.line", { n: row.lineNo }) + " : " + row.reason + " — " + row.raw));
  }
  if (r.dups.length) {
    const f = section(t("bulk.dupTitle"), r.dups, "dup", row => t("bulk.line", { n: row.lineNo }) + " : " + cardLine(row));
    const seg = el("div", "seg");
    ["ignore", "replace"].forEach(m => {
      const b = el("button", null, t("bulk." + m));
      b.setAttribute("aria-pressed", String(m === dupMode));
      b.addEventListener("click", () => {
        dupMode = m;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      });
      seg.appendChild(b);
    });
    f.append(seg, el("div", "hint", t("bulk.replaceHint")));
    wrap.appendChild(f);
  }
  if (r.fresh.length) {
    wrap.appendChild(section(t("bulk.newTitle"), r.fresh, "", cardLine));
  }

  closeFn = openModal(t("bulk.title"), wrap, [
    { label: t("bulk.back"), onClick: () => { openBulkImport(opts); } },
    { label: t("bulk.import"), kind: "primary", onClick: () => {
      const nReplace = dupMode === "replace" ? r.dups.length : 0;
      if (!r.fresh.length && !nReplace) { toast(t("bulk.nothing")); return false; }
      rememberBulkMap(r.map);
      runBulkImport(opts, r, nReplace, lg);
    } }
  ]);
}

// Applique l'import par lots de CONFIG.IMPORT_BATCH cartes, dans l'ordre des lignes, avec barre de progression.
// Chaque lot est enregistré (appareil + cloud) avant de passer au suivant.
// Lot refusé par l'appareil : le lot est annulé, les lots précédents sont gardés. Envoi cloud refusé : le lot est
// gardé sur l'appareil (synchro plus tard). Dans les deux cas : arrêt et ligne à partir de laquelle reprendre.
// Nouvelle liste : créée dans le dossier choisi (ou un nouveau dossier) ; ses langues ne sont enregistrées
// que si elles diffèrent de celles du dossier (sinon elle en hérite).
async function runBulkImport(opts, r, nReplace, lg) {
  const rows = r.fresh.concat(nReplace ? r.dups : []).sort((a, b) => a.lineNo - b.lineNo);
  const total = rows.length;
  const prog = openProgress(t("bulk.title"), t("bulk.progress", { a: 0, n: total }));
  let listId = opts.target, newList = null, newFolder = null;
  if (listId === "__new__") {
    let folderId = opts.folder || null;
    if (folderId === "__new__") {
      newFolder = { id: uid(), name: opts.newFolder, order: nextOrder(state.folders) };
      state.folders.push(newFolder); folderId = newFolder.id;
    } else if (folderId && !getFolder(folderId)) folderId = null;
    newList = { id: uid(), name: opts.newName, folderId, order: nextOrder(listsIn(folderId)), createdAt: Date.now() };
    if (!sameLangs(lg, folderLangs(getFolder(folderId)))) { newList.target = lg.target; newList.support = lg.support.slice(); }
    state.lists.push(newList); listId = newList.id;
  }
  const st = state;
  const addedIds = [];
  let done = 0, added = 0, replaced = 0, stop = null;
  for (let i = 0; i < total; i += CONFIG.IMPORT_BATCH) {
    const batch = rows.slice(i, i + CONFIG.IMPORT_BATCH);
    const undo = [], batchIds = [];
    let nAdd = 0, nRep = 0;
    batch.forEach(row => {
      if (row.card && row.typed) {
        // Autre type : les champs importés remplacent le contenu ; progression et règle liée conservées
        const c = row.card;
        undo.push([c, normTypedFields(c.type, c)]);
        const keepRule = c.ruleId;
        Object.assign(c, normTypedFields(row.typed, row.fields));
        if (keepRule && "ruleId" in c) c.ruleId = keepRule;
        nRep++;
      } else if (row.typed) {
        const nc = newTypedCard(listId, row.typed, Object.assign({}, row.fields, { lang: lg.target }), []);
        state.cards.push(nc); batchIds.push(nc.id); nAdd++;
      } else if (row.card) {
        const c = row.card;
        undo.push([c, { terms: Object.assign({}, c.terms), pos: Object.assign({}, c.pos), example: c.example, tags: c.tags }]);
        // Colonnes importées : remplacent le contenu existant ; progression conservée
        row.set.forEach(k => {
          if (isLang(k)) { if (row.terms[k]) c.terms[k] = row.terms[k]; else delete c.terms[k]; }
          else if (k === "example") c.example = row.example;
          else if (k === "tags") c.tags = row.tags;
          else if (k === "pos") { if (row.pos) c.pos[lg.target] = row.pos; else delete c.pos[lg.target]; }
        });
        nRep++;
      } else {
        const nc = newCard(listId, row.terms, row.example, row.tags, row.pos ? { [lg.target]: row.pos } : null);
        state.cards.push(nc); batchIds.push(nc.id); nAdd++;
      }
    });
    state.updatedAt = Date.now();
    const res = await Storage.saveNow(state);
    if (state !== st) { prog.close(); return; } // compte changé entre-temps
    if (!res.local) {
      // Annule ce lot seulement (les lots précédents sont déjà enregistrés).
      const drop = new Set(batchIds);
      state.cards = state.cards.filter(c => !drop.has(c.id));
      undo.forEach(([c, v]) => Object.assign(c, v));
      if (newList && !addedIds.length) {
        state.lists = state.lists.filter(l => l !== newList);
        if (newFolder) state.folders = state.folders.filter(f => f !== newFolder);
      }
      state.updatedAt = Date.now();
      Storage.save(state);
      stop = { key: "bulk.stopLocal", line: batch[0].lineNo };
      break;
    }
    addedIds.push(...batchIds); added += nAdd; replaced += nRep;
    done += batch.length;
    prog.set(done / total, t("bulk.progress", { a: done, n: total }));
    if (!res.remote) {
      if (done < total) stop = { key: "bulk.stopRemote", line: rows[done].lineNo };
      else toast(t("storage.info.error"));
      break;
    }
    await yieldUI();
  }
  prog.close();
  lv.listId = (newList && !state.lists.includes(newList)) ? null : listId; lv.query = "";
  render();
  if (added + replaced > 0) {                   // journal : import terminé (ou arrêté)
    const il = getList(listId);
    Activity.log("import", { n: added, replaced, list: il ? il.name : "", stopped: !!stop });
  }
  if (stop) {
    openModal(t("bulk.stopTitle"), el("p", null, t(stop.key, { n: added + replaced, line: stop.line })), [{ label: t("close"), kind: "primary" }]);
    return;
  }
  toast(t("bulk.done", { n: added, m: replaced }));
  offerCompletion(addedIds); // champs vides : proposer de les compléter
}

// === ÉCRAN : STATS ===
// Filtres gardés en mémoire tant que l'appli est ouverte :
//   stv.lang  : langue apprise ("" = toutes) ; stv.scope : "" (tout) | "f:<idDossier>" | "l:<idListe>".
// Taux de réussite = réponses « Su » / toutes les réponses (stats.correct / stats.seen).
const stv = { lang: "", scope: "", cap: "" };

function catCounts(cards) {
  const n = { known: 0, review: 0, unknown: 0 };
  cards.forEach(c => n[Leitner.category(c)]++);
  return n;
}
function rateOf(cards) {
  let seen = 0, ok = 0;
  cards.forEach(c => { seen += c.stats.seen; ok += c.stats.correct; });
  return { seen, ok, pct: seen ? Math.round(ok * 100 / seen) : null };
}
function pctText(r) { return r.pct == null ? "—" : t("stats.pct", { n: r.pct }); }
function catBar(n, total) {
  const bar = el("div", "st-bar");
  [["known", "st-ok"], ["review", "st-warn"], ["unknown", "st-bad"]].forEach(([k, cls]) => {
    if (!n[k]) return;
    const s = el("span", cls);
    s.style.width = (n[k] * 100 / total) + "%";
    bar.appendChild(s);
  });
  return bar;
}
function stTile(value, label) {
  const d = el("div", "st-tile");
  d.append(el("div", "st-num", String(value)), el("div", "st-lbl", label));
  return d;
}
// Ligne « nom + N cartes · taux + barre des catégories » (par dossier, par liste).
function stGroupRow(name, cards) {
  const row = el("div", "st-list");
  row.append(el("div", "st-list-hd", name), el("div", "st-list-sub", t("stats.listLine", { n: cards.length, r: pctText(rateOf(cards)) })));
  if (cards.length) row.appendChild(catBar(catCounts(cards), cards.length));
  return row;
}

function renderStats() {
  const root = $("#screen-stats");
  root.textContent = "";
  const langs = targetLangsInUse();
  if (stv.lang && !langs.includes(stv.lang)) stv.lang = "";
  if (stv.scope.startsWith("f:") && !getFolder(stv.scope.slice(2))) stv.scope = "";
  if (stv.scope.startsWith("l:") && !getList(stv.scope.slice(2))) stv.scope = "";
  if (!state.cards.length) { root.appendChild(el("div", "empty", t("stats.empty"))); return; }

  const lgs = langsByList();
  const inLang = l => !stv.lang || lgs.get(l.id).target === stv.lang;
  const lists = orderedLists().filter(inLang);
  if (stv.scope.startsWith("l:") && !lists.some(l => l.id === stv.scope.slice(2))) stv.scope = "";

  // Filtres : langue apprise (si plusieurs), puis tout / un dossier / une liste
  const filters = el("div", "st-filters");
  if (langs.length > 1) {
    const ls = el("select", "input");
    [["", t("stats.allLangs")]].concat(langs.map(c => [c, langName(c)])).forEach(([v, l]) => { const o = el("option", null, l); o.value = v; ls.appendChild(o); });
    ls.value = stv.lang;
    ls.addEventListener("change", () => { stv.lang = ls.value; renderStats(); });
    filters.appendChild(ls);
  }
  if (state.lists.length > 1 || state.folders.length) {
    const sel = el("select", "input");
    const add = (parent, v, l) => { const o = el("option", null, l); o.value = v; parent.appendChild(o); };
    add(sel, "", t("stats.allLists"));
    sortedFolders().forEach(f => {
      const fl = lists.filter(l => l.folderId === f.id);
      if (!fl.length) return;
      const g = el("optgroup"); g.label = f.name;
      add(g, "f:" + f.id, t("stats.wholeFolder", { name: f.name }));
      fl.forEach(l => add(g, "l:" + l.id, l.name));
      sel.appendChild(g);
    });
    const loose = lists.filter(l => !l.folderId);
    if (loose.length) {
      const g = state.folders.length ? el("optgroup") : sel;
      if (g !== sel) { g.label = t("folders.none"); sel.appendChild(g); }
      loose.forEach(l => add(g, "l:" + l.id, l.name));
    }
    sel.value = stv.scope;
    sel.addEventListener("change", () => { stv.scope = sel.value; renderStats(); });
    filters.appendChild(sel);
  }
  if (filters.childNodes.length) root.appendChild(filters);

  // Listes du périmètre, puis cartes
  let scopeLists = lists;
  if (stv.scope.startsWith("f:")) scopeLists = lists.filter(l => l.folderId === stv.scope.slice(2));
  else if (stv.scope.startsWith("l:")) scopeLists = lists.filter(l => l.id === stv.scope.slice(2));
  const ids = new Set(scopeLists.map(l => l.id));
  const cards = state.cards.filter(c => ids.has(c.listId));
  if (!cards.length) { root.appendChild(el("div", "empty", t("lists.noCards"))); return; }
  const now = Date.now();
  const rate = rateOf(cards);

  // Chiffres clés (la série de jours est globale)
  const top = el("div", "card");
  const tiles = el("div", "st-tiles");
  tiles.append(
    stTile(cards.length, t("stats.words")),
    stTile(dueCount(cards, now), t("home.due")),
    stTile(pctText(rate), t("stats.rate")),
    stTile(computeStreak(), t("home.streak"))
  );
  top.appendChild(tiles);
  if (rate.seen) top.appendChild(el("div", "hint", t("stats.rateHint", { c: rate.ok, s: rate.seen })));
  root.appendChild(top);
  root.appendChild(statsStreak());

  // Par catégorie
  const n = catCounts(cards);
  const cat = el("div", "card");
  cat.appendChild(el("h2", null, t("stats.byCat")));
  const grid = el("div", "sum-grid");
  grid.style.marginTop = "0";
  [["known", "ok"], ["review", "warn"], ["unknown", "bad"]].forEach(([k, cls]) => {
    const cell = el("div", "sum-cell " + cls);
    cell.append(el("div", "sum-num", String(n[k])), el("div", "sum-lbl", t("cat." + k)));
    grid.appendChild(cell);
  });
  cat.append(grid, catBar(n, cards.length));
  root.appendChild(cat);

  // Par boîte (0 à 5)
  const boxes = [0, 0, 0, 0, 0, 0];
  cards.forEach(c => boxes[c.box]++);
  const max = Math.max(1, ...boxes);
  const bx = el("div", "card");
  bx.appendChild(el("h2", null, t("stats.byBox")));
  boxes.forEach((v, i) => {
    const row = el("div", "st-row");
    const tr = el("div", "st-track");
    const fill = el("div", "st-fill " + (i === 0 ? "st-bad" : i <= 2 ? "st-warn" : "st-ok"));
    fill.style.width = (v * 100 / max) + "%";
    tr.appendChild(fill);
    row.append(el("div", null, t("stats.box", { n: i })), tr, el("div", "st-n", String(v)));
    bx.appendChild(row);
  });
  root.appendChild(bx);

  // Par type de carte (s'il y a plusieurs types dans le périmètre)
  const typesIn = CARD_TYPES.filter(ty => cards.some(c => cardType(c) === ty));
  if (typesIn.length > 1) {
    const pt = el("div", "card");
    pt.appendChild(el("h2", null, t("stats.byType")));
    typesIn.forEach(ty => pt.appendChild(stGroupRow(TYPE_ICON[ty] + " " + t("type." + ty), cards.filter(c => cardType(c) === ty))));
    root.appendChild(pt);
  }

  // Par temps (cartes de conjugaison), dans l'ordre des temps de chaque langue
  const conj = cards.filter(c => cardType(c) === "conj");
  if (conj.length) {
    const multi = new Set(conj.map(c => c.lang)).size > 1;
    const groups = new Map();
    conj.forEach(c => { const k = tenseKey(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
    const ord = k => { const [lng, id] = k.split("|"); return LANG_CODES.indexOf(lng) * 100 + tensesOf(lng).findIndex(x => x.id === id); };
    const ptn = el("div", "card");
    ptn.appendChild(el("h2", null, t("stats.byTense")));
    [...groups.keys()].sort((a, b) => ord(a) - ord(b)).forEach(k => {
      const [lng, id] = k.split("|");
      const cs = groups.get(k);
      const verbs = new Set(cs.map(verbKey)).size;
      const row = stGroupRow(tenseName(lng, id) + (multi ? " (" + langName(lng) + ")" : ""), cs);
      row.querySelector(".st-list-sub").textContent += " · " + t(verbs > 1 ? "stats.verbs" : "stats.verb1", { n: verbs });
      ptn.appendChild(row);
    });
    root.appendChild(ptn);
  }

  // Par dossier (vue « tout », s'il y a des dossiers)
  if (!stv.scope && state.folders.length) {
    const pf = el("div", "card");
    pf.appendChild(el("h2", null, t("stats.byFolder")));
    sortedFolders().forEach(f => {
      const fl = new Set(lists.filter(l => l.folderId === f.id).map(l => l.id));
      if (fl.size) pf.appendChild(stGroupRow(f.name, cards.filter(c => fl.has(c.listId))));
    });
    const loose = new Set(lists.filter(l => !l.folderId).map(l => l.id));
    if (loose.size) pf.appendChild(stGroupRow(t("folders.none"), cards.filter(c => loose.has(c.listId))));
    if (pf.childNodes.length > 1) root.appendChild(pf);
  }

  // Par liste (périmètre « tout » ou un dossier, s'il y a plusieurs listes)
  if (!stv.scope.startsWith("l:") && scopeLists.length > 1) {
    const pl = el("div", "card");
    pl.appendChild(el("h2", null, t("stats.byList")));
    scopeLists.forEach(l => pl.appendChild(stGroupRow(stv.scope ? l.name : listLabel(l), cardsOf(l.id))));
    root.appendChild(pl);
  }

  // Mots les plus ratés (10 max)
  const missed = cards.filter(c => c.stats.wrong > 0)
    .sort((a, b) => b.stats.wrong - a.stats.wrong || a.stats.correct - b.stats.correct)
    .slice(0, 10);
  const ms = el("div", "card");
  ms.appendChild(el("h2", null, t("stats.missed")));
  if (!missed.length) ms.appendChild(el("div", "muted", t("stats.noMissed")));
  missed.forEach(c => {
    const lg = lgs.get(c.listId);
    const row = el("div", "st-miss");
    const m = el("div", "main");
    const f = el("div", "t1", isVocab(c) ? (targetTerm(c, lg) || "—") : cardTitle(c)); f.lang = cardLang(c);
    if (!isVocab(c)) f.insertBefore(typeBadge(c.type), f.firstChild);
    m.appendChild(f);
    const sub = isVocab(c) ? supportText(c, lg) : cardSubtitle(c);
    if (sub) m.appendChild(el("div", "t2", sub));
    row.append(m, el("div", "cnt", t("stats.missedCount", { w: c.stats.wrong, s: c.stats.seen })));
    ms.appendChild(row);
  });
  root.appendChild(ms);
}

// Série (étape 28) : chiffres, calendrier des 12 dernières semaines (jours gelés, objectif atteint), badges.
function statsStreak() {
  const s = Streak.data(), wrap = el("div");
  const card = el("div", "card");
  card.appendChild(el("h2", null, "🔥 " + t("sk.title")));
  const tiles = el("div", "st-tiles");
  tiles.append(stTile(s.current, t("home.streak")), stTile(s.best, t("sk.bestLbl")),
    stTile(s.freezes + " / " + STREAK_MAX_FREEZES, "❄️ " + t("sk.freezesLbl")), stTile(Streak.goal(), t("sk.goalTitle")));
  card.appendChild(tiles);
  card.appendChild(el("div", "hint", t("sk.rules", { g: Streak.goal() })));
  wrap.appendChild(card);
  // Calendrier : du lundi d'il y a 11 semaines à aujourd'hui (même dessin que la fiche du compte)
  const today = new Date(), dow = (today.getDay() + 6) % 7;
  const from = todayStr(new Date(today.getFullYear(), today.getMonth(), today.getDate() - dow - 77, 12));
  const days = state.history.filter(h => h.reviewed > 0 && h.date >= from).map(h => ({ day: h.date, reviewed: h.reviewed, sessions: 0 }));
  wrap.appendChild(fcCalendar({ from, to: todayStr(), days },
    { frozen: new Set(s.frozenDays), valid: new Set(s.validDays), store: stv, line: n => t("sk.calCards", { n }) }));
  // Badges : les 4 paliers, obtenus en couleur avec leur date
  const bc = el("div", "card");
  bc.appendChild(el("h2", null, t("sk.badges")));
  const grid = el("div", "sk-badges");
  STREAK_BADGES.forEach(b => {
    const got = s.badges.find(x => x.days === b);
    const c = el("div", "sk-badge " + (got ? "on" : "off"));
    c.append(el("div", "ic", badgeIcon(b)), el("div", "nm", t("sk.badgeName", { n: b })),
      el("div", "dt", got ? (got.day ? dashBucketLabel(got.day, false, true) : t("sk.badgeGot")) : t("sk.badgeTodo")));
    c.title = t("sk.badgeName", { n: b }) + " — " + (got ? t("sk.badgeGot") : t("sk.badgeTodo"));
    grid.appendChild(c);
  });
  bc.appendChild(grid);
  wrap.appendChild(bc);
  return wrap;
}

// Carte « Audio » : lecture auto, langues lues automatiquement, avertissement si une langue n'a pas de voix.
function renderAudioCard() {
  const box = $("#audioCard");
  if (!box) return;
  box.textContent = "";
  box.appendChild(el("h2", null, t("audio.title")));
  box.appendChild(audioToggle());
  const seg = el("div", "seg");
  ["target", "support", "both"].forEach(v => {
    const b = el("button", null, t("audio.langs." + v));
    b.setAttribute("aria-pressed", String(audioSettings().langs === v));
    b.addEventListener("click", () => {
      state.settings.audio = Object.assign({ auto: true }, state.settings.audio, { langs: v });
      commit();
    });
    seg.appendChild(b);
  });
  box.appendChild(formField(t("audio.langs"), seg));
  const st = Speech.status();
  if (st === "none") box.appendChild(el("div", "au-warn", t("audio.noSpeech")));
  else if (st === "ready") {
    const missing = LANG_CODES.filter(c => !Speech.has(c));
    if (missing.length) box.appendChild(el("div", "au-warn", t("audio.noVoice", { langs: missing.map(c => langName(c)).join(", ") })));
  }
}
function initSettings() {
  document.querySelectorAll("#setLang button").forEach(b => b.addEventListener("click", () => {
    state.settings.uiLang = b.dataset.value; commit();
  }));
  document.querySelectorAll("#setTheme button").forEach(b => b.addEventListener("click", () => {
    state.settings.theme = b.dataset.value; commit();
  }));
  $("#setSessionSize").addEventListener("change", e => {
    state.settings.sessionSize = clampInt(e.target.value, 1, 500, 20); commit();
  });
  // Objectif du jour (5 à 100) : s'il est déjà atteint avec le nouvel objectif, le jour est validé tout de suite.
  $("#setDailyGoal").addEventListener("change", e => {
    const v = clampInt(e.target.value, 5, 100, 10);
