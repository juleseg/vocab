<!-- === FIABILITÉ DU CHARGEMENT (étape 62), partie 1 : note un script de l'appli (js/…) qui ne se charge pas
     (erreur réseau, fichier absent) ou qui n'est pas du JavaScript (SyntaxError, ex. du HTML reçu à la place).
     Doit être AVANT les scripts : leurs erreurs de chargement ne se voient qu'au moment où elles arrivent.
     Rien de global : marque data-load-fail sur <html>, lue par la partie 2 tout à la fin. config.js n'est pas surveillé. -->
<script>
(function () {
  try {
    var isApp = function (u) { try { var x = new URL(u, location.href); return x.origin === location.origin && /\/js\/.+\.js$/.test(x.pathname); } catch (e) { return false; } };
    window.addEventListener("error", function (ev) {
      try {
        var t = ev && ev.target, bad = false;
        if (t && t.tagName === "SCRIPT") bad = isApp(t.src);                       // script non chargé
        else if (ev && ev.filename && isApp(ev.filename)) {                          // script reçu mais illisible
          var m = String((ev.error && ev.error.name) || "") + " " + String(ev.message || "");
          bad = /SyntaxError|Unexpected token/i.test(m);
        }
        if (bad) document.documentElement.setAttribute("data-load-fail", "1");
      } catch (e) {}
    }, true);
  } catch (e) {}
})();
</script>

<!-- === FIABILITÉ DU CHARGEMENT (étape 62), partie 2 : après le chargement de la page, si l'appli ne s'est pas lancée
     (window.App absent, js/app.js absent, ou un script de l'appli non chargé : voir partie 1), bandeau simple
     « Chargement incomplet (connexion instable). Recharger » dans la langue connue (sinon celle du navigateur).
     Styles écrits ici : css/app.css peut lui aussi manquer. Jamais affiché quand tout s'est chargé. -->
<script>
(function () {
  var TXT = {
    ko: ["불러오기가 완료되지 않았어요 (연결이 불안정해요).", "새로고침"],
    fr: ["Chargement incomplet (connexion instable).", "Recharger"],
    en: ["Loading incomplete (unstable connection).", "Reload"]
  };
  function lang() {
    try { var p = JSON.parse(localStorage.getItem("vocabfr.prefs") || "null"); if (p && TXT[p.uiLang]) return p.uiLang; } catch (e) {}
    var n = String((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase().slice(0, 2);
    return TXT[n] ? n : "en";
  }
  function check() {
    try {
      var failed = document.documentElement.getAttribute("data-load-fail") === "1";
      if (!failed && window.App && typeof init === "function") return;              // tout va bien : rien
      if (document.getElementById("loadFailBar")) return;
      var t = TXT[lang()];
      var bar = document.createElement("div");
      bar.id = "loadFailBar";
      bar.setAttribute("role", "alert");
      bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483000;display:flex;align-items:center;gap:12px;" +
        "justify-content:center;flex-wrap:wrap;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));" +
        "background:#fff4ce;color:#3d2e00;border-bottom:1px solid #e0c46c;font:16px/1.4 system-ui,-apple-system,sans-serif;" +
        "box-shadow:0 2px 8px rgba(0,0,0,.15)";
      var msg = document.createElement("span");
      msg.textContent = t[0];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = t[1];
      btn.style.cssText = "font:inherit;font-weight:600;padding:8px 18px;border-radius:10px;border:0;background:#2f5bd3;color:#fff;cursor:pointer";
      btn.addEventListener("click", function () { location.reload(); });
      bar.appendChild(msg); bar.appendChild(btn);
      document.body.appendChild(bar);
    } catch (e) {}
  }
  if (document.readyState === "complete") check(); else window.addEventListener("load", check);
})();
</script>
