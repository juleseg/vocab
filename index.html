<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab</title>
<style>
/* === STYLES : THÈMES === */
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1d1d1f; --muted:#6b6b70;
  --border:#dedbd4; --accent:#2f5bd3; --accent-text:#ffffff; --ok:#1f8a4c; --warn:#c07a00; --bad:#c43c3c;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416; --surface:#1e1e22; --surface2:#2a2a2f; --text:#f2f2f4; --muted:#a0a0a8;
  --border:#34343a; --accent:#7b9cff; --accent-text:#0d1430; --ok:#4cc27e; --warn:#e3a43a; --bad:#ef6b6b;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    color-scheme:dark;
    --bg:#141416; --surface:#1e1e22; --surface2:#2a2a2f; --text:#f2f2f4; --muted:#a0a0a8;
    --border:#34343a; --accent:#7b9cff; --accent-text:#0d1430; --ok:#4cc27e; --warn:#e3a43a; --bad:#ef6b6b;
    --shadow:none;
  }
}

/* === STYLES : BASE === */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:22px;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-mode="cloud"] .dot{background:var(--ok)}
.sync[data-mode="syncing"] .dot{background:var(--warn)}
.sync[data-mode="error"] .dot{background:var(--bad)}
.sync[data-mode="offline"] .dot{background:transparent;border:2px solid var(--muted)}
main{flex:1;padding:8px 16px 110px}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.big-num{font-size:44px;font-weight:700;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2 .card{text-align:center;margin-bottom:0}

/* === STYLES : FORMULAIRES === */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;padding:10px 4px;border-radius:9px;min-height:44px;cursor:pointer;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
input[type="number"],textarea{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:600;padding:10px 14px}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* === STYLES : NAVIGATION === */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.bottom button{position:relative;border:0;background:none;padding:8px 1px 10px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:1.15;text-align:center;color:var(--muted);cursor:pointer}
.nav-badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:0 5px;display:flex;align-items:center;justify-content:center}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.active{color:var(--accent);font-weight:600}

/* === STYLES : MODALE & TOAST === */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:18px}
.modal p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.progress{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.modal .progress-text{margin:10px 0 0}

/* === STYLES : LISTES & CARTES === */
[hidden]{display:none !important}
.input{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px;min-height:48px}
textarea.input{font-family:inherit;font-size:inherit;min-height:80px}
.lv-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lv-top h2{flex:1;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{border:0;background:none;color:var(--accent);padding:10px 4px;min-height:44px;cursor:pointer;font-weight:600}
.lv-links{display:flex;flex-wrap:wrap;gap:0 16px;margin-bottom:8px}
.lv-sub{font-size:14px;color:var(--muted);margin:-2px 0 2px}
.lv-sub:empty{display:none}
.lv-links .danger{color:var(--bad)}
#lvSearch{margin-bottom:12px}
#lvActions{margin-bottom:14px}
.items{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;padding:14px 16px;min-height:60px;cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600;overflow-wrap:anywhere}
.item .t2{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .chev{color:var(--muted);font-size:22px}
.tag{display:inline-block;font-size:12px;background:var(--surface2);border-radius:6px;padding:1px 6px;margin:4px 4px 0 0;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.req{color:var(--bad)}
.preview-sum{display:grid;gap:2px;margin-bottom:14px;font-weight:600}
.preview-box{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.preview-box .pl{padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;overflow-wrap:anywhere}
.preview-box .pl:last-child{border-bottom:0}
.pl.bad{color:var(--bad)}
.pl.dup{color:var(--warn)}

/* === STYLES : DOSSIERS === */
.fd-sec{margin-bottom:14px}
.fd-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;border-radius:12px}
.fd-toggle{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 4px;cursor:pointer;min-height:44px}
.fd-name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.fd-none{padding:6px 4px}
.fd-none .fd-name{color:var(--muted);font-size:15px}
.fd-caret{display:inline-block;width:20px;color:var(--muted)}
.fd-meta{font-size:13px;color:var(--muted);padding-left:20px}
.fd-menu{border:0;background:none;font-size:24px;line-height:1;min-width:44px;min-height:44px;cursor:pointer;color:var(--muted)}
.fd-empty{font-size:14px;color:var(--muted);padding:4px 24px 8px}
.fd-head.drop-over{background:var(--surface2);outline:2px dashed var(--accent)}
.item.dragging{opacity:.4}
div.item{cursor:pointer}
.ord-btns{display:flex;gap:6px;flex:none}
.ord-btn{border:1px solid var(--border);background:var(--surface2);border-radius:10px;min-width:44px;min-height:40px;cursor:pointer;font-size:18px}
.ord-btn:disabled{opacity:.35;cursor:default}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px;cursor:pointer}
.check-row input{width:22px;height:22px;flex:none;accent-color:var(--accent)}

/* === STYLES : IMPORT FICHIER === */
.bulk-ta{min-height:140px;max-height:60vh;resize:vertical;overflow-y:auto}
.drop-zone{position:relative;border:2px dashed var(--border);border-radius:14px;padding:12px;text-align:center}
/* Vrai <input type="file"> masqué visuellement (pas display:none, pas pointer-events:none) : ouvert par son <label for> */
.file-input{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;opacity:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
label.file-pick{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
label.file-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fx-sum .fx-line{margin:4px 0}.fx-sum .ok{font-weight:600}.fx-sum .warn{color:var(--warn)}.fx-detail{font-size:13px;color:var(--muted);margin:2px 0 0 10px;overflow-wrap:anywhere}.fx-corr{margin-top:10px;padding:8px 10px;border:1px solid var(--border);border-radius:12px}.fx-check{display:flex;gap:8px;align-items:flex-start;margin-top:8px}.fx-chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}.fx-chips:empty{display:none}.fx-links{margin-top:12px}
.drop-zone.over{border-color:var(--accent);background:var(--surface2)}
.drop-hint{font-size:13px;color:var(--muted);margin-top:8px}
@media (hover:none){.drop-hint{display:none}}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 6px 6px 12px}
.file-chip span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 14px;font-size:14px;color:var(--muted)}
.pager button{border:1px solid var(--border);background:var(--surface2);border-radius:10px;min-width:44px;min-height:40px;cursor:pointer;font-size:18px}
.pager button:disabled{opacity:.4;cursor:default}

/* === STYLES : IMPORT COLONNES === */
.col-map{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.col-map table{border-collapse:collapse;min-width:100%;font-size:14px}
.col-map th,.col-map td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.col-map tr:last-child td{border-bottom:0}
.col-map th .input{min-width:120px;min-height:40px;padding:6px 8px;font-size:14px}
.col-map td.muted{opacity:.5}
.lang-ro{font-weight:600;padding:4px 0}

/* === STYLES : RÉVISER === */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.avail{font-weight:600;text-align:center;margin:4px 0 12px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.btns.three .btn,.qz-btns .btn{padding:8px 4px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
@media (max-width:360px){.seg button{font-size:15px}.qz-btns .btn{font-size:17px}}
.btn.ok{color:var(--ok)}
.btn.warn{color:var(--warn)}

/* === STYLES : SESSION (COMMUN) === */
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin-bottom:8px}

/* === STYLES : MODE INTERROGATEUR === */
.qz-q{text-align:center;padding:26px 16px}
.qz-main{font-size:clamp(32px,10vw,46px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;margin-top:6px}
.qz-sub{font-size:20px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.qz-ans{border:2px dashed var(--accent);padding:8px 16px 16px}
.qz-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qz-lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qz-amain{font-size:26px;font-weight:700;overflow-wrap:anywhere}
.qz-asub{color:var(--muted);overflow-wrap:anywhere}
.qz-ex{font-style:italic;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.qz-hidden{color:var(--muted);text-align:center;padding:12px 0}
.qz-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qz-btns .btn{min-height:84px;font-size:19px}

/* === STYLES : MODE CARTES === */
.sw-stage{position:relative;height:min(56vh,420px);margin:4px 0 8px;perspective:1200px}
.sw-card{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;outline:none}
.sw-card.sw-enter{animation:swIn .22s ease-out}
@keyframes swIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sw-inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.sw-inner.flipped{transform:rotateY(180deg)}
.sw-face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.10);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:16px 18px;overflow:hidden}
.sw-back{transform:rotateY(180deg);border:2px solid var(--accent)}
.sw-lang{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sw-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
.sw-main{font-size:clamp(26px,8vw,38px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sw-sub{font-size:19px;color:var(--muted);overflow-wrap:anywhere}
.sw-ex{font-size:16px;color:var(--muted);font-style:italic;margin-top:10px;max-width:92%}
.sw-stamp{position:absolute;z-index:2;top:18px;padding:4px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;background:var(--surface)}
.sw-stamp-known{left:18px;color:var(--ok);transform:rotate(-12deg)}
.sw-stamp-unknown{right:18px;color:var(--bad);transform:rotate(12deg)}
.sw-stamp-review{left:50%;top:auto;bottom:18px;transform:translateX(-50%);color:var(--warn)}
.sw-hint{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sum-cell{background:var(--surface2);border-radius:14px;padding:14px 6px;text-align:center}
.sum-num{font-size:34px;font-weight:700;line-height:1.1}
.sum-cell.ok .sum-num{color:var(--ok)}
.sum-cell.warn .sum-num{color:var(--warn)}
.sum-cell.bad .sum-num{color:var(--bad)}
.sum-lbl{font-size:14px;color:var(--muted)}
.sum-ok{margin-top:14px;text-align:center;font-weight:600;color:var(--ok)}
@media (prefers-reduced-motion: reduce){.sw-inner{transition:none}.sw-card.sw-enter{animation:none}}

/* === STYLES : MODE ÉCRIT === */
.wr-q{text-align:center;padding:18px 14px}
.wr-q .sw-main{font-size:clamp(24px,7vw,34px)}
.wr-q .sw-sub{margin-top:4px}
.wr-input{font-size:20px;min-height:56px;margin-bottom:12px;text-align:center}
.wr-input[readonly]{opacity:.75}
.wr-res{border-width:2px}
.wr-res.ok{border-color:var(--ok)}
.wr-res.acc{border-color:var(--warn)}
.wr-res.bad{border-color:var(--bad)}
.wr-head{font-weight:700;font-size:19px}
.wr-res.ok .wr-head{color:var(--ok)}
.wr-res.acc .wr-head{color:var(--warn)}
.wr-res.bad .wr-head{color:var(--bad)}
.wr-lbl{font-size:13px;color:var(--muted);margin-top:12px}
.wr-diff{font-size:22px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
mark.wr-miss{background:rgba(31,138,76,.25);color:inherit;border-radius:3px;text-decoration:underline;text-underline-offset:3px}
mark.wr-bad{background:rgba(196,60,60,.25);color:inherit;border-radius:3px;text-decoration:line-through}
.wr-ex{font-style:italic;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}
.wr-fix{font-size:14px;color:var(--muted);text-align:center;margin:14px 0 8px}

/* === STYLES : AUDIO === */
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--accent);cursor:pointer;padding:0}
.spk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk:active{transform:scale(.94)}
.sw-face .spk{position:absolute;top:10px;right:10px;z-index:3}
.sw-inner.flipped .sw-front,.sw-inner:not(.flipped) .sw-back{pointer-events:none}
.spk-row{display:flex;justify-content:center;margin-top:10px}
.qz-head-r{display:flex;align-items:center;gap:6px}
/* Interrupteur « Lecture auto » : toute la ligne est cliquable, grand curseur pour le pouce */
.au-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;margin-bottom:10px;padding:8px 10px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:600;text-align:left;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.au-switch .au-lbl{display:flex;align-items:center;gap:10px}
.au-switch .au-lbl svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.au-track{position:relative;flex:none;width:76px;height:44px;border-radius:22px;background:var(--surface2);border:1px solid var(--border);transition:background .2s}
.au-knob{position:absolute;top:3px;left:3px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.au-switch[aria-checked="true"] .au-track{background:var(--accent);border-color:var(--accent)}
.au-switch[aria-checked="true"] .au-knob{transform:translateX(32px)}
.au-warn{font-size:14px;color:var(--warn);margin-top:10px}
@media (prefers-reduced-motion: reduce){.au-track,.au-knob{transition:none}}

/* === STYLES : NATURE GRAMMATICALE === */
.pos{font-size:max(13px,.5em);font-weight:500;font-style:italic;color:var(--muted);margin-left:.4em;white-space:nowrap}
.sub-item{white-space:normal}
.sub-sep{color:var(--muted)}
.wr-pos{margin-top:4px}
.wr-pos .pos{margin-left:0;font-size:15px}
.term-row{display:flex;gap:8px}
.term-row .input:first-child{flex:1;min-width:0}
.term-row select.input{flex:none;width:118px;padding:8px 6px;font-size:15px}

/* === STYLES : TYPES DE CARTES === */
.type-badge{display:inline-block;font-size:12px;font-weight:600;font-style:normal;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px;background:var(--surface2);color:var(--accent);white-space:nowrap}
.tag.warn{color:var(--warn)}
.ty-line{font-size:16px;color:var(--muted);overflow-wrap:anywhere;max-width:100%}
.ty-big{font-size:18px;font-weight:600}
.ty-tr{font-style:italic}
.ty-note{font-size:14px}
.ty-expl{color:var(--text)}
.ty-lbl{font-weight:600}
.ty-gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);color:transparent;line-height:1}
mark.ty-fill{background:rgba(31,138,76,.22);color:inherit;border-radius:4px;padding:0 3px}
.ty-wrong{font-size:16px;font-weight:500;color:var(--muted)}
.ty-rbody{text-align:left;width:100%;font-size:16px;line-height:1.45}
.ty-rbody p{margin:0 0 6px}
.ty-rbody ul,.ty-ex{margin:4px 0 6px;padding-left:22px;text-align:left}
.ty-ex{font-style:italic;color:var(--muted);width:100%}
.ty-btn{min-height:40px;padding:6px 8px}
.ty-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:17px}
.ty-table td{padding:8px 6px;border-bottom:1px solid var(--border)}
.ty-table td.muted{color:var(--muted);width:40%}
.ty-table tr.cur td{font-weight:700;background:var(--surface2)}
.conj-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.conj-grid label{color:var(--muted);font-size:15px}
.wr-full{font-size:20px;font-weight:600;margin-top:10px;overflow-wrap:anywhere}
/* Phrases : texte plus petit que les mots seuls */
.ty-face.ty-cloze .sw-main,.ty-face.ty-fix .sw-main{font-size:clamp(21px,6vw,28px);font-weight:600}
.ty-face.ty-rule .sw-main{font-size:clamp(22px,6.5vw,30px)}
.sw-face.sw-long .sw-body{justify-content:flex-start;align-items:stretch;text-align:left}
.sw-face.sw-long .sw-main{font-size:20px;margin-top:22px}
.qz-q.ty-cloze .qz-main,.qz-q.ty-fix .qz-main,.qz-q.ty-rule .qz-main{font-size:clamp(22px,6.5vw,30px)}
.qz-ans.ty-cloze .qz-amain,.qz-ans.ty-fix .qz-amain,.qz-ans.ty-rule .qz-amain{font-size:20px}
.wr-q.ty-cloze .sw-main,.wr-q.ty-fix .sw-main{font-size:clamp(20px,6vw,26px)}
.wr-q .ty-line{margin-top:6px}

/* === STYLES : MODE TABLEAU === */
.rv-conj{border:1px solid var(--border);border-radius:12px;padding:10px 12px 2px;margin-bottom:14px;background:var(--surface2)}
.rv-conj-hd{font-weight:700;margin-bottom:6px}
.tb-head{text-align:center;padding:16px 14px}
.tb-head .ty-line{margin-top:4px}
.tb-verb{font-size:clamp(26px,8vw,36px);font-weight:700;overflow-wrap:anywhere}
.tb-grid{padding:6px 12px}
.tb-row{display:grid;grid-template-columns:minmax(72px,34%) 1fr;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tb-row:last-child{border-bottom:none}
.tb-person{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.tb-cell{position:relative}
.tb-input{font-size:18px;min-height:48px;padding-right:34px}
.tb-input[readonly]{opacity:.85}
.tb-row.ok .tb-input{border-color:var(--ok)}
.tb-row.bad .tb-input{border-color:var(--bad)}
.tb-mark{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:700;font-size:18px}
.tb-row.ok .tb-mark{color:var(--ok)}
.tb-row.bad .tb-mark{color:var(--bad)}
.tb-fix{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:2px 0 2px}
.tb-fix .wr-diff{font-size:18px}
.tb-note{width:100%;font-size:13px;color:var(--warn)}
.tb-all{margin-top:8px;color:var(--text);font-size:17px}

/* === STYLES : GÉNÉRER DES CARTES === */
.gen-ta{min-height:76px}
.gen-info{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.gen-chk{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:10px}
.gen-chk input{width:20px;height:20px}
.pv-new{margin-top:4px}
.pv-new .ty-table{font-size:15px;margin:4px 0}
.pv-new .ty-table td{padding:4px 6px}
.pv-new-t1{font-weight:600;overflow-wrap:anywhere}
.pv-new-t2{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.pv-type.newcard{background:rgba(31,138,76,.15);color:var(--ok)}
.pv-edit{display:grid;gap:6px;margin-top:6px}
.pv-edit label{font-size:12px;color:var(--muted);margin-bottom:-4px}
.pv-edit textarea{min-height:64px}

/* === STYLES : STATS === */
.st-filters{display:grid;gap:8px;margin-bottom:14px}
.st-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-tile{background:var(--surface2);border-radius:14px;padding:12px 8px;text-align:center}
.st-num{font-size:30px;font-weight:700;line-height:1.1}
.st-lbl{font-size:13px;color:var(--muted)}
.st-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-top:12px}
.st-bar span{display:block;height:100%}
.st-ok{background:var(--ok)}
.st-warn{background:var(--warn)}
.st-bad{background:var(--bad)}
.st-row{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.st-track{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.st-fill{height:100%;border-radius:7px}
.st-n{text-align:right;font-variant-numeric:tabular-nums}
.st-list{padding:12px 0;border-bottom:1px solid var(--border)}
.st-list:first-of-type{padding-top:0}
.st-list:last-child{border-bottom:0;padding-bottom:0}
.st-list-hd{font-weight:600;overflow-wrap:anywhere}
.st-list-sub{font-size:14px;color:var(--muted)}
.st-list .st-bar{margin-top:6px}
.st-miss{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.st-miss:last-child{border-bottom:0;padding-bottom:0}
.st-miss .main{flex:1;min-width:0}
.st-miss .t1{font-weight:600;overflow-wrap:anywhere}
.st-miss .t2{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.st-miss .cnt{color:var(--bad);font-size:14px;white-space:nowrap}

/* === STYLES : CONNEXION === */
body.auth nav.bottom{display:none}
body.auth main{padding-bottom:24px}
.auth-pin{font-size:24px;letter-spacing:.5em;text-align:center}
.auth-store{text-align:center;margin-top:14px}
.auth-mig p{margin:0 0 12px}
.auth-lang{margin-bottom:14px}
.auth-msg{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.auth-msg.err{color:var(--bad);border:1px solid var(--bad);background:transparent}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}

/* === STYLES : ADMINISTRATION === */
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.adm-top h2{margin:0;font-size:20px}
.adm-tags .tag.warn{color:var(--warn)}
.adm-pick{max-height:34vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:0 12px;margin-bottom:12px}
.adm-pick .check{border-bottom:1px solid var(--border)}
.adm-pick .check:last-child{border-bottom:0}
.adm-pick .check.sub{padding-left:22px}

/* --- Demandes à Claude (suivi admin, étape 23) --- */
.adm-reqbtn{margin:4px 0 14px}
.aq-h{font-size:16px;margin:18px 0 8px}
.aq-period{margin-bottom:10px}
.aq-period button{flex:1}
.aq-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.aq-table{border-collapse:collapse;width:100%;font-size:13px}
.aq-table th,.aq-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.aq-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.aq-table th{background:var(--surface2);position:sticky;top:0}
.aq-sort{background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0;white-space:nowrap}
.aq-table tr.aq-acc{cursor:pointer}
.aq-table tr.aq-acc:hover td{background:var(--surface2)}
.aq-table .aq-name{font-weight:600}
.aq-table tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:0}
.aq-detail td{white-space:normal;overflow-wrap:anywhere;min-width:60px}
.aq-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.aq-f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.aq-count{font-size:13px;margin:4px 0 8px}
.aq-list{display:flex;flex-direction:column;gap:8px}
.aq-row{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border)}
.aq-counts{color:var(--text)}
.aq-detailbox{max-height:62vh;overflow:auto}
.aq-detailbox h4{margin:14px 0 6px;font-size:15px}
.aq-sum{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0}
.aq-sum dt{color:var(--muted)}
.aq-sum dd{margin:0;overflow-wrap:anywhere}
.aq-lothead{font-size:13px;font-weight:600;margin:10px 0 4px}
.aq-cleared{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.aq-json{max-height:60vh;overflow:auto;font-size:11px;background:var(--surface2);padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

/* --- Journal d'activité (admin, étape 24) --- */
.adm-navbtns{margin:4px 0 14px}
.adm-navbtns .adm-reqbtn{margin:0}
.al-filters{grid-template-columns:1fr 1fr 1fr}
@media (max-width:420px){.al-filters{grid-template-columns:1fr 1fr}}
.al-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.al-bar .muted{flex:1;font-size:13px;min-width:120px}
.al-bar .btn{width:auto;padding:8px 12px;min-height:40px;font-size:14px}
.al-list{display:flex;flex-direction:column;gap:6px}
.al-row{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);padding:10px 12px;margin:0}
.al-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.al-who{font-weight:700;overflow-wrap:anywhere}
.al-time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.al-kind{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:4px;font-size:14px}
.al-tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.al-tag.adm{color:var(--accent)}
.al-tag.bad{color:var(--bad)}
.al-sum{overflow-wrap:anywhere}
.al-dev{font-size:12px;color:var(--muted);margin-top:3px}
.al-devcard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.al-devt{font-weight:600}
.al-devm{font-size:12px;color:var(--muted);margin-top:4px}
.adm-tags .tag.muted{color:var(--muted)}
.app-version{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 4px}

/* --- Tableau de bord (admin, étape 25) --- */
.dash-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.dash-nav .btn{margin:0;padding:10px 6px;min-height:44px;font-size:14px;overflow-wrap:anywhere}
.dash-sec{margin-bottom:18px}
.dash-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.dash-h h3{margin:0;font-size:16px}
.dash-csv{width:auto;margin:0;padding:6px 10px;min-height:36px;font-size:13px;flex:none}
.aq-csv{display:block;margin:0 0 8px auto}
.dash-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dash-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.dash-tl{font-size:12px;color:var(--muted)}
.dash-tv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.dash-ts{font-size:12px;color:var(--muted);margin-top:2px}
.dash-ts.warn{color:var(--bad);font-weight:600}
.dash-chart{padding:12px;margin-bottom:10px;overflow:hidden}
.dash-ch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dash-ch-title{font-weight:700;font-size:14px}
.dash-ch-total{font-size:12px;color:var(--muted);white-space:nowrap}
.dash-ch-cap{font-size:13px;min-height:18px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.dash-svg{display:block;max-width:100%;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
.dash-grid{stroke:var(--border);stroke-width:1}
.dash-axis{fill:var(--muted);font-size:10px}
.dash-area{fill:var(--accent);opacity:.12}
.dash-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash-dot{fill:var(--accent)}
.dash-guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dash-mark{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dash-note{margin:-4px 0 6px}
.dash-empty{padding:10px}
.dash-table td.dash-wrap{white-space:normal;min-width:110px;overflow-wrap:anywhere}
.dash-table th.num{text-align:right}
.dash-link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.dash-inact{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
.dash-inact .input{width:90px}
.dash-alert{padding:10px 12px;margin-bottom:8px}
.dash-al-title{font-weight:700;font-size:14px;margin-bottom:4px}
.dash-al-item{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.dash-al-title + .dash-al-item{border-top:0}
.dash-al-txt{overflow-wrap:anywhere;min-width:0}
.dash-al-acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:13px}
.items .item.adm-focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface2)}
/* --- Fiche d'un compte (admin, étape 26) --- */
.fc-nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 8px}
.fc-nav .btn{margin:0;padding:10px 6px;min-height:44px;font-size:14px;overflow-wrap:anywhere}
.fc-loading{display:flex;align-items:center;gap:12px;color:var(--muted)}
.fc-spin{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:fcspin .8s linear infinite}
@keyframes fcspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fc-spin{animation-duration:2.4s}}
.fc-h{margin:20px 0 8px;font-size:17px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.fc-h4{margin:14px 0 6px;font-size:14px}
.fc-dl{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 12px;margin:0;font-size:14px}
.fc-dl dt{color:var(--muted)}
.fc-dl dd{margin:0;overflow-wrap:anywhere;min-width:0}
.fc-small{font-size:12px}
.fc-dev + .fc-dev{margin-top:6px}
.fc-table td.fc-wrap{white-space:normal;min-width:90px;overflow-wrap:anywhere}
.fc-table th.num{text-align:right}
.fc-cal,.fc-hours{padding:12px;margin:10px 0}
.fc-cal-wrap{display:flex;gap:4px;margin-top:4px}
.fc-cal-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);width:12px;line-height:1}
.fc-cal-days span{display:flex;align-items:center}
.fc-cal-grid{flex:1;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:360px}
.fc-day{display:block;aspect-ratio:1;min-width:0;width:100%;padding:0;border:0;border-radius:3px;background:var(--surface2);cursor:pointer}
span.fc-day{display:inline-block;width:12px;height:12px;aspect-ratio:auto;cursor:default;vertical-align:middle}
.fc-day.l1{background:color-mix(in srgb,var(--ok) 30%,var(--surface2))}
.fc-day.l2{background:color-mix(in srgb,var(--ok) 55%,var(--surface2))}
.fc-day.l3{background:color-mix(in srgb,var(--ok) 80%,var(--surface2))}
.fc-day.l4{background:var(--ok)}
.fc-day.frozen{background:#9cc9f0;box-shadow:inset 0 0 0 2px #3b8fd6}
.fc-day.today{outline:2px solid var(--text);outline-offset:-1px}
.fc-legend{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:11px;margin-top:8px}
.fc-legend .muted{margin:0 4px}
.fc-bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:90px;margin-top:4px}
.fc-bar{height:100%;display:flex;align-items:flex-end;padding:0;border:0;background:none;cursor:pointer;min-width:0}
.fc-bar span{display:block;width:100%;min-height:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.fc-bar.sel span{opacity:1;box-shadow:0 0 0 2px var(--text)}
.fc-bars-ax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
.fc-clist{padding:4px 12px;margin-bottom:8px}
.fc-blocked{max-height:420px;overflow-y:auto}
.fc-cline,.fc-card{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.fc-clist .fc-cline:first-child,.fc-cards .fc-card:first-child{border-top:0}
.fc-cmain{min-width:0;overflow-wrap:anywhere}
.fc-ct{font-weight:600}
.fc-cnum{flex:none;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fc-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fc-acts .btn{width:auto;margin:0;flex:1 1 140px}
.fc-search{margin-bottom:8px}
.fc-folder,.fc-list{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px}
.fc-folder > .fc-list{margin:0 8px 8px}
.fc-folder > summary,.fc-list > summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px;min-height:44px;cursor:pointer;list-style-position:inside}
.fc-ln{font-weight:600;overflow-wrap:anywhere}
.fc-cards{padding:0 12px 8px}
.fc-folder > p{padding:0 12px 8px;margin:0}
.fc-res-h{font-weight:700;font-size:13px;margin:12px 0 2px;overflow-wrap:anywhere}
.fc-meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px}
.fc-meter span{display:block;height:100%;background:var(--accent)}
.fc-meter span.bad{background:var(--bad)}
.fc-scroll{max-height:320px;overflow-y:auto}
.aq-table tr.fc-warnrow td{color:var(--bad);font-weight:600}

/* --- Gestion des comptes (admin, étape 27) : blocage, annonces, listes modèles --- */
.tag.bad{color:var(--bad);border:1px solid var(--bad);background:transparent}
.tag.ok{color:var(--ok)}
.blk-card h2{color:var(--bad)}
.blk-reason{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.blk-lbl{font-size:13px;margin-bottom:2px}
.blk-txt{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.blk-help{font-size:14px;margin:0}
.blk-ta,.an-ta{width:100%;min-height:72px;resize:vertical;font:inherit;line-height:1.4}
.ann-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:16px;max-height:55vh;overflow-y:auto}
.an-intro{font-size:14px;margin:0 0 10px}
.an-list{margin-top:12px}
.an-item{padding:14px}
.an-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.an-head .tag{margin:0;flex:none}
.an-t{font-weight:700;overflow-wrap:anywhere;min-width:0}
.an-prev{margin-top:6px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.an-meta{margin-top:8px;font-size:13px;color:var(--muted);display:grid;gap:2px;overflow-wrap:anywhere}
.an-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.an-acts .btn{min-height:44px;padding:8px 4px;font-size:14px;overflow-wrap:anywhere}
.an-lang{border:1px solid var(--border);border-radius:12px;padding:8px 12px 12px;margin:0 0 12px;min-width:0}
.an-lang legend{font-weight:600;font-size:14px;padding:0 4px}
.an-lang .field{margin-bottom:8px}
.an-pick{margin-top:8px}
.an-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.an-dates input{min-width:0;width:100%}
@media (max-width:420px){.an-dates{grid-template-columns:1fr}}
.an-rl{max-height:30vh;overflow-y:auto;padding:0 12px}
.an-r{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;overflow-wrap:anywhere}

function t(key, vars) {
  const lang = (state && state.settings && state.settings.uiLang) || defaultLang();
  let s = (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}

function applyI18n() {
  document.documentElement.lang = state.settings.uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.title = t("appTitle");
}

}

}

// === SÉRIES ===
// Étape 28 : séries façon Duolingo. Données : state.streak, clé user:<id>:streak (morceau « streak » du STORAGE).
//   { current, best, since, lastValidDay, checkedDay, freezes, run, validDays [], frozenDays [], badges [{ days, day }],
//     lost { value, day, since } | null, adjustments [{ id, kind, value, freezes, delta, before, since, reason, at, by, seen }] }
// Jours = dates locales de l'appareil ("YYYY-MM-DD"), comparées comme du texte.
// - Jour validé : au moins dailyGoal cartes révisées ce jour-là (Réglages, 5 à 100, 10 par défaut). Validé une seule
//   fois (lastValidDay) : pas de double comptage, même si l'heure ou le fuseau changent.
// - Jours passés « fermés » un par un (checkedDay = dernier jour fermé) : jour non validé → 1 gel utilisé s'il en
//   reste (série gardée, jour gelé), sinon série à 0 (lost = valeur perdue, pour la restauration par l'admin). Record gardé.
// - 1 gel gagné tous les 7 jours validés d'affilée (run), 2 au maximum. Badges à 7, 30, 100 et 365 jours (une seule fois).
// - Modifications de l'admin (fonctions SQL admin_streak_* de l'étape 28) : écrites directement dans la clé streak
//   (adjustments, seen = false). Au lancement, l'appli les applique (valeurs absolues : rejouer ne change rien),
//   les marque vues et affiche un message. Un déclencheur SQL empêche l'appli d'effacer une modification pas encore vue.
// - Migration 3 → 4 : streakFromHistory (jours avec au moins 1 révision = validés, série actuelle gardée, 0 gel).
const STREAK_BADGES = [7, 30, 100, 365];

function normAdj(a) {

  if (!["set", "restore", "freezes"].includes(a.kind)) return null;
  const b = a.before && typeof a.before === "object" ? a.before : null;
  return {
    id: a.id.slice(0, 64), kind: a.kind,
    value: clampInt(a.value, 0, STREAK_MAX, 0), freezes: clampInt(a.freezes, 0, STREAK_MAX_FREEZES, 0), delta: clampInt(a.delta, -2, 2, 0),
    before: b ? { current: clampInt(b.current, 0, STREAK_MAX, 0), freezes: clampInt(b.freezes, 0, STREAK_MAX_FREEZES, 0),

// Migration 3 → 4 : jours avec au moins 1 révision = validés ; série en cours gardée (aujourd'hui compris s'il a révisé,
// comme l'ancien affichage) ; record = plus longue suite ; badges déjà atteints donnés sans animation ; 0 gel.
function streakFromHistory(history, today) {
  today = today || todayStr();
  const days = Array.from(new Set(arr(history).filter(h => h && num(h.reviewed, 0) > 0).map(h => skDay(h.date)).filter(d => d && d <= today))).sort();
  const set = new Set(days);
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = prev && skAdd(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  const start = set.has(today) ? today : skAdd(today, -1);
  let cur = 0;
  while (set.has(skAdd(start, -cur))) cur++;

  return {
    current: cur, best, since: cur ? skAdd(start, -(cur - 1)) : null, lastValidDay: cur ? start : null,
    checkedDay: skAdd(today, -1), freezes: 0, run: 0,

// Ferme les jours passés jusqu'à hier (today exclu). Modifie s. Renvoie les événements [{ k: "frozen", day } | { k: "lost", value }].
function streakRoll(s, today) {
  const ev = [];
  let d = s.checkedDay ? skAdd(s.checkedDay, 1) : (s.lastValidDay ? skAdd(s.lastValidDay, 1) : today);
  if (s.lastValidDay && s.lastValidDay >= d) d = skAdd(s.lastValidDay, 1);
  if (d < today && skDiff(d, today) > STREAK_KEEP_DAYS) d = skAdd(today, -STREAK_KEEP_DAYS);
  const valid = new Set(s.validDays);
  for (; d < today; d = skAdd(d, 1)) {
    if (valid.has(d) || d === s.lastValidDay) continue;
    s.run = 0;
    if (s.current <= 0) continue;
    if (s.freezes > 0) { s.freezes--; s.frozenDays.push(d); ev.push({ k: "frozen", day: d }); }
    else { s.lost = { value: s.current, day: d, since: s.since }; ev.push({ k: "lost", value: s.current }); s.current = 0; s.since = null; }
  }

  if (!s.checkedDay || s.checkedDay < y) s.checkedDay = y;
  s.frozenDays = skDays(s.frozenDays);

}
// Objectif du jour atteint ? Valide le jour une seule fois. Renvoie [{ k: "goal", value } | { k: "earned" } | { k: "badge", days }].
function streakValidate(s, today, reviewed, goal) {
  if (reviewed < goal) return [];
  if (s.lastValidDay && s.lastValidDay >= today) return [];   // déjà validé (ou horloge revenue en arrière)
  const ev = [];
  if (s.current <= 0) s.since = today;
  s.current++; s.run++; s.lastValidDay = today;
  s.validDays = skDays(s.validDays.concat(today));
  s.best = Math.max(s.best, s.current);
  ev.push({ k: "goal", value: s.current });
  if (s.run % STREAK_FREEZE_EVERY === 0 && s.freezes < STREAK_MAX_FREEZES) { s.freezes++; ev.push({ k: "earned" }); }

    if (s.current >= b && !s.badges.some(x => x.days === b)) { s.badges.push({ days: b, day: today }); ev.push({ k: "badge", days: b }); }

// Modifications de l'admin pas encore vues : appliquées dans l'ordre (valeurs absolues), puis marquées vues.
// Série posée par l'admin = série du jour de la modification : les jours d'avant ne sont plus à rattraper.
function streakApplyAdj(s, today) {
  const done = [];
  s.adjustments.filter(a => !a.seen).sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
    let day = skLocalDay(a.at) || today;
    if (day > today) day = today;
    s.freezes = a.freezes;
    if (a.kind !== "freezes") {
      s.current = a.value;
      s.best = Math.max(s.best, a.value);
      s.since = a.value > 0 ? (a.since || skAdd(day, -(a.value - 1))) : null;
      if (a.kind === "restore" || a.value > 0) s.lost = null;
      const y = skAdd(day, -1);
      if (!s.checkedDay || s.checkedDay < y) s.checkedDay = y;
    }

  });

// Données en ligne : ajoute les modifications de l'admin que cet appareil ne connaît pas encore.
function streakMerge(s, raw) {
  if (!s || !raw || typeof raw !== "object") return 0;
  const have = new Set(s.adjustments.map(a => a.id));
  let n = 0;
  arr(raw.adjustments).map(normAdj).filter(Boolean).forEach(a => { if (!have.has(a.id)) { s.adjustments.push(a); have.add(a.id); n++; } });
  if (n) s.adjustments = s.adjustments.slice(-STREAK_ADJ_MAX);

// Série vue à la date today sans rien modifier (fiche du compte, admin) : copie fermée jusqu'à hier.
function streakEffective(s, today) {
  const c = normStreak(JSON.parse(JSON.stringify(s || {})), []);
  streakRoll(c, today || todayStr());
  return c;
}

// Côté appli : objectif du jour, messages au lancement, célébrations.
const Streak = (() => {
  let notices = [], lastDay = null, watching = false;
  function goal() { return clampInt(state.settings.dailyGoal, 5, 100, 10); }
  function reviewedOn(day) { const h = state.history.find(x => x.date === day); return h ? num(h.reviewed, 0) : 0; }
  function data() { if (!state.streak) state.streak = normStreak(null, state.history); return state.streak; }
  function doneToday() { return data().lastValidDay === todayStr(); }
  // Au lancement, au changement de jour, après une synchro, après un changement d'objectif.
  function tick(show) {
    if (!Storage.getUser()) return;
    const s = data(), today = todayStr();
    lastDay = today;
    const before = JSON.stringify(s);
    streakApplyAdj(s, today).forEach(a => notices.push({ k: "adj", a }));
    notices.push(...streakRoll(s, today));
    const ev = streakValidate(s, today, reviewedOn(today), goal());
    if (JSON.stringify(s) !== before) commit();
    celebrate(ev);
    if (show) showNotices();
    Friends.publish();   // série, objectif du jour, semaine : résumé public pour mes amis (étape 29)
  }
  // Après chaque réponse (Leitner) : l'appelant enregistre (commit). day = jour de la réponse.
  function onReview(day) {
    const s = data();
    lastDay = todayStr();
    notices.push(...streakRoll(s, day));
    celebrate(streakValidate(s, day, reviewedOn(day), goal()));
  }
  function celebrate(ev) {
    if (!ev.length) return;
    const g = ev.find(e => e.k === "goal");
    if (g) {
      toast(t("sk.goalDone", { n: g.value }) + (ev.some(e => e.k === "earned") ? " " + t("sk.earned") : ""));
      const fl = $("#homeFlame");
      if (fl) { fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on"); }
    }
    ev.filter(e => e.k === "badge").forEach((e, i) => setTimeout(() => badgePop(e.days), 600 + i * 3000));
  }
  // Petite animation au passage d'un palier (une seule fois : le badge est enregistré).
  function badgePop(days) {
    const box = el("div", "sk-pop");
    box.setAttribute("role", "status");
    box.append(el("span", "ic", badgeIcon(days)), el("div", "tx", t("sk.badgeNew", { n: days })), el("div", "sb", t("sk.badgeSub")));
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3000);
  }
  // Messages en attente (gel utilisé, série perdue, modifications de l'admin) : une fenêtre, hors session de révision.
  function showNotices() {
    if (!notices.length || !Storage.getUser()) return;
    if (rv.phase === "run" && currentScreen === "review") return;   // en pleine session : plus tard
    const list = notices.splice(0), s = data(), body = el("div");
    const p = txt => body.appendChild(el("p", "sk-msg", txt));
    const frozen = list.filter(x => x.k === "frozen").length;
    const lost = list.filter(x => x.k === "lost").pop();
    if (frozen) p("❄️ " + (frozen > 1 ? t("sk.msg.frozenN", { n: frozen }) : t("sk.msg.frozen1")));
    if (lost) p("💔 " + t("sk.msg.lost", { n: lost.value, b: s.best }));
    list.filter(x => x.k === "adj").forEach(({ a }) => {
      if (a.kind === "restore") p("🔥 " + t("sk.msg.restored", { n: a.value }));
      else if (a.kind === "set") p("🔥 " + t("sk.msg.set", { n: a.value }));
      else if (a.delta > 0) p("❄️ " + (a.delta > 1 ? t("sk.msg.giftN", { n: a.delta }) : t("sk.msg.gift1")));
      else if (a.delta < 0) p("❄️ " + t("sk.msg.removed", { n: -a.delta }));
    });
    if (!body.childNodes.length) return;
    if (!lost || s.current > 0) p(t("sk.msg.now", { n: s.current, f: s.freezes }));
    openModal(t("sk.title"), body, [{ label: t("ann.ok"), kind: "primary" }]);
  }
  // Changement de jour pendant que l'appli est ouverte (minuit, fuseau, retour au premier plan).
  function watch() {
    if (watching) return;
    watching = true;
    const check = () => { if (Storage.getUser() && lastDay && todayStr() !== lastDay) tick(true); };
    setInterval(check, 60000);
    try { document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); }); } catch (e) {}
  }

  return { goal, reviewedOn, data, doneToday, tick, onReview, showNotices, watch, reset };
})();
function badgeIcon(days) { return days >= 365 ? "👑" : days >= 100 ? "🏆" : days >= 30 ? "🥇" : "🏅"; }

// === TYPES DE CARTES ===
// Chaque carte a un champ type. Tous les types passent par le même Leitner, les mêmes listes, dossiers, stats et « À valider ».
//   vocab : vocabulaire (terms, pos, example)
//   conj  : conjugaison, une forme par carte (lang, verb, tense, person, answer, translation, note)
//   cloze : texte à trous (lang, sentence avec ___, answer, hint, explanation, translation, ruleId)
//   fix   : corriger l'erreur (lang, wrong, correct, explanation, ruleId)
//   rule  : fiche de règle (lang, title, body, examples [liste], translation)
// lang = langue apprise de la liste au moment de la création. Plusieurs réponses acceptées avec "/" (conj, cloze).
// Toutes les cartes gardent terms / pos / example (vides hors vocabulaire) : le code commun ne plante jamais.
const CARD_TYPES = ["vocab", "conj", "cloze", "fix", "rule"];
const TYPE_FIELDS = {
  conj: ["lang", "verb", "tense", "person", "answer", "translation", "note"],
  cloze: ["lang", "sentence", "answer", "hint", "explanation", "translation", "ruleId"],
  fix: ["lang", "wrong", "correct", "explanation", "ruleId"],
  rule: ["lang", "title", "body", "translation"]           // + examples (liste)

const TYPE_ICON = { vocab: "Aa", conj: "⇄", cloze: "▁", fix: "✎", rule: "§" };
const CLOZE_GAP = /_{2,}/;

function cardType(c) { return c && CARD_TYPES.includes(c.type) ? c.type : "vocab"; }
function isVocab(c) { return cardType(c) === "vocab"; }

function cardLang(c) { return !isVocab(c) && isLang(c.lang) ? c.lang : cardLangs(c).target; }

function typedUsable(c) {
  if (!isLang(c.lang)) return false;
  switch (c.type) {
    case "conj": return !!(c.verb && splitAlts(c.answer).length && tenseOf(c.lang, c.tense) && conjPerson(c));
    case "cloze": return CLOZE_GAP.test(c.sentence || "") && splitAlts(c.answer).length > 0;
    case "fix": return !!(c.wrong && c.correct);
    case "rule": return !!(c.title && (c.body || arr(c.examples).length));
  }
  return false;
}
function ruleOf(c) {
  const r = c && c.ruleId ? state.cards.find(x => x.id === c.ruleId) : null;
  return r && cardType(r) === "rule" ? r : null;
}
function clozeShow(sentence, fill) { return String(sentence || "").replace(CLOZE_GAP, fill); }

// --- Textes courts (listes, résumé, stats) ---
function cardTitle(c) {
  switch (cardType(c)) {
    case "conj": return c.verb + " — " + tenseName(c.lang, c.tense) + " — " + personLabel(c.lang, c.tense, c.person);
    case "cloze": return clozeShow(c.sentence, "___");
    case "fix": return c.wrong;
    case "rule": return c.title;
  }
  return targetTerm(c) || "—";
}
function cardSubtitle(c) {
  switch (cardType(c)) {
    case "conj": return [conjFull(c), c.translation].filter(Boolean).join(" · ");
    case "cloze": return clozeShow(c.sentence, splitAlts(c.answer)[0] || "___");
    case "fix": return c.correct;
    case "rule": return String(c.body || "").split("\n").map(x => x.replace(/\*\*/g, "").replace(/^\s*-\s*/, "")).filter(Boolean).join(" · ");
  }
  return supportText(c);
}
function typeBadge(type) { return el("span", "type-badge tb-" + type, TYPE_ICON[type] + " " + t("type." + type)); }
// Texte de recherche (écran Listes)
function cardSearchText(c) {
  if (isVocab(c)) return Object.values(c.terms).concat([c.example]).join(" ");
  return (TYPE_FIELDS[c.type] || []).filter(f => !["lang", "ruleId"].includes(f)).map(f => c[f]).concat(arr(c.examples)).join(" ");
}

// --- Affichage ---
// Corps de règle : texte court ; **gras** et lignes « - … » (liste) autorisés. Construit sans innerHTML.
function richLine(parent, s) {
  String(s).split(/\*\*(.+?)\*\*/).forEach((part, i) => { if (part) parent.appendChild(i % 2 ? el("b", null, part) : document.createTextNode(part)); });
}
function ruleBodyNode(body, lng) {
  const d = el("div", "ty-rbody");
  d.lang = lng || "";
  let ul = null;
  String(body || "").split("\n").forEach(line => {
    const m = line.match(/^\s*[-•]\s+(.*)$/);
    if (m) { if (!ul) { ul = el("ul"); d.appendChild(ul); } const li = el("li"); richLine(li, m[1]); ul.appendChild(li); }
    else if (line.trim()) { ul = null; const p = el("p"); richLine(p, line.trim()); d.appendChild(p); }
  });
  return d;
}
function tyLine(cls, text, lng) { const d = el("div", "ty-line " + (cls || ""), text); if (lng) d.lang = lng; return d; }
function tyLabeled(label, text, lng) {
  const d = el("div", "ty-line");
  d.appendChild(el("span", "ty-lbl", label + " "));
  const s = el("span", null, text); if (lng) s.lang = lng;
  d.appendChild(s);
  return d;
}
// Bouton dans une face de carte : ne retourne pas / ne fait pas glisser la carte.
function faceBtn(label, onClick) {
  const b = el("button", "link-btn ty-btn", label);
  b.type = "button";
  const stop = e => e.stopPropagation();
  b.addEventListener("pointerdown", stop);
  b.addEventListener("pointerup", stop);
  b.addEventListener("keydown", stop);
  b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return b;
}
// Phrase à trous : trou visible (question) ou réponse surlignée (réponse).
function clozeNode(cls, c, fill) {
  const d = el("div", cls); d.lang = c.lang;
  const parts = String(c.sentence || "").split(CLOZE_GAP);
  parts.forEach((p, i) => {
    if (p) d.appendChild(document.createTextNode(p));
    if (i < parts.length - 1) d.appendChild(fill ? el("mark", "ty-fill", fill) : el("span", "ty-gap", "＿＿＿"));
  });
  return d;
}
// Phrase corrigée avec les différences surlignées, et la phrase fautive avec les erreurs barrées.
function fixDiffNodes(c) {
  const r = wrLcs(c.wrong, c.correct);
  const good = wrDiffNode(r.B, r.mb, "wr-miss"); good.classList.add("ty-sent"); good.lang = c.lang;
  const bad = wrDiffNode(r.A, r.ma, "wr-bad"); bad.classList.add("ty-wrong"); bad.lang = c.lang;
  return { good, bad };
}
function ruleBtn(c) { const r = ruleOf(c); return r ? faceBtn(t("type.seeRule"), () => openRuleModal(r)) : null; }

// Faces question / réponse d'une carte hors vocabulaire (même forme que cardFaces) :
//   { lang (titre), main (texte), lng, items (lecture audio), mainNode() (affichage riche), extras() (nœuds en plus), noSub, long }
// Le sens de révision est ignoré pour ces types.
function typedFaces(c) {
  const L = c.lang, lg = cardLangs(c);
  const head = t("type." + c.type) + " · " + langName(L);
  const say = text => text ? [{ text, lng: L }] : [];
  let q = {}, a = {};
  if (c.type === "conj") {
    const full = conjFull(c);
    const info = tenseName(L, c.tense) + " — " + personLabel(L, c.tense, c.person);
    q = { main: c.verb, items: say(c.verb), extras: () => [tyLine("ty-big", info)] };
    a = { main: full, items: say(full), extras: () => [
      tyLine("", c.verb + " — " + info, L),
      splitAlts(c.answer).length > 1 ? tyLine("", t("type.alsoOk", { a: splitAlts(c.answer).join(" / ") }), L) : null,
      c.translation ? tyLine("ty-tr", c.translation) : null,
      c.note ? tyLine("ty-note", c.note) : null,
      faceBtn(t("type.seeTable"), () => openConjTable(c))
    ] };
  } else if (c.type === "cloze") {
    const ans = splitAlts(c.answer);
    q = { main: clozeShow(c.sentence, "…"), items: say(clozeShow(c.sentence, "…")), mainNode: cls => clozeNode(cls, c, null),
      extras: () => [c.hint ? tyLabeled(t("type.hint"), c.hint) : null] };
    a = { main: clozeShow(c.sentence, ans[0] || ""), items: say(clozeShow(c.sentence, ans[0] || "")), mainNode: cls => clozeNode(cls, c, ans[0] || ""),
      extras: () => [
        ans.length > 1 ? tyLine("", t("type.alsoOk", { a: ans.join(" / ") }), L) : null,
        c.explanation ? tyLine("ty-expl", c.explanation) : null,
        c.translation ? tyLine("ty-tr", c.translation) : null,
        ruleBtn(c)
      ] };
  } else if (c.type === "fix") {
    q = { main: c.wrong, items: say(c.wrong), extras: () => [tyLine("ty-big", t("type.fixQ"))] };
    a = { main: c.correct, items: say(c.correct), mainNode: cls => { const n = fixDiffNodes(c).good; n.classList.add(cls); return n; },
      extras: () => [fixDiffNodes(c).bad, c.explanation ? tyLine("ty-expl", c.explanation) : null, ruleBtn(c)] };
  } else {
    q = { main: c.title, items: say(c.title), extras: () => [tyLine("ty-big", t("type.ruleQ"))] };
    a = { main: c.title, items: say(arr(c.examples).join(". ")), long: true, extras: () => {
      const out = [ruleBodyNode(c.body, "")];
      if (arr(c.examples).length) { const ul = el("ul", "ty-ex"); ul.lang = L; c.examples.forEach(x => ul.appendChild(el("li", null, x))); out.push(ul); }
      if (c.translation) out.push(tyLine("ty-tr", c.translation));
      return out;
    } };
  }
  const base = { lang: head, lng: L, sub: "", subLng: "", noSub: true };
  return { q: Object.assign({}, base, q), a: Object.assign({}, base, a), target: L, lg: { target: L, support: lg.support }, typed: true };
}
// Nœuds en plus d'une face (null retirés).
function faceExtras(f) { return f && f.extras ? f.extras().filter(Boolean) : []; }

// « Voir le tableau » : toutes les cartes du même verbe + temps (même langue), dans l'ordre des personnes.
function conjSiblings(c) {
  const v = normText(c.verb);
  return state.cards.filter(x => cardType(x) === "conj" && x.lang === c.lang && x.tense === c.tense && normText(x.verb) === v)
    .sort((a, b) => (a.listId === c.listId ? 0 : 1) - (b.listId === c.listId ? 0 : 1));
}
function openConjTable(c) {
  const sib = conjSiblings(c);
  const wrap = el("div");
  wrap.appendChild(tyLine("ty-big", tenseName(c.lang, c.tense)));
  const tr0 = sib.map(x => x.translation).find(Boolean);
  if (tr0) wrap.appendChild(tyLine("ty-tr", tr0));
  const tb = el("table", "ty-table");
  personsOf(c.lang, c.tense).forEach(p => {
    const x = sib.find(y => y.person === p.id);
    const tr = el("tr", x && x.id === c.id ? "cur" : null);
    tr.append(el("td", "muted", personLabel(c.lang, c.tense, p.id)));
    const td = el("td", null, x ? conjFull(x) : "—"); td.lang = c.lang;
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  wrap.appendChild(tb);
  const notes = [...new Set(sib.map(x => x.note).filter(Boolean))];
  if (notes.length) wrap.appendChild(tyLine("ty-note", notes.join(" · ")));
  openModal(c.verb, wrap, [{ label: t("close"), kind: "primary" }]);
}
// « Voir la règle »
function openRuleModal(r) {
  const wrap = el("div");
  wrap.appendChild(ruleBodyNode(r.body, ""));
  if (arr(r.examples).length) { const ul = el("ul", "ty-ex"); ul.lang = r.lang; r.examples.forEach(x => ul.appendChild(el("li", null, x))); wrap.appendChild(ul); }
  if (r.translation) wrap.appendChild(tyLine("ty-tr", r.translation));
  openModal(r.title, wrap, [{ label: t("close"), kind: "primary" }]);
}

// Réponses acceptées en mode Écrit (hors vocabulaire) : [{ text, lng, sentence? }].
// conj : la forme seule ou avec le pronom ; cloze : le mot manquant ; fix : la phrase corrigée entière.
function typedAlts(c) {
  const out = [], add = (text, sentence) => { if (text && !out.some(x => x.text === text)) out.push({ text: wrClean(text), lng: c.lang, sentence: !!sentence }); };
  if (c.type === "conj") splitAlts(c.answer).forEach(x => { add(x); add(conjFull(c, x)); });
  else if (c.type === "cloze") splitAlts(c.answer).forEach(x => add(x));
  else if (c.type === "fix") add(c.correct, true);
  return out;
}

// === DEMO ===
// Liste « Démo » d'un nouveau compte, dans sa langue apprise par défaut : tout vient de LANGUAGES[langue].demo.
// Mots : traductions prises dans les mots de même key des autres langues ; phrase d'exemple dans la langue apprise.
// Autres types : textes { fr, ko, en } pris dans la 1re langue d'appui qui les a (traductions : toutes les langues d'appui).
function addDemoList(data) {
  const lg = resolveLangs([{ target: data.settings.defaultTarget, support: data.settings.defaultSupport }]);
  const D = (LANGUAGES[lg.target] && LANGUAGES[lg.target].demo) || {};
  const list = { id: uid(), name: "Démo", folderId: null, order: nextOrder(data.lists.filter(l => !l.folderId)), createdAt: Date.now() };
  data.lists.push(list);
  arr(D.words).forEach(w => {
    const terms = {}, pos = {};
    LANG_CODES.forEach(code => {
      const x = arr((LANGUAGES[code].demo || {}).words).find(y => y.key === w.key);
      if (x) { terms[code] = x.term; if (x.pos) pos[code] = x.pos; }
    });
    data.cards.push(newCard(list.id, terms, w.ex || "", arr(w.tags).slice(), pos));
  });
  const order = lg.support.concat([lg.target]);
  const one = v => (v && typeof v === "object") ? (order.map(k => v[k]).find(Boolean) || locText(v, data.settings.uiLang)) : String(v || "");
  const all = v => (v && typeof v === "object") ? lg.support.map(k => v[k]).filter(Boolean).join(" / ") : String(v || "");
  const rules = {};
  const cards = arr(D.cards);
  cards.filter(x => x.type === "rule").concat(cards.filter(x => x.type !== "rule")).forEach(x => {
    const base = { lang: lg.target };
    if (x.type === "rule") {
      const c = newTypedCard(list.id, "rule", Object.assign(base, { title: x.title, body: one(x.body), examples: x.examples, translation: all(x.translation) }));
      rules[x.key] = c.id; data.cards.push(c);
    } else if (x.type === "conjtab") {
      personsOf(lg.target, x.tense).forEach((p, i) => {
        if (!x.forms[i]) return;
        data.cards.push(newTypedCard(list.id, "conj", Object.assign({}, base, { verb: x.verb, tense: x.tense, person: p.id, answer: x.forms[i],
          translation: all(x.translation), note: one(x.note) })));
      });
    } else if (x.type === "cloze") {
      data.cards.push(newTypedCard(list.id, "cloze", Object.assign(base, { sentence: x.sentence, answer: x.answer, hint: one(x.hint),
        explanation: one(x.explanation), translation: all(x.translation), ruleId: rules[x.ruleKey] || "" })));
    } else if (x.type === "fix") {
      data.cards.push(newTypedCard(list.id, "fix", Object.assign(base, { wrong: x.wrong, correct: x.correct,
        explanation: one(x.explanation), ruleId: rules[x.ruleKey] || "" })));
    }
  });
  return data;
}
// Exemple de saisie pour un champ de mot (éditeur de carte) : 3e mot de la démo de cette langue.
function langSample(code) { const w = arr((LANGUAGES[code] && LANGUAGES[code].demo || {}).words); return (w[2] || w[0] || {}).term || ""; }

// === STORAGE ===
// Couche d'accès unique. Données du compte connecté (<id> = identifiant de l'appli) découpées en morceaux :
//   user:<id>:index                 { v: 2, updatedAt, keys: [...] } — liste des morceaux, écrit en dernier
//   user:<id>:settings              { version (modèle de données), settings, updatedAt, rejected, lastCheckAt, aiResume: { kind, total } }
//   user:<id>:folders / :lists / :history
//   user:<id>:streak                série (étape 28, voir SÉRIES) — aussi modifiée par les fonctions admin de l'étape 28
//   user:<id>:proposals:<n>         propositions « À valider » (500 max par morceau)
//   user:<id>:cards:<listId>:<n>    { cards: [200 max], sig: { idCarte: empreinte vérifiée } }
//   user:<id>:resume:<n>            ids des cartes restant à compléter (complétion en pause, 2000 max par morceau)
// Seuls les morceaux modifiés sont écrits (comparaison avec ce qui a déjà été écrit).
//  - local : localStorage "vocabfr." + clé (écriture tout-ou-rien : en cas d'échec, les morceaux déjà écrits sont restaurés)
//  - cloud : document data/users/<idClaude>/<clé> = { json, updatedAt } (adaptateur claudeDbBackend)
//  - Supabase (si config.js est rempli) : table user_data, une ligne par morceau, clé primaire (user_id, key),
//    clé sans le préfixe "user:<id>:" — adaptateur supabaseBackend, voir supabase.sql
// Conflits : localStorage "vocabfr.synced:<id>" = updatedAt des données en ligne à la dernière synchro réussie.
// Avant chaque envoi, l'index en ligne est relu : s'il a changé depuis (autre appareil), on demande quelles données garder.
// Envoi raté : données gardées sur l'appareil, nouvel essai automatique (CONFIG.RETRY_MS, et au retour de la connexion).
// Ancien format (un seul bloc) : localStorage "vocabfr.user:<id>" + document "user:<id>". Migré automatiquement,
// après un export JSON de sécurité. Le document cloud ancien n'est jamais effacé ; la clé locale ancienne
// est retirée seulement après relecture réussie du nouveau format.
// Registre des comptes : localStorage "vocabfr.accounts" + document data/users/<idClaude>/accounts.
// Anciennes données (avant les comptes) : "vocabfr.data.v1" + data/users/<idClaude>/state, lues pour la migration, jamais effacées.

// Adaptateur cloud de l'artifact : get(clé) → texte JSON ou undefined ; set(clé, json, updatedAt) ; del(clé).
function claudeDbBackend(db, base) {
  return {
    async get(key) {
      const snap = await withTimeout(db.doc(base + "/" + key).get(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!snap.exists) return undefined;
      const body = snap.data();
      return body && typeof body.json === "string" ? body.json : undefined;
    },
    async set(key, json, updatedAt) { await withTimeout(db.doc(base + "/" + key).set({ json, updatedAt }), CONFIG.REMOTE_TIMEOUT_MS); },
    async del(key) { await withTimeout(db.doc(base + "/" + key).delete(), CONFIG.REMOTE_TIMEOUT_MS); }
  };
}
// Adaptateur Supabase : table user_data (user_id, key, data jsonb, updated_at), RLS = chacun ses lignes (admin : toutes).
// La clé y est stockée sans le préfixe "user:<id>:". uid = auth.uid() de l'utilisateur connecté.
// updated_at est mis par le serveur (trigger). jsonb ne garde pas l'ordre des champs : voir markSynced().
function supabaseBackend(client, uid, prefix) {
  const k = key => key.startsWith(prefix) ? key.slice(prefix.length) : key;
  const ok = r => { if (r && r.error) throw r.error; return r ? r.data : null; };
  const T = CONFIG.REMOTE_TIMEOUT_MS;
  return {
    async get(key) {
      const d = ok(await withTimeout(client.from("user_data").select("data").eq("user_id", uid).eq("key", k(key)).maybeSingle(), T));
      return d ? JSON.stringify(d.data) : undefined;
    },
    // Toutes les lignes du compte en une requête : Map(clé avec préfixe → texte JSON).
    async getAll() {
      const rows = ok(await withTimeout(client.from("user_data").select("key,data").eq("user_id", uid), T * 3));
      return new Map(arr(rows).map(r => [prefix + r.key, JSON.stringify(r.data)]));
    },
    async set(key, json) {
      ok(await withTimeout(client.from("user_data").upsert({ user_id: uid, key: k(key), data: JSON.parse(json) }), T));
    },
    async del(key) {
      ok(await withTimeout(client.from("user_data").delete().eq("user_id", uid).eq("key", k(key)), T));
    }
  };
}

const Storage = (() => {
  let db = null, base = null;  // base = "data/users/<idClaude>" quand le cloud est disponible
  let backend = null;          // adaptateur cloud de l'artifact (null = pas de cloud Claude)
  let sb = null;               // client Supabase (null = pas de Supabase)
  let userId = null, remote = null; // remote = adaptateur du compte connecté
  let remoteOk = false;        // données en ligne lues et comparées : les envois sont permis
  let mode = "local";          // "local" | "cloud" | "syncing" | "offline" | "error"
  let retryTimer = null, failWarned = false, conflictOpen = false;
  let onConflictFn = null, onRetryInitFn = null, onSyncErrorFn = null;
  let timer = null, lastData = null, held = false;
  let chain = Promise.resolve();
  let localSaved = new Map();  // clé → JSON déjà présent dans localStorage
  let remoteSaved = new Map(); // clé → JSON déjà présent dans le cloud
  let localFullWarned = false;
  const listeners = [];

  function setMode(m) { mode = m; listeners.forEach(fn => { try { fn(m); } catch (e) {} }); }
  function onMode(fn) { listeners.push(fn); fn(mode); }
  function getMode() { return mode; }
  function isCloud() { return !!backend || !!sb; }
  function isSupabase() { return !!sb; }
  // Supabase : pas de registre de comptes local (Supabase Auth s'en charge).
  function useSupabase(client) { sb = client; backend = null; setMode("cloud"); }
  function failMode() { setMode(navigator.onLine === false ? "offline" : "error"); }

  // --- Synchro : updatedAt des données en ligne à la dernière synchro réussie (null = inconnu) ---
  function getSynced() {
    if (!userId) return null;
    try { const v = localStorage.getItem(CONFIG.LS_SYNCED + userId); return v === null ? null : Number(v); } catch (e) { return null; }
  }
  function setSynced(v) { if (userId) { try { localStorage.setItem(CONFIG.LS_SYNCED + userId, String(v)); } catch (e) {} } }
  // Les données en ligne sont identiques à data : on retient leurs morceaux (évite de tout renvoyer).
  function markSynced(data) {
    if (!userId) return;
    const { pieces, index } = split(data);
    remoteSaved = new Map(pieces); remoteSaved.set(pre() + "index", index);
    setSynced(data.updatedAt);
  }
  // « Garder les données de cet appareil » : tout renvoyer et supprimer les morceaux en ligne en trop.
  function forceFullPush(remoteKeys, remoteUpdatedAt) {
    remoteSaved = new Map(arr(remoteKeys).map(k => [k, null]));
    remoteSaved.set(pre() + "index", null);
    setSynced(remoteUpdatedAt);
  }
  function onConflict(fn) { onConflictFn = fn; }
  function onRetryInit(fn) { onRetryInitFn = fn; }
  function setConflictOpen(v) { conflictOpen = !!v; }
  // Nouvel essai automatique : relecture en ligne si elle a échoué, sinon nouvel envoi.
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(retryNow, CONFIG.RETRY_MS);
  }
  function retryNow() {
    clearTimeout(retryTimer); retryTimer = null;
    if (!userId || !remote) return;
    if (!remoteOk) { if (onRetryInitFn) { try { onRetryInitFn(); } catch (e) {} } }
    else if (lastData) flush();
  }
  try { window.addEventListener("online", retryNow); window.addEventListener("offline", () => { if (remote) setMode("offline"); }); } catch (e) {}

  function lsGet(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsRaw(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function oldKey(id) { return "user:" + id; }               // ancien format (un seul bloc)
  function pre() { return "user:" + userId + ":"; }          // préfixe des morceaux du compte connecté
  function byteLen(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 3; } }

  // Connexion au cloud (base + identité Claude). Renvoie true si disponible.
  async function connect() {
    try {
      if (typeof window.claude === "undefined" || !window.claude || typeof window.claude.use !== "function") return false;
      const [d, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), CONFIG.REMOTE_TIMEOUT_MS + 2000);
      if (!d || !user) return false;
      const id = await withTimeout(user.id(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!id) return false;
      db = d; base = "data/users/" + id;
      backend = claudeDbBackend(db, base);
      setMode("cloud");
      return true;
    } catch (e) {
      db = null; base = null; backend = null;
      setMode("local");
      return false;
    }
  }
  // Lecture d'un document { json } (registre, anciennes données) : objet, ou undefined si vide. Lève une erreur en cas d'échec.
  async function remoteGet(name) {
    const json = await backend.get(name);
    return json ? JSON.parse(json) : undefined;
  }

  // --- Comptes : { accounts: [{ id, salt, pinHash, createdAt }], migrated } ---
  function normReg(r) {

        .map(a => ({ id: String(a.id), salt: String(a.salt || ""), pinHash: String(a.pinHash), createdAt: num(a.createdAt, 0) })),

    b.accounts.forEach(x => { if (!out.accounts.some(y => y.id === x.id)) out.accounts.push(x); });
    out.accounts.sort((x, y) => x.createdAt - y.createdAt);

  }
  async function loadAccounts() {
    let reg = normReg(lsGet(CONFIG.LS_ACCOUNTS));

      catch (e) { setMode("error"); }
    }

  }
  // Relit le registre distant avant d'écrire, pour ne pas écraser un compte créé sur un autre appareil.
  async function saveAccounts(reg) {

      const m = mergeReg(reg, normReg(await remoteGet(CONFIG.REMOTE_ACCOUNTS)));
      await backend.set(CONFIG.REMOTE_ACCOUNTS, JSON.stringify(m), Date.now());

  }

  // --- Anciennes données (avant les comptes) : la version la plus récente entre local et cloud ---
  function readLegacyLocal() { return lsGet(CONFIG.LS_KEY); }
  async function readLegacy() {
    const l = looksLikeAppData(readLegacyLocal()) ? readLegacyLocal() : null;
    let r = null;
    if (backend) { try { const x = await remoteGet(CONFIG.REMOTE_DOC); if (looksLikeAppData(x)) r = x; } catch (e) {} }
    if (l && r) return num(r.updatedAt, 0) >= num(l.updatedAt, 0) ? r : l;
    return l || r;
  }

  // --- Session sur cet appareil (sans Supabase) : localStorage si « Rester connecté », sinon sessionStorage ---
  function getSession() {
    try { return localStorage.getItem(CONFIG.LS_SESSION) || sessionStorage.getItem(CONFIG.LS_SESSION) || null; } catch (e) { return null; }
  }
  function setSession(id) {
    try { localStorage.removeItem(CONFIG.LS_SESSION); sessionStorage.removeItem(CONFIG.LS_SESSION); } catch (e) {}
    if (!id) return;
    try { (rememberMe() ? localStorage : sessionStorage).setItem(CONFIG.LS_SESSION, id); } catch (e) {}
  }

  // --- Découpage : données → Map(clé → JSON) dans l'ordre de l'index ---
  function slices(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
  function split(data, prefix) {
    const p = new Map(), P = prefix === undefined ? pre() : prefix;
    const put = (k, v) => p.set(P + k, JSON.stringify(v));
    const ids = data.aiResume ? arr(data.aiResume.ids) : [];
    put("settings", {
      version: data.version, settings: data.settings, updatedAt: data.updatedAt, rejected: data.rejected, lastCheckAt: data.lastCheckAt,
      aiResume: data.aiResume ? { kind: data.aiResume.kind, total: ids.length } : null
    });
    put("folders", data.folders);
    put("lists", data.lists);
    put("history", data.history);
    put("streak", data.streak);
    // Cartes : par liste, morceaux de 200 cartes max (et taille limitée, pour les cartes avec de longs exemples).
    const byList = new Map();
    data.cards.forEach(c => { if (!byList.has(c.listId)) byList.set(c.listId, []); byList.get(c.listId).push(c); });
    const sigs = data.checkedSig || {};
    byList.forEach((cards, listId) => {
      let n = 0, cur = [], curSig = {}, bytes = 0;
      const out = () => { put("cards:" + listId + ":" + (n++), { cards: cur, sig: curSig }); cur = []; curSig = {}; bytes = 0; };
      cards.forEach(c => {
        const b = byteLen(JSON.stringify(c)) + 40;
        if (cur.length && (cur.length >= CONFIG.CARDS_PER_PIECE || bytes + b > CONFIG.PIECE_MAX_BYTES)) out();
        cur.push(c); bytes += b;
        if (sigs[c.id]) curSig[c.id] = sigs[c.id];
      });
      if (cur.length) out();
    });
    slices(data.proposals, CONFIG.PROPOSALS_PER_PIECE).forEach((s, i) => put("proposals:" + i, s));
    slices(ids, CONFIG.IDS_PER_PIECE).forEach((s, i) => put("resume:" + i, s));

    return { pieces: p, index };
  }
  // Administration : données d'un autre compte ↔ lignes Supabase. Comme pour le compte lui-même :
  // clé de ligne sans préfixe, mais liste de l'index avec le préfixe "user:<identifiant>:".
  function packRows(data, ident) {
    const P = "user:" + ident + ":";
    const { pieces, index } = split(data, P);
    const rows = Array.from(pieces, ([key, json]) => ({ key: key.slice(P.length), data: JSON.parse(json) }));
    rows.push({ key: "index", data: JSON.parse(index) });  // l'index en dernier
    return rows;
  }
  function unpackRows(rows) {
    const m = new Map(arr(rows).map(r => [r.key, r.data]));
    if (!m.has("index")) return null;
    const idx = Object.assign({}, m.get("index"));
    idx.keys = arr(idx.keys).map(k => String(k).replace(/^user:[^:]*:/, ""));
    return assemble(idx, k => m.get(k), "").data;
  }
  // Morceaux → données (à passer ensuite dans normalizeData). get(clé) → objet ou undefined.
  function assemble(idx, getPiece, prefix) {
    const P = prefix === undefined ? pre() : prefix;
    const s = getPiece(P + "settings") || {};
    const out = {
      version: num(s.version, 1), updatedAt: num(idx.updatedAt, 0),   // pas de version = données de la version 1
      settings: s.settings, rejected: s.rejected, lastCheckAt: s.lastCheckAt,
      folders: arr(getPiece(P + "folders")), lists: arr(getPiece(P + "lists")), history: arr(getPiece(P + "history")),
      streak: getPiece(P + "streak"),   // absent (version 3 et moins) : calculé par normalizeData
      cards: [], proposals: [], checkedSig: {}, aiResume: null
    };
    const ids = [];
    let missing = 0;
    arr(idx.keys).forEach(k => {
      const v = getPiece(k);
      if (v === undefined) { missing++; return; }
      if (k.startsWith(P + "cards:")) { out.cards.push(...arr(v.cards)); Object.assign(out.checkedSig, v.sig || {}); }
      else if (k.startsWith(P + "proposals:")) out.proposals.push(...arr(v));
      else if (k.startsWith(P + "resume:")) ids.push(...arr(v));

  // --- Compte connecté ---

  function setUser(id, sbUid) {

    localSaved = new Map(); remoteSaved = new Map(); localFullWarned = false;
    userId = id || null;
