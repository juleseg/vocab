<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab</title>
<link rel="stylesheet" href="css/app.css?v=33b">
<!-- === PWA (appli installable) === -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5bd3">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocab">
<script src="pwa.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 data-i18n="appTitle"></h1>
    <div class="sync" id="syncStatus" data-mode="local"><span class="dot"></span><span id="syncLabel"></span></div>
  </header>

  <main>
    <!-- BANDEAUX DE REPRISE (traitements interrompus) -->
    <div id="resumeBars"></div>

    <!-- ÉCRAN : CONNEXION -->
    <section class="screen" id="screen-auth"></section>

    <!-- ÉCRAN : ACCUEIL -->
    <section class="screen" id="screen-home">
      <div class="row2">
        <div class="card"><div class="big-num" id="homeDue">0</div><div class="muted" data-i18n="home.due"></div></div>
        <div class="card sk-home" id="homeStreakCard">
          <div class="sk-flame-row"><span class="sk-flame off" id="homeFlame" aria-hidden="true">🔥</span><span class="big-num" id="homeStreak">0</span></div>
          <div class="muted" data-i18n="home.streak"></div>
          <div class="sk-sub" id="homeStreakSub"></div>
        </div>
      </div>
      <div class="card sk-goal" id="homeGoal"></div>
    </section>

    <!-- ÉCRAN : RÉVISER -->
    <section class="screen" id="screen-review"></section>

    <!-- ÉCRAN : LISTES -->
    <section class="screen" id="screen-lists">
      <div class="lv-top" id="lvTop" hidden>
        <button class="link-btn" id="lvBack"></button>
      </div>
      <div class="lv-top" id="lvTitleRow" hidden><h2 id="lvTitle"></h2></div>
      <div class="lv-sub" id="lvSub"></div>
      <div class="lv-links" id="lvLinks" hidden>
        <button class="link-btn" id="lvRename" data-i18n="lists.rename"></button>
        <button class="link-btn" id="lvMove" data-i18n="folders.moveBtn"></button>
        <button class="link-btn" id="lvShare"></button>
        <button class="link-btn" id="lvLangs" data-i18n="folders.langs"></button>
        <button class="link-btn" id="lvUpdate" data-i18n="upd.btn"></button>
        <button class="link-btn" id="lvAsk" data-i18n="queue.ask" hidden></button>
        <button class="link-btn" id="lvFxOut" data-i18n="fx.exportBtn"></button>
        <button class="link-btn" id="lvFxIn" data-i18n="ai.importReply"></button>
        <button class="link-btn danger" id="lvDelete" data-i18n="lists.delete"></button>
      </div>
      <input type="search" class="input" id="lvSearch" autocomplete="off">
      <div class="btns three" id="lvActions">
        <button class="btn primary" id="lvAdd"></button>
        <button class="btn" id="lvBulk" data-i18n="lists.importText"></button>
        <button class="btn" id="lvGen" data-i18n="gen.btn"></button>
      </div>
      <div class="lv-links" id="lvMore">
        <button class="link-btn" id="lvNewFolder" data-i18n="folders.newBtn"></button>
        <button class="link-btn" id="lvReorder"></button>
        <button class="link-btn" id="lvUpdateAll" data-i18n="upd.all"></button>
        <button class="link-btn" id="lvAskAll" data-i18n="queue.ask" hidden></button>
        <button class="link-btn" id="lvFxOutAll" data-i18n="fx.exportBtn"></button>
        <button class="link-btn" id="lvFxInAll" data-i18n="ai.importReply"></button>
      </div>
      <div id="lvContent"></div>
    </section>

    <!-- ÉCRAN : STATS -->
    <section class="screen" id="screen-stats"></section>

    <!-- ÉCRAN : À VALIDER -->
    <section class="screen" id="screen-pending"></section>

    <!-- ÉCRAN : DEMANDES À CLAUDE (file d'attente, mode Supabase) -->
    <section class="screen" id="screen-requests"></section>

    <!-- Amis (étape 29) -->
    <section class="screen" id="screen-friends"></section>

    <!-- ÉCRAN : RÉGLAGES -->
    <section class="screen" id="screen-admin"></section>

    <!-- ÉCRAN : ADMINISTRATION — DEMANDES À CLAUDE (suivi, admin seulement) -->
    <section class="screen" id="screen-adminreq"></section>

    <!-- ÉCRAN : ADMINISTRATION — JOURNAL D'ACTIVITÉ (admin seulement) -->
    <section class="screen" id="screen-adminlog"></section>

    <!-- ÉCRAN : ADMINISTRATION — LISTE DES COMPTES (admin seulement, étape 25 : l'accueil admin est le tableau de bord) -->
    <section class="screen" id="screen-adminacc"></section>
    <!-- Fiche d'un compte (admin, étape 26) -->
    <section class="screen" id="screen-adminfiche"></section>
    <!-- Annonces et listes modèles (admin, étape 27) -->
    <section class="screen" id="screen-adminann"></section>
    <section class="screen" id="screen-admintpl"></section>
    <!-- Notifications push (admin, étape 32) -->
    <section class="screen" id="screen-adminpush"></section>

    <section class="screen" id="screen-settings">
      <div class="card">
        <div class="field">
          <label data-i18n="settings.language"></label>
          <div class="seg" id="setLang">
            <button data-value="ko">한국어</button>
            <button data-value="fr">Français</button>
            <button data-value="en">English</button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="settings.theme"></label>
          <div class="seg" id="setTheme">
            <button data-value="light" data-i18n="theme.light"></button>
            <button data-value="dark" data-i18n="theme.dark"></button>
            <button data-value="auto" data-i18n="theme.auto"></button>
          </div>
        </div>
        <div class="field">
          <label for="setSessionSize" data-i18n="settings.sessionSize"></label>
          <input type="number" id="setSessionSize" min="1" max="500" inputmode="numeric">
        </div>
        <div class="field">
          <label for="setDailyGoal" data-i18n="settings.dailyGoal"></label>
          <input type="number" id="setDailyGoal" min="5" max="100" inputmode="numeric">
          <div class="hint" data-i18n="settings.dailyGoalHint"></div>
        </div>
      </div>

      <div class="card" id="audioCard"></div>

      <div class="card">
        <h2 data-i18n="langs.defaultTitle"></h2>
        <p class="muted" id="defaultLangs" style="margin-top:0"></p>
        <button class="btn" id="btnDefaultLangs" data-i18n="langs.change"></button>
      </div>

      <div class="card" id="aiCard"></div>

      <div class="card" id="friendsPrivCard" hidden></div>

      <div class="card" id="pushCard" hidden></div>

      <div class="card">
        <h2 data-i18n="account.title"></h2>
        <p class="muted" id="accountInfo" style="margin-top:0"></p>
        <div class="btns">
          <button class="btn" id="btnChangePin" data-i18n="account.changePin"></button>
          <button class="btn" id="btnLogout" data-i18n="account.logout"></button>
        </div>
      </div>

      <div class="card" id="adminCard" hidden>
        <h2 data-i18n="admin.title"></h2>
        <button class="btn" id="btnAdmin" data-i18n="admin.open"></button>
      </div>

      <div class="card">
        <h2 data-i18n="settings.data"></h2>
        <p class="muted" id="storageInfo" style="margin-top:0"></p>
        <div class="btns two">
          <button class="btn" id="btnExport" data-i18n="export"></button>
          <button class="btn" id="btnImport" data-i18n="import"></button>
        </div>
        <input type="file" id="importFile" class="hidden-input" accept="application/json,.json">
      </div>

      <p class="app-version" id="appVersion"></p>
    </section>
  </main>

  <nav class="bottom">
    <div class="inner">
      <button data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home"></span></button>
      <button data-nav="review"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="14" height="16" rx="2"/><path d="M8 2h11a1 1 0 0 1 1 1v14"/></svg><span data-i18n="nav.review"></span></button>
      <button data-nav="lists"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-i18n="nav.lists"></span></button>
      <button data-nav="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav.stats"></span></button>
      <button data-nav="pending"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span data-i18n="nav.pending"></span><span class="nav-badge" id="pendingBadge" hidden></span></button>
      <button data-nav="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/></svg><span data-i18n="nav.friends"></span><span class="nav-badge" id="friendsBadge" hidden></span></button>
      <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="nav.settings"></span></button>
    </div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<!-- Configuration Supabase (fichier séparé, absent dans Claude : l'appli passe alors au stockage de l'artifact ou du navigateur) -->
<script src="config.js"></script>
<!-- Scripts de l'appli, dans l'ordre (scripts classiques, sans build). -->
<script src="js/core.js?v=33b"></script>
<script src="js/languages.js?v=33b"></script>
<script src="js/i18n/ko.js?v=33b"></script>
<script src="js/i18n/fr.js?v=33b"></script>
<script src="js/i18n/en.js?v=33b"></script>
<script src="js/storage.js?v=33b"></script>
<script src="js/cards.js?v=33b"></script>
<script src="js/auth.js?v=33b"></script>
<script src="js/leitner.js?v=33b"></script>
<script src="js/modes/cartes.js?v=33b"></script>
<script src="js/modes/ecrit.js?v=33b"></script>
<script src="js/modes/interrogateur.js?v=33b"></script>
<script src="js/modes/tableau.js?v=33b"></script>
<script src="js/screens/accueil.js?v=33b"></script>
<script src="js/screens/reviser.js?v=33b"></script>
<script src="js/screens/listes.js?v=33b"></script>
<script src="js/screens/stats.js?v=33b"></script>
<script src="js/screens/reglages.js?v=33b"></script>
<script src="js/screens/a-valider.js?v=33b"></script>
<script src="js/screens/amis.js?v=33b"></script>
<script src="js/screens/admin.js?v=33b"></script>
<script src="js/screens/admin-dashboard.js?v=33b"></script>
<script src="js/screens/admin-demandes.js?v=33b"></script>
<script src="js/screens/admin-journal.js?v=33b"></script>
<script src="js/screens/admin-fiche.js?v=33b"></script>
<script src="js/screens/admin-comptes.js?v=33b"></script>
<script src="js/screens/admin-notifications.js?v=33b"></script>
<script src="js/partage.js?v=33b"></script>
<script src="js/import.js?v=33b"></script>
<script src="js/completion.js?v=33b"></script>
<script src="js/queue.js?v=33b"></script>
<script src="js/activity.js?v=33b"></script>
<script src="js/audio.js?v=33b"></script>
<script src="js/notifications.js?v=33b"></script>
<script src="js/app.js?v=33b"></script>
</body>
</html>
