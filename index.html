// === EXPORT / IMPORT ===
// Exporte data (par défaut : les données du compte connecté).
// Renvoie "saved" (fichier enregistré) ou "text" (fenêtre avec le texte à copier).
async function exportData(data, filename) {
  const json = JSON.stringify(data || state, null, 2);
  filename = filename || ("vocabulaire-francais-" + (Storage.getUser() ? Storage.getUser() + "-" : "") + todayStr() + ".json");
  try {
    const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data: json }); toast(t("export.done")); return "saved"; }
  } catch (e) { /* refusé ou indisponible : on passe au plan B */ }
  if (!inClaude()) {          // navigateur (GitHub Pages) : téléchargement d'un fichier .json
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast(t("export.done"));
      return "saved";
    } catch (e) {}
  }
  showExportText(json);
  return "text";
}
function showExportText(json) {
  const wrap = document.createElement("div");
  const p = document.createElement("p"); p.textContent = t("export.fallback");
  const ta = document.createElement("textarea"); ta.readOnly = true; ta.value = json;
  wrap.append(p, ta);
  openModal(t("export.title"), wrap, [
    { label: t("copy"), kind: "primary", onClick: () => {
      try { navigator.clipboard.writeText(json).then(() => toast(t("copied")), () => { ta.select(); }); }
      catch (e) { ta.select(); }
      return false;
    } },
    { label: t("close") }
  ]);
}

// target (administration) : { id, apply(data) } pour importer dans un autre compte ; sinon le compte connecté.
let importTarget = null;
function openImport(target) {
  importTarget = target && typeof target.apply === "function" ? target : null;
  const wrap = document.createElement("div");
  const fileBtn = document.createElement("button");
  fileBtn.className = "btn"; fileBtn.textContent = t("import.file");
  const lab = document.createElement("p"); lab.className = "muted"; lab.style.margin = "16px 0 6px"; lab.textContent = t("import.paste");
  const ta = document.createElement("textarea"); ta.placeholder = '{ "version": 2, ... }';
  wrap.append(fileBtn, lab, ta);
  let closeFn = null;
  fileBtn.addEventListener("click", () => { if (closeFn) closeFn(); $("#importFile").click(); });
  closeFn = openModal(t("import.title"), wrap, [
    { label: t("cancel") },
    { label: t("next"), kind: "primary", onClick: () => importFromText(ta.value) ? undefined : false }
  ]);
}
function onImportFile(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importFromText(String(r.result || ""));
  r.onerror = () => toast(t("import.error"));
  r.readAsText(f);
}
function importFromText(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { toast(t("import.error")); return false; }
  if (!looksLikeAppData(raw)) { toast(t("import.error")); return false; }
  const data = normalizeData(raw);
  const tg = importTarget;
  const p = document.createElement("p");
  p.textContent = tg ? t("admin.importConfirm", { id: tg.id, lists: data.lists.length, cards: data.cards.length })
                     : t("import.confirm", { lists: data.lists.length, cards: data.cards.length });
  openModal(t("import.title"), p, [
    { label: t("cancel") },
    { label: t("confirm"), kind: "primary", onClick: () => {
      if (tg) { tg.apply(data).then(() => toast(t("admin.importDone", { id: tg.id })), () => toast(t("admin.err"))); return; }
      state = data; applyTheme(); commit(); toast(t("import.done"));
    } }
  ]);
  return true;
}

// === CLAUDE (IA) ===
// Capacité "sample" de l'artifact : interroger Claude depuis la page (sur le compte Claude de la personne).
// status : "pending" (en attente de l'environnement) | "on" | "off" (repli « Préparer pour Claude »).
const AI = (() => {
  let fn = null, status = "pending", readyP = null;
  const listeners = [];
  const OFF_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
  function set(s) { status = s; listeners.forEach(f => { try { f(s); } catch (e) {} }); }
  function init() {
    if (readyP) return readyP;
    readyP = (async () => {
      try {
        if (!window.claude || typeof window.claude.use !== "function") { set("off"); return; }
        const s = await withTimeout(window.claude.use("sample"), 12000);
        fn = (typeof s === "function" && typeof s.json === "function") ? s : null;
        set(fn ? "on" : "off");
      } catch (e) { fn = null; set("off"); }
    })();
    return readyP;
  }
  // Réponse JSON de Claude. Rejette { code, message } ; les refus définitifs basculent sur le repli.
  async function ask(prompt, signal) {
    if (!fn) throw { code: "not_granted", message: "unavailable" };
    try { return await fn.json(prompt, { signal, modelTier: "default" }); }
    catch (e) {
      if (e && OFF_CODES.includes(e.code)) { fn = null; set("off"); }
      throw e;
    }
  }
  return {
    init, ready: init, ask,
    status: () => status, isOn: () => status === "on", isOffCode: c => OFF_CODES.includes(c),
    onChange: f => listeners.push(f)
  };
})();

// === COMPLÉTION & VÉRIFICATION ===
// Toutes les propositions vont dans state.proposals (section « À valider ») : rien n'est écrit directement dans les cartes.
// Champs d'une proposition : code de langue (traduction), "example", "pos:<code>" (nature grammaticale) ou "dup".
// Complétion : langues d'appui, exemple et nature (de chaque langue de la carte) vides
// (la langue apprise est la référence, jamais complétée).
// Vérification : fautes, accents, traductions douteuses (Claude) + doublons (détectés localement).
let aiJob = null; // traitement en cours (un seul à la fois)

function posFields(lg) { return [lg.target].concat(lg.support).map(posField); }
function fillFields(c, lg) { if (!isVocab(c)) return []; lg = lg || cardLangs(c); return lg.support.concat(["example"], posFields(lg)); }
function checkFields(c, lg) { lg = lg || cardLangs(c); return [lg.target].concat(lg.support, ["example"], posFields(lg)); }
// Consignes « nature grammaticale » communes (accès direct et « Préparer pour Claude »).
function posPromptLines(prefix) {
  const g = LANG_CODES.filter(c => LANGUAGES[c].gender), ng = LANG_CODES.filter(c => !LANGUAGES[c].gender);
  return [
    prefix + "pos:<code de langue> : nature grammaticale du mot dans cette langue (celui de la carte, ou la traduction que tu proposes), avec UN de ces codes : " +
      "nm (nom masculin), nf (nom féminin), nmf (nom masculin et féminin), nmpl (nom masculin pluriel), nfpl (nom féminin pluriel), n (nom, langue sans genre), " +
      "v (verbe), vpr (verbe pronominal), adj, adv, prep, conj, pron, interj, expr (expression).",
    prefix + "Langues avec genre (" + g.join(", ") + ") : un nom a TOUJOURS son genre (nm, nf, nmf, nmpl ou nfpl), jamais n. Langues sans genre (" + ng.join(", ") + ") : n pour un nom."
  ];
}
function uiLangNameFr() { return langName(state.settings.uiLang, "fr").toLowerCase(); }
// « fr = français, ko = coréen, en = anglais » (consignes envoyées à Claude)
function langLegend() { return LANG_CODES.map(c => c + " = " + LANGUAGES[c].names.fr.toLowerCase()).join(", "); }

function strHash(s) {
  let h = 2166136261;
  s = String(s || "");
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
// Empreinte : langue apprise, langues d'appui (dans l'ordre), exemple. Pour une liste fr ← ko, en : identique à la version 1.
function cardSig(c) { const lg = cardLangs(c); return strHash([lg.target].concat(lg.support).map(x => term(c, x)).concat([c.example]).join("\u0001")); }
function rejectKey(cardId, field, value) { return cardId + "|" + field + "|" + strHash(normText(value)); }
function missingFields(c) { return fillFields(c).filter(f => !fieldVal(c, f).trim()); }
// Nom sans genre dans une langue à genre (« n », ou « nom » importé tel quel) : à corriger (proposition de type Correction).
function posNeedsGender(c, code) {
  if (!LANGUAGES[code] || !LANGUAGES[code].gender) return false;
  const v = String((c.pos || {})[code] || "").trim();
  return !!v && !POS_GENDERED.includes(v) && (v === "n" || parsePos(v, LANG_CODES.find(x => !LANGUAGES[x].gender) || "") === "n");
}
function genderFields(c, lg) { lg = lg || cardLangs(c); return posFields(lg).filter(f => posNeedsGender(c, f.slice(4))); }
// Type de proposition pour un champ demandé à Claude : complétion (vide), correction (genre manquant), sinon rien.
function fillType(c, f) {
  if (!fieldVal(c, f).trim()) return "completion";
  if (isPosField(f) && posNeedsGender(c, f.slice(4))) return "correction";
  return null;
}
function cardsWithGaps(cards) { return cards.filter(c => missingFields(c).length); }
function chunks(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }

// Ajoute une proposition si elle est utile : jamais sur un champ rempli à la main (complétion),
// jamais une valeur déjà refusée, une seule proposition en attente par carte et par champ.
function addProposal(p) {
  const c = state.cards.find(x => x.id === p.cardId);
  if (!c) return false;
  let nv = String(p.newValue || "").replace(/\s+/g, " ").trim();
  if (isPosField(p.field)) nv = parsePos(nv, p.field.slice(4)); // code valide pour la langue, sinon refusé
  if (p.field !== "dup") {
    if (!nv || !checkFields(c).includes(p.field)) return false;
    const cur = fieldVal(c, p.field).trim();
    if (p.type === "completion" && (cur || p.field === cardLangs(c).target)) return false;
    if (p.type === "correction" && (!cur || cur === nv)) return false;
  }
  if (state.rejected.includes(rejectKey(c.id, p.field, nv))) return false;
  if (state.proposals.some(x => x.cardId === c.id && x.field === p.field)) return false;
  state.proposals.push({
    id: uid(), cardId: c.id, field: p.field, type: p.type,
    oldValue: p.field === "dup" ? "" : fieldVal(c, p.field), newValue: nv,
    reason: String(p.reason || "").slice(0, 300), createdAt: Date.now()
  });
  return true;
}

// Doublons dans une même liste (même règle que l'import texte) : on garde la carte la plus travaillée.
// cards : périmètre (par défaut toutes les cartes).
function dupGroups(cards) {
  const groups = new Map();
  (cards || state.cards).filter(isVocab).forEach(c => {          // vocabulaire seulement
    const k = c.listId + "#" + dupKey(c.terms, cardLangs(c));
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  return groups;
}
function addDuplicateProposals(cards) {
  const groups = dupGroups(cards);
  let n = 0;
  groups.forEach(g => {
    if (g.length < 2) return;
    const keep = g.slice().sort((a, b) => b.stats.seen - a.stats.seen)[0];
    g.forEach(c => {
      if (c !== keep && addProposal({ cardId: c.id, field: "dup", type: "correction", newValue: "", reason: t("pv.dupReason") })) n++;
    });
  });
  return n;
}

// Enregistre sans tout réafficher (une session de révision peut être en cours).
function commitQuiet() {
  state.updatedAt = Date.now();
  Storage.save(state);
  renderPendingBadge();
  if (currentScreen === "pending" || currentScreen === "settings") renderScreen();
}

// --- Consignes envoyées à Claude (identifiants courts k0, k1… pour limiter la taille) ---
// target = code de la langue apprise de la carte ; puis une entrée par langue remplie (apprise + appui).
function aiItems(batch, withMissing, want) {
  return batch.map((c, i) => {
    const lg = cardLangs(c);
    const o = { id: "k" + i, target: lg.target };
    [lg.target].concat(lg.support).forEach(code => { const v = term(c, code); if (v) o[code] = v; });
    if (c.example) o.example = c.example;
    if (withMissing) o.missing = (want || missingFields)(c);
    return o;
  });
}
// want(carte) → champs demandés (par défaut : tous les champs vides). Un champ « pos: » déjà rempli = genre à préciser.
function completionPrompt(batch, want) {
  return [
    "Tu aides des apprenants en langues. Voici des cartes de vocabulaire. Codes de langue : " + langLegend() + ".",
    "Pour chaque carte, \"target\" est la langue apprise ; le champ de cette langue est la référence : ne le change pas.",
    "Complète UNIQUEMENT les champs listés dans \"missing\" (un champ pos: listé alors que le nom n'a pas de genre : donne le code avec le genre) :",
    "- un code de langue : traduction courte et naturelle du mot de la langue apprise dans cette langue ;",
    "- example : une phrase d'exemple courte et simple DANS LA LANGUE APPRISE (niveau débutant) qui utilise le mot.",
  ].concat(posPromptLines("- "), [
    "Si le mot de la langue apprise contient plusieurs sens séparés par \"/\", tu peux donner plusieurs traductions séparées par \" / \".",
    "Réponds uniquement avec un tableau JSON, un objet par carte, avec l'id et seulement les champs demandés.",
    "Exemple : [{\"id\":\"k0\",\"en\":\"shelf\",\"example\":\"Le livre est sur l'étagère.\",\"pos:fr\":\"nf\",\"pos:en\":\"n\"}]",
    "",
    "Cartes :",
    JSON.stringify(aiItems(batch, true, want))
  ]).join("\n");
}
function verifyPrompt(batch) {
  return [
    "Tu vérifies des cartes de vocabulaire d'apprenants en langues. Codes de langue : " + langLegend() + ".",
    "Pour chaque carte, \"target\" est la langue apprise. Champs : un code de langue par mot (celui de la langue apprise est la réponse attendue ; plusieurs réponses séparées par \"/\"), example (phrase d'exemple dans la langue apprise).",
    "Signale seulement les vraies erreurs : fautes d'orthographe, accents manquants ou faux, traductions fausses ou douteuses, exemple incorrect. Pas de remarques de style. Rien pour un champ absent.",
    "Pour chaque erreur : field = le code de langue ou example, la valeur corrigée COMPLÈTE du champ, et une raison très courte en " + uiLangNameFr() + ".",
    "Réponds uniquement avec un tableau JSON, vide [] si tout est correct.",
    "Exemple : [{\"id\":\"k0\",\"field\":\"fr\",\"value\":\"l'école\",\"reason\":\"accent manquant\"}]",
    "",
    "Cartes :",
    JSON.stringify(aiItems(batch, false))
  ].join("\n");
}
// Applique la réponse d'un lot. Renvoie le nombre de propositions ajoutées.
function applyAiResult(kind, batch, res, want) {
  if (!Array.isArray(res)) return 0;
  let n = 0;
  res.forEach(item => {
    if (!item || typeof item !== "object") return;
    const m = /^k(\d+)$/.exec(String(item.id || ""));
    const c = m && batch[+m[1]];
    if (!c) return;
    if (kind === "complete") {
      (want || fillFields)(c).forEach(f => {
        let v = item[f];
        if (v == null && isPosField(f) && item.pos && typeof item.pos === "object") v = item.pos[f.slice(4)]; // forme { pos: { fr: "nf" } } acceptée aussi
        const type = fillType(c, f);
        if (typeof v === "string" && type && addProposal({ cardId: c.id, field: f, type, newValue: v, reason: type === "correction" ? t("upd.genderReason") : "" })) n++;
      });
    } else if (checkFields(c).includes(item.field) && typeof item.value === "string") {
      if (addProposal({ cardId: c.id, field: item.field, type: "correction", newValue: item.value, reason: typeof item.reason === "string" ? item.reason : "" })) n++;
    }
  });
  return n;
}
function aiErrorText(e) {
  const code = e && e.code;
  if (code === "rate_limited") return t("ai.err.rate");
  if (AI.isOffCode(code)) return t("ai.err.off");
  return t("ai.err.other");
}

// Traitement par lots de CONFIG.AI_BATCH cartes, un lot après l'autre (jamais en parallèle ni en boucle de réessai).
// opts : { silent (vérification automatique), extra (propositions déjà ajoutées, ex. doublons),
//          want (champs demandés par carte, complétion), noEndModal (pas de fenêtre de fin : l'appelant l'affiche) }
// Renvoie { added, error, stopped } (null si rien n'a été lancé ou si le compte a changé).
async function runAiJob(kind, cards, opts) {
  opts = opts || {};
  if (aiJob) { if (!opts.silent) toast(t("ai.busy")); return null; }
  const st = state, who = Storage.getUser();
  const batches = chunks(cards, CONFIG.AI_BATCH);
  const ctl = new AbortController();
  aiJob = { ctl };
  const isComplete = kind === "complete";
  let added = opts.extra || 0, error = null, stopped = false, prog = null, next = 0;
  // Complétion : enregistre les cartes restantes (reprise plus tard depuis Réglages), ou rien si tout est fait.
  const saveResume = () => {
    if (!isComplete) return;
    const live = new Set(state.cards.map(c => c.id));
    const ids = [];
    for (let j = next; j < batches.length; j++) batches[j].forEach(c => { if (live.has(c.id)) ids.push(c.id); });
    state.aiResume = ids.length ? { kind: "complete", ids } : null;
  };
  if (!opts.silent) {
    prog = openProgress(t("ai.progressTitle." + kind), t("ai.progress", { i: 1, n: batches.length }),
      [{ label: t(isComplete ? "ai.pause" : "ai.stop"), onClick: () => { ctl.abort(); } }]);
  }
  try {
    for (let i = 0; i < batches.length; i++) {
      next = i;
      if (ctl.signal.aborted) { stopped = true; break; }
      if (prog) prog.set(i / batches.length, t("ai.progress", { i: i + 1, n: batches.length }));
      const batch = batches[i];
      let res;
      try { res = await AI.ask(isComplete ? completionPrompt(batch, opts.want) : verifyPrompt(batch), ctl.signal); }
      catch (e) { if (e && e.code === "cancelled") stopped = true; else error = e; break; }
      if (state !== st || Storage.getUser() !== who) return null; // compte changé ou données importées entre-temps
      added += applyAiResult(kind, batch, res, opts.want);
      if (kind === "verify") batch.forEach(c => { if (state.cards.includes(c)) state.checkedSig[c.id] = cardSig(c); });
      next = i + 1;
      saveResume();
      commitQuiet();
    }
    if (isComplete && (stopped || error) && state === st && Storage.getUser() === who) { saveResume(); commitQuiet(); }
  } finally {
    aiJob = null;
    if (prog) prog.close();
  }
  if (state !== st || Storage.getUser() !== who) return null;
  const result = { added, error, stopped };
  if (opts.silent) { if (added) toast(t("ai.autoDone", { n: added })); return result; }
  if (opts.noEndModal) return result;
  let msg = error ? aiErrorText(error) : stopped ? t(isComplete ? "ai.paused" : "ai.stopped", { n: added }) : added ? t("ai.done", { n: added }) : t("ai.doneNone");
  if (error && added) msg += " " + t("ai.done", { n: added });
  if (error && isComplete && state.aiResume) msg += " " + t("ai.resumeLater");
  const actions = [{ label: t("close") }];
  if (added) actions.push({ label: t("ai.see"), kind: "primary", onClick: () => { goPending(); } });
  openModal(t("ai.doneTitle"), el("p", null, msg), actions);
  return result;
}

function goPending() {
  try { history.replaceState(null, "", "#" + HASH_OF.pending); } catch (e) {}
  showScreen("pending");
}

// Après l'ajout de cartes (manuel ou import) : proposer de compléter les trous.
function offerCompletion(cardIds) {
  const ids = new Set(cardIds || []);
  const cards = state.cards.filter(c => ids.has(c.id) && missingFields(c).length);
  if (!cards.length) return;
  openModal(t("ai.offerTitle"), el("p", null, t("ai.offer", { n: cards.length })), [
    { label: t("ai.offerNo") },
    { label: t("ai.offerYes"), kind: "primary", onClick: () => { startCompletion(cards.map(c => c.id)); } }
  ]);
}
// ids : cartes ciblées (null = toutes). want : champs demandés par carte (null = tous les champs vides).
// fromResume : reprise depuis les Réglages ; si la complétion en pause venait de « Mettre à jour », mêmes catégories.
async function startCompletion(ids, want, fromResume) {
  await AI.ready();
  const cats = fromResume ? updResumeCats() : null;
  if (cats) want = updWant(cats);
  const set = ids ? new Set(ids) : null;
  const cards = state.cards.filter(c => (!set || set.has(c.id)) && (want ? want(c) : missingFields(c)).length);
  if (!cards.length) { toast(t("ai.nothingToComplete")); return; }
  if (AI.isOn()) { await runAiJob("complete", cards, { want }); updResumeSync(cats); }
  else openPrepare("complete", cards);
}
// Bouton « Vérifier mes listes » : toutes les cartes.
async function startVerify() {
  if (aiJob) { toast(t("ai.busy")); return; }
  await AI.ready();
  if (!state.cards.length) { toast(t("ai.noCards")); return; }
  const nd = addDuplicateProposals();
  if (nd) commitQuiet();
  const cards = state.cards.filter(isVocab); // complétion et vérification : vocabulaire seulement
  if (!cards.length) { toast(t("ai.noCards")); return; }
  if (!AI.isOn()) { if (nd) toast(t("ai.autoDone", { n: nd })); openPrepare("verify", cards); return; }
  const b = Math.ceil(cards.length / CONFIG.AI_BATCH);
  if (b <= 3) { runAiJob("verify", cards, { extra: nd }); return; }
  openModal(t("ai.verify"), el("p", null, t("ai.verifyConfirm", { n: cards.length, b })), [
    { label: t("cancel") },
    { label: t("confirm"), kind: "primary", onClick: () => { runAiJob("verify", cards, { extra: nd }); } }
  ]);
}

// Au lancement : au plus une fois par semaine, et seulement les cartes nouvelles ou modifiées depuis leur dernière vérification.
// Premier lancement d'un compte : on démarre le compteur sans rien envoyer.
async function autoWeeklyCheck(id) {
  try {
    if (Storage.getUser() !== id) return;
    if (!state.lastCheckAt) { state.lastCheckAt = Date.now(); commitQuiet(); return; }
    if (Date.now() - state.lastCheckAt < CONFIG.AUTO_CHECK_DAYS * 864e5 || !state.cards.length) return;
    const st = state;
    await AI.ready();
    if (Storage.getUser() !== id || state !== st) return;
    state.lastCheckAt = Date.now();
    const nd = addDuplicateProposals();
    commitQuiet();
    const todo = AI.isOn() ? state.cards.filter(c => isVocab(c) && state.checkedSig[c.id] !== cardSig(c)) : [];
    if (!todo.length) { if (nd) toast(t("ai.autoDone", { n: nd })); return; }
    toast(t("ai.autoStart"));
    await runAiJob("verify", todo, { silent: true, extra: nd });
  } catch (e) { /* jamais bloquant */ }
}

// Carte « Complétion et vérification » des Réglages.
function renderAiCard() {
  const box = $("#aiCard");
  if (!box) return;
  box.textContent = "";
  box.appendChild(el("h2", null, t("ai.title")));
  const st = AI.status();
  const p = el("p", "muted", t(st === "pending" ? "ai.checking" : st === "on" ? "ai.on" : "ai.off"));
  p.style.marginTop = "0";
  box.appendChild(p);
  const btns = el("div", "btns");
  const b1 = el("button", "btn", t("ai.complete", { n: cardsWithGaps(state.cards).length }));
  const b2 = el("button", "btn", t("ai.verify"));
  b1.disabled = b2.disabled = st === "pending";
  b1.addEventListener("click", () => startCompletion(null));
  b2.addEventListener("click", () => startVerify());
  btns.append(b1, b2);
  if (state.aiResume && st === "on") {
    const br = el("button", "btn primary", t("ai.resume", { n: state.aiResume.ids.length }));
    br.addEventListener("click", () => startCompletion(state.aiResume.ids.slice(), null, true));
    btns.appendChild(br);
  }
  if (st === "off") {
    const b3 = el("button", "btn", t("ai.importReply"));
    b3.addEventListener("click", openReplyImport);
    btns.appendChild(b3);
  }
  box.appendChild(btns);
  let last = t("ai.never");
  try { if (state.lastCheckAt) last = t("ai.lastCheck", { d: new Date(state.lastCheckAt).toLocaleDateString(state.settings.uiLang) }); } catch (e) {}
  box.appendChild(el("div", "ai-last", last));
}

// === PRÉPARER POUR CLAUDE (REPLI) ===
// Sans accès direct à Claude : texte (consignes + lignes) à copier dans une conversation, puis réimport de la réponse.
// Lignes envoyées : en-tête « liste;<codes de langue>;example » puis une ligne par carte (toutes les langues de LANGUAGES).
// Complétion : en plus, une colonne « pos:<code> » par langue (nature grammaticale).
// Complétion  — reçues : mêmes lignes complétées, avec l'en-tête.
// Vérification — reçues : liste;mot;champ;valeur corrigée;raison (mot = mot de la langue apprise, champ = code de langue ou example).
// Correspondance au réimport : nom de la liste + mot de la langue apprise de cette liste (sans casse ni accents).
const PREP_LIST_WORDS = ["liste", "list", "목록"];

// Code de langue ou "example" pour un nom de champ (code, nom de langue, exemple…), sinon null.
function fieldAlias(s) {
  const m = /^(?:pos|nature)\s*[:_\-\s]\s*([a-z]{2,3})$/i.exec(String(s || "").trim()); // pos:fr, nature fr…
  if (m && isLang(m[1].toLowerCase())) return posField(m[1].toLowerCase());
  const k = headerKind(s); return isLang(k) || k === "example" ? k : null;
}
function prepCell(s) { return String(s || "").replace(/[;\r\n]+/g, " ").trim(); }
function prepListName(id) { const l = getList(id); return prepCell(l ? l.name : ""); }
function prepText(kind, cards) {
  const posCols = kind === "complete" ? LANG_CODES.map(posField) : [];
  const cols = ["liste"].concat(LANG_CODES, ["example"], posCols);
  // Langue apprise et langues d'appui de chaque liste présente
  const seen = new Set(), perList = [];
  cards.forEach(c => {
    if (seen.has(c.listId)) return;
    seen.add(c.listId);
    const lg = listLangs(c.listId);
    perList.push("- " + prepListName(c.listId) + " : langue apprise " + lg.target + ", langues d'appui " + lg.support.join(", "));
  });
  const head = kind === "complete" ? [

    "- Seule exception : une nature « n » (nom sans genre) dans une langue avec genre : remplace-la par le code avec le genre.",

  ], posPromptLines("- "), [

  ]) : [

  ].concat(perList, [

    "- mot = le mot de la langue apprise de la liste, tel qu'il est écrit ci-dessous, même s'il contient l'erreur.",

    "- raison = très courte, en " + uiLangNameFr() + ".",

  ]);
  const lines = cards.map(c => [prepListName(c.listId)].concat(LANG_CODES.map(code => term(c, code)), [c.example], posCols.map(f => fieldVal(c, f))).map(prepCell).join(";"));
  return head.concat([""], [cols.join(";")], lines).join("\n");
}

function findCardsFor(listName, word) {
  const ln = normText(prepCell(listName)), w = normText(word);
  if (!w) return [];
  const lists = state.lists.filter(l => normText(prepCell(l.name)) === ln);
  const ids = new Map(lists.map(l => [l.id, listLangs(l).target]));
  return state.cards.filter(c => ids.has(c.listId) && normText(term(c, ids.get(c.listId))) === w);
}
// Analyse la réponse collée. Renvoie { added, unknown }.
function importReply(text) {
  let added = 0, unknown = 0;
  let cols = LANG_CODES.concat(["example"]); // colonnes après « liste » (remplacées par la ligne d'en-tête si présente)
  let sawHeader = false;                       // en-tête vu = réponse de complétion
  String(text || "").split(/\r?\n/).forEach(raw => {
    const line = raw.trim().replace(/^[-*•]\s+/, "");
    if (!line || line.startsWith("```") || /^ras\.?$/i.test(line) || !line.includes(";")) return;
    const parts = line.split(";").map(s => s.trim());
    if (PREP_LIST_WORDS.includes(normText(parts[0]))) { // ligne d'en-tête
      cols = parts.slice(1).map(x => fieldAlias(x) || "ignore");
      sawHeader = true;
      return;
    }
    if (parts.length < 3) { unknown++; return; }
    const field = !sawHeader && parts.length >= 4 ? fieldAlias(parts[2]) : null;
    if (field && parts.length <= 6) {                // vérification : liste;mot;champ;valeur;raison
      const cands = findCardsFor(parts[0], parts[1]);
      if (cands.length) {
        const reason = parts.slice(4).join("; ");
        for (const c of cands) if (addProposal({ cardId: c.id, field, type: "correction", newValue: parts[3], reason })) { added++; break; }
        return;
      }
    }
    // complétion : liste;<colonnes>
    const vals = {};
    cols.forEach((k, i) => { if (k !== "ignore") vals[k] = parts[i + 1] || ""; });
    if (cols[cols.length - 1] === "example" && parts.length > cols.length + 1) vals.example = parts.slice(cols.length).join("; ");
    const lists = state.lists.filter(l => normText(prepCell(l.name)) === normText(prepCell(parts[0])));
    let cands = [];
    for (const l of lists) { const tg = listLangs(l).target; if (vals[tg]) cands = cands.concat(findCardsFor(parts[0], vals[tg]).filter(c => c.listId === l.id)); }
    if (!cands.length) { unknown++; return; }
    const same = (a, b) => !String(a || "").trim() || !b || normText(a) === normText(b);
    const fit = cands.filter(x => cardLangs(x).support.every(code => same(term(x, code), vals[code])));
    const c = fit.find(x => missingFields(x).length) || fit[0] || cands.find(x => missingFields(x).length) || cands[0];
    (prepWantFor(c) || fillFields(c)).forEach(f => {
      const type = fillType(c, f);
      if (vals[f] && type && addProposal({ cardId: c.id, field: f, type, newValue: vals[f], reason: type === "correction" ? t("upd.genderReason") : "" })) added++;
    });
  });
  return { added, unknown };
}
function openReplyImport() {
  const wrap = el("div");

// === GÉNÉRER DES CARTES ===
// Écran (fenêtre) « Générer des cartes » : liste de destination, type de carte, paramètres
// (conjugaison : verbes, temps, personnes ; autres types : sujet + nombre), puis :
//   - « Générer avec Claude » si la capacité sample de l'artifact est disponible (pas d'API payante),
//   - « Préparer pour Claude » sinon (ou en plus) : consignes à copier dans une conversation, réponse à recoller.
// Claude répond dans le format de l'import en masse (une ligne par carte, ";") : un seul analyseur (parseTypedLine).
//   vocab;<langue apprise>;<langues d'appui…>;exemple;nature
//   conjtab;verbe;temps;forme1|forme2|…;traduction;note   ou   conj;verbe;temps;personne;forme;traduction;note
//   trou;phrase avec ___;réponse;indice;explication;traduction;titre de la règle
//   erreur;phrase fautive;phrase corrigée;explication;titre de la règle
//   regle;titre;texte;exemple1|exemple2|…;traduction
// Rien n'est écrit dans les listes : chaque carte (ou tableau de conjugaison) devient une proposition
// « Nouvelle carte » dans « À valider » : { id, cardId: "", listId, field: "new", type: "newcard", cards: [{ type, fields, ruleRef }], key, reason, createdAt }.
const GEN_TYPES = ["vocab", "conj", "cloze", "fix", "rule"];
const GEN_MAX = 30;          // cartes max par demande (sujet libre)
const GEN_VERBS_PER_CALL = 5; // conjugaison : verbes par appel à Claude
let gv = null;               // réglages de la fenêtre, gardés tant que l'appli est ouverte

function genDefaults(listId) {
  const l = listId ? getList(listId) : null;
  return { listId: l ? l.id : (state.lists[0] ? orderedLists()[0].id : "__new__"), newName: "", folder: l ? (l.folderId || "") : "",
    newTarget: accountLangs().target, type: "conj", verbs: "", tenses: [], persons: [], topic: "", count: 10, withRule: false };
}
// Langues de la destination (liste existante, ou nouvelle liste : langue choisie + langues d'appui par défaut).
function genLangs(o) {
  if (o.listId !== "__new__" && getList(o.listId)) return listLangs(o.listId);
  const fl = folderLangs(getFolder(o.folder));
  return fl.target === o.newTarget ? fl : { target: o.newTarget, support: defaultSupportFor(o.newTarget) };
}
function genVerbs(o) { return [...new Set(String(o.verbs || "").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean))]; }
// Temps choisis (ids) encore valables pour la langue ; par défaut le 1er temps.
function genTenses(o, lng) {
  const ids = tensesOf(lng).map(x => x.id);
  const sel = o.tenses.filter(id => ids.includes(id));
  return sel.length ? sel : ids.slice(0, 1);
}
// Personnes demandées pour un temps : filtre seulement sur les personnes habituelles de la langue.
function genPersons(o, lng, tenseId) {
  const ps = personsOf(lng, tenseId);
  if (ps !== arr(grammarOf(lng).persons) || !o.persons.length) return ps;
  const sel = ps.filter(p => o.persons.includes(p.id));
  return sel.length ? sel : ps;
}

      tw.appendChild(b);

  }
  wrap.appendChild(el("p", "hint", t("gen.help")));

  const check = () => {

    const req = genRequest(o);
    if (req.type === "conj" && !req.verbs.length) { toast(t("gen.needVerbs")); return null; }

  };
  const acts = [];
  if (AI.isOn()) acts.push({ label: t("gen.run"), kind: "primary", onClick: () => { const r = check(); if (!r) return false; runGenerate(r); } });
  acts.push({ label: t("gen.prepare"), kind: AI.isOn() ? "" : "primary", onClick: () => { const r = check(); if (!r) return false; openGenPrepare(r); } });
  acts.push({ label: t("cancel") });
  close = openModal(t("gen.title"), wrap, acts);
}
// Exemple de verbes pour le champ (depuis la démo de la langue).
function genVerbExample(lng) {
  const D = (LANGUAGES[lng] && LANGUAGES[lng].demo) || {};
  const v = arr(D.cards).filter(x => x.type === "conjtab").map(x => x.verb);
  return (v.length ? v : arr(D.words).filter(w => w.pos === "v").map(w => w.term)).slice(0, 3).join(", ") || "…";
}
// Demande figée au moment du clic (la fenêtre peut changer ensuite).
function genRequest(o) {
  const lg = genLangs(o);
  const req = { listId: o.listId, newName: o.newName.trim(), folder: getFolder(o.folder) ? o.folder : null, lg, lang: lg.target, type: o.type,
    verbs: genVerbs(o), topic: String(o.topic || "").trim(), count: clampInt(o.count, 1, GEN_MAX, 10), withRule: !!o.withRule };
  req.tenses = req.type === "conj" ? genTenses(o, req.lang) : [];

}
// Liste de destination (créée au premier ajout si c'est une nouvelle liste ; même liste pour les morceaux suivants).
function genListId(req) {
  if (req.listId !== "__new__" && getList(req.listId)) return req.listId;
  if (req.createdId && getList(req.createdId)) return req.createdId;
  const folderId = req.folder && getFolder(req.folder) ? req.folder : null;
  const nl = { id: uid(), name: req.newName || t("gen.title"), folderId, order: nextOrder(listsIn(folderId)), createdAt: Date.now() };
  if (!sameLangs(req.lg, folderLangs(getFolder(folderId)))) { nl.target = req.lg.target; nl.support = req.lg.support.slice(); }
  state.lists.push(nl);
  req.createdId = nl.id;
  return nl.id;
}

function genConjExample(lng, tenseId) {

// --- Lecture de la réponse ---
// → { drafts: [{ type, fields, ruleRef }], errors: [texte], lines }
function parseGenReply(text, req) {
  const out = { drafts: [], errors: [], lines: 0 };
  const L = req.lang, sup = req.lg.support;
  bulkLines(text).forEach(raw => {
    const line = raw.trim().replace(/^[-*•]\s+/, "").replace(/^\d+[.)]\s+/, "");
    if (!line || line.startsWith("```") || !line.includes(";")) return;
    const cols = line.split(";").map(x => x.trim());
    const kind = linePrefix(cols);
    if (!kind) return;                                   // texte d'accompagnement ignoré
    out.lines++;
    if (kind === "vocab") {
      const terms = {}; terms[L] = cols[1] || "";
      sup.forEach((c, i) => { if (cols[2 + i]) terms[c] = cols[2 + i]; });
      const example = cols[2 + sup.length] || "";
      const pv = parsePos(cols[3 + sup.length] || "", L);
      if (!terms[L] || !sup.some(c => terms[c])) { out.errors.push(line); return; }
      out.drafts.push({ type: "vocab", fields: { terms, example, pos: pv ? { [L]: pv } : {} } });
      return;
    }
    const r = parseTypedLine(kind, cols, L);
    if (r.err) { out.errors.push(line + " — " + r.err); return; }
    const ruleRef = kind === "cloze" ? cols[6] : kind === "fix" ? cols[4] : "";
    r.rows.forEach(row => out.drafts.push({ type: row.type, fields: row.fields, ruleRef: ruleRef || "" }));
  });
  return out;
}
// Clé de doublon d'un brouillon (même règle que l'import).
function draftKey(d, lg) { return d.type === "vocab" ? "vocab|" + dupKey(d.fields.terms, lg) : typedKey(d.type, d.fields); }
// Regroupe les formes d'un même verbe + temps (un tableau = une proposition), le reste une carte par proposition.
function draftGroups(drafts) {
  const out = [], tabs = new Map();
  drafts.forEach(d => {
    if (d.type !== "conj") { out.push([d]); return; }
    const k = normText(d.fields.verb) + "|" + d.fields.tense;
    if (!tabs.has(k)) { const g = []; tabs.set(k, g); out.push(g); }
    tabs.get(k).push(d);
  });
  return out;
}
// Ajoute les propositions « Nouvelle carte ». Cartes déjà dans la liste, déjà proposées ou refusées : ignorées.
// Renvoie { added (propositions), cards (cartes), skipped }.
function addGenProposals(drafts, req) {
  const res = { added: 0, cards: 0, skipped: 0 };
  if (!drafts.length) return res;
  const listId = genListId(req);
  const lg = listLangs(listId);
  const have = new Set(cardsOf(listId).map(c => isVocab(c) ? "vocab|" + dupKey(c.terms, lg) : typedKey(c.type, c)));
  state.proposals.filter(p => p.field === "new" && p.listId === listId).forEach(p => p.cards.forEach(d => have.add(draftKey(d, lg))));
  draftGroups(drafts).forEach(g => {
    const fresh = g.filter(d => {
      const k = draftKey(d, lg);
      if (have.has(k) || state.rejected.includes(rejectKey(listId, "new", k))) { res.skipped++; return false; }
      have.add(k);
      return true;
    });
    if (!fresh.length) return;
    state.proposals.push({ id: uid(), cardId: "", listId, field: "new", type: "newcard", cards: fresh,
      oldValue: "", newValue: "", reason: genLabel(req), createdAt: Date.now() });
    res.added++; res.cards += fresh.length;
  });
  return res;
}

// --- Accès direct (capacité sample) ---
async function runGenerate(req) {
  if (aiJob) { toast(t("ai.busy")); return; }
  const parts = req.type === "conj" ? chunks(req.verbs, GEN_VERBS_PER_CALL) : [null];
  const ctrl = new AbortController();
  aiJob = { kind: "generate", ctrl };
  let stopped = false;
  const pg = openProgress(t("gen.title"), t("gen.working", { i: 1, n: parts.length }), [
    { label: t("ai.stop"), onClick: () => { stopped = true; try { ctrl.abort(); } catch (e) {} return false; } }
  ]);
  const tot = { added: 0, cards: 0, skipped: 0, errors: [] };
  let error = null;
  try {
    for (let i = 0; i < parts.length && !stopped; i++) {
      pg.set(i / parts.length, t("gen.working", { i: i + 1, n: parts.length }));
      let res;
      try { res = await AI.ask(genPromptJson(req, parts[i]), ctrl.signal); }
      catch (e) { if (!stopped) error = e; break; }
      const lines = Array.isArray(res) ? res : res && Array.isArray(res.lines) ? res.lines : [];
      const r = parseGenReply(lines.map(String).join("\n"), req);
      const a = addGenProposals(r.drafts, req);
      tot.added += a.added; tot.cards += a.cards; tot.skipped += a.skipped; tot.errors.push(...r.errors);
      if (a.added) commitQuiet();
    }
  } finally { aiJob = null; pg.close(); }
  if (tot.added) commit();
  genDone(tot, req, error);
}
function genDone(tot, req, error) {
  const wrap = el("div");

  if (tot.skipped) wrap.appendChild(el("p", "muted", t("gen.skipped", { n: tot.skipped })));
  if (tot.errors.length) {

    const ul = el("ul", "hint");

  }
  const acts = [{ label: t("close") }];
  if (error) acts.unshift({ label: t("gen.prepare"), onClick: () => { openGenPrepare(req); } });
  if (tot.added) acts.push({ label: t("ai.see"), kind: "primary", onClick: () => { goPendingFor({ kind: "list", id: genListId(req) }); } });
  openModal(t("gen.title"), wrap, acts);
}

// === MISE À JOUR DES LISTES ===
// « Mettre à jour » une liste, un dossier ou tout (scope = { kind: "list"|"folder"|"all", id }).
// 1. Analyse : rien n'est modifié, bilan par catégorie avec le nombre de cartes concernées.
// 2. Cases à cocher, puis « Lancer » : complétion / vérification existantes (lots de 20, Pause, reprise depuis
//    les Réglages), toutes les propositions vont dans « À valider », ouvert filtré sur la liste ou le dossier.
// Catégories : "tr:<code>" (traduction manquante), "pos" (nature manquante + noms sans genre), "example",
//   "pending" (propositions en attente ou champs « auto »), "verify" (cartes jamais vérifiées ou modifiées depuis),
//   "dup" (doublons), "legacy" (cartes à l'ancien format, normalement aucune : migration au lancement).
// Badge « N à compléter » (listes et dossiers) = cartes avec un champ vide ou un nom sans genre, recalculé à chaque affichage.

// Trous d'une carte : champs vides (langues d'appui, exemple, natures) + noms sans genre.
function gapFields(c, lg) {
  lg = lg || cardLangs(c);
  return fillFields(c, lg).filter(f => !fieldVal(c, f).trim()).concat(genderFields(c, lg));
}
function listGapCount(l) { const lg = listLangs(l); return cardsOf(l.id).filter(c => gapFields(c, lg).length).length; }
function folderGapCount(f) { return listsIn(f.id).reduce((n, l) => n + listGapCount(l), 0); }
function updBadge(n) { return n ? el("span", "upd-badge", t("upd.badge", { n })) : null; }
function updDate(ts) {
  if (!ts) return t("upd.never");
  try { return t("upd.last", { d: new Date(ts).toLocaleDateString(state.settings.uiLang) }); } catch (e) { return t("upd.never"); }
}

// Mise à jour (traductions, nature, exemple, vérification, doublons) : cartes de vocabulaire seulement.
function updScopeCards(scope) {
  if (scope.kind === "list") return getList(scope.id) ? cardsOf(scope.id).filter(isVocab) : [];
  if (scope.kind === "folder") { const f = getFolder(scope.id); return f ? cardsUnder("folder", f).filter(isVocab) : []; }
  return state.cards.filter(isVocab);
}
function updScopeObj(scope) { return scope.kind === "list" ? getList(scope.id) : scope.kind === "folder" ? getFolder(scope.id) : null; }
// Ancien format (la migration v1 → v2 est faite au lancement : normalement aucune).
function isLegacyCard(c) { return !c.terms || typeof c.terms !== "object" || !c.pos || typeof c.pos !== "object" || !Array.isArray(c.auto); }

// Analyse sans rien modifier.
function analyzeUpdate(cards) {
  const lgs = new Map();
  const L = c => { let x = lgs.get(c.listId); if (!x) { x = cardLangs(c); lgs.set(c.listId, x); } return x; };
  const pend = new Set(state.proposals.map(p => p.cardId));
  const a = { total: cards.length, tr: {}, pos: 0, gender: 0, genderLangs: new Set(), example: 0, pending: 0, verify: 0, dup: 0, legacy: 0 };
  cards.forEach(c => {
    if (isLegacyCard(c)) { a.legacy++; return; }
    const lg = L(c);
    lg.support.forEach(code => { if (!(code in a.tr)) a.tr[code] = 0; if (!term(c, code).trim()) a.tr[code]++; });
    const g = genderFields(c, lg);
    g.forEach(f => a.genderLangs.add(f.slice(4)));
    if (g.length || posFields(lg).some(f => !fieldVal(c, f).trim())) a.pos++;
    if (g.length) a.gender++;
    if (!String(c.example || "").trim()) a.example++;
    if (pend.has(c.id) || c.auto.length) a.pending++;
    if (state.checkedSig[c.id] !== cardSig(c)) a.verify++;
  });
  dupGroups(cards).forEach(g => { if (g.length > 1) a.dup += g.length - 1; });
  return a;
}

// Champs demandés à Claude pour une carte, selon les catégories cochées.
function updWant(cats) {
  return c => {
    const lg = cardLangs(c), out = [];
    lg.support.forEach(code => { if (cats.includes("tr:" + code) && !term(c, code).trim()) out.push(code); });
    if (cats.includes("example") && !String(c.example || "").trim()) out.push("example");
    if (cats.includes("pos")) posFields(lg).forEach(f => { if (!fieldVal(c, f).trim() || posNeedsGender(c, f.slice(4))) out.push(f); });
    return out;
  };
}

// Reprise (Réglages) d'une complétion mise en pause pendant une mise à jour : mêmes catégories.
// Gardé sur cet appareil (localStorage), à côté de state.aiResume.
function updResumeKey() { return CONFIG.LS_USER_PREFIX + "updResume:" + (Storage.getUser() || ""); }
function updResumeCats() {
  try { const r = JSON.parse(localStorage.getItem(updResumeKey()) || "null"); return state.aiResume && r && Array.isArray(r.cats) ? r.cats : null; }
  catch (e) { return null; }
}
function updResumeSync(cats) {
  try {
    if (state.aiResume && cats) localStorage.setItem(updResumeKey(), JSON.stringify({ cats }));
    else localStorage.removeItem(updResumeKey());
  } catch (e) {}
}

// Repli « Préparer pour Claude » : à la réimportation, seuls les champs des catégories cochées sont proposés.
let prepScope = null; // { st, ids: Set, want }
function prepWantFor(c) { return prepScope && prepScope.st === state && prepScope.ids.has(c.id) ? prepScope.want(c) : null; }

// Ouvre « À valider » filtré sur la liste ou le dossier.
function goPendingFor(scope) {
  pvReset();
  if (scope.kind === "list" && getList(scope.id)) { pv.list = scope.id; pv.folder = pvFolderOf(scope.id); }
  else if (scope.kind === "folder" && getFolder(scope.id)) pv.folder = scope.id;
  goPending();

async function openUpdate(scope) {

  row("pos", t("upd.cat.pos"), a.pos, a.gender ? t("upd.cat.gender", { n: a.gender, langs: [...a.genderLangs].map(x => langName(x)).join(", ") }) : "", true);
  row("example", t("upd.cat.example"), a.example, "", true);

    { label: t("cancel") },

    } }

async function runUpdate(scope, cats) {
  if (aiJob) { toast(t("ai.busy")); return; }
  const st = state;
  const cards = updScopeCards(scope);
  const now = Date.now();
  const stamp = x => { if (x) x.lastUpdate = now; };
  if (scope.kind === "list") stamp(getList(scope.id));
  else if (scope.kind === "folder") { stamp(getFolder(scope.id)); listsIn(scope.id).forEach(stamp); }
  else { state.folders.forEach(stamp); state.lists.forEach(stamp); }
  let added = 0, legacy = 0;
  if (cats.includes("legacy")) cards.forEach(c => { if (isLegacyCard(c)) { Object.assign(c, normalizeCard(c)); legacy++; } });
  if (cats.includes("dup")) added += addDuplicateProposals(cards);
  commit();
  const want = updWant(cats);
  const fillCards = cards.filter(c => !isLegacyCard(c) && want(c).length);
  const verifyCards = cats.includes("verify") ? cards.filter(c => state.checkedSig[c.id] !== cardSig(c)) : [];
  const seePending = cats.includes("pending");
  await AI.ready();
  if (state !== st) return;

  // Sans accès direct à Claude : textes à copier (vérification dessous, complétion au-dessus).
  if (!AI.isOn() && (fillCards.length || verifyCards.length)) {
    if (added || legacy) toast(t("ai.autoDone", { n: added }));
    if (verifyCards.length) openPrepare("verify", verifyCards);
    if (fillCards.length) { prepScope = { st: state, ids: new Set(fillCards.map(c => c.id)), want }; openPrepare("complete", fillCards); }
    return;
  }

  let error = null, stopped = false;
  if (fillCards.length) {
    const r = await runAiJob("complete", fillCards, { want, noEndModal: true });
    if (!r || state !== st) return;
    added += r.added; error = r.error; stopped = r.stopped;
    updResumeSync(cats);
  }
  if (verifyCards.length && !error && !stopped) {
    const r = await runAiJob("verify", verifyCards, { noEndModal: true });
    if (!r || state !== st) return;
    added += r.added; error = r.error; stopped = r.stopped;
  }
  if (!fillCards.length && !verifyCards.length && !added && !legacy && seePending) { goPendingFor(scope); return; }

  let msg = error ? aiErrorText(error) : stopped ? t(fillCards.length ? "ai.paused" : "ai.stopped", { n: added }) : added ? t("ai.done", { n: added }) : t("ai.doneNone");
  if (error && added) msg += " " + t("ai.done", { n: added });
  if (error && state.aiResume && fillCards.length) msg += " " + t("ai.resumeLater");
  if (legacy) msg += " " + t("upd.legacyDone", { n: legacy });
  const actions = [{ label: t("close") }];
  if (added || seePending) actions.push({ label: t("ai.see"), kind: "primary", onClick: () => { goPendingFor(scope); } });
  openModal(t("ai.doneTitle"), el("p", null, msg), actions);
}

// === ÉCRAN : À VALIDER ===
// Une ligne par proposition : case à cocher, liste, mot de la langue apprise, champ, ancienne → nouvelle valeur (différences surlignées), type.
// Filtres (liste, type, champ) ; « Tout sélectionner » ne prend que les lignes filtrées ; la sélection est limitée aux lignes visibles.
// Accepter / Refuser / Modifier (édition dans la ligne, puis Accepter) ; « Annuler » quelques secondes après une action groupée.
const pv = { folder: "", list: "", type: "", field: "", sel: new Set(), editing: new Set(), edits: {} };
// Dossier : id, "__none__" (sans dossier) ou "" (tous).
function pvFolderOf(listId) { const l = getList(listId); return l && l.folderId ? l.folderId : "__none__"; }
// Filtre par champ : une traduction (code de langue), l'exemple, la nature (« pos » = toutes les langues) ou les doublons.
const PV_FIELDS = LANG_CODES.concat(["example", "pos", "dup"]);
function pvFieldMatch(p, f) { return f === "pos" ? isPosField(p.field) : p.field === f; }
// Nature affichée : « n.f. — nom féminin » (abréviation dans la langue du mot, nom dans la langue de l'interface).
function pvPosText(code, lng) { return code ? posLabel(code, lng) + (POS_CODES.includes(code) ? " — " + t("pos." + code) : "") : ""; }
let undoTimer = null;

function pvReset() { pv.folder = ""; pv.list = ""; pv.type = ""; pv.field = ""; pvClearSel(); }
function pvClearSel() { pv.sel.clear(); pv.editing.clear(); pv.edits = {}; }
function pvFieldLabel(f) {
  if (f === "dup") return t("pv.field.dup");
  if (f === "example") return t("card.example");
  if (f === "pos") return t("pv.field.posAll");
  if (isPosField(f)) return t("pv.field.pos", { lang: langName(f.slice(4)) });
  return langName(f);
}
function liveProposals() {
  const ids = new Set(state.cards.map(c => c.id));
  return state.proposals.filter(p => p.field === "new" ? !!getList(p.listId) : ids.has(p.cardId));
}
// Liste d'une proposition (« Nouvelle carte » : liste de destination).
function pvListOf(p, cards) { if (p.field === "new") return p.listId; const c = cards.get(p.cardId); return c ? c.listId : ""; }
function renderPendingBadge() {
  const b = $("#pendingBadge");
  if (!b) return;
  const n = Storage.getUser() ? liveProposals().length : 0;

function renderPending() {
  const root = $("#screen-pending");
  root.textContent = "";
  const all = liveProposals();
  if (!all.length) { pvClearSel(); root.appendChild(el("div", "empty", t("pv.empty"))); return; }
  const cards = new Map(state.cards.map(c => [c.id, c]));
  const listIds = new Set(all.map(p => pvListOf(p, cards)));
  if (pv.list && !listIds.has(pv.list)) pv.list = "";
  const folderIds = new Set([...listIds].map(pvFolderOf));
  if (pv.folder && !folderIds.has(pv.folder)) pv.folder = "";
  if (pv.list && pv.folder && pvFolderOf(pv.list) !== pv.folder) pv.list = "";
  if (pv.field && !all.some(p => pvFieldMatch(p, pv.field))) pv.field = "";
  if (pv.type && !all.some(p => p.type === pv.type)) pv.type = "";
  const vis = all.filter(p => (!pv.folder || pvFolderOf(pvListOf(p, cards)) === pv.folder) && (!pv.list || pvListOf(p, cards) === pv.list) && (!pv.type || p.type === pv.type) && (!pv.field || pvFieldMatch(p, pv.field)));
  const visIds = new Set(vis.map(p => p.id));
  [...pv.sel].forEach(id => { if (!visIds.has(id)) pv.sel.delete(id); });
  [...pv.editing].forEach(id => { if (!visIds.has(id)) pv.editing.delete(id); });

  // Filtres
  const f = el("div", "pv-filters");
  const mkSel = (value, opts, onCh) => {
    const s = el("select", "input");
    opts.forEach(([v, l]) => { const o = el("option", null, l); o.value = v; s.appendChild(o); });
    s.value = value;
    s.addEventListener("change", () => { onCh(s.value); renderPending(); });
    return s;
  };
  if (state.folders.length) {
    const fopts = sortedFolders().filter(x => folderIds.has(x.id)).map(x => [x.id, x.name]);
    if (folderIds.has("__none__")) fopts.push(["__none__", t("folders.none")]);
    f.classList.add("four");
    f.appendChild(mkSel(pv.folder, [["", t("pv.allFolders")]].concat(fopts), v => { pv.folder = v; pv.list = ""; }));
  }
  f.append(
    mkSel(pv.list, [["", t("pv.allLists")]].concat(orderedLists().filter(l => listIds.has(l.id) && (!pv.folder || pvFolderOf(l.id) === pv.folder)).map(l => [l.id, l.name])), v => { pv.list = v; }),
    mkSel(pv.type, [["", t("pv.allTypes")], ["completion", t("pv.type.completion")], ["correction", t("pv.type.correction")]]
      .concat(all.some(p => p.type === "newcard") ? [["newcard", t("pv.type.newcard")]] : []), v => { pv.type = v; }),
    mkSel(pv.field, [["", t("pv.allFields")]].concat(PV_FIELDS.filter(x => all.some(p => pvFieldMatch(p, x))).map(x => [x, pvFieldLabel(x)])), v => { pv.field = v; })
  );
  root.appendChild(f);

  // Sélection + actions (collées en haut pendant le défilement)
  const sticky = el("div", "pv-sticky");
  const bar = el("div", "pv-bar");
  const lab = el("label", "pv-all");
  const cb = el("input");
  cb.type = "checkbox";
  cb.checked = vis.length > 0 && vis.every(p => pv.sel.has(p.id));
  cb.indeterminate = !cb.checked && vis.some(p => pv.sel.has(p.id));
  cb.addEventListener("change", () => { vis.forEach(p => { if (cb.checked) pv.sel.add(p.id); else pv.sel.delete(p.id); }); renderPending(); });
  lab.append(cb, document.createTextNode(t("pv.selectAll")));
  bar.append(lab, el("span", "pv-count", t("pv.selected", { n: pv.sel.size })));
  sticky.appendChild(bar);
  const acts = el("div", "btns three");
  const bA = el("button", "btn primary", t("pv.accept"));
  const bR = el("button", "btn danger", t("pv.reject"));
  const bE = el("button", "btn", t("pv.edit"));
  bA.addEventListener("click", pvAccept);
  bR.addEventListener("click", pvReject);
  bE.addEventListener("click", pvEdit);
  acts.append(bA, bR, bE);
  sticky.appendChild(acts);
  if (pv.editing.size) sticky.appendChild(el("div", "pv-hint", t("pv.editHint")));
  root.appendChild(sticky);

  if (!vis.length) { root.appendChild(el("div", "empty", t("lists.noResults"))); return; }
  const items = el("div", "items");
  vis.forEach(p => items.appendChild(p.field === "new" ? pvNewRow(p) : pvRow(p, cards.get(p.cardId))));

function pvRow(p, c) {
  const row = el("label", "pv-row" + (pv.sel.has(p.id) ? " sel" : ""));
  const cb = el("input", "pv-cb");
  cb.type = "checkbox";
  cb.checked = pv.sel.has(p.id);
  cb.addEventListener("change", () => { if (cb.checked) pv.sel.add(p.id); else pv.sel.delete(p.id); renderPending(); });
  const m = el("div", "main");
  const top = el("div", "pv-top");
  const l = getList(c.listId);
  top.append(el("span", "tag", "▸ " + (l ? l.name : "")), el("span", "pv-type " + p.type, t("pv.type." + p.type)), el("span", "pv-field", pvFieldLabel(p.field)));
  const lg = cardLangs(c);
  const w = el("div", "pv-fr", targetTerm(c, lg) || "—"); w.lang = lg.target;
  m.append(top, w);
  if (p.field === "dup") {
    const sub = supportText(c, lg);
    if (sub) m.appendChild(el("div", "pv-field", sub));
    m.appendChild(el("div", "pv-act", "→ " + t("pv.dupAction")));
  } else if (isPosField(p.field)) { // nature : libellés lisibles, modification par liste déroulante
    const lng = p.field.slice(4);
    const d = el("div", "pv-diff");
    const oldT = pvPosText(p.oldValue, lng);
    d.appendChild(oldT ? el("div", "wr-diff", "") : el("div", "wr-diff muted", "—"));
    if (oldT) d.lastChild.appendChild(el("mark", "wr-bad", oldT));
    d.appendChild(el("span", "pv-arrow", "→"));
    const editing = pv.editing.has(p.id);
    if (!editing) { const nd = el("div", "wr-diff"); nd.appendChild(el("mark", "wr-miss", pvPosText(p.newValue, lng))); d.appendChild(nd); }
    m.appendChild(d);
    if (editing) {
      const ps = el("select", "input");
      const codes = posCodesFor(lng);
      const cur = pv.edits[p.id] != null ? pv.edits[p.id] : p.newValue;
      if (cur && !codes.includes(cur)) codes.push(cur);
      codes.forEach(pc => { const o = el("option", null, pvPosText(pc, lng)); o.value = pc; ps.appendChild(o); });
      ps.value = cur;
      ps.addEventListener("change", () => { pv.edits[p.id] = ps.value; });
      m.appendChild(ps);
    }
  } else {
    const r = wrLcs(p.oldValue, p.newValue);
    const d = el("div", "pv-diff");
    d.appendChild(p.oldValue ? wrDiffNode(r.A, r.ma, "wr-bad") : el("div", "wr-diff muted", "—"));
    d.appendChild(el("span", "pv-arrow", "→"));
    const editing = pv.editing.has(p.id);
    if (!editing) d.appendChild(wrDiffNode(r.B, r.mb, "wr-miss"));
    m.appendChild(d);
    if (editing) { // édition directe de la nouvelle valeur, puis « Accepter »
      const inp = textInput(pv.edits[p.id] != null ? pv.edits[p.id] : p.newValue, "", isLang(p.field) ? p.field : lg.target);
      inp.addEventListener("input", () => { pv.edits[p.id] = inp.value; });
      m.appendChild(inp);
    }
  }
  if (p.reason) m.appendChild(el("div", "pv-reason", p.reason));
  row.append(cb, m);
  return row;
}

// --- Propositions « Nouvelle carte » (écran « Générer des cartes ») ---
function pvNewRank(p) { return p.cards.some(d => d.type === "rule") ? 0 : 1; }
// Carte temporaire pour l'affichage (titres, sous-titres) d'un brouillon.
function draftCard(d, listId) {
  if (d.type === "vocab") return Object.assign(newCard(listId, d.fields.terms, d.fields.example, [], d.fields.pos), { id: "" });
  return Object.assign({ type: d.type, listId, id: "", examples: [] }, d.fields);
}

    pvNewInputs(box, ds, ty === "vocab" ? ["t:" + lg.target].concat(lg.support.map(x => "t:" + x), ["example"]) : (TYPE_FIELDS[ty] || []).filter(f => !["lang", "ruleId"].includes(f)).concat(ty === "rule" ? ["examples"] : []), lg);
  } else {
    const d = ds[0], c = draftCard(d, p.listId);
    const t1 = el("div", "pv-new-t1", ty === "vocab" ? (term(c, lg.target) + (d.fields.pos && d.fields.pos[lg.target] ? "  " + posLabel(d.fields.pos[lg.target], lg.target) : "")) : cardTitle(c));
    t1.lang = ty === "vocab" ? lg.target : c.lang;
    box.appendChild(t1);
    const sub = ty === "vocab" ? supportText(c, lg) : cardSubtitle(c);
    if (sub) box.appendChild(el("div", "pv-new-t2", sub));
    const more = ty === "vocab" ? [d.fields.example] : [d.fields.hint ? t("type.hint") + " " + d.fields.hint : "", d.fields.explanation, ty === "rule" ? arr(d.fields.examples).join(" · ") : "", d.fields.translation];
    more.filter(Boolean).forEach(x => box.appendChild(el("div", "pv-new-t2", x)));
    if (d.ruleRef) box.appendChild(el("div", "pv-new-t2", "§ " + d.ruleRef));
  }
  m.appendChild(box);
  if (p.reason) m.appendChild(el("div", "pv-reason", p.reason));
  row.append(cb, m);
  return row;

// Champs modifiables d'un brouillon (la ligne reste un <label> : les clics sur les champs ne cochent pas la case).
function pvNewInputs(box, ds, fields, lg) {
  const w = el("div", "pv-edit");
  const d = ds[0];
  const stop = e => { e.stopPropagation(); };
  fields.forEach(f => {
    let label, get, set, multi = false, lng = d.fields.lang || lg.target;
    if (f.startsWith("t:")) { const code = f.slice(2); label = langName(code); lng = code; get = () => (d.fields.terms || {})[code] || ""; set = v => { d.fields.terms = Object.assign({}, d.fields.terms, { [code]: v }); }; }
    else if (f === "examples") { label = t("type.rule.examples"); multi = true; get = () => arr(d.fields.examples).join("\n"); set = v => { d.fields.examples = v.split("\n").map(x => x.trim()).filter(Boolean); }; }
    else {
      const LBL = { example: "card.example", sentence: "type.cloze.sentence", answer: "type.cloze.answer", hint: "type.hint", explanation: "type.explanation",
        translation: "type.translation", wrong: "type.fix.wrong", correct: "type.fix.correct", title: "type.rule.title", body: "type.rule.body", note: "type.note" };
      label = t(LBL[f] || "type." + f).replace(/\s*:\s*$/, "");
      multi = f === "body";
      get = () => d.fields[f] || "";
      set = v => { ds.forEach(x => { x.fields[f] = v; }); };   // conjugaison : traduction / note communes au tableau
    }
    w.appendChild(el("label", null, label));
    const inp = multi ? el("textarea", "input") : textInput(get(), "", ["translation", "explanation", "hint", "note"].includes(f) ? "" : lng);
    if (multi) inp.value = get();
    inp.addEventListener("input", () => set(inp.value));
    inp.addEventListener("click", stop);
    w.appendChild(inp);
  });
  box.appendChild(w);
}
// Crée les cartes d'une proposition dans sa liste. Renvoie { added, dupOnly }.
function pvAcceptNew(p, edited) {
  const listId = p.listId;
  if (!getList(listId)) return { added: 0, dupOnly: true };
  const lg = listLangs(listId);
  const ds = edited || p.cards;
  const have = new Set(cardsOf(listId).map(c => isVocab(c) ? "vocab|" + dupKey(c.terms, lg) : typedKey(c.type, c)));
  const fresh = [];
  let dups = 0, bad = 0;
  ds.forEach(d => {
    let c;
    if (d.type === "vocab") {
      const terms = {}; Object.keys(d.fields.terms || {}).forEach(k => { const v = String(d.fields.terms[k] || "").replace(/\s+/g, " ").trim(); if (v) terms[k] = v; });
      c = newCard(listId, terms, String(d.fields.example || "").trim(), [], d.fields.pos || {});
    } else c = newTypedCard(listId, d.type, Object.assign({}, d.fields, { lang: d.fields.lang || lg.target }));
    const k = isVocab(c) ? "vocab|" + dupKey(c.terms, lg) : typedKey(c.type, c);
    if (have.has(k)) { dups++; return; }
    if (!cardUsable(c, lg)) { bad++; return; }
    if (d.ruleRef) {
      const r = state.cards.concat(fresh).find(x => x.listId === listId && cardType(x) === "rule" && normText(x.title) === normText(d.ruleRef));
      if (r) c.ruleId = r.id;
    }
    have.add(k);
    fresh.push(c);
  });
  if (bad) return { added: 0, dupOnly: false };            // une case non valide : rien n'est créé, la ligne reste (à modifier)
  state.cards.push(...fresh);
  fresh.forEach(c => { if (isVocab(c)) state.checkedSig[c.id] = cardSig(c); });
  return { added: fresh.length, dupOnly: !fresh.length && dups > 0 };
}

function pvSelected() { return liveProposals().filter(p => pv.sel.has(p.id)); }
function pvSnapshot() {
  return { st: state, cards: JSON.stringify(state.cards), proposals: JSON.stringify(state.proposals),
    rejected: state.rejected.slice(), checkedSig: Object.assign({}, state.checkedSig) };
}

function pvAccept() {
  const sel = pvSelected();
  if (!sel.length) { toast(t("pv.pickOne")); return; }
  const snap = pvSnapshot();
  let ok = 0, skipped = 0;
  const done = new Set();
  // Nouvelles cartes : fiches de règle d'abord (pour relier les textes à trous / phrases à corriger acceptés en même temps)
  sel.filter(p => p.field === "new").sort((a, b) => pvNewRank(a) - pvNewRank(b)).forEach(p => {
    const r = pvAcceptNew(p, pv.editing.has(p.id) ? pv.edits[p.id] : null);
    if (r.added) { ok++; done.add(p.id); }
    else if (r.dupOnly) { skipped++; done.add(p.id); }   // déjà dans la liste : la proposition disparaît
    else skipped++;                                      // non valide : la ligne reste
  });
  sel.filter(p => p.field !== "new").forEach(p => {
    const c = state.cards.find(x => x.id === p.cardId);
    if (!c) { done.add(p.id); return; }
    if (p.field === "dup") {
      state.cards = state.cards.filter(x => x.id !== c.id);
      delete state.checkedSig[c.id];
      done.add(p.id); ok++;
      return;
    }
    const edited = pv.editing.has(p.id) && pv.edits[p.id] != null;
    let nv = String(edited ? pv.edits[p.id] : p.newValue).replace(/\s+/g, " ").trim();
    if (isPosField(p.field)) nv = parsePos(nv, p.field.slice(4)); // nature non valide : la ligne reste
    const cur = fieldVal(c, p.field);
    const stale = p.type === "completion" ? !!cur.trim() : cur !== p.oldValue; // champ modifié entre-temps : jamais écrasé
    if (stale) { done.add(p.id); skipped++; return; }
    const next = Object.assign({}, c, { terms: Object.assign({}, c.terms), pos: Object.assign({}, c.pos) });
    setFieldVal(next, p.field, nv);
    if (!nv || !cardUsable(next)) { skipped++; return; } // valeur non valide : la ligne reste
    setFieldVal(c, p.field, nv);
    c.auto = c.auto.filter(a => a !== (p.field === "example" ? "example" : isPosField(p.field) ? "pos." + p.field.slice(4) : "terms." + p.field)); // validé à la main
    state.checkedSig[c.id] = cardSig(c);
    done.add(p.id); ok++;
  });
  const ids = new Set(state.cards.map(c => c.id));
  state.proposals = state.proposals.filter(p => !done.has(p.id) && (p.field === "new" ? !!getList(p.listId) : ids.has(p.cardId)));
  pvClearSel();
  commit();
  showUndo(t("pv.accepted", { n: ok }) + (skipped ? t("pv.skipped", { n: skipped }) : ""), snap);
}

function pvReject() {
  const sel = pvSelected();
  if (!sel.length) { toast(t("pv.pickOne")); return; }
  const snap = pvSnapshot();
  const done = new Set(sel.map(p => p.id));
  sel.forEach(p => {
    const ks = p.field === "new"
      ? p.cards.map(d => rejectKey(p.listId, "new", draftKey(d, listLangs(p.listId))))   // ne sera plus proposée par « Générer »
      : [rejectKey(p.cardId, p.field, p.newValue)];
    ks.forEach(k => { if (!state.rejected.includes(k)) state.rejected.push(k); });
  });
  if (state.rejected.length > CONFIG.REJECT_MAX) state.rejected = state.rejected.slice(-CONFIG.REJECT_MAX);
  state.proposals = state.proposals.filter(p => !done.has(p.id));
  pvClearSel();
  commit();
  showUndo(t("pv.rejected", { n: sel.length }), snap);
}

function pvEdit() {
  const sel = pvSelected().filter(p => p.field !== "dup");
  if (!sel.length) { toast(t("pv.pickOne")); return; }
  sel.forEach(p => { pv.editing.add(p.id); if (pv.edits[p.id] == null) pv.edits[p.id] = p.field === "new" ? JSON.parse(JSON.stringify(p.cards)) : p.newValue; });
  renderPending();
  setTimeout(() => { try { const i = $("#screen-pending .pv-row .input"); if (i) i.focus(); } catch (e) {} }, 50);
}

// Barre « Annuler » : restaure cartes, propositions et refus d'avant l'action groupée.
function showUndo(msg, snap) {
  let bar = $("#undoBar");
  if (!bar) {
    bar = el("div", "undo-bar");
    bar.id = "undoBar";
    bar.append(el("span"), el("button"));
    document.body.appendChild(bar);
  }
  const hide = () => { bar.classList.remove("show"); clearTimeout(undoTimer); };
  bar.firstChild.textContent = msg;
  const btn = bar.lastChild;
  btn.textContent = t("pv.undo");
  btn.onclick = () => {
    hide();
    if (state !== snap.st) return; // compte changé entre-temps
    try {
      state.cards = JSON.parse(snap.cards);
      state.proposals = JSON.parse(snap.proposals);
      state.rejected = snap.rejected;
      state.checkedSig = snap.checkedSig;
      commit();
      toast(t("pv.undone"));
    } catch (e) {}
  };
  bar.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hide, CONFIG.UNDO_MS);
}

// === ADMINISTRATION ===
// Écran #admin, visible seulement par l'admin (mode Supabase, compte présent dans la table admins).
// Liste des comptes (fonction admin_list_accounts), réinitialiser le PIN (admin_reset_pin : changement obligatoire ensuite),
// exporter / importer les données d'un compte, copier des dossiers ou des listes vers un autre compte,
// supprimer un compte (admin_delete_account, double confirmation). Les fonctions SQL vérifient que l'appelant est admin.
// Données d'un autre compte : lignes user_data lues / écrites directement (RLS : accès total pour l'admin).
// Si ce compte est ouvert sur un autre appareil, il verra un conflit à son prochain envoi (choix des données à garder).
const adm = { list: null, loading: false, error: false };

function admDate(ts) {
  if (!ts) return t("admin.never");
  try { return new Date(ts).toLocaleDateString(state.settings.uiLang); } catch (e) { return String(ts).slice(0, 10); }
}
function renderAdmin() {
  const root = $("#screen-admin");

// Copie de dossiers et de listes vers un autre compte : nouvelles cartes sans progression.
// Les langues effectives sont recopiées (les réglages par défaut des deux comptes peuvent différer).
async function adminCopy(src) {
  let d;
  try { d = await admRead(src); } catch (e) { toast(t("admin.err")); return; }
  if (!d || !d.lists.length) { toast(t("admin.noData")); return; }
  const others = adm.list.filter(x => x.user_id !== src.user_id);
  const selF = new Set(), selL = new Set();
  const wrap = el("div");
  wrap.appendChild(el("p", "muted", t("admin.copyWhat")));
  const pick = el("div", "adm-pick");
  const byOrder = (x, y) => num(x.order, 0) - num(y.order, 0);
  const listBoxes = new Map();
  const checkRow = (label, cls, onChange) => {
    const r = el("label", "check" + (cls ? " " + cls : ""));
    const cb = el("input"); cb.type = "checkbox";
    cb.addEventListener("change", () => onChange(cb.checked));
    r.append(cb, el("span", null, label));
    pick.appendChild(r);
    return cb;
  };
  const listRow = (l, sub) => {
    const cb = checkRow(l.name + " (" + d.cards.filter(c => c.listId === l.id).length + ")", sub ? "sub" : "", v => { if (v) selL.add(l.id); else selL.delete(l.id); });
    listBoxes.set(l.id, cb);
  };
  d.folders.slice().sort(byOrder).forEach(f => {
    const lists = d.lists.filter(l => l.folderId === f.id).sort(byOrder);
    checkRow("📁 " + f.name, "", v => {
      if (v) selF.add(f.id); else selF.delete(f.id);
      lists.forEach(l => { const cb = listBoxes.get(l.id); if (cb) { cb.checked = v; if (v) selL.add(l.id); else selL.delete(l.id); } });
    });
    lists.forEach(l => listRow(l, true));
  });
  const loose = d.lists.filter(l => !l.folderId || !d.folders.some(f => f.id === l.folderId)).sort(byOrder);
  if (loose.length && d.folders.length) pick.appendChild(el("div", "hint", t("admin.noFolder")));
  loose.forEach(l => listRow(l, false));
  wrap.appendChild(pick);
  const sel = el("select", "input");
  others.forEach(o => { const op = el("option", null, o.identifiant); op.value = o.user_id; sel.appendChild(op); });
  wrap.appendChild(formField(t("admin.copyTo"), sel, false, t("admin.copyHint")));
  openModal(t("admin.copy"), wrap, [
    { label: t("cancel") },
    { label: t("confirm"), kind: "primary", onClick: () => {
      if (!selF.size && !selL.size) { toast(t("admin.copyNone")); return false; }
      const dest = others.find(o => o.user_id === sel.value);
      if (!dest) return false;
      runAdminCopy(d, dest, selF, selL);
    } }
  ]);
}
async function runAdminCopy(d, dest, selF, selL) {
  try {
    let out = await admRead(dest);
    out = out ? JSON.parse(JSON.stringify(out)) : emptyData();
    const acct = resolveLangs([{ target: d.settings.defaultTarget, support: d.settings.defaultSupport }]);
    const now = Date.now();
    const maxOrder = a => a.reduce((m, x) => Math.max(m, num(x.order, 0)), 0);
    let fo = maxOrder(out.folders), lo = maxOrder(out.lists);
    const fMap = {}, lMap = {};
    d.folders.filter(f => selF.has(f.id)).forEach(f => {
      const lg = resolveLangs([acct, f]);
      const nf = { id: uid(), name: f.name, order: ++fo, target: lg.target, support: lg.support.slice() };
      fMap[f.id] = nf.id; out.folders.push(nf);
    });
    d.lists.filter(l => selL.has(l.id)).forEach(l => {
      const f = l.folderId ? d.folders.find(x => x.id === l.folderId) : null;
      const nl = { id: uid(), name: l.name, folderId: (l.folderId && fMap[l.folderId]) || null, order: ++lo, createdAt: now };
      if (l.target) { nl.target = l.target; nl.support = arr(l.support).slice(); }
      else if (!nl.folderId) { const lg = resolveLangs([acct, f, l]); nl.target = lg.target; nl.support = lg.support.slice(); }
      lMap[l.id] = nl.id; out.lists.push(nl);
    });
    let n = 0;
    const idMap = {};
    d.cards.forEach(c => {
      if (!lMap[c.listId]) return;
      const nc = JSON.parse(JSON.stringify(c));
      nc.id = uid(); nc.listId = lMap[c.listId];
      nc.box = 0; nc.dueAt = now; nc.stats = { seen: 0, correct: 0, wrong: 0, lastSeen: null };
      out.cards.push(nc); n++;
      idMap[c.id] = nc.id;
    });
    out.cards.forEach(c => { if (c.ruleId && idMap[c.ruleId]) c.ruleId = idMap[c.ruleId]; }); // lien vers la règle copiée
    out = normalizeData(out);
    await admWrite(dest, out);
    toast(t("admin.copyDone", { folders: Object.keys(fMap).length, lists: Object.keys(lMap).length, cards: n, id: dest.identifiant }));
    loadAdmin();
  } catch (e) { toast(t("admin.err")); }
}

// === CONNEXION ===
// Deux modes, choisis au lancement (INIT) :
//  - "supabase" (config.js rempli) : Supabase Auth. Email technique <identifiant>@vocab.local, mot de passe = SHA-256(identifiant:PIN).
//    Profil (fonction my_profile) : identifiant, PIN à changer (admin à l'installation, PIN réinitialisé par l'admin), admin.
//    « Rester connecté » : session Supabase gardée sur l'appareil (sinon oubliée à la fermeture du navigateur).
//  - "local" (artifact Claude ou navigateur sans config) : registre des comptes comme avant (PIN haché avec un sel, jamais en clair).
//    Migration : le premier compte créé reçoit les anciennes données (après proposition d'export), une seule fois.
// Identifiant : insensible à la casse, espaces retirés, lettres/chiffres/tirets (2 à 20). PIN : 4 à 6 chiffres.
// Identifiant inconnu à la connexion : proposition de créer le compte.
const auth = {
  mode: "local", view: "loading", reg: { accounts: [], migrated: false }, legacy: null, backupAsked: false, busy: false,
  msg: "", isAdmin: false, sbUid: null, lastPin: "", forceId: "", forceTarget: null,
  form: { id: "", pin: "", pin2: "", target: LANG_DEFAULT }
};

function rememberMe() { try { return localStorage.getItem(CONFIG.LS_REMEMBER) !== "0"; } catch (e) { return true; } }
function setRememberMe(v) { try { localStorage.setItem(CONFIG.LS_REMEMBER, v ? "1" : "0"); } catch (e) {} }
function normId(s) { return String(s || "").replace(/\s+/g, "").toLowerCase(); }
function validId(s) { return /^[a-z0-9-]{2,20}$/.test(s); }
function validPin(s) { return /^\d{4,6}$/.test(s); }
function clearAuthForm() { auth.form = { id: "", pin: "", pin2: "", target: (auth.form && auth.form.target) || LANG_DEFAULT }; auth.msg = ""; }
async function hashPin(pin, salt) {
  const txt = salt + ":" + pin;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { // repli si crypto.subtle est absent
    let h = 2166136261;
    for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    return "f" + (h >>> 0).toString(16);
  }
}
// Langue et thème de l'écran de connexion (gardés sur l'appareil).
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(CONFIG.LS_PREFS) || "null");
    if (p && ["ko", "fr", "en"].includes(p.uiLang)) state.settings.uiLang = p.uiLang;
    if (p && ["light", "dark", "auto"].includes(p.theme)) state.settings.theme = p.theme;
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(CONFIG.LS_PREFS, JSON.stringify({ uiLang: state.settings.uiLang, theme: state.settings.theme })); } catch (e) {}
}
function errText(kind) {
  return t({ net: "auth.err.net", exists: "auth.err.exists", confirm: "auth.err.confirm", same: "auth.err.same", wrong: "auth.err.wrong" }[kind] || "auth.err.server");
}

// Affiche l'écran de connexion. view : "loading" | "login" | "create" | "force" (nouveau PIN obligatoire) | "libError".
function showAuth(view) {
  auth.view = view || "login";

function pinInput(value, onInput) {

  i.value = value || "";

// Sélecteur de langue de l'interface, visible sur l'écran de connexion.
function authLangSeg() {
  const seg = el("div", "seg");
  [["ko", "한국어"], ["fr", "Français"], ["en", "English"]].forEach(([code, label]) => {
    const b = el("button", null, label);
