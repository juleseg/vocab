// === FILE D'ATTENTE CLAUDE ===
// Mode Supabase seulement (GitHub Pages, sans accès direct à Claude) : l'appli dépose une demande dans la table
// claude_requests ; une tâche programmée Claude (connecteur Supabase) la traite plus tard et écrit ses réponses
// dans claude_proposals. L'appli les récupère (fonction claude_claim_proposals) et les range dans « À valider »,
// avec les mêmes règles que l'accès direct (addProposal, addGenProposals). Rien n'est écrit dans les cartes.
//
// Demande (ligne claude_requests) : { kind: "complete"|"verify"|"generate", label, card_count, batch_count, payload }
// payload = {
//   v: 1, app: "vocab", kind, uiLang, created: date ISO,
//   answer: format de la réponse attendue pour chaque lot,
//   batches: [{
//     prompt,          // consignes complètes du lot, rédigées par l'appli (mêmes que l'accès direct à Claude)
//     ids,             // complete / verify : ids des cartes ; k0, k1… dans le prompt = ids[0], ids[1]…
//     missing,         // complete : champs demandés par carte (même ordre que ids)
//     sigs             // verify : empreinte des cartes au moment de la demande (cardSig)
//   }],
//   req               // generate : demande figée (genRequest), listId = liste de destination
// }
// Réponse d'un lot (ligne claude_proposals, colonne result) : la valeur JSON demandée par le prompt du lot
//   complete : [{ "id": "k0", "<champ>": "valeur", … }]   verify : [{ "id", "field", "value", "reason" }]
//   generate : { "lines": ["ligne au format de l'import", …] }
const Queue = (() => {
  let status = "unknown";      // unknown | ok | missing (tables pas installées)
  let items = [];              // demandes du compte (50 plus récentes)
  let loaded = false, busy = null, timer = null, lastError = "";
  let v23 = null;              // script de l'étape 23 installé ? (null = pas encore su) — sinon ancien fonctionnement
  const T = 15000;
  const COLS = "id,kind,status,label,card_count,batch_count,error,result_count,created_at,started_at,finished_at,fetched_at";
  const COLS23 = COLS + ",hidden_by_user,content_cleared_at";
  const OPEN = ["pending", "processing"];

  function usable() { return auth.mode === "supabase" && !!auth.sbUid && !!Supa.client() && !!Storage.getUser(); }
  function client() { return Supa.client(); }
  function ok(r) { if (r && r.error) throw r.error; return r ? r.data : null; }
  // "missing" (script SQL de l'étape 18 pas lancé) | "net" | "limit" | "big" | "server"
  function errKind(e) {
    const code = String((e && e.code) || ""), msg = String((e && (e.message || e.msg)) || e || "");
    if (["42P01", "PGRST205", "PGRST202", "42883"].includes(code) || /does not exist|schema cache|could not find/i.test(msg)) return "missing";
    if (/trop de demandes/i.test(msg)) return "limit";
    if (/trop grosse/i.test(msg)) return "big";
    if (sbErrKind(e) === "net") return "net";
    return "server";
  }
  function noteError(e) {
    const k = errKind(e);
    if (k === "missing") status = "missing";
    lastError = k;
    return k;
  }
  function errText(k) { return t("queue.err." + (k || "server")); }
  // Colonne de l'étape 23 absente (script supabase-etape23.sql pas lancé)
  function isNoCol23(e) {
    const code = String((e && e.code) || ""), msg = String((e && (e.message || e.msg)) || "");
    return code === "42703" || /hidden_by_user|content_cleared_at/i.test(msg);
  }

  async function refresh() {
    if (!usable()) return false;
    const get = with23 => {
      let q = client().from("claude_requests").select(with23 ? COLS23 : COLS).eq("user_id", auth.sbUid);
      if (with23) q = q.eq("hidden_by_user", false);          // demandes masquées : plus sur cet écran (gardées pour l'admin)
      return withTimeout(q.order("created_at", { ascending: false }).limit(50), T);
    };
    try {
      let r = v23 === false ? null : await get(true);
      if (r && r.error && isNoCol23(r.error)) { v23 = false; r = null; }
      else if (r && !r.error) v23 = true;
      if (!r) r = await get(false);
      items = arr(ok(r)); loaded = true; status = "ok"; lastError = "";
      return true;
    } catch (e) { noteError(e); return false; }
  }
  // Récupère les réponses arrivées et les range dans « À valider ». Renvoie le résultat de queueApply (ou null).
  async function claim(quiet) {
    if (!usable()) return null;
    const who = Storage.getUser(), st = state;
    let resp;
    try { resp = ok(await withTimeout(client().rpc("claude_claim_proposals"), T * 2)); }
    catch (e) { noteError(e); return null; }
    status = "ok";
    if (!resp || !arr(resp.proposals).length) return { added: 0, cards: 0, bad: 0 };
    if (Storage.getUser() !== who || state !== st) return null;   // compte changé : « Récupérer à nouveau » plus tard
    const r = queueApply(resp);
    if (r.added) { commitQuiet(); if (!quiet) toast(queueGotText(r.added)); }
    return r;
  }
  // Récupération + liste des demandes (un seul appel à la fois), puis prochaine vérification si une demande est en cours.
  function sync(opts) {
    opts = opts || {};
    if (!usable()) return Promise.resolve(null);
    if (busy) return busy;
    busy = (async () => {
      let res = null;
      try {
        res = await claim(!!opts.report);
        await refresh();
        QStats.flush();                                 // compteurs en attente (hors connexion) : renvoyés
      } finally {
        busy = null;
        schedule();
        if (currentScreen === "requests") renderRequests();
        else if (currentScreen === "settings") renderAiCard();
        else if (currentScreen === "pending" && !(res && res.added)) renderPending();   // bandeau à jour
      }
      if (opts.report && res && res.added) {
        openModal(t("ai.doneTitle"), el("p", null, queueGotText(res.added)), [
          { label: t("close") }, { label: t("ai.see"), kind: "primary", onClick: () => { goPending(); } }]);
      }
      return res;
    })();
    return busy;
  }
  function openCount() { return items.filter(r => OPEN.includes(r.status)).length; }
  function schedule() {
    clearTimeout(timer); timer = null;
    if (!usable() || status === "missing") return;
    if (!items.some(r => OPEN.includes(r.status) || (r.status === "done" && !r.fetched_at))) return;
    timer = setTimeout(() => { if (document.visibilityState !== "hidden") sync(); else schedule(); }, CONFIG.QUEUE_POLL_MS);
  }
  async function submit(rows) {
    if (!usable()) return { error: "server" };
    try {
      for (const row of rows) ok(await withTimeout(client().from("claude_requests").insert(row), T));
      status = "ok";
      await refresh();
      schedule();
      return { error: null };
    } catch (e) { const k = noteError(e); await refresh(); return { error: k }; }
  }
  // Annuler : seulement une demande en attente (la règle RLS de l'étape 23 refuse les autres).
  async function remove(ids) {
    try {
      let q = client().from("claude_requests").delete().eq("user_id", auth.sbUid).in("id", ids);
      if (v23 !== false) q = q.eq("status", "pending");
      ok(await withTimeout(q, T));
      await refresh(); return true;
    } catch (e) { noteError(e); toast(errText(lastError)); return false; }
  }
  // Masquer des demandes terminées (done / error) : elles restent dans l'historique admin.
  // Sans le script de l'étape 23 : ancien fonctionnement (demande effacée).
  async function hide(ids) {
    if (v23 === false) {
      try { ok(await withTimeout(client().from("claude_requests").delete().eq("user_id", auth.sbUid).in("id", ids), T)); }
      catch (e) { noteError(e); toast(errText(lastError)); return false; }
      await refresh(); return true;
    }
    try { ok(await withTimeout(client().rpc("claude_request_hide", { p_ids: ids }), T)); }
    catch (e) { noteError(e); toast(errText(lastError)); return false; }
    await refresh(); return true;
  }
  async function refetch(id) {
    try { ok(await withTimeout(client().rpc("claude_refetch_request", { p_request: id }), T)); }
    catch (e) { noteError(e); toast(errText(lastError)); return; }
    const r = await sync();
    if (r && !r.added) toast(t("queue.nothingNew"));
  }
  function start() {
    reset();
    if (!usable()) return;
    sync();
  }
  function reset() { clearTimeout(timer); timer = null; items = []; loaded = false; lastError = ""; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && usable() && loaded) sync(); });
  return {
    usable, sync, submit, remove, hide, refetch, start, reset, refresh, errText,
    items: () => items, loaded: () => loaded, status: () => status, lastError: () => lastError, openCount,
    busy: () => !!busy
  };
})();

// --- Compteurs reçues / acceptées / refusées (suivi admin, étape 23) ---
// Chaque proposition venue de la file garde l'id de sa demande (p.reqId). L'appli compte les propositions reçues à la
// récupération, puis chaque acceptation ou refus dans « À valider », et envoie les hausses à claude_request_add_counts
// (un seul appel pour tout ce qui est en attente : une action groupée = un envoi par paquet). Les compteurs ne font
// qu'augmenter. En attente sur l'appareil (localStorage) tant que l'envoi n'a pas réussi : hors connexion, refait plus
// tard (retour en ligne, synchro de la file, toutes les minutes), sans message d'erreur.
const QStats = (() => {
  const FIELDS = ["received", "accepted", "rejected"];
  let pending = {}, who = null, inflight = null, again = false, timer = null;
  const counted = new Set();            // propositions déjà comptées (acceptées / refusées) depuis l'ouverture
  function key() { return CONFIG.LS_USER_PREFIX + "qstats:" + (Storage.getUser() || ""); }
  function load() {
    const u = Storage.getUser() || "";
    if (who === u) return;
    who = u; pending = {}; counted.clear();
    try {
      const o = JSON.parse(localStorage.getItem(key()) || "{}");
      if (o && typeof o === "object") Object.keys(o).forEach(id => {
        const v = o[id] || {}, x = {};
        FIELDS.forEach(f => { const n = Math.floor(Number(v[f]) || 0); if (n > 0) x[f] = n; });
        if (Object.keys(x).length) pending[id] = x;
      });
    } catch (e) { pending = {}; }
  }
  function store() {
    try { if (Object.keys(pending).length) localStorage.setItem(key(), JSON.stringify(pending)); else localStorage.removeItem(key()); } catch (e) {}
  }
  function add(reqId, field, n) {
    if (!reqId || !FIELDS.includes(field) || !(n > 0)) return;
    load();
    const x = pending[reqId] || (pending[reqId] = {});
    x[field] = (x[field] || 0) + n;
    store();
  }
  // Acceptation / refus d'une proposition de la file (une seule fois par proposition, même après « Annuler »).
  function decide(p, field) {
    if (!p || !p.reqId || p.qc || counted.has(p.id)) return;
    counted.add(p.id);
    add(p.reqId, field, 1);
  }
  function wasCounted(id) { return counted.has(id); }
  function retryLater() { clearTimeout(timer); timer = setTimeout(() => flush(), 60000); }
  // Envoie tout ce qui est en attente (500 demandes max par appel). Rien à envoyer, hors mode Supabase : rien.
  function flush() {
    load();
    if (!Object.keys(pending).length) return Promise.resolve(true);
    if (!Queue.usable()) return Promise.resolve(false);
    if (inflight) { again = true; return inflight; }
    const ids = Object.keys(pending).slice(0, 500);
    const sent = ids.map(id => Object.assign({ id }, pending[id]));
    const u = who, cl = Supa.client();
    inflight = (async () => {
      let okSent = false;
      try {
        const r = await withTimeout(cl.rpc("claude_request_add_counts", { p_items: sent }), 15000);
        if (r && r.error) throw r.error;
        okSent = true;
      } catch (e) { okSent = false; }
      if (who === u && okSent) {
        sent.forEach(s => {                              // retire ce qui a été envoyé (des hausses ont pu arriver entre-temps)
          const x = pending[s.id]; if (!x) return;
          FIELDS.forEach(f => { if (s[f]) { x[f] = (x[f] || 0) - s[f]; if (x[f] <= 0) delete x[f]; } });
          if (!Object.keys(x).length) delete pending[s.id];
        });
        store();
      }
      return okSent;
    })();
    return inflight.then(r => {
      inflight = null;
      if (who !== u) return r;
      if (r && (again || Object.keys(pending).length)) { again = false; return flush(); }
      again = false;
      if (!r) retryLater();
      return r;
    });
  }
  function pendingCount() { load(); return Object.keys(pending).length; }
  window.addEventListener("online", () => { if (pendingCount()) flush(); });
  return { add, decide, wasCounted, flush, pendingCount, reset: () => { who = null; clearTimeout(timer); } };
})();

function queueGotText(n) { return n === 1 ? t("queue.got1") : t("queue.got", { n }); }

// --- Préparer une demande ---
function queueLangsLabel(cards) {
  const lists = [...new Set(cards.map(c => c.listId))];
  if (lists.length === 1) return listLabel(getList(lists[0]));
  const folders = [...new Set(lists.map(id => (getList(id) || {}).folderId || ""))];
  if (folders.length === 1 && getFolder(folders[0])) return getFolder(folders[0]).name + " · " + t("queue.nLists", { n: lists.length });
  return t("queue.nLists", { n: lists.length });
}
// complete / verify : lots de AI_BATCH cartes, QUEUE_MAX_BATCHES lots max par demande (au-delà, plusieurs demandes).
function queueCardRows(kind, cards, want, label) {
  const per = CONFIG.AI_BATCH * CONFIG.QUEUE_MAX_BATCHES;
  const parts = chunks(cards, per);
  const base = label || queueLangsLabel(cards);
  return parts.map((part, pi) => {
    const batches = chunks(part, CONFIG.AI_BATCH).map(b => {
      const o = { ids: b.map(c => c.id) };
      if (kind === "complete") { o.prompt = completionPrompt(b, want); o.missing = b.map(c => (want || missingFields)(c)); }
      else { o.prompt = verifyPrompt(b); o.sigs = b.map(cardSig); }
      return o;
    });
    return {
      kind, label: (base + (parts.length > 1 ? " (" + (pi + 1) + "/" + parts.length + ")" : "")).slice(0, 300),
      card_count: part.length, batch_count: batches.length,
      payload: { v: 1, app: "vocab", kind, uiLang: state.settings.uiLang, created: new Date().toISOString(),
        answer: kind === "complete" ? "json-array: [{\"id\":\"k0\", \"<champ>\": \"valeur\"}]" : "json-array: [{\"id\":\"k0\",\"field\":\"…\",\"value\":\"…\",\"reason\":\"…\"}]",
        batches }
    };
  });
}
// Envoi d'une demande complete / verify. want : champs demandés par carte (complétion), null = champs vides.
async function queueSubmitCards(kind, cards, want, label) {
  cards = cards.filter(isVocab);
  if (kind === "complete") cards = cards.filter(c => (want || missingFields)(c).length);
  if (!cards.length) { toast(t(kind === "complete" ? "ai.nothingToComplete" : "ai.noCards")); return; }
  const rows = queueCardRows(kind, cards, want, label);
  await queueSend(rows);
}
// Génération : la liste de destination est créée tout de suite si c'est une nouvelle liste (les cartes arrivent plus tard).
async function queueSubmitGenerate(req) {
  const parts = req.type === "conj" ? chunks(req.verbs, GEN_VERBS_PER_CALL) : [null];
  if (parts.length > 50) { toast(t("queue.err.big")); return; }
  const isNew = req.listId === "__new__";
  const listId = genListId(req);
  req.listId = listId;
  if (isNew) commit();
  const keep = Object.assign({}, req, { newName: (getList(listId) || {}).name || req.newName });
  delete keep.createdId;
  const batches = parts.map(v => ({ prompt: genPromptJson(req, v), verbs: v || undefined }));
  const row = {
    kind: "generate", label: (listLabel(getList(listId)) + " · " + genLabel(req)).slice(0, 300),
    card_count: req.type === "conj" ? req.verbs.length : req.count, batch_count: batches.length,
    payload: { v: 1, app: "vocab", kind: "generate", uiLang: state.settings.uiLang, created: new Date().toISOString(),
      answer: "json-object: {\"lines\": [\"…\"]}", req: keep, batches }
  };
  await queueSend([row]);
}
async function queueSend(rows) {
  const pg = openProgress(t("queue.ask"), t("queue.sending"), []);
  let r;
  try { r = await Queue.submit(rows); } finally { pg.close(); }
  if (r.error) { openModal(t("queue.title"), el("p", null, Queue.errText(r.error)), [{ label: t("close") }]); return; }
  Activity.log("claude_request", { type: rows[0].kind, cards: rows.reduce((m, x) => m + (Number(x.card_count) || 0), 0), requests: rows.length });
  if (["pending", "settings", "requests"].includes(currentScreen)) renderScreen();   // bandeau, compteur, liste à jour
  openModal(t("queue.sentTitle"), el("p", null, t(rows.length > 1 ? "queue.sentN" : "queue.sent", { n: rows.length })), [
    { label: t("close") },
    { label: t("queue.see"), kind: "primary", onClick: () => { goRequests(); } }
  ]);
}

// --- Réception ---
// Ids d'une réponse « k0 » (ou l'id de la carte, accepté aussi) → « k<index> » attendu par applyAiResult.
function queueNormItems(res, ids) {
  let list = res;
  if (list && !Array.isArray(list) && typeof list === "object") list = list.items || list.cards || list.result || list.errors || [];
  return arr(list).map(it => {
    if (!it || typeof it !== "object") return null;
    const id = String(it.id || "");
    if (/^k\d+$/.test(id)) return it;
    const i = ids.indexOf(id);
    return i >= 0 ? Object.assign({}, it, { id: "k" + i }) : null;
  }).filter(Boolean);
}
// Demande de génération enregistrée → demande utilisable (liste supprimée entre-temps : recréée sous le même nom).
function queueGenReq(saved) {
  if (!saved || !saved.lg || !LANGUAGES[saved.lang]) return null;
  const req = Object.assign({}, saved, { verbs: arr(saved.verbs), tenses: arr(saved.tenses), persons: arr(saved.persons) });
  req.lg = { target: saved.lg.target, support: arr(saved.lg.support).filter(c => LANGUAGES[c]) };
  if (!getList(req.listId)) { req.listId = "__new__"; req.folder = getFolder(req.folder) ? req.folder : null; }
  return req;
}
// Range les réponses récupérées dans « À valider ». Renvoie { added, cards, bad }.
function queueApply(resp) {
  const reqs = new Map(arr(resp.requests).map(r => [r.id, r]));
  const byId = new Map(state.cards.map(c => [c.id, c]));
  const genReqs = new Map();      // une nouvelle liste recréée une seule fois par demande
  const out = { added: 0, cards: 0, bad: 0 };
  const got = {};                 // demande → propositions ajoutées dans « À valider » (compteur « reçues »)
  arr(resp.proposals).forEach(p => {
    const before = state.proposals.length;
    try { queueApplyOne(p); } catch (e) { out.bad++; }
    // addProposal / addGenProposals ajoutent en fin de tableau : les nouvelles gardent l'id de leur demande
    const fresh = state.proposals.slice(before);
    if (p.request_id && fresh.length) {
      fresh.forEach(x => { x.reqId = String(p.request_id); });
      got[p.request_id] = (got[p.request_id] || 0) + fresh.length;
    }
  });
  Object.keys(got).forEach(id => QStats.add(id, "received", got[id]));
  if (Object.keys(got).length) QStats.flush();
  return out;

  function queueApplyOne(p) {
    {                                                            // un lot de réponse
      const r = reqs.get(p.request_id), pl = r && r.payload;
      const b = pl && arr(pl.batches)[p.batch];
      if (!b) { out.bad++; return; }
      if (r.kind === "generate") {
        let req = genReqs.get(r.id);
        if (!req) { req = queueGenReq(pl.req); if (!req) { out.bad++; return; } genReqs.set(r.id, req); }
        const res = p.result;
        const lines = Array.isArray(res) ? res : res && Array.isArray(res.lines) ? res.lines : [];
        const pr = parseGenReply(lines.map(String).join("\n"), req);
        const a = addGenProposals(pr.drafts, req);
        out.added += a.added; out.cards += a.cards;
        return;
      }
      const ids = arr(b.ids);
      const batch = ids.map(id => byId.get(id) || null);       // carte supprimée entre-temps : ignorée
      const items = queueNormItems(p.result, ids);
      if (r.kind === "complete") {
        const miss = arr(b.missing);
        const want = c => { const i = ids.indexOf(c.id); return i >= 0 && Array.isArray(miss[i]) ? miss[i] : fillFields(c); };
        const n = applyAiResult("complete", batch, items, want);
        out.added += n; out.cards += n;
      } else if (r.kind === "verify") {
        const n = applyAiResult("verify", batch, items);
        out.added += n; out.cards += n;
        const sigs = arr(b.sigs);
        batch.forEach((c, i) => { if (c && sigs[i] && cardSig(c) === sigs[i]) state.checkedSig[c.id] = sigs[i]; }); // carte inchangée : vérifiée
      }
    }
  }
}

// --- Écran « Demandes en cours » (demandes de l'utilisateur) ---
function goRequests() {
  try { history.replaceState(null, "", "#" + HASH_OF.requests); } catch (e) {}
  showScreen("requests");
}
function queueDate(s) {
  try { const d = new Date(s); return d.toLocaleDateString(state.settings.uiLang) + " " + d.toLocaleTimeString(state.settings.uiLang, { hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return ""; }
}
function queueStatusText(r) {
  if (r.status === "done") return t(r.fetched_at ? "queue.st.fetched" : "queue.st.done");
  return t("queue.st." + r.status);
}
function renderRequests() {
  const root = $("#screen-requests");
  if (!root) return;
  root.textContent = "";
  const back = el("button", "link-btn", "‹ " + t("nav.settings"));
  back.addEventListener("click", () => { try { history.replaceState(null, "", "#" + HASH_OF.settings); } catch (e) {} showScreen("settings"); });
  root.appendChild(el("div", "lv-top")).appendChild(back);
  root.appendChild(el("h2", null, t("queue.title")));
  root.appendChild(el("p", "q-note", t("queue.help")));
  const top = el("div", "btns two");
  const ask = el("button", "btn primary", t("queue.ask"));
  ask.addEventListener("click", () => openAskClaude({ kind: "all" }));
  const upd = el("button", "btn", Queue.busy() ? t("queue.checking") : t("queue.refresh"));
  upd.disabled = Queue.busy();
  upd.addEventListener("click", () => { Queue.sync({ report: true }); renderRequests(); });
  top.append(ask, upd);
  root.appendChild(top);
  if (Queue.status() === "missing") { root.appendChild(el("div", "card q-err", t("queue.err.missing"))); return; }
  if (Queue.lastError() && Queue.lastError() !== "missing") root.appendChild(el("p", "q-err", Queue.errText(Queue.lastError())));
  const items = Queue.items();
  if (!Queue.loaded()) { root.appendChild(el("div", "empty", t("queue.loading"))); if (!Queue.busy()) Queue.sync(); return; }
  if (!items.length) { root.appendChild(el("div", "empty", t("queue.empty"))); return; }
  items.forEach(r => {
    const box = el("div", "card q-item");
    const head = el("div", "q-head");
    const left = el("div");
    left.appendChild(el("div", "q-title", t("queue.kind." + r.kind) + (r.label ? " · " + r.label : "")));
    const meta = [r.kind === "generate" ? t("queue.meta.gen", { n: r.card_count }) : t("queue.meta.cards", { n: r.card_count }), t("queue.meta.sent", { d: queueDate(r.created_at) })];
    if (r.finished_at) meta.push(t("queue.meta.done", { d: queueDate(r.finished_at) }));
    left.appendChild(el("div", "q-meta", meta.join(" · ")));
    head.append(left, el("span", "q-st " + r.status, queueStatusText(r)));
    box.appendChild(head);
    if (r.status === "error" && r.error) box.appendChild(el("div", "q-err", r.error));
    const acts = el("div", "q-acts");
    const link = (label, fn, danger) => { const b = el("button", "link-btn" + (danger ? " danger" : ""), label); b.addEventListener("click", fn); acts.appendChild(b); };
    // En attente : annuler (la demande est supprimée). En cours : rien. Terminée : masquer (gardée pour l'admin).
    if (r.status === "pending") {
      link(t("queue.cancel"), () => openModal(t("queue.cancel"), el("p", null, t("queue.cancelConfirm")), [
        { label: t("cancel") },
        { label: t("queue.cancel"), kind: "danger", onClick: () => { Queue.remove([r.id]).then(() => renderRequests()); } }]), true);
    } else if (r.status === "done" || r.status === "error") {
      if (r.status === "done" && r.fetched_at && r.result_count && !r.content_cleared_at) link(t("queue.refetch"), () => { Queue.refetch(r.id); });
      link(t("queue.hide"), () => { Queue.hide([r.id]).then(() => renderRequests()); });
    }
    if (acts.childNodes.length) box.appendChild(acts);
    root.appendChild(box);
  });
  const fin = items.filter(r => r.status === "error" || (r.status === "done" && r.fetched_at));
  if (fin.length > 1) {
    const b = el("button", "btn", t("queue.hideAll", { n: fin.length }));
    b.addEventListener("click", () => { Queue.hide(fin.map(r => r.id)).then(() => renderRequests()); });
    root.appendChild(b);
  }
}

// Fenêtre « Demander à Claude » : compléter les trous, vérifier, ou générer des cartes, sur tout / un dossier / une liste.
function openAskClaude(scope) {
  const o = { kind: "complete", scope: scope && scope.kind !== "all" ? scope.kind + ":" + scope.id : "all" };
  const wrap = el("div");
  wrap.appendChild(el("p", "q-note", t("queue.help")));
  const seg = el("div", "seg");
  const kinds = ["complete", "verify", "generate"];
  const sc = el("select", "input");
  [["all", t("queue.scope.all")]].concat(
    sortedFolders().map(f => ["folder:" + f.id, "▸ " + f.name]),
    orderedLists().map(l => ["list:" + l.id, listLabel(l)])
  ).forEach(([v, l]) => { const op = el("option", null, l); op.value = v; sc.appendChild(op); });
  sc.value = o.scope;
  if (sc.value !== o.scope) sc.value = o.scope = "all";
  const scopeField = formField(t("queue.scope"), sc);
  const info = el("p", "muted");
  const scopeObj = () => { const [k, id] = o.scope.split(":"); return k === "all" ? { kind: "all" } : { kind: k, id }; };
  const pick = () => {
    const cards = updScopeCards(scopeObj());
    if (o.kind === "complete") return cards.filter(c => gapFields(c).length);
    return cards;
  };
  const upd = () => {
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.value === o.kind)));
    scopeField.hidden = o.kind === "generate";
    if (o.kind === "generate") { info.textContent = t("queue.genInfo"); return; }
    const n = pick().length;
    info.textContent = o.kind === "complete" ? t("queue.countComplete", { n }) : t("queue.countVerify", { n });
  };
  kinds.forEach(k => {
    const b = el("button", null, t("queue.kind." + k));
    b.type = "button"; b.dataset.value = k;
    b.addEventListener("click", () => { o.kind = k; upd(); });
    seg.appendChild(b);
  });
  sc.addEventListener("change", () => { o.scope = sc.value; upd(); });
  wrap.append(formField(t("queue.what"), seg), scopeField, info);
  upd();
  openModal(t("queue.ask"), wrap, [
    { label: t("cancel") },
    { label: t("queue.send"), kind: "primary", onClick: () => {
      if (o.kind === "generate") { const s = scopeObj(); openGenerate(s.kind === "list" ? s.id : null); return; }
      const cards = pick();
      if (!cards.length) { toast(t(o.kind === "complete" ? "ai.nothingToComplete" : "ai.noCards")); return false; }
      const s = scopeObj(), obj = updScopeObj(s);
      const label = s.kind === "list" ? listLabel(obj) : s.kind === "folder" ? obj.name : t("queue.scope.all");
      if (o.kind === "verify") { if (addDuplicateProposals(cards)) commitQuiet(); }   // doublons : détectés sur l'appareil
      queueSubmitCards(o.kind, cards, o.kind === "complete" ? gapFields : null, label);
    } }
  ]);
}

// === JOURNAL D'ACTIVITÉ ===
// Mode Supabase seulement (script supabase-etape24.sql). Sans le script, ou hors mode Supabase : rien n'est envoyé,
// l'appli marche comme avant. Jamais d'erreur visible pour l'utilisateur.
// - Événements (table activity_log) : login, session, cards_added, import, validate, claude_request, pin_change, logout,
//   sync_error, conflict, admin_*. data = petit objet, jamais le contenu des cartes.
//   session (étape 26) : data.by_list = { id de liste: nombre de cartes révisées } (30 listes max), pour le classement
//   « listes les plus révisées » et la fiche du compte.
// - File locale par compte (localStorage vocabfr.activity:q:<identifiant>), envoyée regroupée toutes les 30 s, à la mise
//   en arrière-plan et au retour de la connexion (fonction activity_add). Chaque événement a un id (uuid) choisi ici :
//   un renvoi après une coupure n'est gardé qu'une fois. Un événement ne quitte la file qu'après un envoi réussi.
// - login : 1 par heure max (connexion, ou ouverture avec une session déjà ouverte).
// - cards_added : regroupé, 1 événement par liste et par heure (envoyé une heure après le premier ajout, ou à la déconnexion).
// - Appareil (table devices) : device_id gardé dans localStorage (vocabfr.device), fiche mise à jour au lancement (device_touch).
function uuid4() {
  try { if (crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID(); } catch (e) {}
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256); }
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b).map(x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
}
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let deviceIdMem = null;
function deviceId() {
  if (deviceIdMem) return deviceIdMem;
  const K = CONFIG.LS_USER_PREFIX + "device";
  try { const v = localStorage.getItem(K); if (v && UUID_RE.test(v)) return (deviceIdMem = v); } catch (e) {}
  deviceIdMem = uuid4();
  try { localStorage.setItem(K, deviceIdMem); } catch (e) {}
  return deviceIdMem;
}
// Type (phone | tablet | desktop), système et navigateur déduits du user agent ; installed = appli installée (standalone).
function deviceInfo() {
  const ua = String(navigator.userAgent || ""), touch = (navigator.maxTouchPoints || 0) > 1;
  let os = "";
  if (/iPhone|iPod/.test(ua)) os = "iOS";
  else if (/iPad/.test(ua) || (/Macintosh/.test(ua) && touch)) os = "iPadOS";
  else if (/Android/.test(ua)) os = "Android";
  else if (/CrOS/.test(ua)) os = "ChromeOS";
  else if (/Windows/.test(ua)) os = "Windows";
  else if (/Mac OS X|Macintosh/.test(ua)) os = "macOS";
  else if (/Linux/.test(ua)) os = "Linux";
  let type = "desktop";
  if (os === "iPadOS" || /Tablet/i.test(ua) || (os === "Android" && !/Mobile/.test(ua))) type = "tablet";
  else if (os === "iOS" || /Mobi/.test(ua)) type = "phone";
  let browser = "";
  if (/SamsungBrowser/.test(ua)) browser = "Samsung Internet";
  else if (/Edg(e|A|iOS)?\//.test(ua)) browser = "Edge";
  else if (/OPR\/|OPiOS|Opera/.test(ua)) browser = "Opera";
  else if (/Firefox|FxiOS/.test(ua)) browser = "Firefox";
  else if (/Chrome|CriOS|Chromium/.test(ua)) browser = "Chrome";
  else if (/Safari/.test(ua)) browser = "Safari";
  let installed = false;
  try {
    installed = navigator.standalone === true ||
      ["standalone", "fullscreen", "minimal-ui"].some(m => window.matchMedia && window.matchMedia("(display-mode: " + m + ")").matches);
  } catch (e) {}
  return { type, os, browser, installed };
}

const Activity = (() => {
  const SEND_MS = 30000, BATCH = 100, MAX_LOCAL = 600, KEEP_MS = 7 * 86400000;
  const LOGIN_GAP = 3600000, ADD_GAP = 3600000, SYNC_ERR_GAP = 600000;
  let who = null, q = [], adds = {}, early = [], timer = null, inflight = null;
  let status = "unknown";              // unknown | ok | missing (script de l'étape 24 pas lancé)
  let deviceDone = false, lastSyncErr = 0;
  function on() { return auth.mode === "supabase"; }
  function usable() { return on() && !!who && !!auth.sbUid && !!Supa.client() && status !== "missing"; }
  function key(part) { return CONFIG.LS_USER_PREFIX + "activity:" + part + ":" + who; }
  function lsGet(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load() {
    const now = Date.now();
    q = arr(lsGet(key("q"), [])).filter(e => e && UUID_RE.test(String(e.id)) && e.kind && now - Date.parse(e.at || 0) < KEEP_MS);
    const a = lsGet(key("adds"), {});
    adds = a && typeof a === "object" && !Array.isArray(a) ? a : {};
  }
  function storeQ() { if (!who) return; if (q.length) lsSet(key("q"), q); else { try { localStorage.removeItem(key("q")); } catch (e) {} } }
  function storeAdds() { if (who) lsSet(key("adds"), adds); }
  // Petites valeurs seulement : nombres, booléens, textes courts.
  function clean(data) {
    const o = {};
    if (!data || typeof data !== "object") return o;
    Object.keys(data).slice(0, 15).forEach(k => {
      const v = data[k];
      if (typeof v === "number" && isFinite(v)) o[k] = Math.round(v * 100) / 100;
      else if (typeof v === "boolean") o[k] = v;
      else if (typeof v === "string") o[k] = v.slice(0, 120);
      else if (k === "by_list" && v && typeof v === "object" && !Array.isArray(v)) {
        // { id de liste: nombre de cartes } (événement session, étape 26) : 30 listes max, jamais de contenu
        const m = {};
        Object.keys(v).slice(0, 30).forEach(id => { const n = v[id]; if (id.length <= 60 && typeof n === "number" && isFinite(n) && n > 0) m[id] = Math.round(n); });
        o[k] = m;
      }
    });
    return o;
  }
  function make(kind, data, at) {
    const d = at ? new Date(at) : new Date();
    return { id: uuid4(), kind, day: todayStr(d), at: d.toISOString(), data: clean(data), device_id: deviceId() };
  }
  function push(ev) {
    q.push(ev);
    if (q.length > MAX_LOCAL) q = q.slice(-MAX_LOCAL);
    storeQ();
  }
  // Enregistre un événement (jamais bloquant, jamais d'erreur). Sans compte ouvert (nouveau PIN obligatoire) : gardé
  // pour le compte qui s'ouvre ensuite.
  function log(kind, data) {
    try {
      if (!on()) return;
      const ev = make(kind, data);
      if (!who) { early.push(ev); if (early.length > 10) early.shift(); return; }
      push(ev);
    } catch (e) {}
  }
  // login : 1 par heure max sur cet appareil.
  function maybeLogin(via) {
    const k = key("login"), last = Number(lsGet(k, 0)) || 0;
    if (Date.now() - last < LOGIN_GAP) return;
    lsSet(k, Date.now());
    log("login", { via: via || "resume", version: APP_VERSION });
  }
  // Cartes ajoutées à la main : un seul événement par liste et par heure.
  function cardsAdded(listId, n) {
    try {
      if (!on() || !who || !listId || !(n > 0)) return;
      const a = adds[listId];
      if (a && Date.now() - a.since < ADD_GAP) a.n += n;
      else {
        if (a) emitAdd(listId);
        const l = getList(listId);
        adds[listId] = { n, since: Date.now(), list: l ? String(l.name).slice(0, 60) : "" };
      }
      storeAdds();
    } catch (e) {}
  }
  function emitAdd(listId) {
    const a = adds[listId];
    delete adds[listId];
    if (a && a.n > 0) push(make("cards_added", { n: a.n, list: a.list }, a.since));
  }
  function emitDueAdds(all) {
    let changed = false;
    Object.keys(adds).forEach(id => { if (all || Date.now() - num(adds[id].since, 0) >= ADD_GAP) { emitAdd(id); changed = true; } });
    if (changed) storeAdds();
  }
  // Erreur de synchro (pas « hors ligne ») : 1 toutes les 10 min max.
  function syncError(msg) {
    if (!on() || !who || Date.now() - lastSyncErr < SYNC_ERR_GAP) return;
    lastSyncErr = Date.now();
    log("sync_error", { msg: String(msg || "").slice(0, 120) });
  }
  function isMissing(e) {
    const code = String((e && e.code) || ""), msg = String((e && (e.message || e.msg)) || "");
    return ["PGRST202", "42883", "PGRST205", "42P01"].includes(code) || /could not find|does not exist|schema cache/i.test(msg);
  }
  // Envoi regroupé (100 par appel). Échec : tout reste dans la file, nouvel essai au prochain passage.
  function flush() {
    if (!usable() || !q.length) return Promise.resolve(false);
    if (inflight) return inflight;
    const u = who, batch = q.slice(0, BATCH), cl = Supa.client();
    inflight = (async () => {
      try {
        const r = await withTimeout(cl.rpc("activity_add", { p_events: batch }), 15000);
        if (r && r.error) throw r.error;
        status = "ok";
        if (who === u) {
          const sent = new Set(batch.map(e => e.id));
          q = q.filter(e => !sent.has(e.id));
          storeQ();
        }
        return true;
      } catch (e) { if (isMissing(e)) status = "missing"; return false; }
    })().then(ok => {
      inflight = null;
      if (ok && who === u && q.length) return flush();
      return ok;
    });
    return inflight;
  }
  async function touchDevice() {
    if (deviceDone || !usable()) return;
    const d = deviceInfo();
    try {
      const r = await withTimeout(Supa.client().rpc("device_touch", {
        p_device: deviceId(), p_type: d.type, p_os: d.os, p_browser: d.browser, p_installed: d.installed,
        p_version: APP_VERSION, p_lang: state.settings.uiLang
      }), 15000);
      if (r && r.error) throw r.error;
      deviceDone = true; status = "ok";
    } catch (e) { if (isMissing(e)) status = "missing"; }
  }
  function tick() { emitDueAdds(false); flush(); }
  // Ouverture d'un compte (après startUserData). via : "pin" | "create" | "resume".
  function start(via) {
    stop();
    if (!on() || !Storage.getUser()) { early = []; return; }
    who = Storage.getUser();
    status = "unknown"; deviceDone = false;
    load();
    early.forEach(push); early = [];
    maybeLogin(via);
    emitDueAdds(false);
    timer = setInterval(tick, SEND_MS);
    touchDevice().then(() => flush());
  }
  function stop() { clearInterval(timer); timer = null; who = null; q = []; adds = {}; }
  // Déconnexion : événement logout, ajouts en attente, envoi (5 s max), puis arrêt. Ce qui n'est pas parti reste
  // sur l'appareil et partira à la prochaine ouverture du même compte.
  async function end() {
    if (!who) return;
    log("logout", {});
    emitDueAdds(true);
    try { await withTimeout(flush(), 5000); } catch (e) {}
    stop();
  }
  // Fin de session de révision (une seule fois par session).
  function session(s, ids, n) {
    try {
      if (!s || s.logged || !ids.length) return;
      s.logged = true;
      const cards = ids.map(id => state.cards.find(c => c.id === id)).filter(Boolean);
      const langs = [...new Set(cards.map(c => cardLangs(c).target))];
      const byList = {};                                 // ids des listes révisées + nombre de cartes (étape 26)
      cards.forEach(c => { byList[c.listId] = (byList[c.listId] || 0) + 1; });
      log("session", {
        mode: s.mode, cards: ids.length, known: n.known, review: n.review, unknown: n.unknown,
        seconds: Math.round((Date.now() - num(s.startedAt, Date.now())) / 1000),
        lists: Object.keys(byList).length, lang: langs.join(","), by_list: byList
      });
    } catch (e) {}
  }
  try {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { emitDueAdds(false); flush(); } });
    window.addEventListener("pagehide", () => { flush(); });
    window.addEventListener("online", () => { if (who) { touchDevice(); flush(); } });
  } catch (e) {}
  return {
    log, cardsAdded, syncError, session, start, end, flush,
    status: () => status, pending: () => q.length, active: () => !!who
  };
})();

// === AMIS ===
// Étape 29. Mode Supabase seulement (script supabase-etape29.sql). Sans le script : l'écran Amis affiche
// « Lancez le script SQL de l'étape 29 », le reste de l'appli marche comme avant. Hors mode Supabase (artifact,
// navigateur sans config.js) : écran Amis avec un message, rien n'est envoyé.
// - Liens entre comptes : table friendships, changée seulement par les fonctions friend_send / friend_accept /
//   friend_decline / friend_cancel / friend_remove / friend_block / friend_unblock ; lecture : my_friends,
//   friend_incoming_count (badge du menu).
// - Résumé public : table user_public_stats (ma ligne seulement), écrite au lancement, après chaque session de
//   révision et au changement de confidentialité (Réglages → Amis). Les amis la lisent par friends_stats et
//   friends_ranking (confidentialité appliquée côté serveur). Jamais d'accès des amis à user_data.
// - Semaine = lundi → dimanche (jours locaux de l'appareil), d'après history.
// - Journal : friend_request, friend_accept, friend_remove, friend_block (data.target = identifiant de l'autre).
const FRIENDS_MAX_PENDING = 20;
const FRIENDS_POLL_MS = 300000;   // badge des demandes reçues : toutes les 5 min (et au retour au premier plan)
const PRIVACY_ORDER = ["streak", "today", "week", "success", "badges", "ranking"];

// Lundi de la semaine du jour day ("YYYY-MM-DD").
function frMonday(day) {
  const [y, m, d] = day.split("-").map(Number);
  const dow = (new Date(y, m - 1, d, 12).getDay() + 6) % 7;   // 0 = lundi
  return skAdd(day, -dow);
}
// Cartes révisées et justes depuis lundi (jours locaux).
function frWeekStats(today) {
  const mon = frMonday(today);
  let cards = 0, correct = 0;
  arr(state.history).forEach(h => {
    if (h && typeof h.date === "string" && h.date >= mon && h.date <= today) {
      cards += num(h.reviewed, 0); correct += num(h.correct, 0);
    }
  });
  return { mon, cards, correct: Math.min(correct, cards) };
}
function frDayLabel(day, opts) {
  try { const [y, m, d] = day.split("-").map(Number); return new Date(y, m - 1, d, 12).toLocaleDateString(state.settings.uiLang, opts || { day: "numeric", month: "short" }); }
  catch (e) { return String(day || ""); }
}

const Friends = (() => {
  let status = "unknown";          // unknown | ok | missing (script de l'étape 29 pas lancé)
  let incoming = 0;                // demandes reçues (badge)
  let data = null, stats = null, ranking = null, loadedAt = 0, loading = false, err = "", token = 0;
  let lastPub = "", pubBusy = null, pollTimer = null;
  const view = { input: "", rankTab: "cards", busy: false };
  function on() { return auth.mode === "supabase" && !!auth.sbUid && !!Supa.client() && !!Storage.getUser(); }
  function isMissing(e) { return alIsMissing(e); }
  async function rpc(name, args) {
    const r = await withTimeout(Supa.client().rpc(name, args || {}), 15000);
    if (r && r.error) throw r.error;
    return r ? r.data : null;
  }
  // Message d'erreur lisible (hint des fonctions SQL).
  function errText(e) {
    const hint = String((e && e.hint) || "");
    if (I18N.fr["am.err." + hint]) return t("am.err." + hint, { m: FRIENDS_MAX_PENDING });
    if (isMissing(e)) return t("am.missing");
    if (sbErrKind(e) === "net") return t("am.err.net");
    if (String((e && e.code) || "") === "42501" || /compte bloqué/i.test(String((e && e.message) || ""))) return t("am.err.account_blocked");
    return t("am.err.other");
  }

  // --- Résumé public (user_public_stats) ---
  function publicRow() {
    const today = todayStr(), s = Streak.data(), w = frWeekStats(today);
    return {
      user_id: auth.sbUid,
      streak: clampInt(s.current, 0, 100000, 0), best: clampInt(Math.max(s.best, s.current), 0, 100000, 0),
      last_valid_day: s.lastValidDay || null, freezes: clampInt(s.freezes, 0, 2, 0),
      badges: STREAK_BADGES.filter(b => s.badges.some(x => x.days === b)),
      daily_goal: Streak.goal(),
      today_day: today, today_done: Streak.doneToday(),
      week_start: w.mon, week_cards: Math.min(w.cards, 1000000), week_correct: Math.min(w.correct, w.cards, 1000000),

  }
  // Écrit ma ligne (rien si elle n'a pas changé depuis la dernière écriture réussie). Jamais d'erreur visible.
  function publish(force) {
    if (!on() || status === "missing") return Promise.resolve(false);
    if (pubBusy) return pubBusy.then(() => publish(force));
    const row = publicRow(), key = JSON.stringify(row);
    if (!force && key === lastPub) return Promise.resolve(true);
    pubBusy = (async () => {
      try {
        const r = await withTimeout(Supa.client().from("user_public_stats").upsert(row, { onConflict: "user_id" }), 15000);
        if (r && r.error) throw r.error;
        lastPub = key; status = "ok";
        return true;
      } catch (e) { if (isMissing(e)) status = "missing"; return false; }
    })();
    return pubBusy.finally(() => { pubBusy = null; });
  }

  // --- Badge du menu : demandes reçues ---
  async function refreshBadge() {
    if (!on()) { incoming = 0; renderBadge(); return; }
    try { incoming = num(Number(await rpc("friend_incoming_count")), 0); status = "ok"; }
    catch (e) { if (isMissing(e)) { status = "missing"; incoming = 0; } }
    renderBadge();
  }
  function renderBadge() {
    const b = $("#friendsBadge");
    if (!b) return;
    const n = on() ? incoming : 0;
    b.hidden = !n;
    b.textContent = n > 99 ? "99+" : String(n);
  }

  // --- Écran Amis : chargement ---
  async function load() {
    if (!on()) return;
    const my = ++token;
    loading = true; err = "";
    if (currentScreen === "friends") renderFriends();
    await publish(false);   // mes chiffres à jour avant le classement
    try {
      const today = todayStr();
      const [d, s, r] = await Promise.all([rpc("my_friends"), rpc("friends_stats", { p_today: today }), rpc("friends_ranking", { p_today: today })]);
      if (my !== token) return;
      data = d || { incoming: [], outgoing: [], friends: [], blocked: [] };
      stats = arr(s); ranking = r || null; status = "ok"; loadedAt = Date.now();
      incoming = arr(data.incoming).length;
    } catch (e) {
      if (my !== token) return;
      if (isMissing(e)) status = "missing";
      err = errText(e);
    }
    loading = false;
    renderBadge();
    if (currentScreen === "friends") renderFriends();
  }
  function needLoad() { return on() && !loading && (!data || Date.now() - loadedAt > 30000); }

  // --- Actions ---
  async function act(fn, okText, logKind, after) {
    if (view.busy) return;
    view.busy = true;
    if (currentScreen === "friends") renderFriends();
    try {
      const r = await fn();
      if (logKind) Activity.log(logKind, { target: String((r && r.identifiant) || "").slice(0, 40) });
      if (okText) toast(typeof okText === "function" ? okText(r) : okText);
      if (after) after(r);
    } catch (e) {
      toast(errText(e));
    }
    view.busy = false;
    await load();
  }
  function send() {
    const id = normId(view.input);
    if (!validId(id)) { toast(t("am.err.notfound")); return; }
    if (id === Storage.getUser()) { toast(t("am.err.self")); return; }
    act(() => rpc("friend_send", { p_identifiant: id }),
      r => t(r && r.result === "accepted" ? "am.nowFriends" : "am.sent", { id: (r && r.identifiant) || id }),
      null,
      r => { view.input = ""; Activity.log(r && r.result === "accepted" ? "friend_accept" : "friend_request", { target: (r && r.identifiant) || id }); });
  }
  function accept(x) { act(() => rpc("friend_accept", { p_id: x.id }), t("am.accepted", { id: x.identifiant }), "friend_accept"); }
  function decline(x) { act(() => rpc("friend_decline", { p_id: x.id }), t("am.declined", { id: x.identifiant })); }
  function cancel(x) { act(() => rpc("friend_cancel", { p_id: x.id }), t("am.canceled", { id: x.identifiant })); }
  function remove(x) {
    openModal(t("am.remove"), el("p", null, t("am.removeAsk", { id: x.identifiant })), [
      { label: t("cancel") },
      { label: t("am.remove"), kind: "danger", onClick: () => { act(() => rpc("friend_remove", { p_user: x.user_id }), t("am.removed", { id: x.identifiant }), "friend_remove"); } }
    ]);
  }
  function block(x) {
    openModal(t("am.block"), el("p", null, t("am.blockAsk", { id: x.identifiant })), [
      { label: t("cancel") },
      { label: t("am.block"), kind: "danger", onClick: () => { act(() => rpc("friend_block", { p_user: x.user_id }), t("am.blocked", { id: x.identifiant }), "friend_block"); } }
    ]);
  }
  function unblock(x) { act(() => rpc("friend_unblock", { p_user: x.user_id }), t("am.unblocked", { id: x.identifiant })); }

  // --- Lancement / arrêt ---
  function start() {
    stop();
    if (!on()) return;
    status = "unknown";
    publish(true).then(() => refreshBadge());
    pollTimer = setInterval(() => { if (on() && document.visibilityState !== "hidden") refreshBadge(); }, FRIENDS_POLL_MS);
  }
  function stop() { clearInterval(pollTimer); pollTimer = null; }
  function reset() {
    stop(); token++;
    status = "unknown"; incoming = 0; data = null; stats = null; ranking = null; loadedAt = 0; loading = false; err = "";
    lastPub = ""; view.input = ""; view.rankTab = "cards"; view.busy = false;
    renderBadge();
  }
  try {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && on() && pollTimer) refreshBadge(); });
  } catch (e) {}
  return {
    on, publish, refreshBadge, renderBadge, load, needLoad, start, reset,
    send, accept, decline, cancel, remove, block, unblock, view,
    status: () => status, data: () => data, stats: () => stats, ranking: () => ranking, loading: () => loading, err: () => err
  };
})();

// === MISE À JOUR DES LISTES ===
// « Mettre à jour » une liste, un dossier ou tout (scope = { kind: "list"|"folder"|"all", id }).
// 1. Analyse : rien n'est modifié, bilan par catégorie avec le nombre de cartes concernées.
// 2. Cases à cocher, puis « Lancer » : complétion / vérification existantes (lots de 20, Pause, reprise depuis
//    les Réglages), toutes les propositions vont dans « À valider », ouvert filtré sur la liste ou le dossier.
// Catégories : "tr:<code>" (traduction manquante), "pos" (nature manquante + noms sans genre), "example",
//   "pending" (propositions en attente ou champs « auto »), "verify" (cartes jamais vérifiées ou modifiées depuis),
//   "dup" (doublons), "legacy" (cartes à l'ancien format, normalement aucune : migration au lancement).
// Badge « N à compléter » (listes et dossiers) = cartes avec un champ vide ou un nom sans genre, recalculé à chaque affichage.

// Trous d'une carte : champs vides (langues d'appui, exemple, natures) + noms sans genre.
function gapFields(c, lg) {
  lg = lg || cardLangs(c);
  return fillFields(c, lg).filter(f => !fieldVal(c, f).trim()).concat(genderFields(c, lg));
}
function listGapCount(l) { const lg = listLangs(l); return cardsOf(l.id).filter(c => gapFields(c, lg).length).length; }
function folderGapCount(f) { return listsIn(f.id).reduce((n, l) => n + listGapCount(l), 0); }
function updBadge(n) { return n ? el("span", "upd-badge", t("upd.badge", { n })) : null; }
function updDate(ts) {
  if (!ts) return t("upd.never");
  try { return t("upd.last", { d: new Date(ts).toLocaleDateString(state.settings.uiLang) }); } catch (e) { return t("upd.never"); }
}

// Mise à jour (traductions, nature, exemple, vérification, doublons) : cartes de vocabulaire seulement.
function updScopeCards(scope) {
  if (scope.kind === "list") return getList(scope.id) ? cardsOf(scope.id).filter(isVocab) : [];
  if (scope.kind === "folder") { const f = getFolder(scope.id); return f ? cardsUnder("folder", f).filter(isVocab) : []; }
  return state.cards.filter(isVocab);
}
function updScopeObj(scope) { return scope.kind === "list" ? getList(scope.id) : scope.kind === "folder" ? getFolder(scope.id) : null; }
// Ancien format (la migration v1 → v2 est faite au lancement : normalement aucune).
function isLegacyCard(c) { return !c.terms || typeof c.terms !== "object" || !c.pos || typeof c.pos !== "object" || !Array.isArray(c.auto); }

// Analyse sans rien modifier.
function analyzeUpdate(cards) {
  const lgs = new Map();
  const L = c => { let x = lgs.get(c.listId); if (!x) { x = cardLangs(c); lgs.set(c.listId, x); } return x; };
  const pend = new Set(state.proposals.map(p => p.cardId));
  const a = { total: cards.length, tr: {}, pos: 0, gender: 0, genderLangs: new Set(), example: 0, pending: 0, verify: 0, dup: 0, legacy: 0 };
  cards.forEach(c => {
    if (isLegacyCard(c)) { a.legacy++; return; }
    const lg = L(c);
    lg.support.forEach(code => { if (!(code in a.tr)) a.tr[code] = 0; if (!term(c, code).trim()) a.tr[code]++; });
    const g = genderFields(c, lg);
    g.forEach(f => a.genderLangs.add(f.slice(4)));
    if (g.length || posFields(lg).some(f => !fieldVal(c, f).trim())) a.pos++;
    if (g.length) a.gender++;
    if (!String(c.example || "").trim()) a.example++;
    if (pend.has(c.id) || c.auto.length) a.pending++;
    if (state.checkedSig[c.id] !== cardSig(c)) a.verify++;
  });
  dupGroups(cards).forEach(g => { if (g.length > 1) a.dup += g.length - 1; });
  return a;
}

// Champs demandés à Claude pour une carte, selon les catégories cochées.
function updWant(cats) {
  return c => {
    const lg = cardLangs(c), out = [];
    lg.support.forEach(code => { if (cats.includes("tr:" + code) && !term(c, code).trim()) out.push(code); });
    if (cats.includes("example") && !String(c.example || "").trim()) out.push("example");
    if (cats.includes("pos")) posFields(lg).forEach(f => { if (!fieldVal(c, f).trim() || posNeedsGender(c, f.slice(4))) out.push(f); });
    return out;
  };
}

// Reprise (Réglages) d'une complétion mise en pause pendant une mise à jour : mêmes catégories.
// Gardé sur cet appareil (localStorage), à côté de state.aiResume.
function updResumeKey() { return CONFIG.LS_USER_PREFIX + "updResume:" + (Storage.getUser() || ""); }
function updResumeCats() {
  try { const r = JSON.parse(localStorage.getItem(updResumeKey()) || "null"); return state.aiResume && r && Array.isArray(r.cats) ? r.cats : null; }
