// Chaque carte a un champ type. Tous les types passent par le même Leitner, les mêmes listes, dossiers, stats et « À valider ».
//   vocab : vocabulaire (terms, pos, example)
//   conj  : conjugaison, une forme par carte (lang, verb, tense, person, answer, translation, note)
//   cloze : texte à trous (lang, sentence avec ___, answer, hint, explanation, translation, ruleId)
//   fix   : corriger l'erreur (lang, wrong, correct, explanation, ruleId)
//   rule  : fiche de règle (lang, title, body, examples [liste], translation)
// lang = langue apprise de la liste au moment de la création. Plusieurs réponses acceptées avec "/" (conj, cloze).
// Toutes les cartes gardent terms / pos / example (vides hors vocabulaire) : le code commun ne plante jamais.
const CARD_TYPES = ["vocab", "conj", "cloze", "fix", "rule"];
const TYPE_FIELDS = {
  conj: ["lang", "verb", "tense", "person", "answer", "translation", "note"],
  cloze: ["lang", "sentence", "answer", "hint", "explanation", "translation", "ruleId"],
  fix: ["lang", "wrong", "correct", "explanation", "ruleId"],
  rule: ["lang", "title", "body", "translation"]           // + examples (liste)
};
const TYPE_ICON = { vocab: "Aa", conj: "⇄", cloze: "▁", fix: "✎", rule: "§" };
const CLOZE_GAP = /_{2,}/;

function cardType(c) { return c && CARD_TYPES.includes(c.type) ? c.type : "vocab"; }
function isVocab(c) { return cardType(c) === "vocab"; }
// Langue du contenu de la carte (langue apprise) : champ lang hors vocabulaire, sinon langue apprise de la liste.
function cardLang(c) { return !isVocab(c) && isLang(c.lang) ? c.lang : cardLangs(c).target; }
function splitAlts(s) { return String(s || "").split("/").map(x => x.trim()).filter(Boolean); }
function uiOf() { return (state && state.settings && state.settings.uiLang) || "fr"; }
// Texte simple, ou { fr, ko, en } (pris dans la langue de l'interface).
function locText(v, ui) {
  if (v == null) return "";
  if (typeof v !== "object") return String(v);
  ui = ui || uiOf();
  return v[ui] || v.fr || v.en || Object.values(v)[0] || "";
}

// --- Grammaire (lue dans LANGUAGES[x].grammar) ---
function grammarOf(lng) { return (LANGUAGES[lng] && LANGUAGES[lng].grammar) || { tenses: [], persons: [] }; }
function tensesOf(lng) { return arr(grammarOf(lng).tenses); }
function tenseOf(lng, id) { return tensesOf(lng).find(x => x.id === id) || null; }
function personsOf(lng, tenseId) {
  const g = grammarOf(lng), tn = tenseOf(lng, tenseId);
  if (tn && Array.isArray(tn.persons)) return tn.persons;
  if (tn && typeof tn.persons === "string") return arr((g.personSets || {})[tn.persons]);
  return arr(g.persons);
}
function tenseName(lng, id) { const x = tenseOf(lng, id); return x ? locText(x.names) : String(id || ""); }
function personLabel(lng, tenseId, pid) {
  const p = personsOf(lng, tenseId).find(x => x.id === pid);
  if (!p) return String(pid || "");
  const n = p.names ? (p.names[uiOf()] || "") : "";
  return locText(p.label) + (n ? " (" + n + ")" : "");
}
function conjPerson(c) { return personsOf(c.lang, c.tense).find(x => x.id === c.person) || null; }
// Forme affichée avec le pronom (« nous irons ») ; telle quelle si la personne n'a pas de pronom (coréen, verbes irréguliers…).
function conjFull(c, form) {
  const f = form == null ? (splitAlts(c.answer)[0] || "") : form;
  const p = conjPerson(c), g = grammarOf(c.lang);
  if (!p || !p.pronoun || !f) return f;
  return typeof g.join === "function" ? g.join(f, p, tenseOf(c.lang, c.tense)) : p.pronoun + " " + f;
}
// Reconnaissance d'un temps / d'une personne saisis (import) : id, ou nom dans n'importe quelle langue d'interface.
function gKey(s) { return normText(s).replace(/\([^)]*\)/g, "").replace(/[\s.'’_-]+/g, ""); }
function gKeys(v) {
  const out = [];
  const add = x => { if (x == null) return; if (typeof x === "object") Object.values(x).forEach(add); else { out.push(gKey(x)); out.push(normText(x).replace(/[\s.'’_()-]+/g, "")); } };
  add(v);
  return out.filter(Boolean);
}
function findTense(lng, raw) {
  const k = gKey(raw), k2 = normText(raw).replace(/[\s.'’_()-]+/g, "");
  if (!k && !k2) return null;
  return tensesOf(lng).find(x => gKeys([x.id, x.names]).some(n => n === k || n === k2)) || null;
}
function findPerson(lng, tenseId, raw) {
  const k = normText(raw).replace(/[\s.'’_()-]+/g, "");
  if (!k) return null;
  const ps = personsOf(lng, tenseId);
  if (/^[1-9]$/.test(k) && ps[+k - 1]) return ps[+k - 1];          // numéro dans l'ordre des personnes
  return ps.find(p => gKeys([p.id, p.label, p.names, p.pronoun]).includes(k))
    || ps.find(p => [p.pronoun, typeof p.label === "string" ? p.label : ""].some(x => String(x || "").split("/").some(y => gKey(y) === k)))
    || null;
}

// --- Modèle ---
function normTypedFields(type, c) {
  const out = {};
  (TYPE_FIELDS[type] || []).forEach(f => { out[f] = c[f] == null ? "" : String(c[f]).trim(); });
  if (type === "rule") out.examples = arr(c.examples).map(x => String(x).trim()).filter(Boolean);
  return out;
}
function newTypedCard(listId, type, fields, tags) {
  return Object.assign(newCard(listId, {}, "", tags || []), normTypedFields(type, fields || {}), { type });
}
function cardHasContent(c) {
  if (isVocab(c)) return Object.keys(c.terms || {}).length > 0;
  return (TYPE_FIELDS[c.type] || []).some(f => f !== "lang" && String(c[f] || "").trim()) || arr(c.examples).length > 0;
}
// Carte utilisable en révision (hors vocabulaire) : champs indispensables remplis, temps et personne connus.
function typedUsable(c) {
  if (!isLang(c.lang)) return false;
  switch (c.type) {
    case "conj": return !!(c.verb && splitAlts(c.answer).length && tenseOf(c.lang, c.tense) && conjPerson(c));
    case "cloze": return CLOZE_GAP.test(c.sentence || "") && splitAlts(c.answer).length > 0;
    case "fix": return !!(c.wrong && c.correct);
    case "rule": return !!(c.title && (c.body || arr(c.examples).length));
  }
  return false;
}
function ruleOf(c) {
  const r = c && c.ruleId ? state.cards.find(x => x.id === c.ruleId) : null;
  return r && cardType(r) === "rule" ? r : null;
}
function clozeShow(sentence, fill) { return String(sentence || "").replace(CLOZE_GAP, fill); }

// --- Textes courts (listes, résumé, stats) ---
function cardTitle(c) {
  switch (cardType(c)) {
    case "conj": return c.verb + " — " + tenseName(c.lang, c.tense) + " — " + personLabel(c.lang, c.tense, c.person);
    case "cloze": return clozeShow(c.sentence, "___");
    case "fix": return c.wrong;
    case "rule": return c.title;
  }
  return targetTerm(c) || "—";
}
function cardSubtitle(c) {
  switch (cardType(c)) {
    case "conj": return [conjFull(c), c.translation].filter(Boolean).join(" · ");
    case "cloze": return clozeShow(c.sentence, splitAlts(c.answer)[0] || "___");
    case "fix": return c.correct;
    case "rule": return String(c.body || "").split("\n").map(x => x.replace(/\*\*/g, "").replace(/^\s*-\s*/, "")).filter(Boolean).join(" · ");
  }
  return supportText(c);
}
function typeBadge(type) { return el("span", "type-badge tb-" + type, TYPE_ICON[type] + " " + t("type." + type)); }
// Texte de recherche (écran Listes)
function cardSearchText(c) {
  if (isVocab(c)) return Object.values(c.terms).concat([c.example]).join(" ");
  return (TYPE_FIELDS[c.type] || []).filter(f => !["lang", "ruleId"].includes(f)).map(f => c[f]).concat(arr(c.examples)).join(" ");
}

// --- Affichage ---
// Corps de règle : texte court ; **gras** et lignes « - … » (liste) autorisés. Construit sans innerHTML.
function richLine(parent, s) {
  String(s).split(/\*\*(.+?)\*\*/).forEach((part, i) => { if (part) parent.appendChild(i % 2 ? el("b", null, part) : document.createTextNode(part)); });
}
function ruleBodyNode(body, lng) {
  const d = el("div", "ty-rbody");
  d.lang = lng || "";
  let ul = null;
  String(body || "").split("\n").forEach(line => {
    const m = line.match(/^\s*[-•]\s+(.*)$/);
    if (m) { if (!ul) { ul = el("ul"); d.appendChild(ul); } const li = el("li"); richLine(li, m[1]); ul.appendChild(li); }
    else if (line.trim()) { ul = null; const p = el("p"); richLine(p, line.trim()); d.appendChild(p); }
  });
  return d;
}
function tyLine(cls, text, lng) { const d = el("div", "ty-line " + (cls || ""), text); if (lng) d.lang = lng; return d; }
function tyLabeled(label, text, lng) {
  const d = el("div", "ty-line");
  d.appendChild(el("span", "ty-lbl", label + " "));
  const s = el("span", null, text); if (lng) s.lang = lng;
  d.appendChild(s);
  return d;
}
// Bouton dans une face de carte : ne retourne pas / ne fait pas glisser la carte.
function faceBtn(label, onClick) {
  const b = el("button", "link-btn ty-btn", label);
  b.type = "button";
  const stop = e => e.stopPropagation();
  b.addEventListener("pointerdown", stop);
  b.addEventListener("pointerup", stop);
  b.addEventListener("keydown", stop);
  b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return b;
}
// Phrase à trous : trou visible (question) ou réponse surlignée (réponse).
function clozeNode(cls, c, fill) {
  const d = el("div", cls); d.lang = c.lang;
  const parts = String(c.sentence || "").split(CLOZE_GAP);
  parts.forEach((p, i) => {
    if (p) d.appendChild(document.createTextNode(p));
    if (i < parts.length - 1) d.appendChild(fill ? el("mark", "ty-fill", fill) : el("span", "ty-gap", "＿＿＿"));
  });
  return d;
}
// Phrase corrigée avec les différences surlignées, et la phrase fautive avec les erreurs barrées.
function fixDiffNodes(c) {
  const r = wrLcs(c.wrong, c.correct);
  const good = wrDiffNode(r.B, r.mb, "wr-miss"); good.classList.add("ty-sent"); good.lang = c.lang;
  const bad = wrDiffNode(r.A, r.ma, "wr-bad"); bad.classList.add("ty-wrong"); bad.lang = c.lang;
  return { good, bad };
}
function ruleBtn(c) { const r = ruleOf(c); return r ? faceBtn(t("type.seeRule"), () => openRuleModal(r)) : null; }

// Faces question / réponse d'une carte hors vocabulaire (même forme que cardFaces) :
//   { lang (titre), main (texte), lng, items (lecture audio), mainNode() (affichage riche), extras() (nœuds en plus), noSub, long }
// Le sens de révision est ignoré pour ces types.
function typedFaces(c) {
  const L = c.lang, lg = cardLangs(c);
  const head = t("type." + c.type) + " · " + langName(L);
  const say = text => text ? [{ text, lng: L }] : [];
  let q = {}, a = {};
  if (c.type === "conj") {
    const full = conjFull(c);
    const info = tenseName(L, c.tense) + " — " + personLabel(L, c.tense, c.person);
    q = { main: c.verb, items: say(c.verb), extras: () => [tyLine("ty-big", info)] };
    a = { main: full, items: say(full), extras: () => [
      tyLine("", c.verb + " — " + info, L),
      splitAlts(c.answer).length > 1 ? tyLine("", t("type.alsoOk", { a: splitAlts(c.answer).join(" / ") }), L) : null,
      c.translation ? tyLine("ty-tr", c.translation) : null,
      c.note ? tyLine("ty-note", c.note) : null,
      faceBtn(t("type.seeTable"), () => openConjTable(c))
    ] };
  } else if (c.type === "cloze") {
    const ans = splitAlts(c.answer);
    q = { main: clozeShow(c.sentence, "…"), items: say(clozeShow(c.sentence, "…")), mainNode: cls => clozeNode(cls, c, null),
      extras: () => [c.hint ? tyLabeled(t("type.hint"), c.hint) : null] };
    a = { main: clozeShow(c.sentence, ans[0] || ""), items: say(clozeShow(c.sentence, ans[0] || "")), mainNode: cls => clozeNode(cls, c, ans[0] || ""),
      extras: () => [
        ans.length > 1 ? tyLine("", t("type.alsoOk", { a: ans.join(" / ") }), L) : null,
        c.explanation ? tyLine("ty-expl", c.explanation) : null,
        c.translation ? tyLine("ty-tr", c.translation) : null,
        ruleBtn(c)
      ] };
  } else if (c.type === "fix") {
    q = { main: c.wrong, items: say(c.wrong), extras: () => [tyLine("ty-big", t("type.fixQ"))] };
    a = { main: c.correct, items: say(c.correct), mainNode: cls => { const n = fixDiffNodes(c).good; n.classList.add(cls); return n; },
      extras: () => [fixDiffNodes(c).bad, c.explanation ? tyLine("ty-expl", c.explanation) : null, ruleBtn(c)] };
  } else {
    q = { main: c.title, items: say(c.title), extras: () => [tyLine("ty-big", t("type.ruleQ"))] };
    a = { main: c.title, items: say(arr(c.examples).join(". ")), long: true, extras: () => {
      const out = [ruleBodyNode(c.body, "")];
      if (arr(c.examples).length) { const ul = el("ul", "ty-ex"); ul.lang = L; c.examples.forEach(x => ul.appendChild(el("li", null, x))); out.push(ul); }
      if (c.translation) out.push(tyLine("ty-tr", c.translation));
      return out;
    } };
  }
  const base = { lang: head, lng: L, sub: "", subLng: "", noSub: true };
  return { q: Object.assign({}, base, q), a: Object.assign({}, base, a), target: L, lg: { target: L, support: lg.support }, typed: true };
}
// Nœuds en plus d'une face (null retirés).
function faceExtras(f) { return f && f.extras ? f.extras().filter(Boolean) : []; }

// « Voir le tableau » : toutes les cartes du même verbe + temps (même langue), dans l'ordre des personnes.
function conjSiblings(c) {
  const v = normText(c.verb);
  return state.cards.filter(x => cardType(x) === "conj" && x.lang === c.lang && x.tense === c.tense && normText(x.verb) === v)
    .sort((a, b) => (a.listId === c.listId ? 0 : 1) - (b.listId === c.listId ? 0 : 1));
}
function openConjTable(c) {
  const sib = conjSiblings(c);
  const wrap = el("div");
  wrap.appendChild(tyLine("ty-big", tenseName(c.lang, c.tense)));
  const tr0 = sib.map(x => x.translation).find(Boolean);
  if (tr0) wrap.appendChild(tyLine("ty-tr", tr0));
  const tb = el("table", "ty-table");
  personsOf(c.lang, c.tense).forEach(p => {
    const x = sib.find(y => y.person === p.id);
    const tr = el("tr", x && x.id === c.id ? "cur" : null);
    tr.append(el("td", "muted", personLabel(c.lang, c.tense, p.id)));
    const td = el("td", null, x ? conjFull(x) : "—"); td.lang = c.lang;
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  wrap.appendChild(tb);
  const notes = [...new Set(sib.map(x => x.note).filter(Boolean))];
  if (notes.length) wrap.appendChild(tyLine("ty-note", notes.join(" · ")));
  openModal(c.verb, wrap, [{ label: t("close"), kind: "primary" }]);
}
// « Voir la règle »
function openRuleModal(r) {
  const wrap = el("div");
  wrap.appendChild(ruleBodyNode(r.body, ""));
  if (arr(r.examples).length) { const ul = el("ul", "ty-ex"); ul.lang = r.lang; r.examples.forEach(x => ul.appendChild(el("li", null, x))); wrap.appendChild(ul); }
  if (r.translation) wrap.appendChild(tyLine("ty-tr", r.translation));
  openModal(r.title, wrap, [{ label: t("close"), kind: "primary" }]);
}

// Réponses acceptées en mode Écrit (hors vocabulaire) : [{ text, lng, sentence? }].
// conj : la forme seule ou avec le pronom ; cloze : le mot manquant ; fix : la phrase corrigée entière.
function typedAlts(c) {
  const out = [], add = (text, sentence) => { if (text && !out.some(x => x.text === text)) out.push({ text: wrClean(text), lng: c.lang, sentence: !!sentence }); };
  if (c.type === "conj") splitAlts(c.answer).forEach(x => { add(x); add(conjFull(c, x)); });
  else if (c.type === "cloze") splitAlts(c.answer).forEach(x => add(x));
  else if (c.type === "fix") add(c.correct, true);
  return out;
}

// === DEMO ===
// Liste « Démo » d'un nouveau compte, dans sa langue apprise par défaut : tout vient de LANGUAGES[langue].demo.
// Mots : traductions prises dans les mots de même key des autres langues ; phrase d'exemple dans la langue apprise.
// Autres types : textes { fr, ko, en } pris dans la 1re langue d'appui qui les a (traductions : toutes les langues d'appui).
function addDemoList(data) {
  const lg = resolveLangs([{ target: data.settings.defaultTarget, support: data.settings.defaultSupport }]);
  const D = (LANGUAGES[lg.target] && LANGUAGES[lg.target].demo) || {};
  const list = { id: uid(), name: "Démo", folderId: null, order: nextOrder(data.lists.filter(l => !l.folderId)), createdAt: Date.now() };
  data.lists.push(list);
  arr(D.words).forEach(w => {
    const terms = {}, pos = {};
    LANG_CODES.forEach(code => {
      const x = arr((LANGUAGES[code].demo || {}).words).find(y => y.key === w.key);
      if (x) { terms[code] = x.term; if (x.pos) pos[code] = x.pos; }
    });
    data.cards.push(newCard(list.id, terms, w.ex || "", arr(w.tags).slice(), pos));
  });
  const order = lg.support.concat([lg.target]);
  const one = v => (v && typeof v === "object") ? (order.map(k => v[k]).find(Boolean) || locText(v, data.settings.uiLang)) : String(v || "");
  const all = v => (v && typeof v === "object") ? lg.support.map(k => v[k]).filter(Boolean).join(" / ") : String(v || "");
  const rules = {};
  const cards = arr(D.cards);
  cards.filter(x => x.type === "rule").concat(cards.filter(x => x.type !== "rule")).forEach(x => {
    const base = { lang: lg.target };
    if (x.type === "rule") {
      const c = newTypedCard(list.id, "rule", Object.assign(base, { title: x.title, body: one(x.body), examples: x.examples, translation: all(x.translation) }));
      rules[x.key] = c.id; data.cards.push(c);
    } else if (x.type === "conjtab") {
      personsOf(lg.target, x.tense).forEach((p, i) => {
        if (!x.forms[i]) return;
        data.cards.push(newTypedCard(list.id, "conj", Object.assign({}, base, { verb: x.verb, tense: x.tense, person: p.id, answer: x.forms[i],
          translation: all(x.translation), note: one(x.note) })));
      });
    } else if (x.type === "cloze") {
      data.cards.push(newTypedCard(list.id, "cloze", Object.assign(base, { sentence: x.sentence, answer: x.answer, hint: one(x.hint),
        explanation: one(x.explanation), translation: all(x.translation), ruleId: rules[x.ruleKey] || "" })));
    } else if (x.type === "fix") {
      data.cards.push(newTypedCard(list.id, "fix", Object.assign(base, { wrong: x.wrong, correct: x.correct,
        explanation: one(x.explanation), ruleId: rules[x.ruleKey] || "" })));
    }
  });
  return data;
}
// Exemple de saisie pour un champ de mot (éditeur de carte) : 3e mot de la démo de cette langue.
function langSample(code) { const w = arr((LANGUAGES[code] && LANGUAGES[code].demo || {}).words); return (w[2] || w[0] || {}).term || ""; }

// === STORAGE ===
// Couche d'accès unique. Données du compte connecté (<id> = identifiant de l'appli) découpées en morceaux :
//   user:<id>:index                 { v: 2, updatedAt, keys: [...] } — liste des morceaux, écrit en dernier
//   user:<id>:settings              { version (modèle de données), settings, updatedAt, rejected, lastCheckAt, aiResume: { kind, total } }
//   user:<id>:folders / :lists / :history
//   user:<id>:proposals:<n>         propositions « À valider » (500 max par morceau)
//   user:<id>:cards:<listId>:<n>    { cards: [200 max], sig: { idCarte: empreinte vérifiée } }
//   user:<id>:resume:<n>            ids des cartes restant à compléter (complétion en pause, 2000 max par morceau)
// Seuls les morceaux modifiés sont écrits (comparaison avec ce qui a déjà été écrit).
//  - local : localStorage "vocabfr." + clé (écriture tout-ou-rien : en cas d'échec, les morceaux déjà écrits sont restaurés)
//  - cloud : document data/users/<idClaude>/<clé> = { json, updatedAt } (adaptateur claudeDbBackend)
//  - Supabase (si config.js est rempli) : table user_data, une ligne par morceau, clé primaire (user_id, key),
//    clé sans le préfixe "user:<id>:" — adaptateur supabaseBackend, voir supabase.sql
// Conflits : localStorage "vocabfr.synced:<id>" = updatedAt des données en ligne à la dernière synchro réussie.
// Avant chaque envoi, l'index en ligne est relu : s'il a changé depuis (autre appareil), on demande quelles données garder.
// Envoi raté : données gardées sur l'appareil, nouvel essai automatique (CONFIG.RETRY_MS, et au retour de la connexion).
// Ancien format (un seul bloc) : localStorage "vocabfr.user:<id>" + document "user:<id>". Migré automatiquement,
// après un export JSON de sécurité. Le document cloud ancien n'est jamais effacé ; la clé locale ancienne
// est retirée seulement après relecture réussie du nouveau format.
// Registre des comptes : localStorage "vocabfr.accounts" + document data/users/<idClaude>/accounts.
// Anciennes données (avant les comptes) : "vocabfr.data.v1" + data/users/<idClaude>/state, lues pour la migration, jamais effacées.

// Adaptateur cloud de l'artifact : get(clé) → texte JSON ou undefined ; set(clé, json, updatedAt) ; del(clé).
function claudeDbBackend(db, base) {
  return {
    async get(key) {
      const snap = await withTimeout(db.doc(base + "/" + key).get(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!snap.exists) return undefined;
      const body = snap.data();
      return body && typeof body.json === "string" ? body.json : undefined;
    },
    async set(key, json, updatedAt) { await withTimeout(db.doc(base + "/" + key).set({ json, updatedAt }), CONFIG.REMOTE_TIMEOUT_MS); },
    async del(key) { await withTimeout(db.doc(base + "/" + key).delete(), CONFIG.REMOTE_TIMEOUT_MS); }
  };
}
// Adaptateur Supabase : table user_data (user_id, key, data jsonb, updated_at), RLS = chacun ses lignes (admin : toutes).
// La clé y est stockée sans le préfixe "user:<id>:". uid = auth.uid() de l'utilisateur connecté.
// updated_at est mis par le serveur (trigger). jsonb ne garde pas l'ordre des champs : voir markSynced().
function supabaseBackend(client, uid, prefix) {
  const k = key => key.startsWith(prefix) ? key.slice(prefix.length) : key;
  const ok = r => { if (r && r.error) throw r.error; return r ? r.data : null; };
  const T = CONFIG.REMOTE_TIMEOUT_MS;
  return {
    async get(key) {
      const d = ok(await withTimeout(client.from("user_data").select("data").eq("user_id", uid).eq("key", k(key)).maybeSingle(), T));
      return d ? JSON.stringify(d.data) : undefined;
    },
    // Toutes les lignes du compte en une requête : Map(clé avec préfixe → texte JSON).
    async getAll() {
      const rows = ok(await withTimeout(client.from("user_data").select("key,data").eq("user_id", uid), T * 3));
      return new Map(arr(rows).map(r => [prefix + r.key, JSON.stringify(r.data)]));
    },
    async set(key, json) {
      ok(await withTimeout(client.from("user_data").upsert({ user_id: uid, key: k(key), data: JSON.parse(json) }), T));
    },
    async del(key) {
      ok(await withTimeout(client.from("user_data").delete().eq("user_id", uid).eq("key", k(key)), T));
    }
  };
}

const Storage = (() => {
  let db = null, base = null;  // base = "data/users/<idClaude>" quand le cloud est disponible
  let backend = null;          // adaptateur cloud de l'artifact (null = pas de cloud Claude)
  let sb = null;               // client Supabase (null = pas de Supabase)
  let userId = null, remote = null; // remote = adaptateur du compte connecté
  let remoteOk = false;        // données en ligne lues et comparées : les envois sont permis
  let mode = "local";          // "local" | "cloud" | "syncing" | "offline" | "error"
  let retryTimer = null, failWarned = false, conflictOpen = false;
  let onConflictFn = null, onRetryInitFn = null;
  let timer = null, lastData = null, held = false;
  let chain = Promise.resolve();
  let localSaved = new Map();  // clé → JSON déjà présent dans localStorage
  let remoteSaved = new Map(); // clé → JSON déjà présent dans le cloud
  let localFullWarned = false;
  const listeners = [];

  function setMode(m) { mode = m; listeners.forEach(fn => { try { fn(m); } catch (e) {} }); }
  function onMode(fn) { listeners.push(fn); fn(mode); }
  function getMode() { return mode; }
  function isCloud() { return !!backend || !!sb; }
  function isSupabase() { return !!sb; }
  // Supabase : pas de registre de comptes local (Supabase Auth s'en charge).
  function useSupabase(client) { sb = client; backend = null; setMode("cloud"); }
  function failMode() { setMode(navigator.onLine === false ? "offline" : "error"); }

  // --- Synchro : updatedAt des données en ligne à la dernière synchro réussie (null = inconnu) ---
  function getSynced() {
    if (!userId) return null;
    try { const v = localStorage.getItem(CONFIG.LS_SYNCED + userId); return v === null ? null : Number(v); } catch (e) { return null; }
  }
  function setSynced(v) { if (userId) { try { localStorage.setItem(CONFIG.LS_SYNCED + userId, String(v)); } catch (e) {} } }
  // Les données en ligne sont identiques à data : on retient leurs morceaux (évite de tout renvoyer).
  function markSynced(data) {
    if (!userId) return;
    const { pieces, index } = split(data);
    remoteSaved = new Map(pieces); remoteSaved.set(pre() + "index", index);
    setSynced(data.updatedAt);
  }
  // « Garder les données de cet appareil » : tout renvoyer et supprimer les morceaux en ligne en trop.
  function forceFullPush(remoteKeys, remoteUpdatedAt) {
    remoteSaved = new Map(arr(remoteKeys).map(k => [k, null]));
    remoteSaved.set(pre() + "index", null);
    setSynced(remoteUpdatedAt);
  }
  function onConflict(fn) { onConflictFn = fn; }
  function onRetryInit(fn) { onRetryInitFn = fn; }
  function setConflictOpen(v) { conflictOpen = !!v; }
  // Nouvel essai automatique : relecture en ligne si elle a échoué, sinon nouvel envoi.
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(retryNow, CONFIG.RETRY_MS);
  }
  function retryNow() {
    clearTimeout(retryTimer); retryTimer = null;
    if (!userId || !remote) return;
    if (!remoteOk) { if (onRetryInitFn) { try { onRetryInitFn(); } catch (e) {} } }
    else if (lastData) flush();
  }
  try { window.addEventListener("online", retryNow); window.addEventListener("offline", () => { if (remote) setMode("offline"); }); } catch (e) {}

  function lsGet(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsRaw(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function oldKey(id) { return "user:" + id; }               // ancien format (un seul bloc)
  function pre() { return "user:" + userId + ":"; }          // préfixe des morceaux du compte connecté
  function byteLen(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 3; } }

  // Connexion au cloud (base + identité Claude). Renvoie true si disponible.
  async function connect() {
    try {
      if (typeof window.claude === "undefined" || !window.claude || typeof window.claude.use !== "function") return false;
      const [d, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), CONFIG.REMOTE_TIMEOUT_MS + 2000);
      if (!d || !user) return false;
      const id = await withTimeout(user.id(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!id) return false;
      db = d; base = "data/users/" + id;
      backend = claudeDbBackend(db, base);
      setMode("cloud");
      return true;
    } catch (e) {
      db = null; base = null; backend = null;
      setMode("local");
      return false;
    }
  }
  // Lecture d'un document { json } (registre, anciennes données) : objet, ou undefined si vide. Lève une erreur en cas d'échec.
  async function remoteGet(name) {
    const json = await backend.get(name);
    return json ? JSON.parse(json) : undefined;
  }

  // --- Comptes : { accounts: [{ id, salt, pinHash, createdAt }], migrated } ---
  function normReg(r) {
    const d = (r && typeof r === "object") ? r : {};
    return {
      accounts: arr(d.accounts).filter(a => a && a.id && a.pinHash)
        .map(a => ({ id: String(a.id), salt: String(a.salt || ""), pinHash: String(a.pinHash), createdAt: num(a.createdAt, 0) })),
      migrated: !!d.migrated
    };
  }
  function mergeReg(a, b) {
    const out = { accounts: a.accounts.slice(), migrated: a.migrated || b.migrated };
    b.accounts.forEach(x => { if (!out.accounts.some(y => y.id === x.id)) out.accounts.push(x); });
    out.accounts.sort((x, y) => x.createdAt - y.createdAt);
    return out;
  }
  async function loadAccounts() {
    let reg = normReg(lsGet(CONFIG.LS_ACCOUNTS));
    if (backend) {
      try { reg = mergeReg(reg, normReg(await remoteGet(CONFIG.REMOTE_ACCOUNTS))); }
      catch (e) { setMode("error"); }
    }
    lsSet(CONFIG.LS_ACCOUNTS, reg);
    return reg;
  }
  // Relit le registre distant avant d'écrire, pour ne pas écraser un compte créé sur un autre appareil.
  async function saveAccounts(reg) {
    lsSet(CONFIG.LS_ACCOUNTS, reg);
    if (!backend) return;
    try {
      const m = mergeReg(reg, normReg(await remoteGet(CONFIG.REMOTE_ACCOUNTS)));
      await backend.set(CONFIG.REMOTE_ACCOUNTS, JSON.stringify(m), Date.now());
      lsSet(CONFIG.LS_ACCOUNTS, m);
      setMode("cloud");
    } catch (e) { setMode("error"); }
  }

  // --- Anciennes données (avant les comptes) : la version la plus récente entre local et cloud ---
  function readLegacyLocal() { return lsGet(CONFIG.LS_KEY); }
  async function readLegacy() {
    const l = looksLikeAppData(readLegacyLocal()) ? readLegacyLocal() : null;
    let r = null;
    if (backend) { try { const x = await remoteGet(CONFIG.REMOTE_DOC); if (looksLikeAppData(x)) r = x; } catch (e) {} }
    if (l && r) return num(r.updatedAt, 0) >= num(l.updatedAt, 0) ? r : l;
    return l || r;
  }

  // --- Session sur cet appareil (sans Supabase) : localStorage si « Rester connecté », sinon sessionStorage ---
  function getSession() {
    try { return localStorage.getItem(CONFIG.LS_SESSION) || sessionStorage.getItem(CONFIG.LS_SESSION) || null; } catch (e) { return null; }
  }
  function setSession(id) {
    try { localStorage.removeItem(CONFIG.LS_SESSION); sessionStorage.removeItem(CONFIG.LS_SESSION); } catch (e) {}
    if (!id) return;
    try { (rememberMe() ? localStorage : sessionStorage).setItem(CONFIG.LS_SESSION, id); } catch (e) {}
  }

  // --- Découpage : données → Map(clé → JSON) dans l'ordre de l'index ---
  function slices(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
  function split(data, prefix) {
    const p = new Map(), P = prefix === undefined ? pre() : prefix;
    const put = (k, v) => p.set(P + k, JSON.stringify(v));
    const ids = data.aiResume ? arr(data.aiResume.ids) : [];
    put("settings", {
      version: data.version, settings: data.settings, updatedAt: data.updatedAt, rejected: data.rejected, lastCheckAt: data.lastCheckAt,
      aiResume: data.aiResume ? { kind: data.aiResume.kind, total: ids.length } : null
    });
    put("folders", data.folders);
    put("lists", data.lists);
    put("history", data.history);
    // Cartes : par liste, morceaux de 200 cartes max (et taille limitée, pour les cartes avec de longs exemples).
    const byList = new Map();
    data.cards.forEach(c => { if (!byList.has(c.listId)) byList.set(c.listId, []); byList.get(c.listId).push(c); });
    const sigs = data.checkedSig || {};
    byList.forEach((cards, listId) => {
      let n = 0, cur = [], curSig = {}, bytes = 0;
      const out = () => { put("cards:" + listId + ":" + (n++), { cards: cur, sig: curSig }); cur = []; curSig = {}; bytes = 0; };
      cards.forEach(c => {
        const b = byteLen(JSON.stringify(c)) + 40;
        if (cur.length && (cur.length >= CONFIG.CARDS_PER_PIECE || bytes + b > CONFIG.PIECE_MAX_BYTES)) out();
        cur.push(c); bytes += b;
        if (sigs[c.id]) curSig[c.id] = sigs[c.id];
      });
      if (cur.length) out();
    });
    slices(data.proposals, CONFIG.PROPOSALS_PER_PIECE).forEach((s, i) => put("proposals:" + i, s));
    slices(ids, CONFIG.IDS_PER_PIECE).forEach((s, i) => put("resume:" + i, s));
    const index = JSON.stringify({ v: 2, updatedAt: data.updatedAt, keys: Array.from(p.keys()) });
    return { pieces: p, index };
  }
  // Administration : données d'un autre compte ↔ lignes Supabase. Comme pour le compte lui-même :
  // clé de ligne sans préfixe, mais liste de l'index avec le préfixe "user:<identifiant>:".
  function packRows(data, ident) {
    const P = "user:" + ident + ":";
    const { pieces, index } = split(data, P);
    const rows = Array.from(pieces, ([key, json]) => ({ key: key.slice(P.length), data: JSON.parse(json) }));
    rows.push({ key: "index", data: JSON.parse(index) });  // l'index en dernier
    return rows;
  }
  function unpackRows(rows) {
    const m = new Map(arr(rows).map(r => [r.key, r.data]));
    if (!m.has("index")) return null;
    const idx = Object.assign({}, m.get("index"));
    idx.keys = arr(idx.keys).map(k => String(k).replace(/^user:[^:]*:/, ""));
    return assemble(idx, k => m.get(k), "").data;
  }
  // Morceaux → données (à passer ensuite dans normalizeData). get(clé) → objet ou undefined.
  function assemble(idx, getPiece, prefix) {
    const P = prefix === undefined ? pre() : prefix;
    const s = getPiece(P + "settings") || {};
    const out = {
      version: num(s.version, 1), updatedAt: num(idx.updatedAt, 0),   // pas de version = données de la version 1
      settings: s.settings, rejected: s.rejected, lastCheckAt: s.lastCheckAt,
      folders: arr(getPiece(P + "folders")), lists: arr(getPiece(P + "lists")), history: arr(getPiece(P + "history")),
      cards: [], proposals: [], checkedSig: {}, aiResume: null
    };
    const ids = [];
    let missing = 0;
    arr(idx.keys).forEach(k => {
      const v = getPiece(k);
      if (v === undefined) { missing++; return; }
      if (k.startsWith(P + "cards:")) { out.cards.push(...arr(v.cards)); Object.assign(out.checkedSig, v.sig || {}); }
      else if (k.startsWith(P + "proposals:")) out.proposals.push(...arr(v));
      else if (k.startsWith(P + "resume:")) ids.push(...arr(v));
    });
    if (s.aiResume && s.aiResume.kind) out.aiResume = { kind: s.aiResume.kind, ids };
    return { data: out, missing };
  }

  // --- Compte connecté ---
  // sbUid : identifiant Supabase (auth.uid()) du compte, en mode Supabase.
  function setUser(id, sbUid) {
    clearTimeout(timer); timer = null; lastData = null; held = false;
    clearTimeout(retryTimer); retryTimer = null; failWarned = false; conflictOpen = false; remoteOk = false;
    localSaved = new Map(); remoteSaved = new Map(); localFullWarned = false;
    userId = id || null;
    if (!userId) remote = null;
    else if (sb) remote = sbUid ? supabaseBackend(sb, sbUid, "user:" + userId + ":") : null;
    else remote = backend || null;
  }
  function getUser() { return userId; }
  // Pendant l'ouverture du compte : les sauvegardes restent en mémoire (pas d'écriture avant la migration).
  function hold() { held = true; }
  function release() { held = false; }

  // Lecture locale : { data, old } (old = ancien format, à migrer), ou null si rien.
  function readLocal() {
    if (!userId) return null;
    const P = pre();
    const idxRaw = lsRaw(CONFIG.LS_USER_PREFIX + P + "index");
    if (idxRaw) {
      try {
        const idx = JSON.parse(idxRaw);
        localSaved = new Map([[P + "index", idxRaw]]);
        const { data, missing } = assemble(idx, k => {
          const raw = lsRaw(CONFIG.LS_USER_PREFIX + k);
          if (raw === null) return undefined;
          localSaved.set(k, raw);
          return JSON.parse(raw);
        });
        if (missing) data.updatedAt = 0; // incomplet : une version cloud complète passera devant
        return { data, old: false };
      } catch (e) { /* index illisible : on tente l'ancien format */ }
    }
    const old = lsGet(CONFIG.LS_USER_PREFIX + oldKey(userId));
    return looksLikeAppData(old) ? { data: old, old: true } : null;
  }
  // Écriture locale tout-ou-rien des morceaux modifiés. Renvoie true si tout est écrit.
  function writeLocal(data) {
    if (!userId) return false;
    const { pieces, index } = split(data);
    const P = pre(), done = [];
    try {
      pieces.forEach((json, k) => {
        if (localSaved.get(k) === json) return;
        done.push([k, localSaved.has(k) ? localSaved.get(k) : null]);
        localStorage.setItem(CONFIG.LS_USER_PREFIX + k, json);
        localSaved.set(k, json);
      });
      if (localSaved.get(P + "index") !== index) {
        done.push([P + "index", localSaved.has(P + "index") ? localSaved.get(P + "index") : null]);
        localStorage.setItem(CONFIG.LS_USER_PREFIX + P + "index", index);
        localSaved.set(P + "index", index);
      }
    } catch (e) {
      // Mémoire de l'appareil pleine (ou indisponible) : on remet les morceaux comme avant.
      done.reverse().forEach(([k, prev]) => {
        try {
          if (prev === null) { localStorage.removeItem(CONFIG.LS_USER_PREFIX + k); localSaved.delete(k); }
          else { localStorage.setItem(CONFIG.LS_USER_PREFIX + k, prev); localSaved.set(k, prev); }
        } catch (e2) {}
      });
      return false;
    }
    // Morceaux qui n'existent plus (liste vidée, propositions traitées…).
    Array.from(localSaved.keys()).forEach(k => {
      if (k !== P + "index" && !pieces.has(k)) { lsDel(CONFIG.LS_USER_PREFIX + k); localSaved.delete(k); }
    });
    return true;
  }
  // Après migration réussie : relit le nouveau format et retire l'ancienne clé locale si tout correspond.
  function dropOldLocal(data) {
    if (!userId) return false;
    const back = readLocal();
    if (!back || back.old || !back.data || arr(back.data.cards).length !== data.cards.length) return false;
    lsDel(CONFIG.LS_USER_PREFIX + oldKey(userId));
    return true;
  }

  // Lecture cloud. Renvoie { data, old, keys } (données du compte), undefined (cloud dispo mais vide), null (cloud indisponible).
  // En cas d'échec : pas d'envoi (on n'a pas pu comparer), nouvel essai automatique.
  async function initRemote() {
    if (!remote) return null;
    const id = userId, P = pre();
    try {
      let got = null, idxRaw;
      if (remote.getAll) { got = await remote.getAll(); idxRaw = got.get(P + "index"); }
      else idxRaw = await remote.get(P + "index");
      if (userId !== id) return null;
      if (idxRaw) {
        const idx = JSON.parse(idxRaw);
        const keys = arr(idx.keys);
        if (!got) {
          got = new Map([[P + "index", idxRaw]]);
          for (let i = 0; i < keys.length; i += 8) {           // 8 lectures à la fois
            const part = keys.slice(i, i + 8);
            const vals = await Promise.all(part.map(k => remote.get(k)));
            part.forEach((k, j) => { if (vals[j] !== undefined) got.set(k, vals[j]); });
          }
        }
        if (userId !== id) return null;
        const { data, missing } = assemble(idx, k => got.has(k) ? JSON.parse(got.get(k)) : undefined);
        if (missing) throw new Error("incomplete");
        remoteSaved = new Map(Array.from(got).filter(([k]) => k === P + "index" || keys.includes(k)));
        remoteOk = true;
        setMode("cloud");
        return { data, old: false, keys: Array.from(got.keys()) };
      }
      const old = remote.getAll ? undefined : await remoteGet(oldKey(id));
      if (userId !== id) return null;
      remoteSaved = got ? new Map(Array.from(got.keys(), k => [k, null])) : new Map();
      remoteOk = true;
      setMode("cloud");
      return looksLikeAppData(old) ? { data: old, old: true, keys: [] } : undefined;
    } catch (e) {
      if (userId === id) { remoteOk = false; failMode(); scheduleRetry(); }
      return null;
    }
  }

  // Envoi cloud des morceaux modifiés, puis de l'index, puis suppression des morceaux disparus. Renvoie true si tout est à jour.
  // Avant d'écrire : relecture de l'index en ligne ; s'il a changé depuis la dernière synchro → conflit (on n'écrit rien).
  async function doFlush() {
    if (!remote || !remoteOk || !lastData || !userId || conflictOpen) return !remote;
    const id = userId, P = pre();
    const { pieces, index } = split(lastData);
    const todo = [];
    pieces.forEach((json, k) => { if (remoteSaved.get(k) !== json) todo.push([k, json]); });
    const idxChanged = remoteSaved.get(P + "index") !== index;
    const gone = Array.from(remoteSaved.keys()).filter(k => k !== P + "index" && !pieces.has(k));
    if (!todo.length && !idxChanged && !gone.length) { if (mode !== "cloud") setMode("cloud"); return true; }
    if (todo.some(([, json]) => byteLen(json) > CONFIG.MAX_DOC_BYTES)) { setMode("error"); toast(t("save.tooBig")); return false; }
    try {
      setMode("syncing");
      const S = getSynced();
      if (S !== null) {
        const rIdx = await remote.get(P + "index");
        if (userId !== id) return false;
        const r = rIdx ? num(JSON.parse(rIdx).updatedAt, 0) : 0;
        if (r > S && r !== lastData.updatedAt) {            // modifié ailleurs depuis la dernière synchro
          conflictOpen = true;
          setMode("error");
          if (onConflictFn) setTimeout(() => { try { onConflictFn(); } catch (e) {} }, 0);
          return false;
        }
      }
      for (const [k, json] of todo) {                         // un morceau à la fois
        await remote.set(k, json, lastData.updatedAt);
        if (userId !== id) return false;
        remoteSaved.set(k, json);
      }
      await remote.set(P + "index", index, lastData.updatedAt);
      remoteSaved.set(P + "index", index);
      setSynced(lastData.updatedAt);
      for (const k of gone) { await remote.del(k); remoteSaved.delete(k); }
      failWarned = false;
      setMode("cloud");
      return true;
    } catch (e) {
      if (userId === id) {
        failMode();
        if (!failWarned && navigator.onLine !== false) { failWarned = true; toast(t("save.retry")); }
        scheduleRetry();
      }
      return false;
    }
  }
  // Les envois cloud passent l'un après l'autre (jamais deux écritures en même temps).
  function flush() {
    const p = chain.then(doFlush, doFlush);
    chain = p.catch(() => false);
    return p;
  }

  // Sauvegarde du compte connecté : immédiate en local (morceaux modifiés), différée (regroupée) vers le cloud.
  // Renvoie false si l'appareil n'a pas pu enregistrer.
  function save(data) {
    if (!userId) return false;
    lastData = data;
    if (held) return true;
    const ok = writeLocal(data);
    if (!ok) { setMode("error"); if (!localFullWarned) { localFullWarned = true; toast(t("save.localFull")); } }
    else localFullWarned = false;
    if (remote) {
      clearTimeout(timer);
      timer = setTimeout(() => { timer = null; flush(); }, CONFIG.SAVE_DELAY_MS);
    }
    return ok;
  }
  // Sauvegarde complète tout de suite (import par lots). Renvoie { local, remote } (true = réussi ou sans objet).
  async function saveNow(data) {
    if (!userId) return { local: false, remote: false };
    lastData = data;
    clearTimeout(timer); timer = null;
    const local = writeLocal(data);
    if (!local) { setMode("error"); return { local: false, remote: false }; }
    const r = (remote && remoteOk) ? await flush() : true;  // en ligne pas encore relu : envoi plus tard
    return { local: true, remote: r };
  }

  // Appli fermée ou mise en arrière-plan avant le délai, fin de session de révision : on envoie tout de suite.
  function flushNow() { if (timer) { clearTimeout(timer); timer = null; flush(); } }
  try {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNow(); });
    window.addEventListener("pagehide", flushNow);
  } catch (e) {}

  // Avant de changer de compte : envoie ce qui attend et attend la fin des écritures.
  async function flushWait() {
    flushNow();
    try { await chain; } catch (e) {}
  }

  return {
    connect, isCloud, isSupabase, useSupabase, onMode, getMode,
    loadAccounts, saveAccounts, readLegacy, readLegacyLocal, getSession, setSession,
    setUser, getUser, hold, release, readLocal, writeLocal, dropOldLocal, initRemote, save, saveNow, flushNow, flushWait,
    getSynced, markSynced, forceFullPush, onConflict, onRetryInit, setConflictOpen, packRows, unpackRows
  };
})();

// === SUPABASE ===
// Client Supabase, chargé seulement si config.js est rempli (window.APP_CONFIG = { SUPABASE_URL, SUPABASE_ANON_KEY }).
// Clé publique (« publishable » ou « anon ») uniquement : jamais la clé service_role / secrète.
// Connexion : email technique <identifiant>@vocab.local (jamais affiché), mot de passe = SHA-256(identifiant + ":" + PIN).
// Fonctions SQL utilisées (voir supabase.sql) : username_exists, my_profile, touch_last_seen, pin_changed,
// admin_list_accounts, admin_reset_pin, admin_delete_account. Données : table user_data (une ligne par morceau).
function inClaude() { return !!(window.claude && typeof window.claude.use === "function"); }

// SHA-256 en hexadécimal (crypto.subtle, sinon calcul en JavaScript : même résultat).
async function sha256Hex(str) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return sha256Js(str); }
}
function sha256Js(str) {
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  const H = [], K = [];
  for (let n = 2, c = 0; c < 64; n++) {
    let prime = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 4294967296) | 0;
    K[c++] = (Math.pow(n, 1 / 3) * 4294967296) | 0;
  }
  const b = Array.from(new TextEncoder().encode(str)), len = b.length * 8;
  b.push(0x80);
  while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i >= 4 ? 0 : (len >>> (8 * i)) & 255);
  const w = new Array(64);
  for (let j = 0; j < b.length; j += 64) {
    for (let i = 0; i < 16; i++) w[i] = (b[j + 4 * i] << 24) | (b[j + 4 * i + 1] << 16) | (b[j + 4 * i + 2] << 8) | b[j + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const x = w[i - 15], y = w[i - 2];
      w[i] = (w[i - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + w[i - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0;
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    [a, bb, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

// Type d'erreur Supabase → "net" | "wrong" | "exists" | "confirm" | "same" | "server".
function sbErrKind(e) {
  const code = String((e && e.code) || ""), msg = String((e && (e.message || e.msg)) || e || "");
  if (navigator.onLine === false || /fetch|network|timeout|load failed/i.test(msg) || (e && (e.name === "AuthRetryableFetchError" || e.status === 0))) return "net";
  if (code === "invalid_credentials" || /invalid login credentials/i.test(msg)) return "wrong";
  if (code === "user_already_exists" || /already registered|already exists/i.test(msg)) return "exists";
  if (code === "confirm" || code === "email_not_confirmed" || /not confirmed/i.test(msg)) return "confirm";
  if (code === "same_password" || /different from the old/i.test(msg)) return "same";
  return "server";
}

const Supa = (() => {
  let client = null;
  const AUTH_KEY = "vocabfr.sb.auth";
  // Configuration lue dans config.js ; valeurs d'exemple ou vides = pas de Supabase.
  function cfg() {
    const c = (window.APP_CONFIG && typeof window.APP_CONFIG === "object") ? window.APP_CONFIG : {};
    const url = String(c.SUPABASE_URL || "").trim(), key = String(c.SUPABASE_ANON_KEY || "").trim();
    if (!/^https:\/\/\S+$/.test(url) || key.length < 20 || /REMPLACER|VOTRE|xxxx/i.test(url + key)) return null;
    return { url: url.replace(/\/+$/, ""), key };
  }
  function configured() { return !!cfg(); }
  function loadLib() {
    if (window.supabase && typeof window.supabase.createClient === "function") return Promise.resolve();
    return withTimeout(new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = CONFIG.SB_CDN; sc.onload = res; sc.onerror = () => rej(new Error("cdn"));
      document.head.appendChild(sc);
    }), 15000);
  }
  // « Rester connecté » : session Supabase dans localStorage, sinon dans sessionStorage (oubliée à la fermeture).
  const authStorage = {
    getItem(k) { try { const v = localStorage.getItem(k); return v !== null ? v : sessionStorage.getItem(k); } catch (e) { return null; } },
    setItem(k, v) {
      try {
        if (rememberMe()) { localStorage.setItem(k, v); sessionStorage.removeItem(k); }
        else { sessionStorage.setItem(k, v); localStorage.removeItem(k); }
      } catch (e) {}
    },
    removeItem(k) { try { localStorage.removeItem(k); } catch (e) {} try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  async function init() {
    const c = cfg();
    if (!c) return false;
    try {
      await loadLib();
      client = window.supabase.createClient(c.url, c.key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: authStorage, storageKey: AUTH_KEY }
      });
      return true;
    } catch (e) { client = null; return false; }
  }
  const T = 15000;
  const ok = r => { if (r && r.error) throw r.error; return r ? r.data : null; };
  function email(id) { return id + "@" + CONFIG.SB_EMAIL_DOMAIN; }
  function password(id, pin) { return sha256Hex(id + ":" + pin); }
  async function session() { return ok(await withTimeout(client.auth.getSession(), T)).session || null; }
  async function signIn(id, pin) {
    return ok(await withTimeout(client.auth.signInWithPassword({ email: email(id), password: await password(id, pin) }), T)).session;
  }
  async function signUp(id, pin) {
    const d = ok(await withTimeout(client.auth.signUp({ email: email(id), password: await password(id, pin) }), T));
    if (!d || !d.session) throw { code: "confirm" };   // confirmation par email encore activée
    return d.session;
  }
  async function signOut() {
    try { await withTimeout(client.auth.signOut({ scope: "local" }), 5000); } catch (e) {}
    authStorage.removeItem(AUTH_KEY);
  }
  async function rpc(name, args) { return ok(await withTimeout(client.rpc(name, args || {}), T)); }
  // Nouveau PIN pour le compte connecté (puis « PIN à changer » retiré).
  async function setPin(id, pin) {
    ok(await withTimeout(client.auth.updateUser({ password: await password(id, pin) }), T));
    await rpc("pin_changed");
  }
  // Administration : lignes user_data d'un compte (RLS : réservé à l'admin pour les autres comptes).
  async function readRows(userUuid) {
    return arr(ok(await withTimeout(client.from("user_data").select("key,data").eq("user_id", userUuid), T * 2)));
  }
  // Remplace toutes les lignes d'un compte : morceaux, puis index, puis suppression des anciennes clés.
  async function writeRows(userUuid, rows) {
    const old = arr(ok(await withTimeout(client.from("user_data").select("key").eq("user_id", userUuid), T))).map(r => r.key);
    const pieces = rows.filter(r => r.key !== "index"), idx = rows.filter(r => r.key === "index");
    for (let i = 0; i < pieces.length; i += 5) {
      ok(await withTimeout(client.from("user_data").upsert(pieces.slice(i, i + 5).map(r => ({ user_id: userUuid, key: r.key, data: r.data }))), T));
    }
    if (idx.length) ok(await withTimeout(client.from("user_data").upsert({ user_id: userUuid, key: "index", data: idx[0].data }), T));
    const keep = new Set(rows.map(r => r.key));
    const del = old.filter(k => !keep.has(k));
    for (let i = 0; i < del.length; i += 50) {
      ok(await withTimeout(client.from("user_data").delete().eq("user_id", userUuid).in("key", del.slice(i, i + 50)), T));
    }
  }
  return {
    configured, init, client: () => client, password, session, signIn, signUp, signOut, setPin, readRows, writeRows,
    usernameExists: id => rpc("username_exists", { p_identifiant: id }),
    myProfile: () => rpc("my_profile"),
    touch: () => rpc("touch_last_seen"),
    listAccounts: () => rpc("admin_list_accounts"),
    resetPin: (userUuid, pwd) => rpc("admin_reset_pin", { p_user_id: userUuid, p_password: pwd }),
    deleteAccount: userUuid => rpc("admin_delete_account", { p_user_id: userUuid })
  };
})();

// === STATE ===
let state = emptyData();

// Toute modification des données passe par commit() : horodatage + sauvegarde + rafraîchissement.
function commit() {
  state.updatedAt = Date.now();
  Storage.save(state);
  render();
}

// === LEITNER ===
// Boîte 0 = nouveau ou pas su (revient dans la session). Boîtes 1 à 5 : 1, 3, 7, 14, 30 jours.
// Intervalles en jours calendaires : la carte redevient due à minuit (heure locale) du jour J+N.
const Leitner = (() => {
  const MAX_BOX = 5;
  function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ts, n) { const d = new Date(dayStart(ts)); d.setDate(d.getDate() + n); return d.getTime(); }
  function isDue(c, now) { return c.dueAt <= (now || Date.now()); }
  // "unknown" = Pas su (boîte 0), "review" = À revoir (1-2), "known" = Su (3-5)
  function category(c) { return c.box === 0 ? "unknown" : (c.box <= 2 ? "review" : "known"); }
  function logHistory(now, known) {
    const date = todayStr(new Date(now));
    let h = state.history.find(x => x.date === date);
    if (!h) { h = { date, reviewed: 0, correct: 0 }; state.history.push(h); }
    h.reviewed++;
    if (known) h.correct++;
  }
  // result : "known" (Su) | "review" (À revoir) | "unknown" (Pas su).
  // Modifie la carte et l'historique, sans sauvegarder (l'appelant fait commit()).
  function grade(c, result, now) {
    now = now || Date.now();
    const from = c.box;
    if (result === "known") {
      c.box = Math.min(MAX_BOX, c.box + 1);              // boîte 5 : reste en 5, revient dans 30 j
      c.dueAt = addDays(now, CONFIG.LEITNER_INTERVALS_DAYS[c.box]);
    } else if (result === "review") {
      c.dueAt = addDays(now, 1);                        // même boîte, revient demain
    } else {
      c.box = 0;
      c.dueAt = now;                                    // revient dans la session
    }
    c.stats.seen++;
    c.stats.lastSeen = now;
    if (result === "known") c.stats.correct++;
    if (result === "unknown") c.stats.wrong++;
    logHistory(now, result === "known");
    return { from, to: c.box, dueAt: c.dueAt };
  }
  return { dayStart, addDays, isDue, category, grade };
})();

// === AUDIO ===
// Synthèse vocale du navigateur : voix donnée par le champ tts de chaque langue (LANGUAGES).
// Le bouton haut-parleur n'est créé que si une voix existe (sinon rien, sans erreur).
// Plusieurs langues sur une face : lues l'une après l'autre. Une nouvelle carte coupe la lecture en cours.
// Lecture auto (state.settings.audio) : question lue à son apparition, réponse au retournement
// (ou après validation en mode Écrit), seulement pour les langues choisies (langue apprise / d'appui / les deux).
const Speech = (() => {
  const LANG = {};
  LANG_CODES.forEach(c => { LANG[c] = LANGUAGES[c].tts; });
  let voices = [], ready = false, token = 0;
  const synth = (() => { try { return window.speechSynthesis || null; } catch (e) { return null; } })();
  function load() { try { voices = (synth && synth.getVoices()) || []; } catch (e) { voices = []; } return voices.length > 0; }
  function voiceFor(lng) {
    const full = (LANG[lng] || "").toLowerCase(), base = full.slice(0, 2);
    const norm = v => String(v.lang || "").toLowerCase().replace("_", "-");
    return voices.find(v => norm(v) === full) || voices.find(v => norm(v).startsWith(base)) || null;
  }
  function has(lng) {
    return !!(synth && typeof SpeechSynthesisUtterance !== "undefined" && LANG[lng] && voiceFor(lng));
  }
  function stop() { token++; try { if (synth) synth.cancel(); } catch (e) {} }
  // items : [{ text, lng }] lus à la suite ; langues sans voix sautées. "voler / s'envoler" : lu avec une pause.
  function speakSeq(items) {
    const list = arr(items).filter(x => x && x.text && x.text !== "—" && has(x.lng));
    stop();
    if (!list.length) return false;
    const my = token;
    setTimeout(() => {                       // petit délai : certains navigateurs ignorent speak() juste après cancel()
      if (my !== token) return;
      list.forEach(x => {
        try {
          const u = new SpeechSynthesisUtterance(String(x.text).replace(/\s*\/\s*/g, ", "));
          u.lang = LANG[x.lng];
          u.voice = voiceFor(x.lng);
          synth.speak(u);
        } catch (e) {}
      });
    }, 60);
    return true;
  }
  function speak(text, lng) { return speakSeq([{ text, lng }]); }
  // Les voix arrivent souvent après le chargement : onReady est appelé une fois quand elles sont prêtes.
  function init(onReady) {
    if (!synth) return;
    if (load()) { ready = true; return; }
    const h = () => { if (!ready && load()) { ready = true; try { onReady(); } catch (e) {} } };
    try {
      if (synth.addEventListener) synth.addEventListener("voiceschanged", h);
      else synth.onvoiceschanged = h;
    } catch (e) {}
  }
  // "none" (pas de synthèse vocale) | "loading" (voix pas encore connues) | "ready"
  function status() { return !synth || typeof SpeechSynthesisUtterance === "undefined" ? "none" : (ready || load() ? "ready" : "loading"); }
  return { has, speak, speakSeq, stop, init, status };
})();

const SPK_ICON = '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
// Bouton haut-parleur qui lit items ([{ text, lng }]) à la suite, ou null si aucune de ces langues n'a de voix.
// pointerdown arrêté pour ne pas retourner / faire glisser la carte en mode Cartes.
function speakItemsBtn(items) {
  const list = arr(items).filter(x => x && x.text && x.text !== "—" && Speech.has(x.lng));
  if (!list.length) return null;
  const b = el("button", "spk");
  b.type = "button";
  b.innerHTML = SPK_ICON;
  b.setAttribute("aria-label", t("audio.play"));
  const stop = e => e.stopPropagation();
  b.addEventListener("pointerdown", stop);
  b.addEventListener("keydown", stop);
  b.addEventListener("click", e => { e.stopPropagation(); Speech.speakSeq(list); });
  return b;
}
function speakBtn(text, lng) { return speakItemsBtn([{ text, lng }]); }
function spkRow(text, lng) { return spkItemsRow([{ text, lng }]); }
function spkItemsRow(items) {
  const b = speakItemsBtn(items);
  if (!b) return null;
  const r = el("div", "spk-row");
  r.appendChild(b);
  return r;
}

// --- Lecture auto pendant une session ---
function audioSettings() { return state.settings.audio || { auto: true, langs: "target" }; }
// Langue lue automatiquement selon le réglage (lg = langues de la carte).
function autoLangOk(lng, lg) {
  const m = audioSettings().langs;
  return m === "both" || (m === "target" ? lng === lg.target : lng !== lg.target);
}
// À appeler à l'affichage d'une carte : une nouvelle carte coupe la lecture en cours.
// Clé = nombre de réponses déjà données + id : une carte « Pas su » qui revient compte comme une nouvelle carte.
function audioCard(s, c) {
  const key = s.log.length + ":" + c.id;
  if (!s.audio || s.audio.key !== key) { Speech.stop(); s.audio = { key, done: new Set() }; }
}
// Lit une face (side = "q" ou "a") une seule fois par carte, si la lecture auto est active.
// Rien n'est marqué comme lu si aucune voix n'est encore prête (nouvel essai quand les voix arrivent).
function autoSpeak(s, side, items, lg) {
  if (!audioSettings().auto || !s || !s.audio || s.audio.done.has(side)) return;
  const list = arr(items).filter(x => autoLangOk(x.lng, lg));
  if (Speech.speakSeq(list)) s.audio.done.add(side);
}
// Interrupteur « Lecture auto » : toucher n'importe où sur la ligne, ou glisser le curseur à gauche / à droite.
function audioToggle() {
  const b = el("button", "au-switch");
  b.type = "button";
  b.setAttribute("role", "switch");
  const lbl = el("span", "au-lbl");
  lbl.innerHTML = SPK_ICON;
  lbl.appendChild(el("span", null, t("audio.auto")));
  const track = el("span", "au-track");
  track.appendChild(el("span", "au-knob"));
  b.append(lbl, track);
  const show = () => b.setAttribute("aria-checked", String(!!audioSettings().auto));
  const setOn = on => {
    if (!state.settings.audio) state.settings.audio = { auto: true, langs: "target" };
    if (state.settings.audio.auto === on) return;
    state.settings.audio.auto = on;
    if (!on) Speech.stop();
    show();
    commitQuiet(); // mémorisé, sans réafficher l'écran (la carte en cours reste)
  };
  let x0 = null, dragged = false;
  b.addEventListener("pointerdown", e => { x0 = e.clientX; dragged = false; });
  b.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 18) { dragged = true; setOn(dx > 0); }
  });
  b.addEventListener("pointercancel", () => { x0 = null; });
  b.addEventListener("click", () => { if (dragged) { dragged = false; return; } setOn(!audioSettings().auto); });
  show();
  return b;
}

// === THEME ===
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.settings.theme);
}

// === NAVIGATION ===
const SCREENS = ["home", "review", "lists", "stats", "pending", "settings", "admin"];
const HASH_OF = { home: "home", review: "review", lists: "lists", stats: "stats", pending: "a-valider", settings: "reglages", admin: "admin" }; // "settings" est réservé dans l'URL
let currentScreen = "home";

function screenFromHash() {
  const h = (location.hash || "").replace("#", "");
  return SCREENS.find(s => HASH_OF[s] === h) || "home";
}
function showScreen(name) {
  if (!Storage.getUser()) { showAuth(auth.view); return; } // personne de connecté : écran de connexion
  currentScreen = SCREENS.includes(name) ? name : "home";
  if (currentScreen === "admin" && !auth.isAdmin) currentScreen = "settings"; // Administration : admin seulement
  document.querySelectorAll(".screen").forEach(el => el.classList.toggle("active", el.id === "screen-" + currentScreen));
  document.querySelectorAll("nav.bottom button").forEach(b => b.classList.toggle("active", b.dataset.nav === currentScreen));
  renderScreen();
  window.scrollTo(0, 0);
}
function initNav() {
  document.querySelectorAll("nav.bottom button").forEach(b => {
    b.addEventListener("click", () => {
      try { history.replaceState(null, "", "#" + HASH_OF[b.dataset.nav]); } catch (e) {}
      showScreen(b.dataset.nav);
    });
  });
  window.addEventListener("hashchange", () => showScreen(screenFromHash()));
}

// === UI : MODALE & TOAST ===
let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

// actions : [{ label, kind: "primary"|"danger"|"", onClick: () => (false pour garder ouverte) }]
function openModal(title, bodyNode, actions, opts) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const box = document.createElement("div");
  box.className = "modal";
  const h = document.createElement("h3");
  h.textContent = title;
  box.appendChild(h);
  if (bodyNode) box.appendChild(bodyNode);
  const btns = document.createElement("div");
  btns.className = "btns" + (actions.length === 2 ? " two" : "");
  btns.style.marginTop = "16px";
  const close = () => bg.remove();
  actions.forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.kind || "");
    b.textContent = a.label;
    b.addEventListener("click", () => { const keep = a.onClick ? a.onClick() === false : false; if (!keep) close(); });
    btns.appendChild(b);
  });
  box.appendChild(btns);
  bg.appendChild(box);
  if (!(opts && opts.locked)) bg.addEventListener("click", e => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  return close;
}
// Fenêtre avec barre de progression (ne se ferme pas en touchant le fond). Renvoie { set(fraction, texte), close }.
function openProgress(title, text, actions) {
  const wrap = document.createElement("div");
  const bar = document.createElement("div"); bar.className = "progress";
  const fill = document.createElement("div"); fill.className = "progress-fill";
  bar.appendChild(fill);
  bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", "100");
  const p = document.createElement("p"); p.className = "muted progress-text"; p.textContent = text || "";
  wrap.append(bar, p);
  const close = openModal(title, wrap, actions || [], { locked: true });
  const set = (frac, txt) => {
    const v = Math.max(0, Math.min(100, Math.round((frac || 0) * 100)));
    fill.style.width = v + "%"; bar.setAttribute("aria-valuenow", String(v));
    if (txt !== undefined) p.textContent = txt;
  };
  set(0);
  return { set, close };
}

function renderSyncStatus(mode) {

  $("#syncLabel").textContent = t("storage." + mode);
  const infoKey = mode === "error" ? "storage.info.error" : mode === "offline" ? "storage.info.offline" : (mode === "local" ? "storage.info.local" : "storage.info.cloud");
