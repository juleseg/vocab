// Repli « Préparer pour Claude » : à la réimportation, seuls les champs des catégories cochées sont proposés.
let prepScope = null; // { st, ids: Set, want }
function prepWantFor(c) { return prepScope && prepScope.st === state && prepScope.ids.has(c.id) ? prepScope.want(c) : null; }

// Ouvre « À valider » filtré sur la liste ou le dossier.
function goPendingFor(scope) {
  pvReset();
  if (scope.kind === "list" && getList(scope.id)) { pv.list = scope.id; pv.folder = pvFolderOf(scope.id); }
  else if (scope.kind === "folder" && getFolder(scope.id)) pv.folder = scope.id;
  goPending();
}

async function openUpdate(scope) {
  if (aiJob) { toast(t("ai.busy")); return; }
  const obj = updScopeObj(scope);
  if (scope.kind !== "all" && !obj) return;
  const cards = updScopeCards(scope);
  if (!cards.length) { toast(t("ai.noCards")); return; }
  await AI.ready();
  const a = analyzeUpdate(cards);
  const checked = new Set();
  const wrap = el("div");
  wrap.appendChild(el("p", "muted upd-intro", t("upd.intro", { n: a.total })));
  const row = (cat, label, n, hint, on) => {
    const r = el("label", "upd-row" + (n ? "" : " off"));
    const cb = el("input"); cb.type = "checkbox"; cb.disabled = !n; cb.checked = !!n && on;
    if (cb.checked) checked.add(cat);
    cb.addEventListener("change", () => { if (cb.checked) checked.add(cat); else checked.delete(cat); });
    const l = el("div", "upd-l");
    l.appendChild(el("div", null, label));
    if (hint) l.appendChild(el("div", "upd-h", hint));
    r.append(cb, l, el("span", "upd-n", n ? t(n === 1 ? "upd.card1" : "upd.cards", { n }) : "✓"));
    wrap.appendChild(r);
  };
  LANG_CODES.filter(code => code in a.tr).forEach(code => row("tr:" + code, t("upd.cat.tr", { lang: langName(code) }), a.tr[code], "", true));
  row("pos", t("upd.cat.pos"), a.pos, a.gender ? t("upd.cat.gender", { n: a.gender, langs: [...a.genderLangs].map(x => langName(x)).join(", ") }) : "", true);
  row("example", t("upd.cat.example"), a.example, "", true);
  row("pending", t("upd.cat.pending"), a.pending, t("upd.cat.pendingHint"), true);
  const calls = Math.ceil(a.verify / CONFIG.AI_BATCH);
  row("verify", t("upd.cat.verify"), a.verify, t("upd.cat.verifyHint") + (AI.isOn() && calls ? " · " + t("upd.calls", { b: calls }) : ""), false);
  row("dup", t("upd.cat.dup"), a.dup, "", true);
  if (a.legacy) row("legacy", t("upd.cat.legacy"), a.legacy, "", true);
  else wrap.appendChild(el("div", "upd-last", t("upd.formatOk")));
  if (obj) wrap.appendChild(el("div", "upd-last", updDate(obj.lastUpdate)));
  const name = scope.kind === "all" ? t("upd.allName") : obj.name;
  // Échange par fichier avec Claude (même périmètre)
  let closeUpd = null;
  const fxl = el("div", "lv-links fx-links");
  const lo = el("button", "link-btn", t("fx.exportBtn")), li = el("button", "link-btn", t("ai.importReply"));
  lo.type = li.type = "button";
  lo.addEventListener("click", () => { if (closeUpd) closeUpd(); openFxExport(scope.kind === "all" ? "all" : scope.kind + ":" + scope.id); });
  li.addEventListener("click", () => { if (closeUpd) closeUpd(); openFxImport(); });
  fxl.append(lo, li);
  wrap.appendChild(fxl);
  closeUpd = openModal(t("upd.title", { name }), wrap, [
    { label: t("cancel") },
    { label: t("upd.launch"), kind: "primary", onClick: () => {
      if (!checked.size) { toast(t("upd.pickOne")); return false; }
      runUpdate(scope, [...checked]);
    } }
  ]);
}

async function runUpdate(scope, cats) {
  if (aiJob) { toast(t("ai.busy")); return; }
  const st = state;
  const cards = updScopeCards(scope);
  const now = Date.now();
  const stamp = x => { if (x) x.lastUpdate = now; };
  if (scope.kind === "list") stamp(getList(scope.id));
  else if (scope.kind === "folder") { stamp(getFolder(scope.id)); listsIn(scope.id).forEach(stamp); }
  else { state.folders.forEach(stamp); state.lists.forEach(stamp); }
  let added = 0, legacy = 0;
  if (cats.includes("legacy")) cards.forEach(c => { if (isLegacyCard(c)) { Object.assign(c, normalizeCard(c)); legacy++; } });
  if (cats.includes("dup")) added += addDuplicateProposals(cards);
  commit();
  const want = updWant(cats);
  const fillCards = cards.filter(c => !isLegacyCard(c) && want(c).length);
  const verifyCards = cats.includes("verify") ? cards.filter(c => state.checkedSig[c.id] !== cardSig(c)) : [];
  const seePending = cats.includes("pending");
  await AI.ready();
  if (state !== st) return;

  // Sans accès direct à Claude : textes à copier (vérification dessous, complétion au-dessus).
  if (!AI.isOn() && (fillCards.length || verifyCards.length)) {
    if (added || legacy) toast(t("ai.autoDone", { n: added }));
    if (verifyCards.length) openPrepare("verify", verifyCards);
    if (fillCards.length) { prepScope = { st: state, ids: new Set(fillCards.map(c => c.id)), want }; openPrepare("complete", fillCards); }
    return;
  }

  let error = null, stopped = false;
  if (fillCards.length) {
    const r = await runAiJob("complete", fillCards, { want, noEndModal: true, resumeCats: cats });
    if (!r || state !== st) return;
    added += r.added; error = r.error; stopped = r.stopped;
    if (r.interrupted) return;   // bandeau « Reprendre / Abandonner »
  }
  if (verifyCards.length && !error && !stopped) {
    const r = await runAiJob("verify", verifyCards, { noEndModal: true });
    if (!r || state !== st) return;
    added += r.added; error = r.error; stopped = r.stopped;
  }
  if (!fillCards.length && !verifyCards.length && !added && !legacy && seePending) { goPendingFor(scope); return; }

  let msg = error ? aiErrorText(error) : stopped ? t(fillCards.length ? "ai.paused" : "ai.stopped", { n: added }) : added ? t("ai.done", { n: added }) : t("ai.doneNone");
  if (error && added) msg += " " + t("ai.done", { n: added });
  if (error && state.aiResume && fillCards.length) msg += " " + t("ai.resumeLater");
  if (legacy) msg += " " + t("upd.legacyDone", { n: legacy });
  const actions = [{ label: t("close") }];
  if (added || seePending) actions.push({ label: t("ai.see"), kind: "primary", onClick: () => { goPendingFor(scope); } });
  openModal(t("ai.doneTitle"), el("p", null, msg), actions);
}

// === ÉCRAN : À VALIDER ===
// Une ligne par proposition : case à cocher, liste, mot de la langue apprise, champ, ancienne → nouvelle valeur (différences surlignées), type.
// Filtres (liste, type, champ) ; la sélection est limitée aux lignes filtrées.
// Pages de CONFIG.PV_PAGE lignes : seule la page affichée est dans le DOM. Sélection = ensemble d'ids en mémoire (pv.sel) :
// menu « Sélectionner » : 50 · 100 · 200 · 500 (les N premières lignes filtrées, dans l'ordre affiché, à partir de la page
// en cours) · Tout (N) (toutes les lignes filtrées, sans les afficher) · Aucune. Un choix remplace la sélection précédente.
// Seules les 50 cases de la page affichée reflètent l'ensemble ; aucune boucle sur des cases à cocher.
// Accepter / Refuser : par paquets de CONFIG.PV_CHUNK, barre de progression, l'écran reste fluide ; reste à faire gardé
// sur l'appareil après chaque paquet (reprise par le bandeau si l'appli est rechargée ou si on arrête).
// Modifier (édition dans la ligne, puis Accepter) ; « Annuler » quelques secondes après une action groupée.
const pv = { folder: "", list: "", type: "", field: "", page: 0, sel: new Set(), editing: new Set(), edits: {}, refreshBar: null };
// Dossier : id, "__none__" (sans dossier) ou "" (tous).
function pvFolderOf(listId) { const l = getList(listId); return l && l.folderId ? l.folderId : "__none__"; }
// Filtre par champ : une traduction (code de langue), l'exemple, la nature (« pos » = toutes les langues) ou les doublons.
const PV_FIELDS = LANG_CODES.concat(["example", "pos", "typed", "dup"]);
function pvFieldMatch(p, f) { return f === "pos" ? isPosField(p.field) : f === "typed" ? isTypedField(p.field) : p.field === f; }
// Nature affichée : « n.f. — nom féminin » (abréviation dans la langue du mot, nom dans la langue de l'interface).
function pvPosText(code, lng) { return code ? posLabel(code, lng) + (POS_CODES.includes(code) ? " — " + t("pos." + code) : "") : ""; }
let undoTimer = null;

function pvReset() { pv.folder = ""; pv.list = ""; pv.type = ""; pv.field = ""; pv.page = 0; pvClearSel(); }
function pvClearSel() { pv.sel.clear(); pv.editing.clear(); pv.edits = {}; }
function pvFieldLabel(f) {
  if (f === "dup") return t("pv.field.dup");
  if (f === "example") return t("card.example");
  if (f === "pos") return t("pv.field.posAll");
  if (f === "typed") return t("pv.field.typed");
  if (isTypedField(f)) { const k = f.slice(2); return t(k === "examples" ? "type.rule.examples" : k === "hint" ? "type.hint" : "type." + k).replace(/\s*:\s*$/, ""); }
  if (isPosField(f)) return t("pv.field.pos", { lang: langName(f.slice(4)) });
  return langName(f);
}
function liveProposals() {
  const ids = new Set(state.cards.map(c => c.id));
  return state.proposals.filter(p => p.field === "new" ? !!getList(p.listId) : ids.has(p.cardId));
}
// Liste d'une proposition (« Nouvelle carte » : liste de destination).
function pvListOf(p, cards) { if (p.field === "new") return p.listId; const c = cards.get(p.cardId); return c ? c.listId : ""; }
function renderPendingBadge() {
  const b = $("#pendingBadge");
  if (!b) return;
  const n = Storage.getUser() ? liveProposals().length : 0;
  b.hidden = !n;
  b.textContent = n > 99 ? "99+" : String(n);
}

// Menu « Sélectionner » : tailles proposées.
const PV_SEL_SIZES = [50, 100, 200, 500];
// Remplace la sélection : "none", "all" (toutes les lignes filtrées) ou N lignes à partir de la 1re ligne de la page en cours.
function pvSelect(vis, v) {
  pv.sel.clear();
  if (v === "none") return;
  if (v === "all") { for (let i = 0; i < vis.length; i++) pv.sel.add(vis[i].id); return; }
  const n = parseInt(v, 10);
  if (!(n > 0)) return;
  const start = Math.min(Math.max(0, pv.page | 0) * CONFIG.PV_PAGE, vis.length);
  const end = Math.min(start + n, vis.length);
  for (let i = start; i < end; i++) pv.sel.add(vis[i].id);
}

function renderPending() {
  const root = $("#screen-pending");
  root.textContent = "";
  const qb = queueBanner();             // demandes à Claude en cours (file d'attente)
  if (qb) root.appendChild(qb);
  const all = liveProposals();
  if (!all.length) { pvClearSel(); root.appendChild(el("div", "empty", t("pv.empty"))); return; }
  const cards = new Map(state.cards.map(c => [c.id, c]));
  const listIds = new Set(all.map(p => pvListOf(p, cards)));
  if (pv.list && !listIds.has(pv.list)) pv.list = "";
  const folderIds = new Set([...listIds].map(pvFolderOf));
  if (pv.folder && !folderIds.has(pv.folder)) pv.folder = "";
  if (pv.list && pv.folder && pvFolderOf(pv.list) !== pv.folder) pv.list = "";
  if (pv.field && !all.some(p => pvFieldMatch(p, pv.field))) pv.field = "";
  if (pv.type && !all.some(p => p.type === pv.type)) pv.type = "";
  const vis = all.filter(p => (!pv.folder || pvFolderOf(pvListOf(p, cards)) === pv.folder) && (!pv.list || pvListOf(p, cards) === pv.list) && (!pv.type || p.type === pv.type) && (!pv.field || pvFieldMatch(p, pv.field)));
  const visIds = new Set(vis.map(p => p.id));
  [...pv.sel].forEach(id => { if (!visIds.has(id)) pv.sel.delete(id); });
  [...pv.editing].forEach(id => { if (!visIds.has(id)) pv.editing.delete(id); });

  // Filtres
  const f = el("div", "pv-filters");
  const mkSel = (value, opts, onCh) => {
    const s = el("select", "input");
    opts.forEach(([v, l]) => { const o = el("option", null, l); o.value = v; s.appendChild(o); });
    s.value = value;
    s.addEventListener("change", () => { onCh(s.value); pv.page = 0; renderPending(); });
    return s;
  };
  if (state.folders.length) {
    const fopts = sortedFolders().filter(x => folderIds.has(x.id)).map(x => [x.id, x.name]);
    if (folderIds.has("__none__")) fopts.push(["__none__", t("folders.none")]);
    f.classList.add("four");
    f.appendChild(mkSel(pv.folder, [["", t("pv.allFolders")]].concat(fopts), v => { pv.folder = v; pv.list = ""; }));
  }
  f.append(
    mkSel(pv.list, [["", t("pv.allLists")]].concat(orderedLists().filter(l => listIds.has(l.id) && (!pv.folder || pvFolderOf(l.id) === pv.folder)).map(l => [l.id, l.name])), v => { pv.list = v; }),
    mkSel(pv.type, [["", t("pv.allTypes")], ["completion", t("pv.type.completion")], ["correction", t("pv.type.correction")]]
      .concat(all.some(p => p.type === "newcard") ? [["newcard", t("pv.type.newcard")]] : []), v => { pv.type = v; }),
    mkSel(pv.field, [["", t("pv.allFields")]].concat(PV_FIELDS.filter(x => all.some(p => pvFieldMatch(p, x))).map(x => [x, pvFieldLabel(x)])), v => { pv.field = v; })
  );
  root.appendChild(f);

  // Page affichée
  const pages = Math.max(1, Math.ceil(vis.length / CONFIG.PV_PAGE));
  pv.page = Math.min(Math.max(0, pv.page | 0), pages - 1);
  const pageItems = vis.slice(pv.page * CONFIG.PV_PAGE, (pv.page + 1) * CONFIG.PV_PAGE);

  // Sélection + actions (collées en haut pendant le défilement)
  const sticky = el("div", "pv-sticky");
  const bar = el("div", "pv-bar");
  const menu = el("select", "input pv-selmenu");
  menu.setAttribute("aria-label", t("pv.selMenu"));
  [["", t("pv.selMenu")]].concat(PV_SEL_SIZES.map(n => [String(n), t("pv.selN", { n })]), [["all", t("pv.selAll", { n: vis.length })], ["none", t("pv.selNone")]])
    .forEach(([v, l]) => { const o = el("option", null, l); o.value = v; menu.appendChild(o); });
  menu.addEventListener("change", () => {
    const v = menu.value;
    menu.value = "";
    if (!v) return;
    pvSelect(vis, v);
    renderPending();
  });
  const count = el("span", "pv-count");
  bar.append(menu, count);
  sticky.appendChild(bar);
  // Compteur sans réafficher les lignes (appelé aussi quand on coche une ligne).
  const refresh = () => { count.textContent = t("pv.selectedOf", { n: pv.sel.size, total: vis.length }); };
  pv.refreshBar = refresh;
  refresh();
  const acts = el("div", "btns three");
  const bA = el("button", "btn primary", t("pv.accept"));
  const bR = el("button", "btn danger", t("pv.reject"));
  const bE = el("button", "btn", t("pv.edit"));
  bA.addEventListener("click", pvAccept);
  bR.addEventListener("click", pvReject);
  bE.addEventListener("click", pvEdit);
  acts.append(bA, bR, bE);
  sticky.appendChild(acts);
  if (pv.editing.size) sticky.appendChild(el("div", "pv-hint", t("pv.editHint")));
  root.appendChild(sticky);

  if (!vis.length) { root.appendChild(el("div", "empty", t("lists.noResults"))); return; }
  const pager = () => {
    const w = el("div", "pv-pager");
    if (pages < 2) return null;
    const prev = el("button", "btn", "‹"), next = el("button", "btn", "›");
    prev.setAttribute("aria-label", t("pv.prev")); next.setAttribute("aria-label", t("pv.next"));
    prev.disabled = pv.page === 0; next.disabled = pv.page >= pages - 1;
    const go = d => { pv.page += d; renderPending(); try { root.scrollIntoView({ block: "start" }); } catch (e) { window.scrollTo(0, 0); } };
    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    w.append(prev, el("span", null, t("pv.page", { i: pv.page + 1, n: pages })), next);
    return w;
  };
  const p1 = pager();
  if (p1) root.appendChild(p1);
  const items = el("div", "items");
  pageItems.forEach(p => items.appendChild(p.field === "new" ? pvNewRow(p) : pvRow(p, cards.get(p.cardId))));
  root.appendChild(items);
  const p2 = pager();
  if (p2) root.appendChild(p2);
}

// Case d'une ligne : met à jour la sélection, la ligne et la barre, sans réafficher l'écran.
function pvRowCheck(row, cb, id) {
  cb.addEventListener("change", () => {
    if (cb.checked) pv.sel.add(id); else pv.sel.delete(id);
    row.classList.toggle("sel", cb.checked);
    if (pv.refreshBar) pv.refreshBar();
  });
}

function pvRow(p, c) {
  const row = el("label", "pv-row" + (pv.sel.has(p.id) ? " sel" : ""));
  const cb = el("input", "pv-cb");
  cb.type = "checkbox";
  cb.checked = pv.sel.has(p.id);
  pvRowCheck(row, cb, p.id);
  const m = el("div", "main");
  const top = el("div", "pv-top");
  const l = getList(c.listId);
  top.append(el("span", "tag", "▸ " + (l ? l.name : "")), el("span", "pv-type " + p.type, t("pv.type." + p.type)), el("span", "pv-field", pvFieldLabel(p.field)));
  const lg = cardLangs(c);
  const w = el("div", "pv-fr", targetTerm(c, lg) || "—"); w.lang = lg.target;
  m.append(top, w);
  if (p.field === "dup") {
    const sub = supportText(c, lg);
    if (sub) m.appendChild(el("div", "pv-field", sub));
    m.appendChild(el("div", "pv-act", "→ " + t("pv.dupAction")));
  } else if (isPosField(p.field)) { // nature : libellés lisibles, modification par liste déroulante
    const lng = p.field.slice(4);
    const d = el("div", "pv-diff");
    const oldT = pvPosText(p.oldValue, lng);
    d.appendChild(oldT ? el("div", "wr-diff", "") : el("div", "wr-diff muted", "—"));
    if (oldT) d.lastChild.appendChild(el("mark", "wr-bad", oldT));
    d.appendChild(el("span", "pv-arrow", "→"));
    const editing = pv.editing.has(p.id);
    if (!editing) { const nd = el("div", "wr-diff"); nd.appendChild(el("mark", "wr-miss", pvPosText(p.newValue, lng))); d.appendChild(nd); }
    m.appendChild(d);
    if (editing) {
      const ps = el("select", "input");
      const codes = posCodesFor(lng);
      const cur = pv.edits[p.id] != null ? pv.edits[p.id] : p.newValue;
      if (cur && !codes.includes(cur)) codes.push(cur);
      codes.forEach(pc => { const o = el("option", null, pvPosText(pc, lng)); o.value = pc; ps.appendChild(o); });
      ps.value = cur;
      ps.addEventListener("change", () => { pv.edits[p.id] = ps.value; });
      m.appendChild(ps);
    }
  } else {
    const r = wrLcs(p.oldValue, p.newValue);
    const d = el("div", "pv-diff");
    d.appendChild(p.oldValue ? wrDiffNode(r.A, r.ma, "wr-bad") : el("div", "wr-diff muted", "—"));
    d.appendChild(el("span", "pv-arrow", "→"));
    const editing = pv.editing.has(p.id);
    if (!editing) d.appendChild(wrDiffNode(r.B, r.mb, "wr-miss"));
    m.appendChild(d);
    if (editing) { // édition directe de la nouvelle valeur, puis « Accepter »
      const inp = textInput(pv.edits[p.id] != null ? pv.edits[p.id] : p.newValue, "", isLang(p.field) ? p.field : lg.target);
      inp.addEventListener("input", () => { pv.edits[p.id] = inp.value; });
      m.appendChild(inp);
    }
  }
  if (p.reason) m.appendChild(el("div", "pv-reason", p.reason));
  row.append(cb, m);
  return row;
}

// --- Propositions « Nouvelle carte » (écran « Générer des cartes ») ---
function pvNewRank(p) { return p.cards.some(d => d.type === "rule") ? 0 : 1; }
// Carte temporaire pour l'affichage (titres, sous-titres) d'un brouillon.
function draftCard(d, listId) {
  if (d.type === "vocab") return Object.assign(newCard(listId, d.fields.terms, d.fields.example, [], d.fields.pos), { id: "" });
  return Object.assign({ type: d.type, listId, id: "", examples: [] }, d.fields);
}
function pvNewRow(p) {
  const row = el("label", "pv-row" + (pv.sel.has(p.id) ? " sel" : ""));
  const cb = el("input", "pv-cb");
  cb.type = "checkbox";
  cb.checked = pv.sel.has(p.id);
  pvRowCheck(row, cb, p.id);
  const m = el("div", "main");
  const top = el("div", "pv-top");
  const l = getList(p.listId);
  const ty = p.cards[0].type;
  top.append(el("span", "tag", "▸ " + (l ? l.name : "")), el("span", "pv-type newcard", t("pv.type.newcard")), typeBadge(ty));
  if (p.cards.length > 1) top.appendChild(el("span", "pv-field", t("pv.newN", { n: p.cards.length })));
  m.appendChild(top);
  const lg = listLangs(p.listId);
  const editing = pv.editing.has(p.id);
  const ds = editing ? pv.edits[p.id] : p.cards;
  const box = el("div", "pv-new");
  if (ty === "conj") {
    const c0 = draftCard(ds[0], p.listId);
    const h = el("div", "pv-new-t1", c0.verb + " — " + tenseName(c0.lang, c0.tense)); h.lang = c0.lang;
    box.appendChild(h);
    const tb = el("table", "ty-table");
    ds.forEach((d, i) => {
      const c = draftCard(d, p.listId);
      const tr = el("tr");
      tr.appendChild(el("td", "muted", personLabel(c.lang, c.tense, c.person)));
      const td = el("td"); td.lang = c.lang;
      if (editing) { const inp = textInput(d.fields.answer, "", c.lang); inp.addEventListener("input", () => { d.fields.answer = inp.value; }); td.appendChild(inp); }
      else td.textContent = conjFull(c);
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    box.appendChild(tb);
    if (editing) pvNewInputs(box, ds, ["translation", "note"], lg);
    else {
      const extra = [ds[0].fields.translation, ds[0].fields.note].filter(Boolean).join(" · ");
      if (extra) box.appendChild(el("div", "pv-new-t2", extra));
    }
  } else if (editing) {
    pvNewInputs(box, ds, ty === "vocab" ? ["t:" + lg.target].concat(lg.support.map(x => "t:" + x), ["example"]) : (TYPE_FIELDS[ty] || []).filter(f => !["lang", "ruleId"].includes(f)).concat(ty === "rule" ? ["examples"] : []), lg);
  } else {
    const d = ds[0], c = draftCard(d, p.listId);
    const t1 = el("div", "pv-new-t1", ty === "vocab" ? (term(c, lg.target) + (d.fields.pos && d.fields.pos[lg.target] ? "  " + posLabel(d.fields.pos[lg.target], lg.target) : "")) : cardTitle(c));
    t1.lang = ty === "vocab" ? lg.target : c.lang;
    box.appendChild(t1);
    const sub = ty === "vocab" ? supportText(c, lg) : cardSubtitle(c);
    if (sub) box.appendChild(el("div", "pv-new-t2", sub));
    const more = ty === "vocab" ? [d.fields.example] : [d.fields.hint ? t("type.hint") + " " + d.fields.hint : "", d.fields.explanation, ty === "rule" ? arr(d.fields.examples).join(" · ") : "", d.fields.translation];
    more.filter(Boolean).forEach(x => box.appendChild(el("div", "pv-new-t2", x)));
    if (d.ruleRef) box.appendChild(el("div", "pv-new-t2", "§ " + d.ruleRef));
  }
  m.appendChild(box);
  if (p.reason) m.appendChild(el("div", "pv-reason", p.reason));
  row.append(cb, m);
  return row;
}
// Champs modifiables d'un brouillon (la ligne reste un <label> : les clics sur les champs ne cochent pas la case).
function pvNewInputs(box, ds, fields, lg) {
  const w = el("div", "pv-edit");
  const d = ds[0];
  const stop = e => { e.stopPropagation(); };
  fields.forEach(f => {
    let label, get, set, multi = false, lng = d.fields.lang || lg.target;
    if (f.startsWith("t:")) { const code = f.slice(2); label = langName(code); lng = code; get = () => (d.fields.terms || {})[code] || ""; set = v => { d.fields.terms = Object.assign({}, d.fields.terms, { [code]: v }); }; }
    else if (f === "examples") { label = t("type.rule.examples"); multi = true; get = () => arr(d.fields.examples).join("\n"); set = v => { d.fields.examples = v.split("\n").map(x => x.trim()).filter(Boolean); }; }
    else {
      const LBL = { example: "card.example", sentence: "type.cloze.sentence", answer: "type.cloze.answer", hint: "type.hint", explanation: "type.explanation",
        translation: "type.translation", wrong: "type.fix.wrong", correct: "type.fix.correct", title: "type.rule.title", body: "type.rule.body", note: "type.note" };
      label = t(LBL[f] || "type." + f).replace(/\s*:\s*$/, "");
      multi = f === "body";
      get = () => d.fields[f] || "";
      set = v => { ds.forEach(x => { x.fields[f] = v; }); };   // conjugaison : traduction / note communes au tableau
    }
    w.appendChild(el("label", null, label));
    const inp = multi ? el("textarea", "input") : textInput(get(), "", ["translation", "explanation", "hint", "note"].includes(f) ? "" : lng);
    if (multi) inp.value = get();
    inp.addEventListener("input", () => set(inp.value));
    inp.addEventListener("click", stop);
    w.appendChild(inp);
  });
  box.appendChild(w);
}
// Crée les cartes d'une proposition dans sa liste. Renvoie { added, dupOnly }.
function pvAcceptNew(p, edited) {
  const listId = p.listId;
  if (!getList(listId)) return { added: 0, dupOnly: true };
  const lg = listLangs(listId);
  const ds = edited || p.cards;
  const have = new Set(cardsOf(listId).map(c => isVocab(c) ? "vocab|" + dupKey(c.terms, lg) : typedKey(c.type, c)));
  const fresh = [];
  let dups = 0, bad = 0;
  ds.forEach(d => {
    let c;
    if (d.type === "vocab") {
      const terms = {}; Object.keys(d.fields.terms || {}).forEach(k => { const v = String(d.fields.terms[k] || "").replace(/\s+/g, " ").trim(); if (v) terms[k] = v; });
      c = newCard(listId, terms, String(d.fields.example || "").trim(), [], d.fields.pos || {});
    } else c = newTypedCard(listId, d.type, Object.assign({}, d.fields, { lang: d.fields.lang || lg.target }));
    const k = isVocab(c) ? "vocab|" + dupKey(c.terms, lg) : typedKey(c.type, c);
    if (have.has(k)) { dups++; return; }
    if (!cardUsable(c, lg)) { bad++; return; }
    if (d.ruleRef) {
      const r = state.cards.concat(fresh).find(x => x.listId === listId && cardType(x) === "rule" && normText(x.title) === normText(d.ruleRef));
      if (r) c.ruleId = r.id;
    }
    have.add(k);
    fresh.push(c);
  });
  if (bad) return { added: 0, dupOnly: false };            // une case non valide : rien n'est créé, la ligne reste (à modifier)
  state.cards.push(...fresh);
  fresh.forEach(c => { if (isVocab(c)) state.checkedSig[c.id] = cardSig(c); });
  return { added: fresh.length, dupOnly: !fresh.length && dups > 0 };
}

function pvSelected() { return liveProposals().filter(p => pv.sel.has(p.id)); }
function pvSnapshot() {
  return { st: state, cards: JSON.stringify(state.cards), proposals: JSON.stringify(state.proposals),
    rejected: state.rejected.slice(), checkedSig: Object.assign({}, state.checkedSig) };
}

// --- Accepter / Refuser groupés : paquets de CONFIG.PV_CHUNK, reprise possible ---
let pvJob = null;   // traitement en cours { kind, stop }
// Reste à faire, gardé sur cet appareil : { kind: "accept"|"reject", ids, edits, total }
function pvJobKey() { return CONFIG.LS_USER_PREFIX + "pvJob:" + (Storage.getUser() || ""); }
function pvJobSaved() {
  try {
    const r = JSON.parse(localStorage.getItem(pvJobKey()) || "null");
    if (!r || !["accept", "reject"].includes(r.kind) || !Array.isArray(r.ids)) return null;
    const live = new Set(state.proposals.map(p => p.id));
    r.ids = r.ids.filter(id => live.has(id));   // déjà traitées (ou supprimées) : ignorées, pas de doublon
    return r.ids.length ? r : null;
  } catch (e) { return null; }
}
function pvJobStore(r) {
  try { if (r && r.ids.length) localStorage.setItem(pvJobKey(), JSON.stringify(r)); else localStorage.removeItem(pvJobKey()); } catch (e) {}
}

function pvAccept() { pvStart("accept"); }
function pvReject() { pvStart("reject"); }
function pvStart(kind) {
  if (pvJob) { toast(t("pv.busy")); return; }
  let sel = pvSelected();
  if (!sel.length) { toast(t("pv.pickOne")); return; }
  // Nouvelles cartes : fiches de règle d'abord (pour relier les textes à trous / phrases à corriger acceptés en même temps)
  if (kind === "accept") {
    const rank = p => p.field === "new" ? pvNewRank(p) : 2;
    sel = sel.map((p, i) => [p, i]).sort((x, y) => rank(x[0]) - rank(y[0]) || x[1] - y[1]).map(x => x[0]);
  }
  const edits = {};
  if (kind === "accept") sel.forEach(p => { if (pv.editing.has(p.id) && pv.edits[p.id] != null) edits[p.id] = pv.edits[p.id]; });
  pvRun(kind, sel.map(p => p.id), edits, pvSnapshot());
}

// snap : état d'avant (bouton « Annuler ») ; null pour une reprise.
async function pvRun(kind, ids, edits, snap) {
  if (pvJob) { toast(t("pv.busy")); return; }
  const st = state, who = Storage.getUser();
  const job = { kind, stop: false };
  pvJob = job;
  let rest = ids.slice();
  const total = rest.length;
  let ok = 0, skipped = 0, n = 0, prog = null;
  pvJobStore({ kind, ids: rest, edits, total });
  renderResumeBars();
  Wake.on();
  if (total > CONFIG.PV_CHUNK) {
    prog = openProgress(t("pv.progressTitle." + kind), t("pv.progress", { i: 0, n: total }),
      [{ label: t("pv.stop"), onClick: () => { job.stop = true; } }]);
  }
  try {
    while (rest.length && !job.stop) {
      if (state !== st || Storage.getUser() !== who) return;   // compte changé entre-temps
      const part = rest.slice(0, CONFIG.PV_CHUNK);
      const r = kind === "accept" ? pvAcceptPart(part, edits) : pvRejectPart(part);
      ok += r.ok; skipped += r.skipped;
      rest = rest.slice(part.length);
      n += part.length;
      state.updatedAt = Date.now();
      Storage.save(state);                                    // paquet enregistré avant le suivant
      QStats.flush();                                         // compteurs du paquet : un seul envoi (mis en attente hors connexion)
      pvJobStore(rest.length ? { kind, ids: rest, edits, total } : null);
      renderPendingBadge();
      if (prog) prog.set(n / total, t("pv.progress", { i: n, n: total }));
      await yieldUI();                                        // l'écran reste fluide
    }
  } finally {
    if (pvJob === job) pvJob = null;
    Wake.off();
    if (prog) prog.close();
  }
  if (state !== st || Storage.getUser() !== who) return;
  if (ok || skipped) Activity.log("validate", { action: kind, n: ok, skipped });   // journal : une action groupée = un événement
  Storage.flushNow();
  pvClearSel();
  render();
  const msg = (kind === "accept" ? t("pv.accepted", { n: ok }) + (skipped ? t("pv.skipped", { n: skipped }) : "") : t("pv.rejected", { n: ok }));
  if (rest.length) toast(msg);                // arrêté : bandeau « Reprendre / Abandonner »
  else if (snap) showUndo(msg, snap);
  else toast(msg);
}

// Un paquet d'acceptations (même règles qu'avant). Renvoie { ok, skipped }.
function pvAcceptPart(ids, edits) {
  const want = new Set(ids);
  const sel = state.proposals.filter(p => want.has(p.id));
  const order = new Map(ids.map((id, i) => [id, i]));
  sel.sort((a, b) => order.get(a.id) - order.get(b.id));
  let ok = 0, skipped = 0;
  const done = new Set(), removed = new Set();
  sel.filter(p => p.field === "new").forEach(p => {
    const r = pvAcceptNew(p, edits[p.id] != null ? edits[p.id] : null);
    if (r.added) { ok++; done.add(p.id); QStats.decide(p, "accepted"); }
    else if (r.dupOnly) { skipped++; done.add(p.id); }   // déjà dans la liste : la proposition disparaît
    else skipped++;                                      // non valide : la ligne reste
  });
  const cards = new Map(state.cards.map(c => [c.id, c]));
  sel.filter(p => p.field !== "new").forEach(p => {
    const c = cards.get(p.cardId);
    if (!c || removed.has(c.id)) { done.add(p.id); return; }
    if (p.field === "dup") {
      removed.add(c.id);
      delete state.checkedSig[c.id];
      done.add(p.id); ok++;
      return;
    }
    const edited = edits[p.id] != null;
    let nv = String(edited ? edits[p.id] : p.newValue).replace(/\s+/g, " ").trim();
    if (isPosField(p.field)) nv = parsePos(nv, p.field.slice(4)); // nature non valide : la ligne reste
    const cur = fieldVal(c, p.field);
    const stale = p.type === "completion" ? !!cur.trim() : cur !== p.oldValue; // champ modifié entre-temps : jamais écrasé
    if (stale) { done.add(p.id); skipped++; return; }
    const next = Object.assign({}, c, { terms: Object.assign({}, c.terms), pos: Object.assign({}, c.pos) });
    setFieldVal(next, p.field, nv);
    if (!nv || !cardUsable(next)) { skipped++; return; } // valeur non valide : la ligne reste
    setFieldVal(c, p.field, nv);
    c.auto = c.auto.filter(a => a !== (p.field === "example" ? "example" : isPosField(p.field) ? "pos." + p.field.slice(4) : "terms." + p.field)); // validé à la main
    if (isVocab(c)) state.checkedSig[c.id] = cardSig(c);
    done.add(p.id); ok++;
    QStats.decide(p, "accepted");                        // suivi admin (proposition venue de la file d'attente)
  });
  if (removed.size) state.cards = state.cards.filter(c => !removed.has(c.id));
  const cardIds = new Set(state.cards.map(c => c.id));
  const listIds = new Set(state.lists.map(l => l.id));
  state.proposals = state.proposals.filter(p => !done.has(p.id) && (p.field === "new" ? listIds.has(p.listId) : cardIds.has(p.cardId)));
  return { ok, skipped };
}

// Un paquet de refus. Renvoie { ok, skipped }.
function pvRejectPart(ids) {
  const want = new Set(ids);
  const sel = state.proposals.filter(p => want.has(p.id));
  const have = new Set(state.rejected);
  sel.forEach(p => {
    const ks = p.field === "new"
      ? p.cards.map(d => rejectKey(p.listId, "new", draftKey(d, listLangs(p.listId))))   // ne sera plus proposée par « Générer »
      : [rejectKey(p.cardId, p.field, p.newValue)];
    ks.forEach(k => { if (!have.has(k)) { have.add(k); state.rejected.push(k); } });
    QStats.decide(p, "rejected");                        // suivi admin (proposition venue de la file d'attente)
  });
  if (state.rejected.length > CONFIG.REJECT_MAX) state.rejected = state.rejected.slice(-CONFIG.REJECT_MAX);
  const done = new Set(sel.map(p => p.id));
  state.proposals = state.proposals.filter(p => !done.has(p.id));
  return { ok: sel.length, skipped: 0 };
}

function pvEdit() {
  const sel = pvSelected().filter(p => p.field !== "dup");
  if (!sel.length) { toast(t("pv.pickOne")); return; }
  sel.forEach(p => { pv.editing.add(p.id); if (pv.edits[p.id] == null) pv.edits[p.id] = p.field === "new" ? JSON.parse(JSON.stringify(p.cards)) : p.newValue; });
  renderPending();
  setTimeout(() => { try { const i = $("#screen-pending .pv-row .input"); if (i) i.focus(); } catch (e) {} }, 50);
}

// Barre « Annuler » : restaure cartes, propositions et refus d'avant l'action groupée.
function showUndo(msg, snap) {
  let bar = $("#undoBar");
  if (!bar) {
    bar = el("div", "undo-bar");
    bar.id = "undoBar";
    bar.append(el("span"), el("button"));
    document.body.appendChild(bar);
  }
  const hide = () => { bar.classList.remove("show"); clearTimeout(undoTimer); };
  bar.firstChild.textContent = msg;
  const btn = bar.lastChild;
  btn.textContent = t("pv.undo");
  btn.onclick = () => {
    hide();
    if (state !== snap.st) return; // compte changé entre-temps
    try {
      state.cards = JSON.parse(snap.cards);
      state.proposals = JSON.parse(snap.proposals);
      state.proposals.forEach(p => { if (p.reqId && QStats.wasCounted(p.id)) p.qc = true; }); // déjà comptée : pas deux fois
      state.rejected = snap.rejected;
      state.checkedSig = snap.checkedSig;
      commit();
      toast(t("pv.undone"));
    } catch (e) {}
  };
  bar.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hide, CONFIG.UNDO_MS);
}

// === ANNONCES ===
// Étape 27, mode Supabase seulement (script supabase-etape27.sql). Au lancement (après l'ouverture des données),
// fonction my_announcements : annonces actives qui visent ce compte et pas encore lues (un admin n'en reçoit pas).
// Une fenêtre par annonce, l'une après l'autre, qui ne se ferme qu'avec « OK » ; « OK » enregistre la lecture
// (announcement_mark_read), une seule fois par compte. Hors connexion : lecture gardée sur l'appareil
// (vocabfr.ann:read:<compte>), l'annonce n'est plus montrée ici et la lecture est renvoyée au lancement suivant.
// Langue : celle de l'interface, sinon une autre langue disponible (français, anglais, coréen, dans cet ordre).
// Script pas lancé : rien ne s'affiche, sans erreur.
const Ann = (() => {
  const FALLBACK = ["fr", "en", "ko"];
  let busy = false, token = 0;
  const shown = new Set();
  function key() { return CONFIG.LS_USER_PREFIX + "ann:read:" + auth.sbUid; }
  function pending() { try { return arr(JSON.parse(localStorage.getItem(key()) || "[]")).filter(x => UUID_RE.test(String(x))); } catch (e) { return []; } }
  function setPending(ids) { try { if (ids.length) localStorage.setItem(key(), JSON.stringify(ids.slice(-100))); else localStorage.removeItem(key()); } catch (e) {} }
  // Langue à afficher : interface, puis français, anglais, coréen ; seulement une langue qui a un texte.
  function pickLang(a, ui) {
    const has = l => !!(a && ((a.body && String(a.body[l] || "").trim()) || (a.title && String(a.title[l] || "").trim())));
    return [ui].concat(FALLBACK.filter(l => l !== ui)).find(has) || null;
  }
  function texts(a, ui) {
    const l = pickLang(a, ui);
    if (!l) return null;
    return { lang: l, title: String((a.title && a.title[l]) || "").trim(), body: String((a.body && a.body[l]) || "").trim() };
  }
  async function send(id) {
    try { await aqRpc("announcement_mark_read", { p_id: id }); return true; } catch (e) { return false; }
  }
  async function markRead(id) {
    const p = pending();
    if (!p.includes(id)) { p.push(id); setPending(p); }
    if (await send(id)) setPending(pending().filter(x => x !== id));
  }
  async function flush() {
    for (const id of pending()) { if (await send(id)) setPending(pending().filter(x => x !== id)); else break; }
  }
  function showOne(a) {
    return new Promise(res => {
      const tx = texts(a, state.settings.uiLang);
      if (!tx) { res(); return; }
      const body = el("div", "ann-body", tx.body);
      body.lang = tx.lang;
      openModal(tx.title || t("ann.title"), body, [
        { label: t("ann.ok"), kind: "primary", onClick: () => { markRead(a.id); res(); } }
      ], { locked: true });
      const hs = document.querySelectorAll(".modal-bg .modal h3"), h = hs[hs.length - 1];
      if (h && tx.title) h.lang = tx.lang;
    });
  }
  async function check() {
    if (busy || auth.mode !== "supabase" || !auth.sbUid || auth.isAdmin || !Supa.client()) return;
    busy = true;
    const my = ++token, who = auth.sbUid;
    try {
      await flush();
      const list = arr(await aqRpc("my_announcements"));
      const done = new Set(pending());
      for (const a of list) {
        if (my !== token || auth.sbUid !== who || !Storage.getUser()) break;
        if (!a || !a.id || done.has(a.id) || shown.has(a.id)) continue;
        shown.add(a.id);
        await showOne(a);
      }
    } catch (e) { /* script de l'étape 27 pas lancé, ou hors connexion : rien */ }
    finally { busy = false; }
  }
  function reset() { token++; busy = false; shown.clear(); }
  return { check, reset, pickLang, texts };
})();

// Écran #admin, visible seulement par l'admin (mode Supabase, compte présent dans la table admins).
// Liste des comptes (fonction admin_list_accounts), réinitialiser le PIN (admin_reset_pin : changement obligatoire ensuite),
// exporter / importer les données d'un compte, copier des dossiers ou des listes vers un autre compte,
// supprimer un compte (admin_delete_account, double confirmation). Les fonctions SQL vérifient que l'appelant est admin.
// Étape 26 : toucher un compte de la liste ouvre sa fiche (#admin-fiche, voir « Fiche d'un compte » plus bas) ;
// les actions (PIN, export, import, copie, suppression) restent dans le menu « Actions… » de la fiche.
// Étape 27 : bloquer / réactiver (menu « Actions… » de la fiche, état visible dans la liste et la fiche), annonces
// (#admin-annonces) et listes modèles (#admin-modeles) — voir « Gestion des comptes (admin, étape 27) » plus bas.
// Données d'un autre compte : lignes user_data lues / écrites directement (RLS : accès total pour l'admin).

// --- Série d'un compte (étape 28) : admin_streak_get, puis admin_streak_set / _restore / _freezes ---
// La modification est écrite par Supabase dans la clé streak du compte (adjustments) et notée au journal (admin_streak_*) ;
// l'appli du compte l'applique et affiche un message à son lancement suivant. Script pas lancé : « Lancez le script… ».
function skAdmErr(e) {
  if (alIsMissing(e)) return t("st28.missing");
  const h = String((e && e.hint) || "");
  if (["reason", "value", "nolost", "freezes_max", "freezes_min"].includes(h)) return t("sk.adm.err." + h);
  if (h === "gone") return t("dash.accGone");
  return aqErrText(e);
}
async function skAdmin(a, kind) {
  let info;
  try { info = await aqRpc("admin_streak_get", { p_user: a.user_id, p_tz: dashTz() }); }
  catch (e) { toast(skAdmErr(e)); return; }
  if (!info) { toast(t("dash.accGone")); return; }
  const sk = info.streak || {}, cur = num(Number(sk.current), 0), fr = num(Number(sk.freezes), 0), lostV = num(Number(sk.lost_value), 0);
  if (kind === "restore" && lostV <= 0) { toast(t("sk.adm.err.nolost")); return; }
  const wrap = el("div");
  wrap.appendChild(el("p", "sk-adm-cur", t("sk.adm.cur", { n: cur, b: num(Number(sk.best), 0), f: fr, m: STREAK_MAX_FREEZES })));
  const f = { value: cur, delta: 0 };
  if (kind === "set") {
    const inp = el("input", "input");
    inp.type = "number"; inp.min = "0"; inp.max = "10000"; inp.inputMode = "numeric"; inp.value = String(cur);
    inp.addEventListener("input", () => { f.value = inp.value; });
    wrap.appendChild(formField(t("sk.adm.newValue"), inp, true));
  } else if (kind === "restore") {
    wrap.appendChild(el("p", null, t("sk.adm.restoreAsk", { n: lostV + cur, l: lostV,
      d: sk.lost_day ? dashBucketLabel(sk.lost_day, false, true) : "?" })));
  } else {
    const seg = el("div", "sk-seg");
    [-2, -1, 1, 2].forEach(d => {
      const b = el("button", null, (d > 0 ? "+" : "−") + Math.abs(d));
      b.type = "button";
      const ok = fr + d >= 0 && fr + d <= STREAK_MAX_FREEZES;
      b.disabled = !ok;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => { f.delta = d; seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
      seg.appendChild(b);
    });
    wrap.appendChild(formField(t("sk.adm.delta"), seg, true, t("sk.adm.deltaHint", { m: STREAK_MAX_FREEZES })));
  }
  const ta = el("textarea", "input blk-ta");
  ta.maxLength = 300; ta.rows = 3;
  wrap.appendChild(formField(t("blk.reason"), ta, true, t("sk.adm.reasonHint")));
  let busy = false;
  const title = t("sk.adm." + kind) + " — " + a.identifiant;
  const close = openModal(title, wrap, [
    { label: t("cancel") },
    { label: t("sk.adm.apply"), kind: "primary", onClick: () => {
      const reason = ta.value.trim();
      if (kind === "set" && (!/^\d{1,5}$/.test(String(f.value).trim()) || Number(f.value) > 10000)) { toast(t("sk.adm.err.value")); return false; }
      if (kind === "freezes" && !f.delta) { toast(t("sk.adm.err.value")); return false; }
      if (!reason) { toast(t("sk.adm.err.reason")); ta.focus(); return false; }
      if (busy) return false;
      busy = true;
      (async () => {
        try {
          const args = { p_user: a.user_id, p_reason: reason, p_tz: dashTz() };
          let r;
          if (kind === "set") r = await aqRpc("admin_streak_set", Object.assign(args, { p_value: Number(f.value) }));
          else if (kind === "restore") r = await aqRpc("admin_streak_restore", args);
          else r = await aqRpc("admin_streak_freezes", Object.assign(args, { p_delta: f.delta }));
          const ns = (r && r.streak) || {};
          toast(t("sk.adm.done", { id: a.identifiant, n: num(Number(ns.current), 0), f: num(Number(ns.freezes), 0) }));
          close();
          if (currentScreen === "adminfiche") { fc.started = false; renderAdminFiche(); }
          else if (currentScreen === "admin") loadAdmin();
        } catch (e) { busy = false; toast(skAdmErr(e)); }
      })();
      return false;
    } }
  ]);
  setTimeout(() => { try { (wrap.querySelector("input") || ta).focus(); } catch (e) {} }, 50);
}

// Copie de dossiers et de listes vers un autre compte : nouvelles cartes sans progression.
// Les langues effectives sont recopiées (les réglages par défaut des deux comptes peuvent différer).
async function adminCopy(src) {
  let d;
  try { d = await admRead(src); } catch (e) { toast(t("admin.err")); return; }
  if (!d || !d.lists.length) { toast(t("admin.noData")); return; }
  const others = adm.list.filter(x => x.user_id !== src.user_id);
  const selF = new Set(), selL = new Set();
  const wrap = el("div");
  wrap.appendChild(el("p", "muted", t("admin.copyWhat")));
  const pick = el("div", "adm-pick");
  const byOrder = (x, y) => num(x.order, 0) - num(y.order, 0);
  const listBoxes = new Map();
  const checkRow = (label, cls, onChange) => {
    const r = el("label", "check" + (cls ? " " + cls : ""));
    const cb = el("input"); cb.type = "checkbox";
    cb.addEventListener("change", () => onChange(cb.checked));
    r.append(cb, el("span", null, label));
    pick.appendChild(r);
    return cb;
  };
  const listRow = (l, sub) => {
    const cb = checkRow(l.name + " (" + d.cards.filter(c => c.listId === l.id).length + ")", sub ? "sub" : "", v => { if (v) selL.add(l.id); else selL.delete(l.id); });
    listBoxes.set(l.id, cb);
  };
  d.folders.slice().sort(byOrder).forEach(f => {
    const lists = d.lists.filter(l => l.folderId === f.id).sort(byOrder);
    checkRow("📁 " + f.name, "", v => {
      if (v) selF.add(f.id); else selF.delete(f.id);
      lists.forEach(l => { const cb = listBoxes.get(l.id); if (cb) { cb.checked = v; if (v) selL.add(l.id); else selL.delete(l.id); } });
    });
    lists.forEach(l => listRow(l, true));
  });
  const loose = d.lists.filter(l => !l.folderId || !d.folders.some(f => f.id === l.folderId)).sort(byOrder);
  if (loose.length && d.folders.length) pick.appendChild(el("div", "hint", t("admin.noFolder")));
  loose.forEach(l => listRow(l, false));
  wrap.appendChild(pick);
  const sel = el("select", "input");
  others.forEach(o => { const op = el("option", null, o.identifiant); op.value = o.user_id; sel.appendChild(op); });
  wrap.appendChild(formField(t("admin.copyTo"), sel, false, t("admin.copyHint")));
  openModal(t("admin.copy"), wrap, [
    { label: t("cancel") },
    { label: t("confirm"), kind: "primary", onClick: () => {
      if (!selF.size && !selL.size) { toast(t("admin.copyNone")); return false; }
      const dest = others.find(o => o.user_id === sel.value);
      if (!dest) return false;
      runAdminCopy(d, dest, selF, selL);
    } }
  ]);
}
async function runAdminCopy(d, dest, selF, selL) {
  try {
    let out = await admRead(dest);
    out = out ? JSON.parse(JSON.stringify(out)) : emptyData();
    const acct = resolveLangs([{ target: d.settings.defaultTarget, support: d.settings.defaultSupport }]);
    const now = Date.now();
    const maxOrder = a => a.reduce((m, x) => Math.max(m, num(x.order, 0)), 0);
    let fo = maxOrder(out.folders), lo = maxOrder(out.lists);
    const fMap = {}, lMap = {};
    d.folders.filter(f => selF.has(f.id)).forEach(f => {
      const lg = resolveLangs([acct, f]);
      const nf = { id: uid(), name: f.name, order: ++fo, target: lg.target, support: lg.support.slice() };
      fMap[f.id] = nf.id; out.folders.push(nf);
    });
    d.lists.filter(l => selL.has(l.id)).forEach(l => {
      const f = l.folderId ? d.folders.find(x => x.id === l.folderId) : null;
      const nl = { id: uid(), name: l.name, folderId: (l.folderId && fMap[l.folderId]) || null, order: ++lo, createdAt: now };
      if (l.target) { nl.target = l.target; nl.support = arr(l.support).slice(); }
      else if (!nl.folderId) { const lg = resolveLangs([acct, f, l]); nl.target = lg.target; nl.support = lg.support.slice(); }
      lMap[l.id] = nl.id; out.lists.push(nl);
    });
    let n = 0;
    const idMap = {};
    d.cards.forEach(c => {
      if (!lMap[c.listId]) return;
      const nc = JSON.parse(JSON.stringify(c));
      nc.id = uid(); nc.listId = lMap[c.listId];
      nc.box = 0; nc.dueAt = now; nc.stats = { seen: 0, correct: 0, wrong: 0, lastSeen: null };
      out.cards.push(nc); n++;
      idMap[c.id] = nc.id;
    });
    out.cards.forEach(c => { if (c.ruleId && idMap[c.ruleId]) c.ruleId = idMap[c.ruleId]; }); // lien vers la règle copiée
    out = normalizeData(out);
    await admWrite(dest, out);
    toast(t("admin.copyDone", { folders: Object.keys(fMap).length, lists: Object.keys(lMap).length, cards: n, id: dest.identifiant }));
    Activity.log("admin_copy", { target: dest.identifiant, folders: Object.keys(fMap).length, lists: Object.keys(lMap).length, cards: n });
    loadAdmin();
  } catch (e) { toast(t("admin.err")); }
}

// --- Tableau de bord (admin, étape 25) : écran #admin, accueil de l'Administration ---
// Fonctions SQL du script supabase-etape25.sql (security definer, contrôle is_admin()) : admin_dash_kpis (chiffres clés,
// + ménage du journal > 90 j et du contenu des demandes Claude > 30 j), admin_dash_series (30 jours / 12 mois),
// admin_dash_rankings (top 10, 7 j / 30 j), admin_dash_alerts (seuil d'inactivité réglable, 7 j par défaut).
// « Aujourd'hui » = date dans le fuseau horaire de cet appareil. Graphiques SVG dessinés ici, à la largeur de l'écran ;
// toucher un graphique = valeur du point le plus proche. Export CSV (";" + UTF-8 avec BOM) sur chaque tableau.
// Script pas lancé : message « Lancez le script SQL de l'étape 25 », les autres écrans admin restent accessibles.
const DASH_CHARTS = [["reviews", "dash.ch.reviews"], ["active", "dash.ch.active"], ["new_accounts", "dash.ch.new"], ["cards_added", "dash.ch.added"], ["claude", "dash.ch.claude"]];
const DASH_RANKS = [["active", "dash.rk.active"], ["streaks", "dash.rk.streaks"], ["success", "dash.rk.success"], ["lists", "dash.rk.lists"]];
const dash = {
  kpis: null, series: {}, period: "day", rank: {}, rankDays: 7, alerts: null, inactive: 7,
  busy: {}, err: {}, missing: false, started: false, sel: {}
};
function dashTz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } }
function dashRerender() { if (currentScreen === "admin") renderAdmin(); }
// Charge une partie du tableau de bord ("kpis" | "series" | "rank" | "alerts"). Les autres parties restent affichées.
async function dashLoadPart(part) {
  const tz = dashTz();
  dash.busy[part] = true; dash.err[part] = "";
  dashRerender();
  try {
    if (part === "kpis") {
      const k = await aqRpc("admin_dash_kpis", { p_tz: tz });
      dash.kpis = k || {};
      alCleaned = true; aq.cleaned = true;            // ménage déjà fait par admin_dash_kpis
      if (Number(dash.kpis.cleaned_log) > 0) Activity.log("admin_activity_cleanup", { n: Number(dash.kpis.cleaned_log) });
    } else if (part === "series") {
      const p = dash.period;
      dash.series[p] = arr(await aqRpc("admin_dash_series", { p_tz: tz, p_period: p }));
    } else if (part === "rank") {
      const d = dash.rankDays;
      dash.rank[d] = (await aqRpc("admin_dash_rankings", { p_tz: tz, p_days: d })) || {};
    } else if (part === "alerts") {
      dash.alerts = (await aqRpc("admin_dash_alerts", { p_tz: tz, p_inactive: dash.inactive })) || {};
    }
    dash.missing = false;
  } catch (e) {
    if (alIsMissing(e)) {
      dash.missing = true;
      alCleanup();                                       // ménage par les fonctions des étapes 23 et 24
      if (!aq.cleaned) { aq.cleaned = true; aqRpc("admin_claude_cleanup").catch(() => {}); }
    }
    dash.err[part] = alIsMissing(e) ? t("dash.missing") : aqErrText(e);
  }
  dash.busy[part] = false;
  dashRerender();
}
function dashReload() {
  dash.started = true; dash.series = {}; dash.rank = {}; dash.sel = {};

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) { const n = document.createElementNS(SVGNS, tag); Object.keys(attrs || {}).forEach(k => n.setAttribute(k, attrs[k])); return n; }
// Graphique en ligne (une seule série) : axe des valeurs à gauche, quelques dates en bas, point touché mis en évidence.
function dashDrawChart(card, cap, data, key) {
  const month = dash.period === "month";
  const W = Math.max(240, Math.floor(card.clientWidth - 24)), H = 150;
  const m = { l: 34, r: 10, t: 10, b: 22 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = data.map(p => dashNum(p[key]));
  let max = Math.max(...vals, 0);
  // Échelle « ronde » : 1, 2, 5 × 10^n
  const nice = v => { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= v) return f * p; return 10 * p; };
  max = nice(max);
  const n = vals.length;
  const x = i => m.l + (n <= 1 ? pw / 2 : i * pw / (n - 1));
  const y = v => m.t + ph - (v / max) * ph;
  const svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, class: "dash-svg", role: "img", "aria-label": cap.previousSibling ? cap.previousSibling.textContent : "" });
  // Grille et valeurs (0, moitié, max)
  [0, max / 2, max].forEach(v => {
    svg.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "dash-grid" }));
    const tx = svgEl("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", class: "dash-axis" });
    tx.textContent = dashFmt(v);
    svg.appendChild(tx);
  });
  // Dates : début, milieu, fin
  [...new Set([0, Math.floor((n - 1) / 2), n - 1])].forEach(i => {
    if (i < 0) return;
    const tx = svgEl("text", { x: x(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", class: "dash-axis" });
    tx.textContent = dashBucketLabel(data[i].bucket, month, false);
    svg.appendChild(tx);
  });
  // Aire + ligne
  if (n) {
    const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1));
    svg.appendChild(svgEl("polygon", { points: x(0).toFixed(1) + "," + y(0) + " " + pts.join(" ") + " " + x(n - 1).toFixed(1) + "," + y(0), class: "dash-area" }));
    svg.appendChild(svgEl("polyline", { points: pts.join(" "), class: "dash-line" }));
  }
  // Points (petits) et repère du point touché
  const dots = svgEl("g");
  if (n <= 31) vals.forEach((v, i) => dots.appendChild(svgEl("circle", { cx: x(i), cy: y(v), r: 2.5, class: "dash-dot" })));
  svg.appendChild(dots);
  const guide = svgEl("line", { y1: m.t, y2: m.t + ph, class: "dash-guide" });
  const mark = svgEl("circle", { r: 5, class: "dash-mark" });
  svg.append(guide, mark);
  const select = i => {
    i = Math.max(0, Math.min(n - 1, i));
    dash.sel[key] = i;
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i));
    mark.setAttribute("cx", x(i)); mark.setAttribute("cy", y(vals[i]));
    cap.textContent = dashBucketLabel(data[i].bucket, month, true) + " : " + dashFmt(vals[i]);
  };
  const pick = ev => {
    const r = svg.getBoundingClientRect();
    if (!r.width || !n) return;
    const px = (ev.clientX - r.left) * (W / r.width);
    select(Math.round(n <= 1 ? 0 : (px - m.l) / (pw / (n - 1))));
  };
  svg.addEventListener("pointerdown", ev => { pick(ev); try { svg.setPointerCapture(ev.pointerId); } catch (e) {} });
  svg.addEventListener("pointermove", ev => { if (ev.buttons || ev.pointerType === "mouse") pick(ev); });
  const old = card.querySelector("svg");
  if (old) old.remove();
  card.appendChild(svg);
  if (n) select(dash.sel[key] != null ? dash.sel[key] : n - 1);   // par défaut : dernier point (aujourd'hui / ce mois)
}

function aqStatsTable() {
  const rows = aq.stats.slice();

  rows.sort((a, b) => {
    let x = a[key], y = b[key];
    if (key === "identifiant") return dir * String(x || "").localeCompare(String(y || ""));
    if (key === "derniere_demande") { x = x ? Date.parse(x) : 0; y = y ? Date.parse(y) : 0; }
    else { x = Number(x) || 0; y = Number(y) || 0; }
    return dir * (x - y) || String(a.identifiant).localeCompare(String(b.identifiant));
  });
  const wrap = el("div", "aq-tablewrap");

      let v = r[k];
      if (k === "identifiant") v = String(v || "?");
      else if (k === "derniere_demande") { if (v && (!tot.derniere_demande || Date.parse(v) > Date.parse(tot.derniere_demande))) tot.derniere_demande = v; v = v ? admDate(v) : "—"; }
      else { v = num(Number(v), 0); tot[k] += v; }

// Export CSV des compteurs par compte (période choisie), avec la ligne Total, dans l'ordre de tri affiché.
function aqStatsCsv() {
  const rows = aq.stats.slice();
  const { key, dir } = aq.sort;
  rows.sort((a, b) => {
    let x = a[key], y = b[key];
    if (key === "identifiant") return dir * String(x || "").localeCompare(String(y || ""));
    if (key === "derniere_demande") { x = x ? Date.parse(x) : 0; y = y ? Date.parse(y) : 0; }
    else { x = Number(x) || 0; y = Number(y) || 0; }
    return dir * (x - y) || String(a.identifiant).localeCompare(String(b.identifiant));
  });
  const tot = AQ_COLS.map(([k]) => k === "identifiant" ? t("aq.totalRow") : k === "derniere_demande" ? "" : 0);
  const out = rows.map(r => AQ_COLS.map(([k], i) => {
    if (k === "identifiant") return String(r[k] || "?");
    if (k === "derniere_demande") { if (r[k] && (!tot[i] || Date.parse(r[k]) > Date.parse(tot[i]))) tot[i] = r[k]; return admDay(r[k]); }
    const v = num(Number(r[k]), 0); tot[i] += v; return v;
  }));
  const li = AQ_COLS.findIndex(([k]) => k === "derniere_demande");
  if (li >= 0) tot[li] = admDay(tot[li]);
  out.push(tot);
  dashSaveCsv("demandes-claude-" + (aq.period === "all" ? "tout" : aq.period + "j"), AQ_COLS.map(([, lab]) => t(lab)), out);
}

// --- Journal d'activité (admin, étape 24) : écran #admin-journal ---
// Fonctions SQL du script supabase-etape24.sql : admin_activity_log (filtres, page), admin_devices, admin_activity_cleanup.
// 50 lignes par page (seule la page affichée est dans le DOM). Filtres compte / type / période. Export CSV du journal filtré
// (séparateur ";", UTF-8 avec BOM pour Excel). Script pas lancé : message « Lancez le script SQL de l'étape 24 ».
const AL_PAGE = 50;
const AL_KINDS = ["login", "session", "cards_added", "import", "validate", "claude_request", "pin_change", "logout", "sync_error", "conflict",
  "friend_request", "friend_accept", "friend_remove", "friend_block", "admin_*"];
const al = { f: { user: "", kind: "", days: "7" }, page: 0, data: null, loading: false, err: "", missing: false };
let alCleaned = false;
function alIsMissing(e) {
  const code = String((e && e.code) || ""), msg = String((e && (e.message || e.msg)) || "");
  return ["PGRST202", "42883", "PGRST205", "42P01"].includes(code) || /could not find|does not exist|schema cache/i.test(msg);
}
function alErrText(e) { return alIsMissing(e) ? t("al.missing") : aqErrText(e); }
// Ménage des événements de plus de 90 jours, une fois par ouverture de l'appli (à l'ouverture de l'administration).
async function alCleanup() {
  if (alCleaned || auth.mode !== "supabase" || !auth.isAdmin) return;
  alCleaned = true;
  try { const n = await aqRpc("admin_activity_cleanup"); if (Number(n) > 0) Activity.log("admin_activity_cleanup", { n: Number(n) }); }
  catch (e) {}
}
function alDays(v) { return v === "1" ? 1 : v === "7" ? 7 : v === "30" ? 30 : null; }
function alArgs(page, size) {
  return { p_user: al.f.user || null, p_kind: al.f.kind || null, p_days: alDays(al.f.days), p_page: page, p_size: size };
}
async function alLoad() {
  al.loading = true; al.err = "";
  if (currentScreen === "adminlog") renderAdminLog();
  if (!adm.list) { try { adm.list = arr(await Supa.listAccounts()); } catch (e) {} }   // comptes du filtre
  alCleanup();
  try {
    const r = await aqRpc("admin_activity_log", alArgs(al.page, AL_PAGE));
    al.missing = false;
    al.data = { total: num(Number(r && r.total), 0), rows: arr(r && r.rows) };
    const pages = Math.max(1, Math.ceil(al.data.total / AL_PAGE));
    if (al.page > pages - 1 && al.page > 0) { al.page = pages - 1; al.loading = false; return alLoad(); }
  } catch (e) { al.data = null; al.missing = alIsMissing(e); al.err = alErrText(e); }
  al.loading = false;
  if (currentScreen === "adminlog") renderAdminLog();
}
function alKindLabel(k) {

  return I18N.fr["al.k." + k] ? t("al.k." + k) : k;

function alDevLabel(d) {
  if (!d) return "";
  return [t("al.dev." + (d.type || "desktop")), d.os, d.browser, d.installed ? t("al.installed") : t("al.browser")].filter(Boolean).join(" · ");

function alTime(s) {

// Détail lisible d'un événement (dans la langue de l'interface).
function alSummary(r) {
  const d = (r && r.data && typeof r.data === "object") ? r.data : {};
  const n = v => num(Number(v), 0);
  switch (r.kind) {
    case "login": return t("al.s.login." + (["pin", "create", "resume"].includes(d.via) ? d.via : "resume")) + (d.version ? " · v" + d.version : "");
    case "session": return t("al.s.session", { mode: I18N.fr["mode." + d.mode] ? t("mode." + d.mode) : String(d.mode || ""), n: n(d.cards),
      k: n(d.known), r: n(d.review), u: n(d.unknown), min: Math.max(0, Math.round(n(d.seconds) / 6) / 10) })
      + (d.lists ? " · " + t("al.s.lists", { n: n(d.lists) }) : "") + (d.lang ? " · " + String(d.lang).toUpperCase() : "");
    case "cards_added": return t("al.s.added", { n: n(d.n) }) + (d.list ? " · " + d.list : "");
    case "import": return t("al.s.import", { n: n(d.n), m: n(d.replaced) }) + (d.list ? " · " + d.list : "") + (d.stopped ? " · " + t("al.s.stopped") : "");
    case "validate": return t("al.s.validate." + (d.action === "reject" ? "reject" : "accept"), { n: n(d.n) }) + (d.skipped ? " · " + t("al.s.skipped", { n: n(d.skipped) }) : "");
    case "claude_request": return (I18N.fr["queue.kind." + d.type] ? t("queue.kind." + d.type) : String(d.type || "")) + " · " + t("queue.meta.cards", { n: n(d.cards) }) + (n(d.requests) > 1 ? " · ×" + n(d.requests) : "");
    case "sync_error": return String(d.msg || "");
    case "conflict": return t("al.s.conflict." + (d.choice === "local" ? "local" : "remote"));
    case "pin_change": return d.forced ? t("al.s.pinForced") : "";
    case "logout": return "";
    case "admin_streak_set": case "admin_streak_restore":   // étape 28
      return [d.target ? t("al.s.target", { id: d.target }) : "", t("al.s.streak", { b: n(d.before), v: n(d.value) }),
        d.reason ? t("al.s.reason", { r: d.reason }) : ""].filter(Boolean).join(" · ");
    case "admin_streak_freezes":
      return [d.target ? t("al.s.target", { id: d.target }) : "", t("al.s.freezes", { d: (n(d.value) > 0 || Number(d.value) > 0 ? "+" : "") + String(d.value), b: n(d.before) }),
        d.reason ? t("al.s.reason", { r: d.reason }) : ""].filter(Boolean).join(" · ");
  }
  const parts = [];
  if (d.target) parts.push(t("al.s.target", { id: d.target }));
  Object.keys(d).filter(k => k !== "target").forEach(k => parts.push(k + " : " + d[k]));
  return parts.join(" · ");
}

function renderAdminLog() {

  root.textContent = "";

  ref.addEventListener("click", alLoad);
  top.appendChild(ref);
  root.appendChild(top);

  if (al.missing) { root.appendChild(el("div", "card q-err", t("al.missing"))); return; }
  root.appendChild(el("p", "q-note", t("al.help")));
  root.appendChild(alFilters());

  bar.appendChild(csv);

    const fi = el("button", "btn", t("fc.open"));          // fiche du compte (étape 26)
    fi.addEventListener("click", () => openAccountFiche(al.f.user, "adminlog"));
    bar.appendChild(fi);

    prev.setAttribute("aria-label", t("pv.prev")); next.setAttribute("aria-label", t("pv.next"));

    const go = d => { al.page += d; alLoad().then(() => window.scrollTo(0, 0)); };
    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));

// Export CSV du journal filtré : toutes les pages (1000 lignes par appel, 50 000 max).
function csvCell(v) { const s = String(v == null ? "" : v); return /[";\r\n]/.test(s) || /^\s|\s$/.test(s) ? "\"" + s.replace(/"/g, "\"\"") + "\"" : s; }
function csvText(head, rows) { return "﻿" + [head].concat(rows).map(r => r.map(csvCell).join(";")).join("\r\n") + "\r\n"; }
async function alExportCsv() {
  const pg = openProgress(t("al.csv"), t("admin.loading"), []);
  const rows = [];
  try {
    for (let page = 0; page < 50; page++) {
      const r = await aqRpc("admin_activity_log", alArgs(page, 1000));
      const part = arr(r && r.rows);
      part.forEach(x => {
        const d = new Date(x.created_at);
        const iso = isNaN(d) ? String(x.created_at || "") : todayStr(d) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
        rows.push([iso, x.day, x.identifiant, x.kind, alKindLabel(x.kind), alSummary(x), JSON.stringify(x.data || {}), alDevLabel(x.device), x.device_id || ""]);
      });
      const total = num(Number(r && r.total), 0);
      pg.set(Math.min(1, rows.length / Math.max(total, 1)), rows.length + " / " + total);
      if (part.length < 1000 || rows.length >= total) break;
    }
  } catch (e) { pg.close(); toast(alErrText(e)); return; }
  pg.close();
  const csv = csvText([t("al.c.date"), t("al.day"), t("aq.f.account"), t("al.c.code"), t("aq.f.kind"), t("al.detail"), t("al.c.data"), t("al.device"), "device_id"], rows);
  const name = "journal-" + todayStr() + ".csv";
  const okSave = await fxSave(name, inClaude() ? csv : new Blob([csv], { type: "text/csv;charset=utf-8" }));
  if (okSave === true) { toast(t("al.csvDone", { n: rows.length })); Activity.log("admin_journal_export", { n: rows.length }); }
  else if (okSave !== "declined") showExportText(csv);
}

// --- Fiche d'un compte (admin, étape 26) : écran #admin-fiche ---
// Ouverte depuis la liste des comptes, le tableau de bord (alertes, classements), le journal et l'historique des demandes
// Claude (openAccountFiche). Un seul compte à la fois.
// Sources :
//  - user_data du compte (lu par l'admin grâce aux règles RLS) → contenu, difficultés, listes en lecture seule ; calculé
//    ici, dans le navigateur de l'admin (fcCompute), jamais enregistré ;
//  - fonctions SQL du script supabase-etape26.sql (security definer, contrôle is_admin()) : admin_account_summary
//    (en-tête, révisions, calendrier, heures, modes, appareils), admin_account_storage (taille par morceau, version),
//    admin_account_issues (erreurs de synchro et conflits des 30 derniers jours).
// Script pas lancé : « Lancez le script SQL de l'étape 26 », les parties tirées de user_data restent affichées.
// Parties des étapes 28 à 30 (gels, objectif du jour, amis, listes partagées) : « — » en attendant.
// Lecture seule : aucune donnée du compte n'est modifiée ici (les actions existantes ouvrent leurs propres fenêtres).
const FC_LIMIT_KB = 512, FC_WARN_KB = 400, FC_BLOCKED_SEEN = 5, FC_SEARCH_MAX = 200;
const fc = {
  user: null, from: "adminacc", token: 0, loading: false,
  acc: null,                 // ligne de la liste des comptes (identifiant, création, admin…)
  sum: null, store: null, issues: null, part: {}, missing: false,
  data: null, dataErr: "", version: null, view: null,
  q: "", open: {}, cap: ""
};
// Ouvre la fiche d'un compte (userId) ; from = écran de retour.
function openAccountFiche(userId, from) {
  if (!userId) return;
  if (fc.user !== userId) Object.assign(fc, { sum: null, store: null, issues: null, part: {}, missing: false, data: null,
    dataErr: "", version: null, view: null, q: "", open: {}, cap: "", acc: null, friends: null, friendsErr: "" });
  fc.user = userId;
  fc.from = from || (currentScreen !== "adminfiche" ? currentScreen : fc.from) || "adminacc";
  fc.started = false;
  if (currentScreen === "adminfiche") renderAdminFiche();
  else location.hash = "#" + HASH_OF.adminfiche;
}
function fcRerender() { if (currentScreen === "adminfiche") renderAdminFiche(); }
// Calculs sur les données d'un autre compte avec les fonctions de l'appli : state remplacé le temps d'un calcul
// synchrone (langue de l'interface de l'admin gardée), puis remis tel quel. Aucune sauvegarde pendant ce temps.
function fcWith(d, fn) {
  const keep = state;
  state = Object.assign({}, d, { settings: Object.assign({}, d.settings, { uiLang: keep.settings.uiLang, theme: keep.settings.theme }) });
  try { return fn(); } finally { state = keep; }
}
async function fcLoad() {
  const user = fc.user, my = ++fc.token;
  fc.loading = true; fc.started = true;
  fcRerender();
  const tz = dashTz();
  if (!adm.list) { try { adm.list = arr(await Supa.listAccounts()); } catch (e) {} }
  await admLoadBlocked();   // état bloqué / actif (étape 27), pour l'en-tête et le menu « Actions… »
  if (my !== fc.token) return;
  fc.acc = arr(adm.list).find(a => a.user_id === user) || fc.acc;
  const part = async (name, fn) => {
    try { fc[name] = await fn(); fc.part[name] = ""; }
    catch (e) { fc[name] = null; if (alIsMissing(e)) fc.missing = true; fc.part[name] = alIsMissing(e) ? t("fc.missing") : aqErrText(e); }
  };
  fc.missing = false;
  await Promise.all([
    part("sum", () => aqRpc("admin_account_summary", { p_user: user, p_tz: tz })),
    part("store", () => aqRpc("admin_account_storage", { p_user: user })),
    part("issues", () => aqRpc("admin_account_issues", { p_user: user, p_days: 30 })),
    (async () => {   // amis et demandes en attente (étape 29) ; script absent : seulement un message dans la section Amis
      try { fc.friends = await aqRpc("admin_friends", { p_user: user }); fc.friendsErr = ""; }
      catch (e) { fc.friends = null; fc.friendsErr = alIsMissing(e) ? t("am.missing") : aqErrText(e); }
    })(),
    (async () => {
      try {
        if (user === auth.sbUid) { fc.data = state; fc.version = state.version; fc.skStored = true; }
        else {
          const raw = Storage.unpackRows(await Supa.readRows(user));
          fc.version = raw ? num(Number(raw.version), null) : null;
          fc.skStored = !!(raw && raw.streak && typeof raw.streak === "object");   // clé streak présente (version 28)
          fc.data = raw ? normalizeData(raw) : null;
        }
        fc.dataErr = "";
      } catch (e) { fc.data = null; fc.dataErr = aqErrText(e); }
    })()
  ]);
  if (my !== fc.token) return;
  try { fc.view = fc.data ? fcCompute(fc.data) : null; } catch (e) { fc.view = null; fc.dataErr = t("admin.err"); }
  fc.loading = false;
  fcRerender();
}

// --- Calculs (navigateur de l'admin, ce compte seulement) ---
function fcCompute(d) {
  return fcWith(d, () => {
    const cards = arr(d.cards), listIds = new Set(arr(d.lists).map(l => l.id));
    const v = { folders: arr(d.folders).length, lists: arr(d.lists).length, cards: cards.length, types: {}, boxes: [0, 0, 0, 0, 0, 0],
      targets: {}, gaps: 0, proposals: arr(d.proposals).length, missed: [], tenses: [], blocked: [] };
    CARD_TYPES.forEach(ty => { v.types[ty] = [0, 0, 0, 0, 0, 0]; });
    const tense = new Map();
    cards.forEach(c => {
      const ty = cardType(c), b = Math.max(0, Math.min(5, Math.round(num(c.box, 0))));
      v.types[ty][b]++; v.boxes[b]++;
      const lg = listIds.has(c.listId) ? cardLangs(c) : null;
      const tg = ty === "vocab" ? (lg && lg.target) : (c.lang || (lg && lg.target));
      if (tg) v.targets[tg] = (v.targets[tg] || 0) + 1;
      if (lg && gapFields(c, lg).length) v.gaps++;
      const s = c.stats || {}, seen = num(s.seen, 0), ok = num(s.correct, 0), wrong = num(s.wrong, 0);
      if (b === 0 && seen >= FC_BLOCKED_SEEN && ok === 0) v.blocked.push(c);
      if (wrong > 0) v.missed.push(c);
      if (ty === "conj" && c.tense) {
        const k = (c.lang || "") + "|" + c.tense;
        const x = tense.get(k) || { lang: c.lang, tense: c.tense, cards: 0, seen: 0, correct: 0, wrong: 0 };
        x.cards++; x.seen += seen; x.correct += ok; x.wrong += wrong;
        tense.set(k, x);
      }
    });
    const wr = c => num((c.stats || {}).wrong, 0), sn = c => num((c.stats || {}).seen, 0);
    const line = c => ({ id: c.id, type: cardType(c), title: cardTitle(c), sub: cardSubtitle(c), list: (getList(c.listId) || {}).name || "?",
      wrong: wr(c), seen: sn(c), correct: num((c.stats || {}).correct, 0), box: num(c.box, 0) });
    v.missed = v.missed.sort((a, b) => wr(b) - wr(a) || sn(b) - sn(a)).slice(0, 20).map(line);
    v.blocked = v.blocked.sort((a, b) => sn(b) - sn(a)).map(line);
    v.tenses = Array.from(tense.values()).filter(x => x.wrong > 0)
      .sort((a, b) => b.wrong - a.wrong || b.seen - a.seen).slice(0, 10)
      .map(x => Object.assign(x, { name: tenseName(x.lang, x.tense) }));
    // Série (étape 28) : clé streak du compte (sinon calculée depuis history par normalizeData, comme la migration),
    // vue aujourd'hui : jours manqués pas encore traités par l'appli du compte couverts par les gels, sinon série perdue.
    const sk = streakEffective(d.streak || normStreak(null, d.history), todayStr());
    v.streak = sk.current; v.best = sk.best; v.freezes = sk.freezes; v.lost = sk.lost;
    v.goal = clampInt(d.settings && d.settings.dailyGoal, 5, 100, 10);
    v.valid = new Set(sk.validDays);
    v.adjustments = arr(sk.adjustments).slice().reverse();
    v.uiLang = (d.settings && d.settings.uiLang) || "";
    v.langs = Object.keys(v.targets).filter(isLang);
    arr(d.lists).forEach(l => { const tg = listLangs(l).target; if (!v.langs.includes(tg)) v.langs.push(tg); });
    v.frozen = new Set(sk.frozenDays);   // jours gelés (étape 28)
    return v;
  });
}
function fcRate(ok, seen) { return seen > 0 ? dashRate(Math.round(1000 * Math.min(ok, seen) / seen) / 10) : "—"; }
function fcDash(v) { return v == null || v === "" ? "—" : String(v); }
function fcKb(bytes) { const kb = num(Number(bytes), 0) / 1024; try { return kb.toLocaleString(state.settings.uiLang, { maximumFractionDigits: kb < 10 ? 1 : 0 }) + " " + t("fc.kb"); } catch (e) { return Math.round(kb) + " Ko"; } }
function fcLastActivity() {
  const a = fc.sum && fc.sum.account, cands = [];
  if (a) { if (a.last_day) cands.push(Date.parse(a.last_day + "T12:00:00")); [a.last_seen_at, a.last_sign_in_at].forEach(x => { if (x) cands.push(Date.parse(x)); }); }

// Calendrier des 12 dernières semaines : une colonne par semaine (lundi → dimanche), couleur selon les cartes révisées.
function fcLevel(n) { return n <= 0 ? 0 : n < 10 ? 1 : n < 30 ? 2 : n < 60 ? 3 : 4; }
// o (étape 28, facultatif) : { frozen: Set, valid: Set (objectif atteint), store: objet où garder la légende touchée (cap),
//   line: (n, sessions) → texte d'un jour actif }. Sans o : fiche du compte (fc).
function fcCalendar(cal, o) {
  o = o || { frozen: fc.view && fc.view.frozen, valid: fc.view && fc.view.valid, store: fc };
  const store = o.store || {};
  const box = el("div", "card fc-cal");
  box.appendChild(el("div", "dash-ch-title", t("fc.calendar")));
  const cap = el("div", "dash-ch-cap", store.cap || t("fc.calTap"));
  box.appendChild(cap);
  const from = dashBucketDate(cal.from), to = dashBucketDate(cal.to);
  if (isNaN(from) || isNaN(to)) { box.appendChild(el("p", "muted", "—")); return box; }
  const byDay = new Map(arr(cal.days).map(x => [String(x.day).slice(0, 10), x]));
  const frozen = o.frozen || new Set(), valid = o.valid || new Set();
  const wrap = el("div", "fc-cal-wrap");
  const lab = el("div", "fc-cal-days");
  [0, 2, 4, 6].forEach(i => {     // lun, mer, ven, dim
    const d = new Date(2024, 0, 1 + i);          // 1er janvier 2024 = lundi
    const s = el("span", null, (() => { try { return d.toLocaleDateString(state.settings.uiLang, { weekday: "narrow" }); } catch (e) { return ""; } })());
    s.style.gridRow = String(i + 1);
    lab.appendChild(s);
  });
  wrap.appendChild(lab);
  const grid = el("div", "fc-cal-grid");
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const k = todayStr(d), x = byDay.get(k), n = x ? dashNum(x.reviewed) : 0, ses = x ? dashNum(x.sessions) : 0;
    const lvl = Math.max(fcLevel(n), ses > 0 ? 1 : 0);
    const c = el("button", "fc-day l" + lvl + (frozen.has(k) ? " frozen" : "") + (valid.has(k) ? " valid" : "") + (k === todayStr() ? " today" : ""));
    c.type = "button";
    c.dataset.day = k;
    const line = lvl ? (o.line ? o.line(n, ses) : t("fc.calLine", { n, s: ses })) : t("fc.calNone");
    const txt = dashBucketLabel(k, false, true) + " : " + (frozen.has(k) ? t("fc.frozen") : line + (valid.has(k) ? " · " + t("sk.calGoal") : ""));
    c.title = txt; c.setAttribute("aria-label", txt);
    c.addEventListener("click", () => { store.cap = txt; cap.textContent = txt; });
    grid.appendChild(c);
  }
  wrap.appendChild(grid);
  box.appendChild(wrap);
  const leg = el("div", "fc-legend");
  leg.appendChild(el("span", "muted", t("fc.less")));
  [0, 1, 2, 3, 4].forEach(l => leg.appendChild(el("span", "fc-day l" + l)));
  leg.appendChild(el("span", "muted", t("fc.more")));
  leg.appendChild(el("span", "fc-day frozen"));
  leg.appendChild(el("span", "muted", t("fc.frozen")));
  leg.appendChild(el("span", "fc-day l1 valid"));
  leg.appendChild(el("span", "muted", t("sk.calGoal")));
  box.appendChild(leg);
  return box;
}

function fcHours(hours) {

  box.appendChild(cap);
  if (!total) return box;

    b.title = txt; b.setAttribute("aria-label", txt);

function fcTree(d, out) {
  const byOrder = (x, y) => num(x.order, 0) - num(y.order, 0);
  const folders = arr(d.folders).slice().sort(byOrder);
  folders.forEach(f => {
    const lists = arr(d.lists).filter(l => l.folderId === f.id).sort(byOrder);
    const det = el("details", "fc-folder");
    det.open = fc.open["f:" + f.id] !== false;

    sm.append(el("span", "fc-ln", "📁 " + f.name), el("span", "muted fc-small", t("fc.nLists", { n: lists.length })));

    lists.forEach(l => det.appendChild(fcListBlock(d, l)));
    det.addEventListener("toggle", () => { fc.open["f:" + f.id] = det.open; });
    out.appendChild(det);

  const loose = arr(d.lists).filter(l => !l.folderId || !folders.some(f => f.id === l.folderId)).sort(byOrder);

  }
  if (!folders.length && !loose.length) out.appendChild(el("p", "muted", t("fc.noLists")));
}
function fcSearchResults(d, out) {

  found.slice(0, FC_SEARCH_MAX).forEach(c => { if (!byList.has(c.listId)) byList.set(c.listId, []); byList.get(c.listId).push(c); });
  byList.forEach((cs, lid) => {

}

function fcHealth() {

    const bigB = big ? dashNum(big.bytes) : 0;
    const bar = el("div", "fc-meter");
    const fill = el("span", bigB > warn ? "bad" : "");
    fill.style.width = Math.min(100, Math.round(100 * bigB / limit)) + "%";

    const bigNode = el("div");
    bigNode.append(el("div", null, big ? big.key + " — " + fcKb(bigB) + " / " + fcKb(limit) + " (" + Math.round(100 * bigB / limit) + " %)" : "—"), bar);

      [t("fc.lastSync"), st.last_update ? alTime(st.last_update) : "—"],
      [t("fc.version"), ver == null ? "—" : String(ver) + (Number(ver) < DATA_VERSION ? " " + t("fc.versionOld", { v: DATA_VERSION }) : "")]
    ]));
    const over = rows.filter(r => dashNum(r.bytes) > warn);
    if (over.length) sec.appendChild(el("div", "card q-err", t("fc.bigWarn", { n: over.length, kb: FC_WARN_KB })));
    sec.appendChild(el("h4", "fc-h4", t("fc.chunks")));
    if (rows.length) {
      const wrap = fcTable([t("fc.chunk"), t("fc.size"), t("fc.updated")], rows.map(r => [r.key, fcKb(r.bytes), r.updated_at ? alTime(r.updated_at) : ""]), 1);
      wrap.classList.add("fc-scroll");
      rows.forEach((r, i) => { if (dashNum(r.bytes) > warn) { const tr = wrap.querySelectorAll("tbody tr")[i]; if (tr) tr.classList.add("fc-warnrow"); } });
      sec.appendChild(wrap);
    } else sec.appendChild(el("p", "muted", t("admin.noData")));
  }
  sec.appendChild(el("h4", "fc-h4", t("fc.issues")));
  const is = fc.issues;
  if (!is) sec.appendChild(el("div", "card q-err", fc.part.issues || t("fc.missing")));
  else if (!is.length) sec.appendChild(el("p", "muted", t("fc.noIssues")));
  else {
    const b = el("div", "card fc-clist");
    is.forEach(r => {
      const line = el("div", "fc-cline");
      const m = el("div", "fc-cmain");
      m.appendChild(el("div", "fc-ct", alKindLabel(r.kind) + (alSummary(r) ? " — " + alSummary(r) : "")));
      const dv = alDevLabel(r.device);
      m.appendChild(el("div", "muted fc-small", [alTime(r.created_at), dv].filter(Boolean).join(" · ")));
      line.appendChild(m);
      b.appendChild(line);
    });
    sec.appendChild(b);
  }
  return sec;
}

// Date ISO ↔ valeur d'un champ datetime-local (heure de cet appareil).
function anToLocal(iso) {

}
