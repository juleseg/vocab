// === ÉCRAN : ACCUEIL ===
function computeStreak() {
  const days = new Set(state.history.filter(h => h.reviewed > 0).map(h => h.date));
  const d = new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate() - 1); // la série tient encore si on a révisé hier
  let n = 0;
  while (days.has(todayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderHome() {
  const now = Date.now();
  $("#homeDue").textContent = state.cards.filter(c => Leitner.isDue(c, now)).length;
  $("#homeStreak").textContent = computeStreak();
}

// === ÉCRAN : RÉVISER (CHOIX DE SESSION) ===
// rv.phase : "config" (choix de la session) | "run" (session en cours)
// rv.cfg est gardé en mémoire tant que l'appli est ouverte (pas sauvegardé).
// Sens par carte, relatif à la liste de la carte : "toT" = langues d'appui → langue apprise, "fromT" = l'inverse.
// Une session peut mélanger des listes de langues différentes.
const rv = { phase: "config", cfg: null, s: null };
const NO_FOLDER = "__none__";

function defaultSessionCfg() {
  return { scope: "all", folderIds: [], listIds: [], tags: [], cat: "unknown", lang: accountLangs().target,
    types: [], tenses: [], verbs: [], persons: [],   // filtres en plus (vide = tout) : types de cartes ; conjugaison (clés « langue|… »)
    onlyDue: true, dir: "toT", count: state.settings.sessionSize, mode: "cards" };
}
// Clés des filtres de conjugaison (une session peut mélanger plusieurs langues).
function tenseKey(c) { return c.lang + "|" + c.tense; }
function verbKey(c) { return c.lang + "|" + normText(c.verb); }
function personKey(c) { return c.lang + "|" + c.person; }
function conjFilterOn(cfg) { return !!(arr(cfg.tenses).length || arr(cfg.verbs).length || arr(cfg.persons).length); }
function allTags() {
  const s = new Set();
  state.cards.forEach(c => c.tags.forEach(tg => s.add(tg)));
  return [...s].sort((a, b) => a.localeCompare(b));
}
// Langues de chaque liste (calculées une fois pour tout un filtrage).
function langsByList() {
  const m = new Map();
  state.lists.forEach(l => m.set(l.id, listLangs(l)));
  return m;
}
// Langues apprises présentes dans les listes, dans l'ordre de LANGUAGES.
function targetLangsInUse() {
  const s = new Set(state.lists.map(l => listLangs(l).target));
  return LANG_CODES.filter(c => s.has(c));
}
// stage : "base" = sans les filtres de type / conjugaison / mode (pour construire ces filtres) ;
//         "types" = avec le filtre de type, sans ceux de conjugaison ; absent = tous les filtres.
function sessionPool(cfg, stage) {
  const now = Date.now();
  const types = arr(cfg.types), conjOn = conjFilterOn(cfg);
  const lgs = langsByList();
  const lists = new Map(state.lists.map(l => [l.id, l]));
  return state.cards.filter(c => {
    const lg = lgs.get(c.listId);
    if (!lg || !cardUsable(c, lg)) return false;
    if (cfg.scope === "folders") {
      const l = lists.get(c.listId);
      if (!cfg.folderIds.includes(l && l.folderId ? l.folderId : NO_FOLDER)) return false;
    }
    if (cfg.scope === "lists" && !cfg.listIds.includes(c.listId)) return false;
    if (cfg.scope === "tags" && !c.tags.some(tg => cfg.tags.includes(tg))) return false;
    if (cfg.scope === "cat" && Leitner.category(c) !== cfg.cat) return false;
    if (cfg.scope === "lang" && lg.target !== cfg.lang) return false;
    if (cfg.onlyDue && !Leitner.isDue(c, now)) return false;
    if (stage === "base") return true;
    if (types.length && !types.includes(cardType(c))) return false;
    if (stage === "types") return true;
    if (cfg.mode === "write" && cardType(c) === "rule") return false;   // fiche de règle : pas de mode Écrit
    if (cfg.mode === "table" && cardType(c) !== "conj") return false;   // mode Tableau : conjugaison seulement
    if (conjOn) {                                                        // filtres de conjugaison : seulement des cartes conj
      if (cardType(c) !== "conj") return false;
      if (cfg.tenses.length && !cfg.tenses.includes(tenseKey(c))) return false;
      if (cfg.verbs.length && !cfg.verbs.includes(verbKey(c))) return false;
      if (cfg.persons.length && !cfg.persons.includes(personKey(c))) return false;
    }
    return true;
  });
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function toggleIn(a, v) { const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); }

function renderReview() {
  const root = $("#screen-review");
  root.textContent = "";
  if (!rv.cfg) rv.cfg = defaultSessionCfg();
  rv.cfg.listIds = rv.cfg.listIds.filter(id => getList(id)); // listes supprimées entre-temps
  rv.cfg.folderIds = rv.cfg.folderIds.filter(id => id === NO_FOLDER || getFolder(id));
  if (rv.phase === "run" && rv.s) {
    if (rv.s.mode === "cards") renderCardsSession(root);
    else if (rv.s.mode === "write") renderWriteSession(root);
    else if (rv.s.mode === "table") renderTableSession(root);
    else renderQuizSession(root);
  }
  else renderSessionConfig(root);
}

// options : [[valeur, cléI18n], ...] ; labels : textes déjà traduits (optionnel, remplace les clés)
function segField(labelKey, options, current, onPick, labels) {
  const seg = el("div", "seg");
  options.forEach(([v, k], i) => {
    const b = el("button", null, labels ? labels[i] : t(k));
    b.setAttribute("aria-pressed", String(v === current));
    b.addEventListener("click", () => { onPick(v); renderReview(); });
    seg.appendChild(b);
  });
  return formField(t(labelKey), seg);
}
function chipsField(items, selected, onToggle) {
  const f = el("div", "field");
  const w = el("div", "chips");
  items.forEach(it => {
    const b = el("button", null, it.label);
    b.setAttribute("aria-pressed", String(selected.includes(it.value)));
    b.addEventListener("click", () => { onToggle(it.value); renderReview(); });
    w.appendChild(b);
  });
  f.appendChild(w);
  return f;
}

function renderSessionConfig(root) {
  const cfg = rv.cfg;
  const box = el("div", "card");

  // Périmètre : un seul choix (pastilles, car 6 options)
  const sc = chipsField(
    [["all", "scope.all"], ["folders", "scope.folders"], ["lists", "scope.lists"], ["tags", "scope.tags"], ["cat", "scope.cat"], ["lang", "scope.lang"]]
      .map(([v, k]) => ({ value: v, label: t(k) })),
    [cfg.scope], v => { cfg.scope = v; });
  sc.insertBefore(el("label", null, t("review.scope")), sc.firstChild);
  box.appendChild(sc);

  if (cfg.scope === "folders") {
    const items = sortedFolders().map(f => ({ value: f.id, label: f.name }));
    if (items.length && listsIn(null).length) items.push({ value: NO_FOLDER, label: t("folders.none") });
    box.appendChild(items.length
      ? chipsField(items, cfg.folderIds, v => toggleIn(cfg.folderIds, v))
      : el("div", "field hint", t("folders.empty")));
  } else if (cfg.scope === "lists") {
    box.appendChild(state.lists.length
      ? chipsField(orderedLists().map(l => ({ value: l.id, label: listLabel(l) })), cfg.listIds, v => toggleIn(cfg.listIds, v))
      : el("div", "field hint", t("lists.empty")));
  } else if (cfg.scope === "tags") {
    const tags = allTags();
    cfg.tags = cfg.tags.filter(tg => tags.includes(tg));
    box.appendChild(tags.length
      ? chipsField(tags.map(tg => ({ value: tg, label: "#" + tg })), cfg.tags, v => toggleIn(cfg.tags, v))
      : el("div", "field hint", t("review.noTags")));
  } else if (cfg.scope === "cat") {
    box.appendChild(segField("scope.cat",
      [["unknown", "cat.unknown"], ["review", "cat.review"], ["known", "cat.known"]],
      cfg.cat, v => { cfg.cat = v; }));
  } else if (cfg.scope === "lang") {
    const langs = targetLangsInUse();
    if (langs.length && !langs.includes(cfg.lang)) cfg.lang = langs[0];
    box.appendChild(langs.length
      ? segField("scope.lang", langs.map(c => [c, ""]), cfg.lang, v => { cfg.lang = v; }, langs.map(c => langName(c)))
      : el("div", "field hint", t("lists.empty")));
  }

  box.appendChild(segField("review.which", [[true, "which.due"], [false, "which.all"]], cfg.onlyDue, v => { cfg.onlyDue = v; }));

  // Types de cartes (plusieurs choix, aucun = tous), seulement les types présents dans le périmètre
  const base = sessionPool(cfg, "base");
  const present = CARD_TYPES.filter(ty => base.some(c => cardType(c) === ty));
  cfg.types = cfg.types.filter(ty => present.includes(ty));
  if (present.length > 1) {
    const tf = chipsField(present.map(ty => ({ value: ty, label: TYPE_ICON[ty] + " " + t("type." + ty) })), cfg.types, v => toggleIn(cfg.types, v));
    tf.insertBefore(el("label", null, t("review.types")), tf.firstChild);
    tf.appendChild(el("div", "hint", t("review.typesHint")));
    box.appendChild(tf);
  }
  // Conjugaison : temps, verbes, personnes (plusieurs choix, aucun = tous)
  const conjCards = sessionPool(cfg, "types").filter(c => cardType(c) === "conj");
  const keep = (sel, keys) => sel.filter(k => keys.has(k));
  if (conjCards.length) {
    const multi = new Set(conjCards.map(c => c.lang)).size > 1;
    const suf = lng => multi ? " (" + lng.toUpperCase() + ")" : "";
    const tens = new Map(), verbs = new Map(), pers = new Map();
    conjCards.forEach(c => {
      if (!tens.has(tenseKey(c))) tens.set(tenseKey(c), { label: tenseName(c.lang, c.tense) + suf(c.lang), o: [LANG_CODES.indexOf(c.lang), tensesOf(c.lang).findIndex(x => x.id === c.tense)] });
      if (!verbs.has(verbKey(c))) verbs.set(verbKey(c), { label: c.verb + suf(c.lang), o: [LANG_CODES.indexOf(c.lang), 0] });
      if (!pers.has(personKey(c))) {
        const ps = personsOf(c.lang, c.tense);
        pers.set(personKey(c), { label: personLabel(c.lang, c.tense, c.person) + suf(c.lang), o: [LANG_CODES.indexOf(c.lang), ps.findIndex(x => x.id === c.person) + (ps === grammarOf(c.lang).persons ? 0 : 100)] });
      }
    });
    const items = m => [...m.entries()].sort((a, b) => a[1].o[0] - b[1].o[0] || a[1].o[1] - b[1].o[1] || a[1].label.localeCompare(b[1].label)).map(([value, x]) => ({ value, label: x.label }));
    cfg.tenses = keep(cfg.tenses, tens); cfg.verbs = keep(cfg.verbs, verbs); cfg.persons = keep(cfg.persons, pers);
    const cj = el("div", "rv-conj");
    cj.appendChild(el("div", "rv-conj-hd", TYPE_ICON.conj + " " + t("review.conj")));
    [["review.tenses", tens, cfg.tenses], ["review.verbs", verbs, cfg.verbs], ["review.persons", pers, cfg.persons]].forEach(([k, m, sel]) => {
      if (m.size < 2 && !sel.length) return;
      const f = chipsField(items(m), sel, v => toggleIn(sel, v));
      f.insertBefore(el("label", null, t(k)), f.firstChild);
      cj.appendChild(f);
    });
    if (cj.childNodes.length > 1) { cj.appendChild(el("div", "hint", t("review.conjHint"))); box.appendChild(cj); }
  } else { cfg.tenses = []; cfg.verbs = []; cfg.persons = []; }

  // Sens : libellés concrets si toutes les cartes du périmètre ont les mêmes langues (ex. KO·EN → FR)
  const pool = sessionPool(cfg);
  const lgs = langsByList();
  const pairs = new Map();
  pool.forEach(c => { const lg = lgs.get(c.listId); pairs.set(pairLabel(lg), lg); });
  let dirLabels = null;
  if (pairs.size === 1) {
    const lg = [...pairs.values()][0];
    dirLabels = [pairLabel(lg), langCodes([lg.target]) + " → " + langCodes(lg.support), t("dir.mix")];
  }
  box.appendChild(segField("review.dir", [["toT", "dir.toTarget"], ["fromT", "dir.fromTarget"], ["mix", "dir.mix"]], cfg.dir, v => { cfg.dir = v; }, dirLabels));

  const cnt = el("input");
  cnt.type = "number"; cnt.min = "1"; cnt.max = "500"; cnt.inputMode = "numeric"; cnt.value = cfg.count;
  cnt.addEventListener("change", () => { cfg.count = clampInt(cnt.value, 1, 500, state.settings.sessionSize); cnt.value = cfg.count; });
  box.appendChild(formField(t("review.count"), cnt));

  box.appendChild(segField("review.mode", [["cards", "mode.cards"], ["write", "mode.write"], ["quiz", "mode.quiz"], ["table", "mode.table"]], cfg.mode, v => { cfg.mode = v; }));
  if (cfg.mode === "table") box.appendChild(el("div", "hint", t("table.modeHint")));
  root.appendChild(box);

  root.appendChild(el("div", "avail", cfg.mode === "table"
    ? t("table.available", { n: pool.length, m: tableGroups(pool).length })
    : t("review.available", { n: pool.length })));
  const start = el("button", "btn primary", t("review.start"));
  start.addEventListener("click", () => {
    cfg.count = clampInt(cnt.value, 1, 500, state.settings.sessionSize);
    if ((cfg.scope === "lists" && !cfg.listIds.length) || (cfg.scope === "tags" && !cfg.tags.length) ||
        (cfg.scope === "folders" && !cfg.folderIds.length)) { toast(t("review.pickOne")); return; }
    if (!startSession()) toast(t("review.none"));
  });
  root.appendChild(start);
}

// Construit la file : périmètre filtré, ordre aléatoire, coupé au nombre demandé, sens fixé par carte.
function startSession() {
  const cfg = rv.cfg;
  if (cfg.mode === "table") return startTableSession(cfg);
  const pool = shuffle(sessionPool(cfg)).slice(0, cfg.count);
  if (!pool.length) return false;
  const queue = pool.map(c => ({ id: c.id, dir: cfg.dir === "mix" ? (Math.random() < 0.5 ? "toT" : "fromT") : cfg.dir }));
  newRun(queue, cfg.mode);
  return true;
}
// Lance une session à partir d'une file. first = première réponse par carte (résumé, ratés) ; dirs = sens par carte (rejouer).
// Mode Tableau : la file contient des tableaux { ids } (une file de cartes { id } est regroupée par tableau).
function newRun(queue, mode) {
  rv.s = { queue, mode, revealed: false, counts: { known: 0, review: 0, unknown: 0 }, log: [], first: {}, dirs: {} };
  if (mode === "table") {
    if (queue.length && !queue[0].ids) rv.s.queue = tableGroups(queue.map(q => state.cards.find(c => c.id === q.id)).filter(Boolean));
    rv.s.queue.forEach(g => g.ids.forEach(id => { rv.s.dirs[id] = "toT"; }));
  } else queue.forEach(q => { rv.s.dirs[q.id] = q.dir; });
  rv.phase = "run";
  renderReview();
  window.scrollTo(0, 0);
}

// Note une carte de la session (utilisé par tous les modes). Pas su → la carte revient en fin de file.
function gradeCurrent(result) {
  const s = rv.s;
  const item = s.queue.shift();
  const c = item && state.cards.find(x => x.id === item.id);
  if (!c) { renderReview(); return; }
  const r = Leitner.grade(c, result);
  s.counts[result]++;
  if (!(item.id in s.first)) s.first[item.id] = result;
  s.log.unshift({ word: cardTitle(c), result, from: r.from, to: r.to, dueAt: r.dueAt });
  if (result === "unknown") s.queue.push(item);
  s.revealed = false;
  commit();
}
function endSession() { rv.phase = "config"; rv.s = null; Storage.flushNow(); renderReview(); } // synchro en ligne après chaque session

// Carte encore utilisable dans une session en cours (supprimée, ou langue de la liste changée entre-temps).
function sessionCard(id) {
  const c = state.cards.find(x => x.id === id);
  return c && cardUsable(c) ? c : null;
}

// === MODE CARTES ===
// Tap = retourner. Swipe droite = Su, gauche = Pas su, haut = À revoir. Boutons équivalents sous la carte.
const SWIPE = { DIST: 90, OUT_MS: 280 };
let cardsBusy = false; // vrai pendant l'animation de sortie (évite une double notation)

// Faces question / réponse selon le sens : face « langues d'appui » (traductions remplies, dans l'ordre)
// et face « langue apprise ». target = langue apprise de la carte (langue de l'exemple).
// items = mots de la face dans l'ordre ([{ text, lng }]) : lus à la suite, nature affichée à côté de chacun.
// Autres types de cartes : typedFaces (sens ignoré).
function cardFaces(c, dir) {
  if (!isVocab(c)) return typedFaces(c);
  const lg = cardLangs(c);
  const sup = supportTerms(c, lg);
  const supFace = {
    lang: sup.map(x => langName(x.code)).join(" · "),
    main: sup.length ? sup[0].text : "—", lng: sup.length ? sup[0].code : lg.support[0],
    sub: sup.slice(1).map(x => x.text).join(" · "), subLng: sup.length > 1 ? sup[1].code : "",
    items: sup.map(x => ({ text: x.text, lng: x.code }))
  };
  const tgText = term(c, lg.target);
  const tgFace = { lang: langName(lg.target), main: tgText || "—", lng: lg.target, sub: "", subLng: "",
    items: tgText ? [{ text: tgText, lng: lg.target }] : [] };
  return dir === "fromT" ? { q: tgFace, a: supFace, target: lg.target, lg } : { q: supFace, a: tgFace, target: lg.target, lg };
}
// Mot principal d'une face (+ nature si withPos).
function faceMain(cls, f, c, withPos) {
  if (f.mainNode) return f.mainNode(cls);           // affichage riche (phrase à trous, différences surlignées)
  const m = el("div", cls); m.lang = f.lng;
  m.appendChild(document.createTextNode(f.main));
  const p = withPos ? posTag(c, f.lng) : null;
  if (p) m.appendChild(p);
  return m;
}
// Autres mots de la face (langues d'appui suivantes), chacun avec sa nature si withPos. null s'il n'y en a pas.
function faceSub(cls, f, c, withPos) {
  if (f.noSub) return null;
  const rest = f.items.slice(1);
  if (!rest.length) return null;
  const d = el("div", cls);
  rest.forEach((x, i) => {
    if (i) d.appendChild(el("span", "sub-sep", " · "));
    const sp = el("span", "sub-item", x.text); sp.lang = x.lng;
    const p = withPos ? posTag(c, x.lng) : null;
    if (p) sp.appendChild(p);
    d.appendChild(sp);
  });
  return d;
}
function faceNode(cls, f, c, example, exLng) {
  const d = el("div", "sw-face " + cls + (isVocab(c) ? "" : " ty-face ty-" + cardType(c)) + (f.long ? " sw-long" : ""));
  d.appendChild(el("div", "sw-lang", f.lang));
  const sp = speakItemsBtn(f.items);
  if (sp) d.appendChild(sp);
  const b = el("div", "sw-body");
  b.appendChild(faceMain("sw-main", f, c, true));
  const sub = faceSub("sw-sub", f, c, true);
  if (sub) b.appendChild(sub);
  if (example) { const e = el("div", "sw-ex", example); e.lang = exLng; b.appendChild(e); }
  faceExtras(f).forEach(n => b.appendChild(n));
  d.appendChild(b);
  return d;
}
function swipeResult(dx, dy) {
  if (-dy > SWIPE.DIST && -dy > Math.abs(dx)) return "review";
  if (dx > SWIPE.DIST) return "known";
  if (dx < -SWIPE.DIST) return "unknown";
  return null;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function renderCardsSession(root) {
  const s = rv.s;
  cardsBusy = false;
  while (s.queue.length && !sessionCard(s.queue[0].id)) s.queue.shift(); // carte supprimée entre-temps
  if (!s.queue.length) { renderSessionSummary(root); return; }

  const item = s.queue[0];
  const c = sessionCard(item.id);
  const f = cardFaces(c, item.dir);
  audioCard(s, c);

  root.appendChild(audioToggle());
  const meta = el("div", "meta-row");
  meta.append(el("span", null, t("cards.left", { n: s.queue.length })), el("span", null, t("cat." + Leitner.category(c))));
  root.appendChild(meta);

  const stage = el("div", "sw-stage");
  const card = el("div", "sw-card sw-enter");
  card.setAttribute("role", "button");
  card.tabIndex = 0;
  const inner = el("div", "sw-inner" + (s.revealed ? " flipped" : ""));
  inner.append(faceNode("sw-front", f.q, c, "", f.target), faceNode("sw-back", f.a, c, c.example, f.target));
  card.appendChild(inner);
  const stamps = {};
  ["known", "unknown", "review"].forEach(r => { stamps[r] = el("div", "sw-stamp sw-stamp-" + r, t("cat." + r)); card.appendChild(stamps[r]); });
  stage.appendChild(card);
  root.appendChild(stage);
  root.appendChild(el("div", "sw-hint", t("cards.tap")));

  const flip = () => {
    if (cardsBusy) return;
    s.revealed = !s.revealed;
    inner.classList.toggle("flipped", s.revealed);
    if (s.revealed) autoSpeak(s, "a", f.a.items, f.lg); // lecture auto de la réponse au retournement
  };
  autoSpeak(s, s.revealed ? "a" : "q", s.revealed ? f.a.items : f.q.items, f.lg);
  const resetStamps = () => Object.values(stamps).forEach(x => { x.style.opacity = "0"; });
  // Animation de sortie, puis notation (gradeCurrent sauvegarde et affiche la carte suivante).
  const fly = result => {
    if (cardsBusy) return;
    cardsBusy = true;
    const w = window.innerWidth, h = window.innerHeight;
    const to = result === "known" ? [w * 1.2, 40, 25] : result === "unknown" ? [-w * 1.2, 40, -25] : [0, -h, 0];
    resetStamps();
    stamps[result].style.opacity = "1";
    card.classList.remove("sw-enter");
    card.style.transition = "transform " + SWIPE.OUT_MS + "ms ease-in, opacity " + SWIPE.OUT_MS + "ms ease-in";
    card.style.transform = "translate(" + to[0] + "px," + to[1] + "px) rotate(" + to[2] + "deg)";
    card.style.opacity = "0";
    setTimeout(() => gradeCurrent(result), SWIPE.OUT_MS);
  };

  // Glisser (doigt ou souris)
  let d = null;
  card.addEventListener("pointerdown", e => {
    if (cardsBusy || (e.pointerType === "mouse" && e.button !== 0)) return;
    d = { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false };
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
    card.classList.remove("sw-enter");
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if (!d) return;
    d.dx = e.clientX - d.x0; d.dy = e.clientY - d.y0;
    if (!d.moved && Math.hypot(d.dx, d.dy) > 8) d.moved = true;
    if (!d.moved) return;
    card.style.transform = "translate(" + d.dx + "px," + d.dy + "px) rotate(" + (d.dx / 18) + "deg)";
    const up = -d.dy > Math.abs(d.dx);
    stamps.known.style.opacity = up ? "0" : String(clamp01(d.dx / SWIPE.DIST));
    stamps.unknown.style.opacity = up ? "0" : String(clamp01(-d.dx / SWIPE.DIST));
    stamps.review.style.opacity = up ? String(clamp01(-d.dy / SWIPE.DIST)) : "0";
  });
  const end = () => {
    if (!d) return;
    const g = d; d = null;
    if (!g.moved) { card.style.transition = ""; flip(); return; }
    const r = swipeResult(g.dx, g.dy);
    if (r) { fly(r); return; }
    card.style.transition = "transform .25s ease";   // pas assez loin : retour au centre
    card.style.transform = "";
    resetStamps();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", () => { if (d) { d.moved = true; d.dx = 0; d.dy = 0; } end(); });
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });

  // Boutons équivalents (même disposition que les gestes)
  const g = el("div", "btns three");
  [["unknown", "danger", "← ", ""], ["review", "warn", "↑ ", ""], ["known", "ok", "", " →"]].forEach(([r, cls, pre, post]) => {
    const b = el("button", "btn " + cls, pre + t("cat." + r) + post);
    b.addEventListener("click", () => fly(r));
    g.appendChild(b);
  });
  root.appendChild(g);

  const quit = el("button", "link-btn", t("cards.quit"));
  quit.addEventListener("click", () => { if (cardsBusy) return; s.queue = []; renderReview(); });
  root.appendChild(quit);
}

// Résumé de fin de session : chaque carte compte une fois, selon sa première réponse.
// Ratés = cartes répondues « Pas su » au moins une fois.
function renderSessionSummary(root) {
  const s = rv.s;
  Speech.stop();
  const ids = Object.keys(s.first);
  if (!ids.length) { endSession(); return; } // arrêt avant la première carte
  const n = { known: 0, review: 0, unknown: 0 };
  ids.forEach(id => n[s.first[id]]++);

  const box = el("div", "card");
  box.appendChild(el("h2", null, t("sum.title")));
  box.appendChild(el("div", "muted", t("sum.cards", { n: ids.length })));
  const grid = el("div", "sum-grid");
  [["known", "ok"], ["review", "warn"], ["unknown", "bad"]].forEach(([r, cls]) => {
    const cell = el("div", "sum-cell " + cls);
    cell.append(el("div", "sum-num", String(n[r])), el("div", "sum-lbl", t("cat." + r)));
    grid.appendChild(cell);
  });
  box.appendChild(grid);

  const missed = ids.filter(id => s.first[id] === "unknown" && state.cards.some(c => c.id === id));
  if (!missed.length) box.appendChild(el("div", "sum-ok", t("sum.noMiss")));
  root.appendChild(box);

  const btns = el("div", "btns");
  if (missed.length) {
    const b = el("button", "btn primary", t("sum.retry", { n: missed.length }));
    b.addEventListener("click", () => newRun(shuffle(missed.map(id => ({ id, dir: s.dirs[id] || "toT" }))), s.mode));
    btns.appendChild(b);
  }
  const nb = el("button", "btn" + (missed.length ? "" : " primary"), t("sum.new"));
  nb.addEventListener("click", endSession);
  btns.appendChild(nb);
  root.appendChild(btns);
}

// === MODE ÉCRIT ===
// Saisie de la réponse. Comparaison sans casse, espaces en trop ni accents ; plusieurs réponses acceptées ("/").
// Juste mais accents faux = compté juste + bonne orthographe avec différences surlignées.
// Après vérification : valider le résultat proposé, ou le corriger (Su / À revoir / Pas su).
// État de la carte en cours : rv.s.w = { typed, res } (remis à zéro à chaque notation).

// Nettoyage commun : espaces simplifiés, apostrophes unifiées (’ du clavier iPhone = '). Casse et accents gardés.
function wrClean(s) {
  return String(s || "").normalize("NFC").replace(/[’‘ʼ´`]/g, "'").replace(/\s+/g, " ").trim();
}
// Réponses acceptées : champ(s) de la face réponse, découpés sur "/" : [{ text, lng }].
// Réponse attendue en langues d'appui : une réponse juste dans l'une d'elles suffit.
function wrAlts(c, dir) {
  if (!isVocab(c)) return typedAlts(c);              // autres types : forme / mot manquant / phrase corrigée
  const lg = cardLangs(c);
  const fields = dir === "fromT" ? supportTerms(c, lg).map(x => [x.text, x.code]) : [[term(c, lg.target), lg.target]];
  const out = [];
  fields.forEach(([f, lng]) => String(f || "").split("/").map(wrClean).filter(Boolean).forEach(x => out.push({ text: x, lng })));
  return out;
}
// Clé de comparaison selon les règles de la langue (LANGUAGES[x].normalize) : sans casse ; accents retirés
// si la langue les tolère ; espaces retirés (noSpaces) si la langue les tolère.
function wrKey(s, rules, noSpaces) {
  let x = wrClean(s).toLowerCase();
  if (rules.accents) x = x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC");
  if (noSpaces && rules.spaces) x = x.replace(/\s+/g, "");
  return x;
}
// Plus longue sous-séquence commune (sans casse, avec accents) : marque les caractères communs aux deux textes.
function wrLcs(a, b) {
  const A = Array.from(a), B = Array.from(b);
  const ka = A.map(ch => ch.toLowerCase()), kb = B.map(ch => ch.toLowerCase());
  const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = ka[i] === kb[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ma = new Array(n).fill(false), mb = new Array(m).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (ka[i] === kb[j]) { ma[i] = mb[j] = true; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return { A, B, ma, mb, len: L[0][0] };
}
// verdict : "exact" | "accents" (juste, accents faux) | "spaces" (juste, espaces faux) | "punct" (juste, ponctuation) | "wrong".
// best / bestLng = réponse acceptée la plus proche et sa langue.
function wrCheck(typed, alts) {
  const tx = wrClean(typed);
  const res = (verdict, a) => ({ verdict, typed: tx, best: a ? a.text : "—", bestLng: a ? a.lng : "" });
  if (!tx || !alts.length) return res("wrong", alts[0]);
  const low = tx.toLowerCase();
  for (const a of alts) if (a.text.toLowerCase() === low) return res("exact", a);
  for (const a of alts) { const r = langRules(a.lng); if (r.accents && wrKey(a.text, r) === wrKey(tx, r)) return res("accents", a); }
  for (const a of alts) { const r = langRules(a.lng); if (r.spaces && wrKey(a.text, r, true) === wrKey(tx, r, true)) return res("spaces", a); }
  // Ponctuation différente seulement (point final oublié…) : compté juste
  const np = (x, r) => wrKey(x, r, true).replace(/[.,!?;:«»"“”()¿¡…。、]/g, "").replace(/\s+/g, "");
  for (const a of alts) { const r = langRules(a.lng); if (np(a.text, r) && np(a.text, r) === np(tx, r)) return res("punct", a); }
  let best = alts[0], score = -1;
  alts.forEach(a => {
    const r = wrLcs(tx, a.text);
    const sc = r.len / Math.max(r.A.length, r.B.length, 1);
    if (sc > score) { score = sc; best = a; }
  });
  return res("wrong", best);
}
// Texte avec les caractères non communs surlignés (cls = wr-miss ou wr-bad).
function wrDiffNode(chars, marks, cls) {
  const d = el("div", "wr-diff");
  let buf = "", hl = null;
  const flush = () => { if (buf) d.appendChild(hl ? el("mark", cls, buf) : document.createTextNode(buf)); buf = ""; };
  chars.forEach((ch, i) => { const h = !marks[i]; if (h !== hl) { flush(); hl = h; } buf += ch; });
  flush();
  return d;
}
function wrGrade(result) { rv.s.w = null; gradeCurrent(result); }

function renderWriteSession(root) {
  const s = rv.s;
  const skip = id => { const c = sessionCard(id); return !c || cardType(c) === "rule"; }; // supprimée entre-temps, ou fiche de règle
  while (s.queue.length && skip(s.queue[0].id)) s.queue.shift();
  if (!s.queue.length) { renderSessionSummary(root); return; }
  const item = s.queue[0];
  const c = sessionCard(item.id);
  if (!s.w) s.w = { typed: "", res: null };
  const w = s.w;
  const f = cardFaces(c, item.dir);
  const alts = wrAlts(c, item.dir);
  const ansLangs = [];
  alts.forEach(a => { if (!ansLangs.includes(a.lng)) ansLangs.push(a.lng); });

  audioCard(s, c);
  root.appendChild(audioToggle());
  const meta = el("div", "meta-row");
  meta.append(el("span", null, t("cards.left", { n: s.queue.length })), el("span", null, t("cat." + Leitner.category(c))));
  root.appendChild(meta);

  // Question (nature affichée seulement après la réponse)
  const q = el("div", "card wr-q");
  q.appendChild(el("div", "sw-lang", f.q.lang));
  q.appendChild(faceMain("sw-main", f.q, c, !!w.res));
  const qs = faceSub("sw-sub", f.q, c, !!w.res);
  if (qs) q.appendChild(qs);
  faceExtras(f.q).forEach(n => q.appendChild(n));
  if (!isVocab(c)) q.classList.add("ty-" + cardType(c));
  const qsp = spkItemsRow(f.q.items);
  if (qsp) q.appendChild(qsp);
  root.appendChild(q);
  autoSpeak(s, "q", f.q.items, f.lg);

  // Saisie
  const inp = textInput(w.typed, t("write.ph", { lang: ansLangs.map(x => langName(x)).join(t("write.or")) }), ansLangs[0] || f.a.lng);
  inp.classList.add("wr-input");
  inp.spellcheck = false;
  inp.setAttribute("autocapitalize", "off");
  inp.setAttribute("autocorrect", "off");
  inp.enterKeyHint = "done";
  root.appendChild(inp);

  if (!w.res) {
    const check = () => { w.typed = inp.value; w.res = wrCheck(inp.value, alts); renderReview(); };
    inp.addEventListener("input", () => { w.typed = inp.value; });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
    const b = el("button", "btn primary", t("write.check"));
    b.addEventListener("click", check);
    root.appendChild(b);
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
  } else {
    inp.readOnly = true;
    const r = w.res;
    const kind = { exact: "ok", accents: "acc", spaces: "acc", punct: "acc", wrong: "bad" }[r.verdict];
    const box = el("div", "card wr-res " + kind);
    box.appendChild(el("div", "wr-head", t({ exact: "write.ok", accents: "write.accents", spaces: "write.spaces", punct: "write.punct", wrong: "write.wrong" }[r.verdict])));
    if (r.verdict === "exact") {
      box.appendChild(el("div", "wr-diff", r.best));
    } else if (!r.typed) {
      box.appendChild(el("div", "wr-lbl", t("write.correct")));
      box.appendChild(el("div", "wr-diff", r.best));
    } else {
      const d = wrLcs(r.typed, r.best);
      box.appendChild(el("div", "wr-lbl", t("write.yours")));
      box.appendChild(wrDiffNode(d.A, d.ma, "wr-bad"));
      box.appendChild(el("div", "wr-lbl", t("write.correct")));
      box.appendChild(wrDiffNode(d.B, d.mb, "wr-miss"));
    }
    const bp = posTag(c, r.bestLng);
    if (bp) { const pd = el("div", "wr-pos"); pd.appendChild(bp); box.appendChild(pd); }
    const asp = spkItemsRow(f.a.items);
    if (asp) box.appendChild(asp);
    autoSpeak(s, "a", f.a.items, f.lg); // lecture auto de la réponse après validation
    if (!isVocab(c)) {
      // Autres types : phrase complète (texte à trous), forme avec pronom (conjugaison), explication, règle…
      if (c.type !== "fix") { const full = faceMain("wr-full", f.a, c, false); full.classList.add("wr-full"); box.appendChild(full); }
      faceExtras(f.a).forEach(n => box.appendChild(n));
    } else if (alts.length > 1) {
      box.appendChild(el("div", "wr-lbl", t("write.all", { a: f.a.main + (f.a.sub ? " · " + f.a.sub : "") })));
    }
    if (c.example) { const ex = el("div", "wr-ex", c.example); ex.lang = f.target; box.appendChild(ex); }
    root.appendChild(box);

    // Résultat proposé + correction possible
    const sug = r.verdict === "wrong" ? "unknown" : "known";
    const next = el("button", "btn primary", t("write.next", { r: t("cat." + sug) }));
    next.addEventListener("click", () => wrGrade(sug));
    root.appendChild(next);
    root.appendChild(el("div", "wr-fix", t("write.fix")));
    const g = el("div", "btns two");
    [["known", "ok"], ["review", "warn"], ["unknown", "danger"]].filter(([x]) => x !== sug).forEach(([x, cls]) => {
      const b = el("button", "btn " + cls, t("cat." + x));
      b.addEventListener("click", () => wrGrade(x));
      g.appendChild(b);
    });
    root.appendChild(g);
    setTimeout(() => { try { next.focus(); } catch (e) {} }, 60);
  }

  const quit = el("button", "link-btn", t("cards.quit"));
  quit.addEventListener("click", () => { s.w = null; s.queue = []; renderReview(); });
  root.appendChild(quit);
}

// === MODE INTERROGATEUR ===

let quizHideAnswer = false;

function renderQuizSession(root) {
  const s = rv.s;
  while (s.queue.length && !sessionCard(s.queue[0].id)) s.queue.shift(); // carte supprimée entre-temps
  if (!s.queue.length) { renderSessionSummary(root); return; }
  const item = s.queue[0];
  const c = sessionCard(item.id);
  const f = cardFaces(c, item.dir);
  let a0Class = "";

  audioCard(s, c);
  root.appendChild(audioToggle());
  const meta = el("div", "meta-row");
  meta.append(el("span", null, t("cards.left", { n: s.queue.length })), el("span", null, t("cat." + Leitner.category(c))));
  root.appendChild(meta);

  // Question (en grand)
  const q = el("div", "card qz-q");
  q.appendChild(el("div", "sw-lang", f.q.lang));
  q.appendChild(faceMain("qz-main", f.q, c, true));
  const qs = faceSub("qz-sub", f.q, c, true);
  if (qs) q.appendChild(qs);
  faceExtras(f.q).forEach(n => q.appendChild(n));
  if (!isVocab(c)) { q.classList.add("ty-" + cardType(c)); a0Class = "ty-" + cardType(c); }
  const qsp = spkItemsRow(f.q.items);
  if (qsp) q.appendChild(qsp);
  root.appendChild(q);
  autoSpeak(s, "q", f.q.items, f.lg); // pas de retournement ici : seule la question est lue automatiquement

  // Réponse pour l'interrogateur (+ exemple), masquable
  const a = el("div", "card qz-ans");

  head.appendChild(el("div", "qz-lbl", t("quiz.answer", { lang: f.a.lang })));
  const tg = el("button", "link-btn", t(quizHideAnswer ? "quiz.show" : "quiz.hide"));
  tg.addEventListener("click", () => { quizHideAnswer = !quizHideAnswer; renderReview(); });
  const hr = el("div", "qz-head-r");
  const asp = quizHideAnswer ? null : speakItemsBtn(f.a.items);
  if (asp) hr.appendChild(asp);
  hr.appendChild(tg);
  head.appendChild(hr);
  a.appendChild(head);
  if (quizHideAnswer) {
    a.appendChild(el("div", "qz-hidden", t("quiz.hidden")));
  } else {
    a.appendChild(faceMain("qz-amain", f.a, c, true));
    const as = faceSub("qz-asub", f.a, c, true);
    if (as) a.appendChild(as);
    faceExtras(f.a).forEach(n => a.appendChild(n));
    if (a0Class) a.classList.add(a0Class);
    if (c.example) { const ex = el("div", "qz-ex", c.example); ex.lang = f.target; a.appendChild(ex); }
  }
  root.appendChild(a);

  // Notation
  const g = el("div", "qz-btns");
  [["known", "ok"], ["review", "warn"], ["unknown", "danger"]].forEach(([r, cls]) => {

    b.addEventListener("click", () => gradeCurrent(r));
    g.appendChild(b);
  });
  root.appendChild(g);

  const quit = el("button", "link-btn", t("cards.quit"));
  quit.addEventListener("click", () => { s.queue = []; renderReview(); });
  root.appendChild(quit);
}

// === MODE TABLEAU ===
// Conjugaison seulement : un verbe + un temps, une case par personne. Validation d'un coup :
// chaque case juste → Su, fausse (ou vide) → Pas su, dans le Leitner de la carte conj correspondante.
// Les cases fausses reviennent en fin de session (tableau réduit à ces personnes).
// File : rv.s.queue = [{ ids }] ; état du tableau en cours : rv.s.tb = { vals: { id: saisie }, res: { id: verdict } | null, show }.
function tableKey(c) { return c.listId + "|" + c.lang + "|" + normText(c.verb) + "|" + c.tense; }
// Regroupe des cartes conj par tableau (liste + langue + verbe + temps), dans l'ordre d'arrivée des tableaux.
function tableGroups(cards) {
  const m = new Map();
  cards.forEach(c => { if (cardType(c) !== "conj") return; const k = tableKey(c); if (!m.has(k)) m.set(k, []); m.get(k).push(c.id); });
  return [...m.values()].map(ids => ({ ids }));
}
// Tableaux du périmètre. « À réviser aujourd'hui » : un tableau entre dès qu'une de ses cases est due,
// avec toutes ses personnes (filtres de personnes respectés). Nombre de cartes : tableaux ajoutés jusqu'à l'atteindre.
function startTableSession(cfg) {
  const due = sessionPool(cfg);
  if (!due.length) return false;
  const keys = new Set(due.map(tableKey));
  const full = cfg.onlyDue ? sessionPool(Object.assign({}, cfg, { onlyDue: false })).filter(c => keys.has(tableKey(c))) : due;
  const groups = shuffle(tableGroups(full));
  const queue = [];
  let n = 0;
  for (const g of groups) { if (queue.length && n >= cfg.count) break; queue.push(g); n += g.ids.length; }
  newRun(queue, "table");
  return true;
}
function tableCards(g) {
  const cs = g.ids.map(sessionCard).filter(c => c && cardType(c) === "conj");
  if (!cs.length) return [];
  const ps = personsOf(cs[0].lang, cs[0].tense).map(p => p.id);
  return cs.sort((a, b) => ps.indexOf(a.person) - ps.indexOf(b.person));
}

function renderTableSession(root) {
  const s = rv.s;
  while (s.queue.length && !tableCards(s.queue[0]).length) { s.queue.shift(); s.tb = null; }
  if (!s.queue.length) { renderSessionSummary(root); return; }
  const g = s.queue[0];
  const cs = tableCards(g);
  const c0 = cs[0], L = c0.lang;
  if (!s.tb) s.tb = { vals: {}, res: null, show: false };
  const tb = s.tb;

  audioCard(s, c0);
  root.appendChild(audioToggle());
  const left = s.queue.length;
  const meta = el("div", "meta-row");
  meta.append(el("span", null, t(left > 1 ? "table.left" : "table.left1", { n: left })), el("span", null, t("table.cells", { n: cs.length })));
  root.appendChild(meta);

  // En-tête : verbe, temps, traduction, note
  const head = el("div", "card tb-head ty-conj");
  head.appendChild(el("div", "sw-lang", t("type.conj") + " · " + langName(L)));
  const vb = el("div", "tb-verb", c0.verb); vb.lang = L;
  head.appendChild(vb);
  head.appendChild(tyLine("ty-big", tenseName(L, c0.tense)));
  const tr0 = cs.map(x => x.translation).find(Boolean);
  if (tr0) head.appendChild(tyLine("ty-tr", tr0));
  const sp = spkItemsRow([{ text: c0.verb, lng: L }]);
  if (sp) head.appendChild(sp);
  root.appendChild(head);
  autoSpeak(s, "q", [{ text: c0.verb, lng: L }], { target: L, support: cardLangs(c0).support });

  // Tableau : une ligne par personne
  const table = el("div", "card tb-grid");
  const inputs = [];
  cs.forEach((c, i) => {
    const row = el("div", "tb-row");
    const r = tb.res ? tb.res[c.id] : null;
    if (r) row.classList.add(r.verdict === "wrong" ? "bad" : "ok");
    row.appendChild(el("div", "tb-person", personLabel(L, c.tense, c.person)));
    const cell = el("div", "tb-cell");
    const inp = textInput(tb.vals[c.id] || "", "", L);
    inp.classList.add("tb-input");
    inp.spellcheck = false;
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("autocorrect", "off");
    inp.setAttribute("aria-label", personLabel(L, c.tense, c.person));
    inp.enterKeyHint = i < cs.length - 1 ? "next" : "done";
    if (tb.res) inp.readOnly = true;
    else {
      inp.addEventListener("input", () => { tb.vals[c.id] = inp.value; });
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (inputs[i + 1]) inputs[i + 1].focus(); else tableCheck(cs);
      });
    }
    inputs.push(inp);
    cell.appendChild(inp);
    if (r) cell.appendChild(el("span", "tb-mark", r.verdict === "wrong" ? "✗" : "✓"));
    row.appendChild(cell);
    // Correction : différences surlignées (case fausse) ou bonne orthographe (accents…)
    if (r && tb.show && r.verdict !== "exact") {
      const fix = el("div", "tb-fix");
      if (r.typed) {
        const d = wrLcs(r.typed, r.best);
        fix.append(wrDiffNode(d.A, d.ma, "wr-bad"), el("span", "pv-arrow", "→"), wrDiffNode(d.B, d.mb, "wr-miss"));
      } else fix.appendChild(el("div", "wr-diff", r.best));
      fix.lang = L;
      if (r.verdict !== "wrong") fix.appendChild(el("div", "tb-note", t({ accents: "write.accents", spaces: "write.spaces", punct: "write.punct" }[r.verdict])));
      row.appendChild(fix);
    }
    table.appendChild(row);
  });
  root.appendChild(table);

  if (!tb.res) {
    const b = el("button", "btn primary", t("table.check"));
    b.addEventListener("click", () => tableCheck(cs));
    root.appendChild(b);
    setTimeout(() => { try { const f = inputs.find(x => !x.value) || inputs[0]; if (f && !("ontouchstart" in window)) f.focus(); } catch (e) {} }, 60);
  } else {
    const ids = cs.map(c => c.id).filter(id => tb.res[id]);
    const ok = ids.filter(id => tb.res[id].verdict !== "wrong").length;
    const box = el("div", "card wr-res " + (ok === ids.length ? "ok" : ok ? "acc" : "bad"));
    box.appendChild(el("div", "wr-head", t("table.score", { n: ok, m: ids.length })));
    const notes = [...new Set(cs.map(x => x.note).filter(Boolean))];
    if (notes.length) box.appendChild(tyLine("ty-note", notes.join(" · ")));
    const full = cs.map(c => conjFull(c)).join(" · ");
    box.appendChild(tyLine("tb-all", full, L));
    const asp = spkItemsRow(cs.map(c => ({ text: conjFull(c), lng: L })));
    if (asp) box.appendChild(asp);
    root.appendChild(box);
    autoSpeak(s, "a", cs.map(c => ({ text: conjFull(c), lng: L })), { target: L, support: cardLangs(c0).support });
    const btns = el("div", "btns two");
    const show = el("button", "btn", t(tb.show ? "table.hideFix" : "table.showFix"));
    show.addEventListener("click", () => { tb.show = !tb.show; renderReview(); });
    const next = el("button", "btn primary", t("table.next"));
    next.addEventListener("click", tableNext);
    btns.append(show, next);
    root.appendChild(btns);
    setTimeout(() => { try { next.focus(); } catch (e) {} }, 60);
  }

  const quit = el("button", "link-btn", t("cards.quit"));
  quit.addEventListener("click", () => { s.tb = null; s.queue = []; renderReview(); });
  root.appendChild(quit);
}

// Validation d'un coup : chaque case met à jour sa carte dans le Leitner (juste → Su, fausse → Pas su).
function tableCheck(cs) {
  const s = rv.s, tb = s.tb;
  if (!tb || tb.res) return;
  tb.res = {};
  cs.forEach(c => {
    const r = wrCheck(tb.vals[c.id] || "", typedAlts(c));
    tb.res[c.id] = r;
    const result = r.verdict === "wrong" ? "unknown" : "known";
    const g = Leitner.grade(c, result);
    s.counts[result]++;
    if (!(c.id in s.first)) s.first[c.id] = result;
    s.log.unshift({ word: cardTitle(c), result, from: g.from, to: g.to, dueAt: g.dueAt });
  });
  tb.show = cs.some(c => tb.res[c.id].verdict === "wrong");   // correction affichée d'office s'il y a des erreurs
  commit();
}
// Tableau suivant ; les cases fausses reviennent en fin de session.
function tableNext() {
  const s = rv.s, tb = s.tb;
  const g = s.queue.shift();
  if (g && tb && tb.res) {
    const wrong = g.ids.filter(id => tb.res[id] && tb.res[id].verdict === "wrong");
    if (wrong.length) s.queue.push({ ids: wrong });
  }
  s.tb = null;
  renderReview();
  window.scrollTo(0, 0);
}

// === ÉCRAN : LISTES ===
// Vue en cours : listId null = vue d'ensemble (dossiers et listes) ; query = texte de recherche ;
// reorder = mode « Réorganiser » (boutons ↑ ↓ sur les dossiers et les listes).
// Dossiers repliables (état gardé sur l'appareil : localStorage "vocabfr.collapsed:<identifiant>").
// Sur ordinateur : glisser une liste sur un dossier (ou sur « Sans dossier ») pour l'y déplacer.
const lv = { listId: null, query: "", reorder: false };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// Texte comparable : minuscules, sans accents, espaces simplifiés (le coréen reste intact).
function normText(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC")
    .toLowerCase().replace(/\s+/g, " ").trim();
}
// Doublon = même mot dans la langue apprise ET même traduction dans la première langue d'appui remplie.
// Ainsi « voler / 날다 » et « voler / 훔치다 » restent deux cartes distinctes.
// terms : { code: texte } ; lg : langues de la liste.
function dupKey(terms, lg) {
  const f = normText(terms[lg.target]).split("/").map(x => x.trim()).filter(Boolean).join("/");
  const s = lg.support.find(code => normText(terms[code]));
  return f + "|" + (s ? s + ":" + normText(terms[s]) : "");
}
function getList(id) { return state.lists.find(l => l.id === id) || null; }
function cardsOf(listId) { return state.cards.filter(c => c.listId === listId); }
function parseTags(s) { return String(s || "").split(",").map(x => x.trim()).filter(Boolean); }
function cardMatches(c, q) {
  return normText(cardSearchText(c) + " " + c.tags.join(" ")).includes(q);
}
function dueCount(cards, now) { now = now || Date.now(); return cards.filter(c => Leitner.isDue(c, now)).length; }

// --- Dossiers repliés (sur cet appareil) ---
function collapsedKey() { return CONFIG.LS_USER_PREFIX + "collapsed:" + (Storage.getUser() || ""); }
function getCollapsed() { try { return new Set(JSON.parse(localStorage.getItem(collapsedKey()) || "[]")); } catch (e) { return new Set(); } }
function toggleCollapsed(id) {
  const s = getCollapsed();
  if (s.has(id)) s.delete(id); else s.add(id);
  try { localStorage.setItem(collapsedKey(), JSON.stringify([...s])); } catch (e) {}
}
const canDrag = (() => { try { return window.matchMedia("(hover: hover) and (pointer: fine)").matches; } catch (e) { return false; } })();

function renderLists() {
  if (lv.listId && !getList(lv.listId)) lv.listId = null;
  const list = lv.listId ? getList(lv.listId) : null;
  $("#lvTop").hidden = !list;
  $("#lvTitleRow").hidden = !list;
  $("#lvLinks").hidden = !list;
  $("#lvMore").hidden = !!list;
  $("#lvBack").textContent = "‹ " + t("nav.lists");
  $("#lvTitle").textContent = list ? list.name : "";
  $("#lvSub").textContent = list ? (getFolder(list.folderId) ? "▸ " + getFolder(list.folderId).name + " · " : "") + pairLabel(listLangs(list)) + " · " + updDate(list.lastUpdate) : "";
  if (list) { const g = listGapCount(list); $("#lvUpdate").textContent = g ? t("upd.btnN", { n: g }) : t("upd.btn"); }
  $("#lvReorder").textContent = t(lv.reorder ? "folders.reorderDone" : "folders.reorder");
  const search = $("#lvSearch");
  search.placeholder = t("lists.search");
  if (document.activeElement !== search) search.value = lv.query;
  $("#lvAdd").textContent = t(list ? "card.add" : "lists.new");

  const box = $("#lvContent");
  box.textContent = "";
  const q = normText(lv.query);

  // Vue d'ensemble : dossiers puis listes sans dossier
  if (!list && !q) {
    if (!state.lists.length && !state.folders.length) { box.appendChild(el("div", "empty", t("lists.empty"))); return; }
    const now = Date.now();
    const collapsed = getCollapsed();
    const folders = sortedFolders();
    folders.forEach((f, i) => box.appendChild(folderSection(f, i, folders.length, collapsed.has(f.id), now)));
    const loose = listsIn(null);
    if (loose.length || folders.length) {
      const sec = el("div", "fd-sec");
      if (folders.length) {
        const hd = el("div", "fd-head fd-none");
        hd.appendChild(el("div", "fd-name", t("folders.none")));
        sec.appendChild(hd);
        dropTarget(hd, null);
      }
      if (loose.length) sec.appendChild(listItems(loose, now));
      else sec.appendChild(el("div", "fd-empty", t("folders.noLists")));
      box.appendChild(sec);
    }
    return;
  }

  // Cartes : d'une liste, ou résultats de recherche dans toutes les listes
  let cards = list ? cardsOf(list.id) : state.cards;
  if (q) cards = cards.filter(c => cardMatches(c, q));
  if (!cards.length) { box.appendChild(el("div", "empty", t(q ? "lists.noResults" : "lists.noCards"))); return; }
  const wrap = el("div", "items");
  cards.forEach(c => wrap.appendChild(cardItem(c, !list)));
  box.appendChild(wrap);
}

// Un dossier : en-tête (repli, nombre de listes / cartes / à réviser, menu ⋯ ou ↑ ↓), puis ses listes.
function folderSection(f, idx, total, isCollapsed, now) {
  const lists = listsIn(f.id);
  const ids = new Set(lists.map(l => l.id));
  const cards = state.cards.filter(c => ids.has(c.listId));
  const sec = el("div", "fd-sec");
  const hd = el("div", "fd-head");
  const tg = el("button", "fd-toggle");
  tg.setAttribute("aria-expanded", String(!isCollapsed));
  const nm = el("div", "fd-name");
  nm.append(el("span", "fd-caret", isCollapsed ? "▸" : "▾"), document.createTextNode(f.name));
  const fb = updBadge(folderGapCount(f));
  if (fb) nm.append(document.createTextNode(" "), fb);
  const meta = el("div", "fd-meta", t("folders.meta", { l: lists.length, c: cards.length, d: dueCount(cards, now) }) + " · " + pairLabel(folderLangs(f)));
  tg.append(nm, meta);
  tg.addEventListener("click", () => { toggleCollapsed(f.id); renderLists(); });
  hd.appendChild(tg);
  if (lv.reorder) hd.appendChild(orderBtns(sortedFolders(), idx, total));
  else {
    const mb = el("button", "fd-menu", "⋯");
    mb.setAttribute("aria-label", t("folders.menu"));
    mb.addEventListener("click", () => openFolderMenu(f.id));
    hd.appendChild(mb);
  }
  sec.appendChild(hd);
  dropTarget(hd, f.id);
  if (!isCollapsed) sec.appendChild(lists.length ? listItems(lists, now) : el("div", "fd-empty", t("folders.noLists")));
  return sec;
}

function listItems(lists, now) {
  const wrap = el("div", "items");
  lists.forEach((l, i) => {
    const cards = cardsOf(l.id);
    const b = el("div", "item");
    b.setAttribute("role", "button"); b.tabIndex = 0;
    const m = el("div", "main");
    const due = dueCount(cards, now);
    const t1 = el("div", "t1", l.name);
    const lb = updBadge(listGapCount(l));
    if (lb) t1.append(document.createTextNode(" "), lb);
    m.append(t1,
      el("div", "t2", t("lists.count", { n: cards.length }) + (due ? " · " + t("lists.due", { n: due }) : "") + " · " + pairLabel(listLangs(l))));
    b.appendChild(m);
    if (lv.reorder) b.appendChild(orderBtns(lists, i, lists.length));
    else {
      b.appendChild(el("span", "chev", "›"));
      b.addEventListener("click", () => openListView(l.id));
      b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openListView(l.id); } });
      if (canDrag) {
        b.draggable = true;
        b.addEventListener("dragstart", e => { try { e.dataTransfer.setData("text/plain", "list:" + l.id); e.dataTransfer.effectAllowed = "move"; } catch (err) {} b.classList.add("dragging"); });
        b.addEventListener("dragend", () => b.classList.remove("dragging"));
      }
    }
    wrap.appendChild(b);
  });
  return wrap;
}

// Zone de dépôt (ordinateur) : une liste glissée ici passe dans ce dossier (null = sans dossier), en dernière position.
function dropTarget(node, folderId) {
  if (!canDrag) return;
  node.addEventListener("dragover", e => { e.preventDefault(); node.classList.add("drop-over"); });
  node.addEventListener("dragleave", () => node.classList.remove("drop-over"));
  node.addEventListener("drop", e => {
    e.preventDefault(); node.classList.remove("drop-over");
    let v = "";
    try { v = e.dataTransfer.getData("text/plain") || ""; } catch (err) {}
    if (v.startsWith("list:")) moveListTo(v.slice(5), folderId);
  });
}

// Boutons ↑ ↓ du mode « Réorganiser ». items : éléments dans l'ordre affiché (dossiers ou listes d'un même groupe).
function orderBtns(items, idx, total) {
  const w = el("div", "ord-btns");
  [["↑", -1], ["↓", 1]].forEach(([s, d]) => {
    const b = el("button", "ord-btn", s);
    b.disabled = idx + d < 0 || idx + d >= total;
    b.setAttribute("aria-label", t(d < 0 ? "folders.up" : "folders.down"));
    b.addEventListener("click", e => { e.stopPropagation(); moveOrder(items, idx, d); });
    w.appendChild(b);
  });
  return w;
}
function moveOrder(items, idx, d) {
  const a = items.slice();
  const j = idx + d;
  if (j < 0 || j >= a.length) return;
  [a[idx], a[j]] = [a[j], a[idx]];
  a.forEach((x, i) => { x.order = i; });
  commit();
}
// Déplace une liste dans un dossier (null = sans dossier), en dernière position. Cartes et progression inchangées.
function moveListTo(listId, folderId) {
  const l = getList(listId);
  if (!l || (l.folderId || null) === (folderId || null)) return;
  const before = unusableIds();
  l.folderId = folderId || null;
  l.order = nextOrder(listsIn(folderId).filter(x => x !== l));
  commit();
  warnUnusable(before);
  toast(t("folders.moved", { name: l.name, folder: folderId ? getFolder(folderId).name : t("folders.none") }));
}

function cardItem(c, showList) {
  if (!isVocab(c)) return typedCardItem(c, showList);
  const lg = cardLangs(c);
  const b = el("button", "item");
  const m = el("div", "main");
  const t1 = el("div", "t1", targetTerm(c, lg) || "—"); t1.lang = lg.target;
  const tp = posTag(c, lg.target);
  if (tp) t1.appendChild(tp);
  m.appendChild(t1);
  const sup = supportTerms(c, lg);
  if (sup.length) {
    const t2 = el("div", "t2");
    sup.forEach((x, i) => {
      if (i) t2.appendChild(document.createTextNode(" · "));
      const sp = el("span", null, x.text); sp.lang = x.code;
      const p = posTag(c, x.code);
      if (p) sp.appendChild(p);
      t2.appendChild(sp);
    });
    m.appendChild(t2);
  }
  const extra = el("div");
  if (showList) { const l = getList(c.listId); if (l) extra.appendChild(el("span", "tag", "▸ " + l.name)); }
  c.tags.forEach(tg => extra.appendChild(el("span", "tag", "#" + tg)));
  if (extra.childNodes.length) m.appendChild(extra);
  b.append(m, el("span", "chev", "›"));
  b.addEventListener("click", () => openCardEditor(c.id));
  return b;
}

// Carte d'un autre type dans une liste : badge du type, titre court, réponse en dessous.
function typedCardItem(c, showList) {
  const b = el("button", "item");
  const m = el("div", "main");
  const t1 = el("div", "t1"); t1.lang = c.lang;
  t1.append(typeBadge(c.type), document.createTextNode(cardTitle(c)));
  m.appendChild(t1);
  const sub = cardSubtitle(c);
  if (sub) { const t2 = el("div", "t2", sub); t2.lang = c.lang; m.appendChild(t2); }
  const extra = el("div");
  if (showList) { const l = getList(c.listId); if (l) extra.appendChild(el("span", "tag", "▸ " + l.name)); }
  if (!typedUsable(c)) extra.appendChild(el("span", "tag warn", t("type.incomplete")));
  c.tags.forEach(tg => extra.appendChild(el("span", "tag", "#" + tg)));
  if (extra.childNodes.length) m.appendChild(extra);
  b.append(m, el("span", "chev", "›"));
  b.addEventListener("click", () => openCardEditor(c.id));
  return b;
}

function openListView(id) {
  lv.listId = id; lv.query = ""; lv.reorder = false;
  renderLists();
  window.scrollTo(0, 0);
}

function initLists() {
  $("#lvBack").addEventListener("click", () => openListView(null));

// --- Petits constructeurs de formulaire ---
function formField(labelText, input, required, hint) {
  const f = el("div", "field");
  const lab = el("label", null, labelText);
  if (required) lab.appendChild(el("span", "req", " *"));
  f.append(lab, input);
  if (hint) f.appendChild(el("div", "hint", hint));
  return f;
}
function textInput(value, placeholder, lang) {
  const i = el("input", "input");
  i.type = "text"; i.value = value || ""; i.autocomplete = "off";
  if (placeholder) i.placeholder = placeholder;
  if (lang) i.lang = lang;
  return i;
}
// Listes groupées par dossier (ordre d'affichage) ; withNew : option « + Nouvelle liste ».
function listSelect(selectedId, withNew) {
  const s = el("select", "input");
  const add = (parent, l) => { const o = el("option", null, l.name); o.value = l.id; parent.appendChild(o); };
  const folders = sortedFolders();
  folders.forEach(f => {
    const ls = listsIn(f.id);
    if (!ls.length) return;
    const g = el("optgroup"); g.label = f.name;
    ls.forEach(l => add(g, l));
    s.appendChild(g);
  });
  const loose = listsIn(null);
  if (loose.length) {
    if (folders.length) { const g = el("optgroup"); g.label = t("folders.none"); loose.forEach(l => add(g, l)); s.appendChild(g); }
    else loose.forEach(l => add(s, l));
  }
  if (withNew) { const o = el("option", null, t("bulk.newList")); o.value = "__new__"; s.appendChild(o); }
  if (selectedId && (selectedId === "__new__" ? withNew : getList(selectedId))) s.value = selectedId;
  return s;
}
// Dossiers ("" = sans dossier) ; withNew : option « + Nouveau dossier ».
function folderSelect(selectedId, withNew) {
  const s = el("select", "input");
  const o0 = el("option", null, t("folders.none")); o0.value = ""; s.appendChild(o0);
  sortedFolders().forEach(f => { const o = el("option", null, f.name); o.value = f.id; s.appendChild(o); });
  if (withNew) { const o = el("option", null, t("folders.newOption")); o.value = "__new__"; s.appendChild(o); }
  s.value = selectedId && (selectedId === "__new__" || getFolder(selectedId)) ? selectedId : "";
  return s;
}

// --- Langues : apprise + d'appui (compte, dossier ou liste) ---
// Dossier / liste : « Utiliser le réglage du compte / du dossier » (héritage) ou réglage propre.
function cardsUnder(kind, obj) {
  if (kind === "list") return cardsOf(obj.id);
  if (kind === "folder") { const ids = new Set(listsIn(obj.id).map(l => l.id)); return state.cards.filter(c => ids.has(c.listId)); }
  return state.cards;
}
function unusableIds() { return new Set(state.cards.filter(c => !cardUsable(c)).map(c => c.id)); }
// Après un changement de langue : cartes qui n'ont pas de mot dans la nouvelle langue apprise (pas proposées en révision).
function warnUnusable(before) {
  const n = state.cards.filter(c => !before.has(c.id) && !cardUsable(c)).length;
  if (n) setTimeout(() => toast(t("langs.unusable", { n })), 2300);
}
function langPicker(target, support, onChange) {
  const wrap = el("div");
  const seg = el("div", "seg");
  LANG_CODES.forEach(code => {
    const b = el("button", null, langName(code));
    b.type = "button";
    b.setAttribute("aria-pressed", String(code === target));
    b.addEventListener("click", () => {
      // La nouvelle langue apprise prend la place de l'ancienne dans les langues d'appui (fr ← ko, en  ⇒  ko ← fr, en).
      let sp = support.map(x => x === code ? target : x);
      sp = cleanSupport(sp, code);
      if (!sp.length) sp = defaultSupportFor(code);
      onChange(code, sp);
    });
    seg.appendChild(b);
  });
  wrap.appendChild(formField(t("langs.target"), seg));
  const chips = el("div", "chips");
  LANG_CODES.filter(c => c !== target).forEach(code => {
    const b = el("button", null, langName(code));
    b.type = "button";
    b.setAttribute("aria-pressed", String(support.includes(code)));
    b.addEventListener("click", () => { const sp = support.slice(); toggleIn(sp, code); onChange(target, sp); });
    chips.appendChild(b);
  });
  wrap.appendChild(formField(t("langs.support"), chips, false, t("langs.supportHint")));
  return wrap;
}
function openLangEditor(kind, obj) {
  const parent = kind === "list" ? folderLangs(getFolder(obj.folderId)) : kind === "folder" ? accountLangs() : null;
  const cur = kind === "account" ? accountLangs() : kind === "folder" ? folderLangs(obj) : listLangs(obj);
  let inherit = !!parent && !isLang(obj.target);
  let target = cur.target, support = cur.support.slice();
  const wrap = el("div");
  const draw = () => {
    wrap.textContent = "";
    if (kind !== "account") wrap.appendChild(el("p", "muted", t(kind === "list" ? "langs.forList" : "langs.forFolder", { name: obj.name })));
    if (parent) {
      const lab = el("label", "check-row");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = inherit;
      cb.addEventListener("change", () => { inherit = cb.checked; if (inherit) { target = parent.target; support = parent.support.slice(); } draw(); });
      lab.append(cb, document.createTextNode(t(kind === "list" ? "langs.inheritFolder" : "langs.inheritAccount", { pair: pairLabel(parent) })));
      wrap.appendChild(lab);
    }
    if (!inherit) wrap.appendChild(langPicker(target, support, (tg, sp) => { target = tg; support = sp; draw(); }));
    const n = cardsUnder(kind, obj).filter(c => isVocab(c) && !term(c, inherit ? parent.target : target).trim()).length;
    if (n) wrap.appendChild(el("div", "hint", t("langs.missing", { n, lang: langName(inherit ? parent.target : target) })));
  };
  draw();
  openModal(t("langs.title"), wrap, [
    { label: t("cancel") },
    { label: t("save"), kind: "primary", onClick: () => {
      if (!inherit && !support.length) { toast(t("langs.supportRequired")); return false; }
      const before = unusableIds();
      if (kind === "account") { state.settings.defaultTarget = target; state.settings.defaultSupport = support.slice(); }
      else if (inherit) { delete obj.target; delete obj.support; }
      else { obj.target = target; obj.support = support.slice(); }
      commit();
      warnUnusable(before);
    } }
  ]);
}

// --- Dossiers : créer, renommer, menu, supprimer ---
function openFolderName(id, onCreated) {
  const f = id ? getFolder(id) : null;
  const inp = textInput(f ? f.name : "", "");
  const wrap = el("div");
  wrap.appendChild(formField(t("folders.name"), inp, true));
  openModal(t(f ? "folders.renameTitle" : "folders.new"), wrap, [
    { label: t("cancel") },
    { label: t("save"), kind: "primary", onClick: () => {
      const name = inp.value.trim();
      if (!name) { toast(t("folders.nameRequired")); return false; }
      if (f) f.name = name;
      else {
        const nf = { id: uid(), name, order: nextOrder(state.folders) };
        state.folders.push(nf);
        if (onCreated) { onCreated(nf); return; }
      }
      commit();
    } }
  ]);
  setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50);
}
function openFolderMenu(id) {
  const f = getFolder(id);
  if (!f) return;
  const lists = listsIn(id);
  const n = state.cards.filter(c => lists.some(l => l.id === c.listId)).length;
  const p = el("div");
  p.appendChild(el("p", "muted", t("folders.meta", { l: lists.length, c: n, d: dueCount(state.cards.filter(c => lists.some(l => l.id === c.listId))) }) + " · " + pairLabel(folderLangs(f))));
  const fb = updBadge(folderGapCount(f));
  if (fb) p.appendChild(fb);
  p.appendChild(el("div", "upd-last", updDate(f.lastUpdate)));
  openModal(f.name, p, [
    { label: t("upd.btn"), onClick: () => { openUpdate({ kind: "folder", id }); } },
    { label: t("folders.rename"), onClick: () => { openFolderName(id); } },
    { label: t("folders.langs"), onClick: () => { openLangEditor("folder", f); } },
    { label: t("folders.delete"), kind: "danger", onClick: () => { confirmDeleteFolder(id); } },
    { label: t("cancel") }
  ]);
}
// Supprimer un dossier : au choix, supprimer ses listes (et leurs cartes) ou les sortir du dossier.
function confirmDeleteFolder(id) {
  const f = getFolder(id);
  if (!f) return;
  const lists = listsIn(id);
  const ids = new Set(lists.map(l => l.id));
  const n = state.cards.filter(c => ids.has(c.listId)).length;
  const drop = () => {
    state.folders = state.folders.filter(x => x.id !== id);
    sortedFolders().forEach((x, i) => { x.order = i; });
  };
  if (!lists.length) {
    openModal(t("folders.delete"), el("p", null, t("folders.deleteEmpty", { name: f.name })), [
      { label: t("cancel") },
      { label: t("delete"), kind: "danger", onClick: () => { drop(); commit(); } }
    ]);
    return;
  }
  openModal(t("folders.delete"), el("p", null, t("folders.deleteAsk", { name: f.name, l: lists.length, c: n })), [
    { label: t("folders.keepLists"), kind: "primary", onClick: () => {
      const before = unusableIds();
      let o = nextOrder(listsIn(null));
      lists.forEach(l => { l.folderId = null; l.order = o++; });
      drop(); commit(); warnUnusable(before);
    } },
    { label: t("folders.deleteLists", { l: lists.length, c: n }), kind: "danger", onClick: () => {
      openModal(t("folders.delete"), el("p", null, t("folders.deleteListsConfirm", { name: f.name, l: lists.length, c: n })), [
        { label: t("cancel") },
        { label: t("delete"), kind: "danger", onClick: () => {
          state.lists = state.lists.filter(l => !ids.has(l.id));
          state.cards = state.cards.filter(c => !ids.has(c.listId));
          drop(); commit();
        } }
      ]);
    } },
    { label: t("cancel") }
  ]);
}

// --- Listes : créer (avec dossier), renommer, déplacer, supprimer ---
function openListName(id) {
  const l = id ? getList(id) : null;
  const inp = textInput(l ? l.name : "", "");
  const wrap = el("div");
  wrap.appendChild(formField(t("lists.name"), inp, true));
  const fsel = l ? null : folderSelect("", false);
  if (fsel) wrap.appendChild(formField(t("folders.folder"), fsel));
  openModal(t(l ? "lists.renameTitle" : "lists.new"), wrap, [
    { label: t("cancel") },
    { label: t("save"), kind: "primary", onClick: () => {
      const name = inp.value.trim();
      if (!name) { toast(t("lists.nameRequired")); return false; }
      if (l) l.name = name;
      else {
        const folderId = fsel.value || null;
        const nl = { id: uid(), name, folderId, order: nextOrder(listsIn(folderId)), createdAt: Date.now() };
        state.lists.push(nl); lv.listId = nl.id; lv.query = "";
      }
      commit();
    } }
  ]);
  setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50);
}
// « Déplacer vers… » : choix du dossier (ou nouveau dossier).
function openMoveList(id) {
  const l = getList(id);
  if (!l) return;
  const sel = folderSelect(l.folderId || "", true);
  const wrap = el("div");
  wrap.appendChild(formField(t("folders.moveTo"), sel));
  openModal(t("folders.moveTitle", { name: l.name }), wrap, [
