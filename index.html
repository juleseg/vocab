<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire français</title>
<style>
/* === STYLES : THÈMES === */
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1d1d1f; --muted:#6b6b70;
  --border:#dedbd4; --accent:#2f5bd3; --accent-text:#ffffff; --ok:#1f8a4c; --warn:#c07a00; --bad:#c43c3c;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416; --surface:#1e1e22; --surface2:#2a2a2f; --text:#f2f2f4; --muted:#a0a0a8;
  --border:#34343a; --accent:#7b9cff; --accent-text:#0d1430; --ok:#4cc27e; --warn:#e3a43a; --bad:#ef6b6b;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    color-scheme:dark;
    --bg:#141416; --surface:#1e1e22; --surface2:#2a2a2f; --text:#f2f2f4; --muted:#a0a0a8;
    --border:#34343a; --accent:#7b9cff; --accent-text:#0d1430; --ok:#4cc27e; --warn:#e3a43a; --bad:#ef6b6b;
    --shadow:none;
  }
}

/* === STYLES : BASE === */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:22px;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-mode="cloud"] .dot{background:var(--ok)}
.sync[data-mode="syncing"] .dot{background:var(--warn)}
.sync[data-mode="error"] .dot{background:var(--bad)}
main{flex:1;padding:8px 16px 110px}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.big-num{font-size:44px;font-weight:700;line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2 .card{text-align:center;margin-bottom:0}

/* === STYLES : FORMULAIRES === */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;padding:10px 4px;border-radius:9px;min-height:44px;cursor:pointer;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
input[type="number"],textarea{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:600;padding:10px 14px}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* === STYLES : NAVIGATION === */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom button{position:relative;border:0;background:none;padding:8px 1px 10px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;line-height:1.15;text-align:center;color:var(--muted);cursor:pointer}
.nav-badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:0 5px;display:flex;align-items:center;justify-content:center}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.active{color:var(--accent);font-weight:600}

/* === STYLES : MODALE & TOAST === */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--surface);border-radius:20px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:18px}
.modal p{margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.progress{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.modal .progress-text{margin:10px 0 0}

/* === STYLES : LISTES & CARTES === */
[hidden]{display:none !important}
.input{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px;min-height:48px}
textarea.input{font-family:inherit;font-size:inherit;min-height:80px}
.lv-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lv-top h2{flex:1;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{border:0;background:none;color:var(--accent);padding:10px 4px;min-height:44px;cursor:pointer;font-weight:600}
.lv-links{display:flex;flex-wrap:wrap;gap:0 16px;margin-bottom:8px}
.lv-sub{font-size:14px;color:var(--muted);margin:-2px 0 2px}
.lv-sub:empty{display:none}
.lv-links .danger{color:var(--bad)}
#lvSearch{margin-bottom:12px}
#lvActions{margin-bottom:14px}
.items{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;padding:14px 16px;min-height:60px;cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600;overflow-wrap:anywhere}
.item .t2{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .chev{color:var(--muted);font-size:22px}
.tag{display:inline-block;font-size:12px;background:var(--surface2);border-radius:6px;padding:1px 6px;margin:4px 4px 0 0;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.req{color:var(--bad)}
.preview-sum{display:grid;gap:2px;margin-bottom:14px;font-weight:600}
.preview-box{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.preview-box .pl{padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;overflow-wrap:anywhere}
.preview-box .pl:last-child{border-bottom:0}
.pl.bad{color:var(--bad)}
.pl.dup{color:var(--warn)}

/* === STYLES : DOSSIERS === */
.fd-sec{margin-bottom:14px}
.fd-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;border-radius:12px}
.fd-toggle{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 4px;cursor:pointer;min-height:44px}
.fd-name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.fd-none{padding:6px 4px}
.fd-none .fd-name{color:var(--muted);font-size:15px}
.fd-caret{display:inline-block;width:20px;color:var(--muted)}
.fd-meta{font-size:13px;color:var(--muted);padding-left:20px}
.fd-menu{border:0;background:none;font-size:24px;line-height:1;min-width:44px;min-height:44px;cursor:pointer;color:var(--muted)}
.fd-empty{font-size:14px;color:var(--muted);padding:4px 24px 8px}
.fd-head.drop-over{background:var(--surface2);outline:2px dashed var(--accent)}
.item.dragging{opacity:.4}
div.item{cursor:pointer}
.ord-btns{display:flex;gap:6px;flex:none}
.ord-btn{border:1px solid var(--border);background:var(--surface2);border-radius:10px;min-width:44px;min-height:40px;cursor:pointer;font-size:18px}
.ord-btn:disabled{opacity:.35;cursor:default}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px;cursor:pointer}
.check-row input{width:22px;height:22px;flex:none;accent-color:var(--accent)}

/* === STYLES : IMPORT FICHIER === */
.bulk-ta{min-height:140px;max-height:60vh;resize:vertical;overflow-y:auto}
.drop-zone{position:relative;border:2px dashed var(--border);border-radius:14px;padding:12px;text-align:center}
/* Vrai <input type="file"> masqué visuellement (pas display:none, pas pointer-events:none) : ouvert par son <label for> */
.file-input{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;opacity:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
label.file-pick{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
label.file-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop-zone.over{border-color:var(--accent);background:var(--surface2)}
.drop-hint{font-size:13px;color:var(--muted);margin-top:8px}
@media (hover:none){.drop-hint{display:none}}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:6px 6px 6px 12px}
.file-chip span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 14px;font-size:14px;color:var(--muted)}
.pager button{border:1px solid var(--border);background:var(--surface2);border-radius:10px;min-width:44px;min-height:40px;cursor:pointer;font-size:18px}
.pager button:disabled{opacity:.4;cursor:default}

/* === STYLES : IMPORT COLONNES === */
.col-map{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.col-map table{border-collapse:collapse;min-width:100%;font-size:14px}
.col-map th,.col-map td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.col-map tr:last-child td{border-bottom:0}
.col-map th .input{min-width:120px;min-height:40px;padding:6px 8px;font-size:14px}
.col-map td.muted{opacity:.5}
.lang-ro{font-weight:600;padding:4px 0}

/* === STYLES : RÉVISER === */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.avail{font-weight:600;text-align:center;margin:4px 0 12px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.btns.three .btn,.qz-btns .btn{padding:8px 4px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
@media (max-width:360px){.seg button{font-size:15px}.qz-btns .btn{font-size:17px}}
.btn.ok{color:var(--ok)}
.btn.warn{color:var(--warn)}

/* === STYLES : SESSION (COMMUN) === */
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin-bottom:8px}

/* === STYLES : MODE INTERROGATEUR === */
.qz-q{text-align:center;padding:26px 16px}
.qz-main{font-size:clamp(32px,10vw,46px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;margin-top:6px}
.qz-sub{font-size:20px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.qz-ans{border:2px dashed var(--accent);padding:8px 16px 16px}
.qz-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qz-lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qz-amain{font-size:26px;font-weight:700;overflow-wrap:anywhere}
.qz-asub{color:var(--muted);overflow-wrap:anywhere}
.qz-ex{font-style:italic;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.qz-hidden{color:var(--muted);text-align:center;padding:12px 0}
.qz-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.qz-btns .btn{min-height:84px;font-size:19px}

/* === STYLES : MODE CARTES === */
.sw-stage{position:relative;height:min(56vh,420px);margin:4px 0 8px;perspective:1200px}
.sw-card{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;outline:none}
.sw-card.sw-enter{animation:swIn .22s ease-out}
@keyframes swIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sw-inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.sw-inner.flipped{transform:rotateY(180deg)}
.sw-face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.10);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:16px 18px;overflow:hidden}
.sw-back{transform:rotateY(180deg);border:2px solid var(--accent)}
.sw-lang{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sw-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
.sw-main{font-size:clamp(26px,8vw,38px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sw-sub{font-size:19px;color:var(--muted);overflow-wrap:anywhere}
.sw-ex{font-size:16px;color:var(--muted);font-style:italic;margin-top:10px;max-width:92%}
.sw-stamp{position:absolute;z-index:2;top:18px;padding:4px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;background:var(--surface)}
.sw-stamp-known{left:18px;color:var(--ok);transform:rotate(-12deg)}
.sw-stamp-unknown{right:18px;color:var(--bad);transform:rotate(12deg)}
.sw-stamp-review{left:50%;top:auto;bottom:18px;transform:translateX(-50%);color:var(--warn)}
.sw-hint{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sum-cell{background:var(--surface2);border-radius:14px;padding:14px 6px;text-align:center}
.sum-num{font-size:34px;font-weight:700;line-height:1.1}
.sum-cell.ok .sum-num{color:var(--ok)}
.sum-cell.warn .sum-num{color:var(--warn)}
.sum-cell.bad .sum-num{color:var(--bad)}
.sum-lbl{font-size:14px;color:var(--muted)}
.sum-ok{margin-top:14px;text-align:center;font-weight:600;color:var(--ok)}
@media (prefers-reduced-motion: reduce){.sw-inner{transition:none}.sw-card.sw-enter{animation:none}}

/* === STYLES : MODE ÉCRIT === */
.wr-q{text-align:center;padding:18px 14px}
.wr-q .sw-main{font-size:clamp(24px,7vw,34px)}
.wr-q .sw-sub{margin-top:4px}
.wr-input{font-size:20px;min-height:56px;margin-bottom:12px;text-align:center}
.wr-input[readonly]{opacity:.75}
.wr-res{border-width:2px}
.wr-res.ok{border-color:var(--ok)}
.wr-res.acc{border-color:var(--warn)}
.wr-res.bad{border-color:var(--bad)}
.wr-head{font-weight:700;font-size:19px}
.wr-res.ok .wr-head{color:var(--ok)}
.wr-res.acc .wr-head{color:var(--warn)}
.wr-res.bad .wr-head{color:var(--bad)}
.wr-lbl{font-size:13px;color:var(--muted);margin-top:12px}
.wr-diff{font-size:22px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
mark.wr-miss{background:rgba(31,138,76,.25);color:inherit;border-radius:3px;text-decoration:underline;text-underline-offset:3px}
mark.wr-bad{background:rgba(196,60,60,.25);color:inherit;border-radius:3px;text-decoration:line-through}
.wr-ex{font-style:italic;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}
.wr-fix{font-size:14px;color:var(--muted);text-align:center;margin:14px 0 8px}

/* === STYLES : AUDIO === */
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--accent);cursor:pointer;padding:0}
.spk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk:active{transform:scale(.94)}
.sw-face .spk{position:absolute;top:10px;right:10px;z-index:3}
.sw-inner.flipped .sw-front,.sw-inner:not(.flipped) .sw-back{pointer-events:none}
.spk-row{display:flex;justify-content:center;margin-top:10px}
.qz-head-r{display:flex;align-items:center;gap:6px}
/* Interrupteur « Lecture auto » : toute la ligne est cliquable, grand curseur pour le pouce */
.au-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;margin-bottom:10px;padding:8px 10px 8px 16px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:600;text-align:left;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.au-switch .au-lbl{display:flex;align-items:center;gap:10px}
.au-switch .au-lbl svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.au-track{position:relative;flex:none;width:76px;height:44px;border-radius:22px;background:var(--surface2);border:1px solid var(--border);transition:background .2s}
.au-knob{position:absolute;top:3px;left:3px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.au-switch[aria-checked="true"] .au-track{background:var(--accent);border-color:var(--accent)}
.au-switch[aria-checked="true"] .au-knob{transform:translateX(32px)}
.au-warn{font-size:14px;color:var(--warn);margin-top:10px}
@media (prefers-reduced-motion: reduce){.au-track,.au-knob{transition:none}}

/* === STYLES : NATURE GRAMMATICALE === */
.pos{font-size:max(13px,.5em);font-weight:500;font-style:italic;color:var(--muted);margin-left:.4em;white-space:nowrap}
.sub-item{white-space:normal}
.sub-sep{color:var(--muted)}
.wr-pos{margin-top:4px}
.wr-pos .pos{margin-left:0;font-size:15px}
.term-row{display:flex;gap:8px}
.term-row .input:first-child{flex:1;min-width:0}
.term-row select.input{flex:none;width:118px;padding:8px 6px;font-size:15px}

/* === STYLES : STATS === */
.st-filters{display:grid;gap:8px;margin-bottom:14px}
.st-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-tile{background:var(--surface2);border-radius:14px;padding:12px 8px;text-align:center}
.st-num{font-size:30px;font-weight:700;line-height:1.1}
.st-lbl{font-size:13px;color:var(--muted)}
.st-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-top:12px}
.st-bar span{display:block;height:100%}
.st-ok{background:var(--ok)}
.st-warn{background:var(--warn)}
.st-bad{background:var(--bad)}
.st-row{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.st-track{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.st-fill{height:100%;border-radius:7px}
.st-n{text-align:right;font-variant-numeric:tabular-nums}
.st-list{padding:12px 0;border-bottom:1px solid var(--border)}
.st-list:first-of-type{padding-top:0}
.st-list:last-child{border-bottom:0;padding-bottom:0}
.st-list-hd{font-weight:600;overflow-wrap:anywhere}
.st-list-sub{font-size:14px;color:var(--muted)}
.st-list .st-bar{margin-top:6px}
.st-miss{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.st-miss:last-child{border-bottom:0;padding-bottom:0}
.st-miss .main{flex:1;min-width:0}
.st-miss .t1{font-weight:600;overflow-wrap:anywhere}
.st-miss .t2{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.st-miss .cnt{color:var(--bad);font-size:14px;white-space:nowrap}

/* === STYLES : CONNEXION === */
body.auth nav.bottom{display:none}
body.auth main{padding-bottom:24px}
.auth-pin{font-size:24px;letter-spacing:.5em;text-align:center}
.auth-store{text-align:center;margin-top:14px}
.auth-mig p{margin:0 0 12px}

/* === STYLES : MISE À JOUR === */
.upd-badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);white-space:nowrap;vertical-align:middle}
.upd-intro{margin:0 0 10px}
.upd-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border);cursor:pointer}
.upd-row input{width:22px;height:22px;margin:1px 0 0;flex:none}
.upd-row .upd-l{flex:1;min-width:0}
.upd-row .upd-n{font-weight:700;white-space:nowrap}
.upd-row .upd-h{font-size:13px;color:var(--muted);margin-top:2px}
.upd-row.off{opacity:.55;cursor:default}
.upd-last{font-size:13px;color:var(--muted);margin-top:10px}

/* === STYLES : À VALIDER === */
.btn:disabled{opacity:.5;cursor:default}
.ai-last{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
.pv-filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.pv-filters .input{padding:8px;min-height:44px;font-size:15px}
.pv-filters.four{grid-template-columns:1fr 1fr}
.pv-sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pv-all{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600}
.pv-all input,.pv-cb{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.pv-count{font-size:14px;color:var(--muted)}
.pv-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.pv-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.pv-row:last-child{border-bottom:0}
.pv-row.sel{background:var(--surface2)}
.pv-row .main{flex:1;min-width:0}
.pv-cb{margin-top:2px}
.pv-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px}
.pv-top .tag{margin:0}
.pv-type{border-radius:6px;padding:1px 6px;font-weight:600}
.pv-type.completion{background:rgba(47,91,211,.15);color:var(--accent)}
.pv-type.correction{background:rgba(192,122,0,.15);color:var(--warn)}
.pv-field{color:var(--muted)}
.pv-fr{font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.pv-diff{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:4px}
.pv-diff .wr-diff{font-size:16px;font-weight:400}
.pv-arrow{color:var(--muted)}
.pv-act{color:var(--bad);margin-top:4px;font-size:15px}
.pv-reason{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px;overflow-wrap:anywhere}
.pv-row .input{margin-top:6px}
.undo-bar{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:58;max-width:92vw}
.undo-bar.show{display:flex}
.undo-bar button{border:0;background:var(--bg);color:var(--text);font-weight:700;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer}
@media (max-width:360px){.pv-filters{grid-template-columns:1fr 1fr}}

// === LANGUES ===
// Toutes les langues de l'appli. Ajouter une langue = ajouter une entrée ici, rien d'autre.
//   names     : nom de la langue dans chaque langue d'interface (sert aussi à reconnaître l'en-tête d'un import)
//   tts       : voix de synthèse vocale
//   normalize : règles de comparaison du mode Écrit (case : casse ignorée ; accents : accents tolérés ; spaces : espaces tolérés)
//   gender    : les noms ont un genre (nm, nf, nmf, nmpl, nfpl obligatoires, jamais « n »)
//   pos       : abréviation de chaque nature grammaticale, dans la convention des dictionnaires de cette langue
const LANGUAGES = {
  fr: { code: "fr", names: { fr: "Français", ko: "프랑스어", en: "French" }, tts: "fr-FR",
        normalize: { case: true, accents: true, spaces: false }, gender: true,
        pos: { nm: "n.m.", nf: "n.f.", nmf: "n.m. et f.", nmpl: "n.m.pl.", nfpl: "n.f.pl.", n: "n.", v: "v.", vpr: "v. pr.",
               adj: "adj.", adv: "adv.", prep: "prép.", conj: "conj.", pron: "pron.", interj: "interj.", expr: "expr." } },
  ko: { code: "ko", names: { fr: "Coréen", ko: "한국어", en: "Korean" }, tts: "ko-KR",
        normalize: { case: true, accents: false, spaces: true }, gender: false,
        pos: { nm: "명", nf: "명", nmf: "명", nmpl: "명", nfpl: "명", n: "명", v: "동", vpr: "동",
               adj: "형", adv: "부", prep: "조", conj: "접", pron: "대", interj: "감", expr: "구" } },
  en: { code: "en", names: { fr: "Anglais", ko: "영어", en: "English" }, tts: "en-US",
        normalize: { case: true, accents: true, spaces: false }, gender: false,
        pos: { nm: "n.", nf: "n.", nmf: "n.", nmpl: "n. pl.", nfpl: "n. pl.", n: "n.", v: "v.", vpr: "v.",
               adj: "adj.", adv: "adv.", prep: "prep.", conj: "conj.", pron: "pron.", interj: "interj.", expr: "phr." } }
};
const LANG_CODES = Object.keys(LANGUAGES);

function isLang(code) { return typeof code === "string" && Object.prototype.hasOwnProperty.call(LANGUAGES, code); }
// Nom d'une langue dans la langue de l'interface (ou dans ui si donné).
function langName(code, ui) {
  const L = LANGUAGES[code];
  if (!L) return String(code || "");
  const u = ui || (state && state.settings && state.settings.uiLang) || "fr";
  return L.names[u] || L.names.fr || code;
}
function langCodes(codes) { return arr(codes).map(c => String(c).toUpperCase()).join("·"); }
// « KO·EN → FR » : langues d'appui → langue apprise
function pairLabel(lg) { return langCodes(lg.support) + " → " + langCodes([lg.target]); }
function langRules(code) { return (LANGUAGES[code] && LANGUAGES[code].normalize) || { case: true, accents: true, spaces: false }; }
// Langues d'appui par défaut : toutes les autres, l'anglais en dernier (fr → ko, en ; ko → fr, en).
function defaultSupportFor(target) {
  const o = LANG_CODES.filter(c => c !== target);
  return o.filter(c => c !== "en").concat(o.filter(c => c === "en"));
}
function cleanSupport(support, target) {
  const out = [];
  arr(support).forEach(c => { if (isLang(c) && c !== target && !out.includes(c)) out.push(c); });
  return out;
}
// Héritage compte → dossier → liste : le dernier niveau qui a une langue apprise l'emporte (avec ses langues d'appui).
function resolveLangs(levels) {
  let target = "fr", support = null;
  levels.forEach(o => { if (o && isLang(o.target)) { target = o.target; support = o.support; } });
  support = cleanSupport(support, target);
  if (!support.length) support = defaultSupportFor(target);
  return { target, support };
}
function accountLangs() { return resolveLangs([{ target: state.settings.defaultTarget, support: state.settings.defaultSupport }]); }
function folderLangs(folder) { return resolveLangs([accountLangs(), folder]); }
function listLangs(listOrId) {
  const l = typeof listOrId === "string" ? getList(listOrId) : listOrId;
  const f = l && l.folderId ? getFolder(l.folderId) : null;
  return resolveLangs([accountLangs(), f, l]);
}
function cardLangs(c) { return listLangs(c.listId); }
function sameLangs(a, b) { return a.target === b.target && a.support.join() === b.support.join(); }

// --- Champs d'une carte ---
function term(c, code) { return (c && c.terms && typeof c.terms[code] === "string") ? c.terms[code] : ""; }
function targetTerm(c, lg) { return term(c, (lg || cardLangs(c)).target); }
// Traductions remplies dans les langues d'appui, dans l'ordre : [{ code, text }]
function supportTerms(c, lg) {
  return (lg || cardLangs(c)).support.map(code => ({ code, text: term(c, code) })).filter(x => x.text.trim());
}
function supportText(c, lg) { return supportTerms(c, lg).map(x => x.text).join(" · "); }
// Carte utilisable en révision : mot dans la langue apprise + au moins une langue d'appui.
function cardUsable(c, lg) { lg = lg || cardLangs(c); return !!targetTerm(c, lg).trim() && supportTerms(c, lg).length > 0; }
// Champ générique : code de langue, "example" ou "pos:<code>" (nature grammaticale dans cette langue).
function fieldVal(c, f) {
  if (f === "example") return String(c.example || "");
  if (isPosField(f)) return (c.pos && typeof c.pos[f.slice(4)] === "string") ? c.pos[f.slice(4)] : "";
  return term(c, f);
}
function setFieldVal(c, f, v) {
  if (f === "example") c.example = v;
  else if (isPosField(f)) { c.pos = Object.assign({}, c.pos); if (v) c.pos[f.slice(4)] = v; else delete c.pos[f.slice(4)]; }
  else { c.terms[f] = v; }
}

// --- Nature grammaticale ---
// Codes communs à toutes les langues ; l'abréviation affichée vient de LANGUAGES[langue].pos.
const POS_CODES = ["nm", "nf", "nmf", "nmpl", "nfpl", "n", "v", "vpr", "adj", "adv", "prep", "conj", "pron", "interj", "expr"];
const POS_GENDERED = ["nm", "nf", "nmf", "nmpl", "nfpl"];
function isPosField(f) { return typeof f === "string" && f.startsWith("pos:") && isLang(f.slice(4)); }
function posField(code) { return "pos:" + code; }
// Codes proposés pour une langue : noms avec genre si la langue a un genre, sinon « n ».
function posCodesFor(lng) {
  const g = !!(LANGUAGES[lng] && LANGUAGES[lng].gender);
  return POS_CODES.filter(x => g ? x !== "n" : !POS_GENDERED.includes(x));
}
// Abréviation du dictionnaire (« n.f. », « 명 », « v. ») ; texte libre (import non reconnu) affiché tel quel.
function posLabel(code, lng) {
  if (!code) return "";
  const L = LANGUAGES[lng];
  return (L && L.pos && L.pos[code]) || code;
}
// Code de nature pour un texte saisi ou importé (code, abréviation d'une langue, « nom féminin »…), sinon "".
// Le code est ensuite adapté à la langue du mot : « nf » → « n » pour une langue sans genre.
function parsePos(raw, lng) {
  const k = s => normText(s).replace(/[\s.]+/g, "");
  const x = k(raw);
  if (!x) return "";
  let code = POS_CODES.find(c => c === x) || "";
  if (!code) {
    const order = [lng].concat(LANG_CODES.filter(c => c !== lng)).filter(isLang);
    for (const L of order) { const p = LANGUAGES[L].pos || {}; code = POS_CODES.find(c => p[c] && k(p[c]) === x) || ""; if (code) break; }
  }
  if (!code) for (const u of ["fr", "en", "ko"]) { code = POS_CODES.find(c => I18N[u]["pos." + c] && k(I18N[u]["pos." + c]) === x) || ""; if (code) break; }
  if (!code || !isLang(lng)) return code;
  const g = !!LANGUAGES[lng].gender;
  if (!g && POS_GENDERED.includes(code)) return "n";
  if (g && code === "n") return "";                // nom sans genre refusé pour une langue à genre
  return code;
}
// Petite étiquette affichée à côté du mot, ou null.
function posTag(c, lng) {
  const v = c && c.pos && c.pos[lng];
  if (!v) return null;
  const s = el("span", "pos", posLabel(v, lng));
  if (POS_CODES.includes(v)) s.title = t("pos." + v);
  return s;
}

// --- Dossiers ---
function getFolder(id) { return (id && state.folders.find(f => f.id === id)) || null; }
function byOrder(a, b) { return a.order - b.order; }
function sortedFolders() { return state.folders.slice().sort(byOrder); }
function listsIn(folderId) { return state.lists.filter(l => (l.folderId || null) === (folderId || null)).sort(byOrder); }
// Toutes les listes dans l'ordre d'affichage : dossiers dans l'ordre, puis « Sans dossier ».
function orderedLists() {
  const out = [];
  sortedFolders().forEach(f => out.push(...listsIn(f.id)));
  out.push(...listsIn(null));
  return out;
}
function nextOrder(items) { return items.reduce((m, x) => Math.max(m, num(x.order, -1)), -1) + 1; }
function listLabel(l) { const f = l && getFolder(l.folderId); return l ? (f ? f.name + " › " : "") + l.name : ""; }

// === DATA MODEL ===
// Version 2 : cartes multilingues (terms), dossiers, langue apprise et langues d'appui par compte / dossier / liste.
const DATA_VERSION = 2;

function defaultLang() {
  const l = (navigator.language || "").toLowerCase();
  if (l.startsWith("ko")) return "ko";
  if (l.startsWith("fr")) return "fr";
  return "ko"; // public cible : apprenante coréenne
}

function defaultSettings(target) {
  const tg = isLang(target) ? target : "fr";
  return {
    uiLang: defaultLang(), theme: "auto", sessionSize: 20,
    defaultTarget: tg, defaultSupport: defaultSupportFor(tg),
    audio: { auto: true, langs: "target" }
  };
}

function emptyData(target) {
  return {
    version: DATA_VERSION,
    updatedAt: 0,
    settings: defaultSettings(target),
    folders: [],     // { id, name, order, target?, support? }
    lists: [],       // { id, name, folderId|null, order, target?, support?, createdAt }
    cards: [],
    history: [],
    proposals: [],   // propositions « À valider » : { id, cardId, field (code de langue | example | pos:<code> | dup), type, oldValue, newValue, reason, createdAt }
    rejected: [],    // clés des propositions refusées (carte|champ|empreinte de la valeur) : jamais reproposées
    lastCheckAt: 0,  // dernière vérification automatique (0 = pas encore démarrée)

  };
}

// terms : { fr: "...", ko: "...", ... } (une entrée par langue, vide permis)
function newCard(listId, terms, example, tags, pos) {
  return {
    id: uid(), listId,
    terms: normTerms(terms),
    pos: normTerms(pos),
    example: example || "",
    tags: tags || [],
    auto: [],
    box: 0,
    dueAt: Date.now(),
    stats: { seen: 0, correct: 0, wrong: 0, lastSeen: null }

}

// Garde les entrées texte non vides dont la clé ressemble à un code de langue (même une langue retirée de LANGUAGES).
function normTerms(o) {
  const out = {};
  if (o && typeof o === "object" && !Array.isArray(o)) {
    Object.keys(o).forEach(k => {
      const v = o[k] == null ? "" : String(o[k]).trim();
      if (v && /^[a-z]{2,3}(-[a-z0-9]+)?$/i.test(k)) out[k] = v;
    });
  }
  return out;
}
function normLangPair(o) {

  return { target: o.target, support: cleanSupport(o.support, o.target) };
}

// Carte v2, ou carte v1 ({ ko, en, fr }) convertie.
function normalizeCard(c) {
  const st = c.stats || {};
  const terms = (c.terms && typeof c.terms === "object") ? normTerms(c.terms) : normTerms({ fr: c.fr, ko: c.ko, en: c.en });
  return {
    id: String(c.id),
    listId: String(c.listId || ""),
    terms,
    pos: normTerms(c.pos),
    example: String(c.example || ""),
    tags: arr(c.tags).map(String).filter(Boolean),
    auto: arr(c.auto).map(String),
    box: clampInt(c.box, 0, 5, 0),
    dueAt: num(c.dueAt, Date.now()),
    stats: { seen: num(st.seen, 0), correct: num(st.correct, 0), wrong: num(st.wrong, 0), lastSeen: num(st.lastSeen, null) }
  };
}

// Date de la dernière « Mise à jour » d'une liste ou d'un dossier (absente si jamais faite).
function lastUpdateOf(o) { const v = num(o && o.lastUpdate, 0); return v > 0 ? { lastUpdate: v } : {}; }

function dataVersion(raw) { return (raw && typeof raw === "object") ? num(raw.version, 1) : DATA_VERSION; }

// Rend n'importe quel objet (stockage, import, version 1) conforme au modèle version 2, sans planter.
// Migration v1 → v2 : ko/en/fr → terms, listes dans « Sans dossier », langue apprise fr et langues d'appui ko, en par défaut.
function normalizeData(raw) {
  const d = (raw && typeof raw === "object") ? raw : {};
  const s = d.settings || {};
  const tg = isLang(s.defaultTarget) ? s.defaultTarget : "fr";
  const sup = cleanSupport(s.defaultSupport, tg);
  const au = s.audio || {};
  const out = {
    version: DATA_VERSION,
    updatedAt: num(d.updatedAt, 0),
    settings: {
      uiLang: ["ko", "fr", "en"].includes(s.uiLang) ? s.uiLang : defaultLang(),
      theme: ["light", "dark", "auto"].includes(s.theme) ? s.theme : "auto",
      sessionSize: clampInt(s.sessionSize, 1, 500, 20),
      defaultTarget: tg,
      defaultSupport: sup.length ? sup : defaultSupportFor(tg),
      audio: { auto: au.auto !== false, langs: ["target", "support", "both"].includes(au.langs) ? au.langs : "target" }
    },
    folders: arr(d.folders).filter(f => f && f.id).map((f, i) => Object.assign(
      { id: String(f.id), name: String(f.name || ""), order: num(f.order, i) }, normLangPair(f), lastUpdateOf(f))),
    lists: [],
    cards: arr(d.cards).filter(c => c && c.id).map(normalizeCard).filter(c => Object.keys(c.terms).length),
    history: arr(d.history)
      .filter(h => h && /^\d{4}-\d{2}-\d{2}$/.test(h.date))
      .map(h => ({ date: h.date, reviewed: num(h.reviewed, 0), correct: num(h.correct, 0) })),
    proposals: arr(d.proposals)
      .filter(p => p && p.id && p.cardId && (isLang(p.field) || isPosField(p.field) || ["example", "dup"].includes(p.field)) && ["completion", "correction"].includes(p.type))
      .map(p => ({ id: String(p.id), cardId: String(p.cardId), field: p.field, type: p.type,
        oldValue: String(p.oldValue || ""), newValue: String(p.newValue || ""), reason: String(p.reason || ""), createdAt: num(p.createdAt, 0) })),
    rejected: arr(d.rejected).map(String).slice(-CONFIG.REJECT_MAX),
    lastCheckAt: num(d.lastCheckAt, 0),
    checkedSig: {},
    aiResume: null
  };
  const folderIds = new Set(out.folders.map(f => f.id));
  out.lists = arr(d.lists).filter(l => l && l.id).map((l, i) => Object.assign({
    id: String(l.id), name: String(l.name || ""),
    folderId: l.folderId && folderIds.has(String(l.folderId)) ? String(l.folderId) : null,
    order: num(l.order, i), createdAt: num(l.createdAt, Date.now())
  }, normLangPair(l), lastUpdateOf(l)));
  // Ordres renumérotés 0, 1, 2… (dossiers, puis listes de chaque dossier)
  const renum = items => items.map((x, i) => [x, i]).sort((a, b) => a[0].order - b[0].order || a[1] - b[1]).forEach(([x], i) => { x.order = i; });
  renum(out.folders);
  [null].concat(out.folders.map(f => f.id)).forEach(fid => renum(out.lists.filter(l => l.folderId === fid)));

  const cardIds = new Set(out.cards.map(c => c.id));
  out.proposals = out.proposals.filter(p => cardIds.has(p.cardId));
  if (d.aiResume && d.aiResume.kind === "complete") {
    const ids = arr(d.aiResume.ids).map(String).filter(id => cardIds.has(id));
    if (ids.length) out.aiResume = { kind: "complete", ids };
  }
  if (d.checkedSig && typeof d.checkedSig === "object" && !Array.isArray(d.checkedSig)) {
    Object.keys(d.checkedSig).forEach(k => { if (cardIds.has(k) && typeof d.checkedSig[k] === "string") out.checkedSig[k] = d.checkedSig[k]; });
  }
  // Cartes dont la liste n'existe pas (JSON modifié à la main) : sinon invisibles dans l'écran Listes.
  const ids = new Set(out.lists.map(l => l.id));
  const orphans = out.cards.filter(c => !ids.has(c.listId));
  if (orphans.length) {
    const l = { id: uid(), name: "Import", folderId: null, order: out.lists.filter(x => !x.folderId).length, createdAt: Date.now() };
    out.lists.push(l);
    orphans.forEach(c => { c.listId = l.id; });
  }
  return out;
}

function looksLikeAppData(raw) {
  return raw && typeof raw === "object" && Array.isArray(raw.cards) && Array.isArray(raw.lists);
}

// === STORAGE ===
// Couche d'accès unique. Données du compte connecté (<id> = identifiant de l'appli) découpées en morceaux :
//   user:<id>:index                 { v: 2, updatedAt, keys: [...] } — liste des morceaux, écrit en dernier
//   user:<id>:settings              { version (modèle de données), settings, updatedAt, rejected, lastCheckAt, aiResume: { kind, total } }
//   user:<id>:folders / :lists / :history
//   user:<id>:proposals:<n>         propositions « À valider » (500 max par morceau)
//   user:<id>:cards:<listId>:<n>    { cards: [200 max], sig: { idCarte: empreinte vérifiée } }
//   user:<id>:resume:<n>            ids des cartes restant à compléter (complétion en pause, 2000 max par morceau)
// Seuls les morceaux modifiés sont écrits (comparaison avec ce qui a déjà été écrit).
//  - local : localStorage "vocabfr." + clé (écriture tout-ou-rien : en cas d'échec, les morceaux déjà écrits sont restaurés)
//  - cloud : document data/users/<idClaude>/<clé> = { json, updatedAt } (adaptateur claudeDbBackend)
//  - Supabase (prévu) : une ligne par morceau, clé primaire (user_id, key) — adaptateur supabaseBackend, voir supabase.sql
// Ancien format (un seul bloc) : localStorage "vocabfr.user:<id>" + document "user:<id>". Migré automatiquement,
// après un export JSON de sécurité. Le document cloud ancien n'est jamais effacé ; la clé locale ancienne
// est retirée seulement après relecture réussie du nouveau format.
// Registre des comptes : localStorage "vocabfr.accounts" + document data/users/<idClaude>/accounts.
// Anciennes données (avant les comptes) : "vocabfr.data.v1" + data/users/<idClaude>/state, lues pour la migration, jamais effacées.

// Adaptateur cloud de l'artifact : get(clé) → texte JSON ou undefined ; set(clé, json, updatedAt) ; del(clé).
function claudeDbBackend(db, base) {
  return {
    async get(key) {
      const snap = await withTimeout(db.doc(base + "/" + key).get(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!snap.exists) return undefined;
      const body = snap.data();
      return body && typeof body.json === "string" ? body.json : undefined;
    },
    async set(key, json, updatedAt) { await withTimeout(db.doc(base + "/" + key).set({ json, updatedAt }), CONFIG.REMOTE_TIMEOUT_MS); },
    async del(key) { await withTimeout(db.doc(base + "/" + key).delete(), CONFIG.REMOTE_TIMEOUT_MS); }
  };
}
// Adaptateur Supabase (prévu, pas encore branché : il faudra la connexion Supabase Auth).
// Table user_chunks (user_id, key, data jsonb, updated_at) : la clé y est stockée sans le préfixe "user:<id>:".
// client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) ; uid = auth.uid() de l'utilisateur connecté.
function supabaseBackend(client, uid, prefix) {
  const k = key => key.startsWith(prefix) ? key.slice(prefix.length) : key;
  return {
    async get(key) {
      const { data, error } = await client.from("user_chunks").select("data").eq("user_id", uid).eq("key", k(key)).maybeSingle();
      if (error) throw error;
      return data ? JSON.stringify(data.data) : undefined;
    },
    async set(key, json, updatedAt) {
      const { error } = await client.from("user_chunks")
        .upsert({ user_id: uid, key: k(key), data: JSON.parse(json), updated_at: new Date(updatedAt || Date.now()).toISOString() });
      if (error) throw error;
    },
    async del(key) {
      const { error } = await client.from("user_chunks").delete().eq("user_id", uid).eq("key", k(key));
      if (error) throw error;
    }
  };
}

const Storage = (() => {
  let db = null, base = null;  // base = "data/users/<idClaude>" quand le cloud est disponible
  let backend = null;          // adaptateur cloud actif (null = pas de cloud)
  let userId = null, remote = null; // remote = backend utilisable pour le compte connecté
  let mode = "local";          // "local" | "cloud" | "syncing" | "error"
  let timer = null, lastData = null, held = false;
  let chain = Promise.resolve();
  let localSaved = new Map();  // clé → JSON déjà présent dans localStorage
  let remoteSaved = new Map(); // clé → JSON déjà présent dans le cloud
  let localFullWarned = false;
  const listeners = [];

  function setMode(m) { mode = m; listeners.forEach(fn => { try { fn(m); } catch (e) {} }); }
  function onMode(fn) { listeners.push(fn); fn(mode); }
  function getMode() { return mode; }
  function isCloud() { return !!backend; }

  function lsGet(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsRaw(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function oldKey(id) { return "user:" + id; }               // ancien format (un seul bloc)
  function pre() { return "user:" + userId + ":"; }          // préfixe des morceaux du compte connecté
  function byteLen(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 3; } }

  // Connexion au cloud (base + identité Claude). Renvoie true si disponible.
  async function connect() {
    try {
      if (typeof window.claude === "undefined" || !window.claude || typeof window.claude.use !== "function") return false;
      const [d, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), CONFIG.REMOTE_TIMEOUT_MS + 2000);
      if (!d || !user) return false;
      const id = await withTimeout(user.id(), CONFIG.REMOTE_TIMEOUT_MS);
      if (!id) return false;
      db = d; base = "data/users/" + id;
      backend = claudeDbBackend(db, base);
      setMode("cloud");
      return true;
    } catch (e) {
      db = null; base = null; backend = null;
      setMode("local");
      return false;
    }
  }
  // Lecture d'un document { json } (registre, anciennes données) : objet, ou undefined si vide. Lève une erreur en cas d'échec.
  async function remoteGet(name) {
    const json = await backend.get(name);
    return json ? JSON.parse(json) : undefined;
  }

  // --- Comptes : { accounts: [{ id, salt, pinHash, createdAt }], migrated } ---
  function normReg(r) {
    const d = (r && typeof r === "object") ? r : {};
    return {
      accounts: arr(d.accounts).filter(a => a && a.id && a.pinHash)
        .map(a => ({ id: String(a.id), salt: String(a.salt || ""), pinHash: String(a.pinHash), createdAt: num(a.createdAt, 0) })),
      migrated: !!d.migrated
    };
  }
  function mergeReg(a, b) {
    const out = { accounts: a.accounts.slice(), migrated: a.migrated || b.migrated };
    b.accounts.forEach(x => { if (!out.accounts.some(y => y.id === x.id)) out.accounts.push(x); });
    out.accounts.sort((x, y) => x.createdAt - y.createdAt);
    return out;
  }
  async function loadAccounts() {
    let reg = normReg(lsGet(CONFIG.LS_ACCOUNTS));
    if (backend) {
      try { reg = mergeReg(reg, normReg(await remoteGet(CONFIG.REMOTE_ACCOUNTS))); }
      catch (e) { setMode("error"); }
    }
    lsSet(CONFIG.LS_ACCOUNTS, reg);
    return reg;
  }
  // Relit le registre distant avant d'écrire, pour ne pas écraser un compte créé sur un autre appareil.
  async function saveAccounts(reg) {
    lsSet(CONFIG.LS_ACCOUNTS, reg);
    if (!backend) return;
    try {
      const m = mergeReg(reg, normReg(await remoteGet(CONFIG.REMOTE_ACCOUNTS)));
      await backend.set(CONFIG.REMOTE_ACCOUNTS, JSON.stringify(m), Date.now());
      lsSet(CONFIG.LS_ACCOUNTS, m);
      setMode("cloud");
    } catch (e) { setMode("error"); }
  }

  // --- Anciennes données (avant les comptes) : la version la plus récente entre local et cloud ---
  function readLegacyLocal() { return lsGet(CONFIG.LS_KEY); }
  async function readLegacy() {
    const l = looksLikeAppData(readLegacyLocal()) ? readLegacyLocal() : null;
    let r = null;
    if (backend) { try { const x = await remoteGet(CONFIG.REMOTE_DOC); if (looksLikeAppData(x)) r = x; } catch (e) {} }
    if (l && r) return num(r.updatedAt, 0) >= num(l.updatedAt, 0) ? r : l;
    return l || r;
  }

  // --- Session sur cet appareil ---
  function getSession() { try { return localStorage.getItem(CONFIG.LS_SESSION) || null; } catch (e) { return null; } }
  function setSession(id) {
    try { if (id) localStorage.setItem(CONFIG.LS_SESSION, id); else localStorage.removeItem(CONFIG.LS_SESSION); } catch (e) {}
  }

  // --- Découpage : données → Map(clé → JSON) dans l'ordre de l'index ---
  function slices(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
  function split(data) {
    const p = new Map(), P = pre();
    const put = (k, v) => p.set(P + k, JSON.stringify(v));
    const ids = data.aiResume ? arr(data.aiResume.ids) : [];
    put("settings", {
      version: data.version, settings: data.settings, updatedAt: data.updatedAt, rejected: data.rejected, lastCheckAt: data.lastCheckAt,
      aiResume: data.aiResume ? { kind: data.aiResume.kind, total: ids.length } : null
    });
    put("folders", data.folders);
    put("lists", data.lists);
    put("history", data.history);
    // Cartes : par liste, morceaux de 200 cartes max (et taille limitée, pour les cartes avec de longs exemples).
    const byList = new Map();
    data.cards.forEach(c => { if (!byList.has(c.listId)) byList.set(c.listId, []); byList.get(c.listId).push(c); });
    const sigs = data.checkedSig || {};
    byList.forEach((cards, listId) => {
      let n = 0, cur = [], curSig = {}, bytes = 0;
      const out = () => { put("cards:" + listId + ":" + (n++), { cards: cur, sig: curSig }); cur = []; curSig = {}; bytes = 0; };
      cards.forEach(c => {
        const b = byteLen(JSON.stringify(c)) + 40;
        if (cur.length && (cur.length >= CONFIG.CARDS_PER_PIECE || bytes + b > CONFIG.PIECE_MAX_BYTES)) out();
        cur.push(c); bytes += b;
        if (sigs[c.id]) curSig[c.id] = sigs[c.id];
      });
      if (cur.length) out();
    });
    slices(data.proposals, CONFIG.PROPOSALS_PER_PIECE).forEach((s, i) => put("proposals:" + i, s));
    slices(ids, CONFIG.IDS_PER_PIECE).forEach((s, i) => put("resume:" + i, s));
    const index = JSON.stringify({ v: 2, updatedAt: data.updatedAt, keys: Array.from(p.keys()) });
    return { pieces: p, index };
  }
  // Morceaux → données (à passer ensuite dans normalizeData). get(clé) → objet ou undefined.
  function assemble(idx, getPiece) {
    const P = pre();
    const s = getPiece(P + "settings") || {};
    const out = {
      version: num(s.version, 1), updatedAt: num(idx.updatedAt, 0),   // pas de version = données de la version 1
      settings: s.settings, rejected: s.rejected, lastCheckAt: s.lastCheckAt,
      folders: arr(getPiece(P + "folders")), lists: arr(getPiece(P + "lists")), history: arr(getPiece(P + "history")),
      cards: [], proposals: [], checkedSig: {}, aiResume: null
    };
    const ids = [];
    let missing = 0;
    arr(idx.keys).forEach(k => {
      const v = getPiece(k);
      if (v === undefined) { missing++; return; }
      if (k.startsWith(P + "cards:")) { out.cards.push(...arr(v.cards)); Object.assign(out.checkedSig, v.sig || {}); }
      else if (k.startsWith(P + "proposals:")) out.proposals.push(...arr(v));
      else if (k.startsWith(P + "resume:")) ids.push(...arr(v));
    });
    if (s.aiResume && s.aiResume.kind) out.aiResume = { kind: s.aiResume.kind, ids };
    return { data: out, missing };
  }

  // --- Compte connecté ---
  function setUser(id) {
    clearTimeout(timer); timer = null; lastData = null; held = false;
    localSaved = new Map(); remoteSaved = new Map(); localFullWarned = false;
    userId = id || null;
    remote = (backend && userId) ? backend : null;
  }
  function getUser() { return userId; }
  // Pendant l'ouverture du compte : les sauvegardes restent en mémoire (pas d'écriture avant la migration).
  function hold() { held = true; }
  function release() { held = false; }

  // Lecture locale : { data, old } (old = ancien format, à migrer), ou null si rien.
  function readLocal() {
    if (!userId) return null;
    const P = pre();
    const idxRaw = lsRaw(CONFIG.LS_USER_PREFIX + P + "index");
    if (idxRaw) {
      try {
        const idx = JSON.parse(idxRaw);
        localSaved = new Map([[P + "index", idxRaw]]);
        const { data, missing } = assemble(idx, k => {
          const raw = lsRaw(CONFIG.LS_USER_PREFIX + k);
          if (raw === null) return undefined;
          localSaved.set(k, raw);
          return JSON.parse(raw);
        });
        if (missing) data.updatedAt = 0; // incomplet : une version cloud complète passera devant
        return { data, old: false };
      } catch (e) { /* index illisible : on tente l'ancien format */ }
    }
    const old = lsGet(CONFIG.LS_USER_PREFIX + oldKey(userId));
    return looksLikeAppData(old) ? { data: old, old: true } : null;
  }
  // Écriture locale tout-ou-rien des morceaux modifiés. Renvoie true si tout est écrit.
  function writeLocal(data) {
    if (!userId) return false;
    const { pieces, index } = split(data);
    const P = pre(), done = [];
    try {
      pieces.forEach((json, k) => {
        if (localSaved.get(k) === json) return;
        done.push([k, localSaved.has(k) ? localSaved.get(k) : null]);
        localStorage.setItem(CONFIG.LS_USER_PREFIX + k, json);
        localSaved.set(k, json);
      });
      if (localSaved.get(P + "index") !== index) {
        done.push([P + "index", localSaved.has(P + "index") ? localSaved.get(P + "index") : null]);
        localStorage.setItem(CONFIG.LS_USER_PREFIX + P + "index", index);
        localSaved.set(P + "index", index);
      }
    } catch (e) {
      // Mémoire de l'appareil pleine (ou indisponible) : on remet les morceaux comme avant.
      done.reverse().forEach(([k, prev]) => {
        try {
          if (prev === null) { localStorage.removeItem(CONFIG.LS_USER_PREFIX + k); localSaved.delete(k); }
          else { localStorage.setItem(CONFIG.LS_USER_PREFIX + k, prev); localSaved.set(k, prev); }
        } catch (e2) {}
      });
      return false;
    }
    // Morceaux qui n'existent plus (liste vidée, propositions traitées…).
    Array.from(localSaved.keys()).forEach(k => {
      if (k !== P + "index" && !pieces.has(k)) { lsDel(CONFIG.LS_USER_PREFIX + k); localSaved.delete(k); }
    });
    return true;
  }
  // Après migration réussie : relit le nouveau format et retire l'ancienne clé locale si tout correspond.
  function dropOldLocal(data) {
    if (!userId) return false;
    const back = readLocal();
    if (!back || back.old || !back.data || arr(back.data.cards).length !== data.cards.length) return false;
    lsDel(CONFIG.LS_USER_PREFIX + oldKey(userId));
    return true;
  }

  // Lecture cloud. Renvoie { data, old } (données du compte), undefined (cloud dispo mais vide), null (cloud indisponible).
  async function initRemote() {
    if (!remote) return null;
    const id = userId, P = pre();
    try {
      const idxRaw = await remote.get(P + "index");
      if (idxRaw) {
        const idx = JSON.parse(idxRaw);
        const got = new Map([[P + "index", idxRaw]]);
        const keys = arr(idx.keys);
        for (let i = 0; i < keys.length; i += 8) {           // 8 lectures à la fois
          const part = keys.slice(i, i + 8);
          const vals = await Promise.all(part.map(k => remote.get(k)));
          part.forEach((k, j) => { if (vals[j] !== undefined) got.set(k, vals[j]); });
        }
        if (userId !== id) return null;
        const { data, missing } = assemble(idx, k => got.has(k) ? JSON.parse(got.get(k)) : undefined);
        if (missing) throw new Error("incomplete");
        remoteSaved = got;
        setMode("cloud");
        return { data, old: false };
      }
      const old = await remoteGet(oldKey(id));
      if (userId !== id) return null;
      setMode("cloud");
      return looksLikeAppData(old) ? { data: old, old: true } : undefined;
    } catch (e) {
      if (userId === id) { remote = null; setMode("error"); }
      return null;
    }
  }

  // Envoi cloud des morceaux modifiés, puis de l'index, puis suppression des morceaux disparus. Renvoie true si tout est à jour.
  async function doFlush() {
    if (!remote || !lastData || !userId) return true;
    const id = userId, P = pre();
    const { pieces, index } = split(lastData);
    const todo = [];
    pieces.forEach((json, k) => { if (remoteSaved.get(k) !== json) todo.push([k, json]); });
    const idxChanged = remoteSaved.get(P + "index") !== index;
    const gone = Array.from(remoteSaved.keys()).filter(k => k !== P + "index" && !pieces.has(k));
    if (!todo.length && !idxChanged && !gone.length) { if (mode !== "cloud") setMode("cloud"); return true; }
    if (todo.some(([, json]) => byteLen(json) > CONFIG.MAX_DOC_BYTES)) { setMode("error"); toast(t("save.tooBig")); return false; }
    try {
      setMode("syncing");
      for (const [k, json] of todo) {                         // un morceau à la fois
        await remote.set(k, json, lastData.updatedAt);
        if (userId !== id) return false;
        remoteSaved.set(k, json);
      }
      await remote.set(P + "index", index, lastData.updatedAt);
      remoteSaved.set(P + "index", index);
      for (const k of gone) { await remote.del(k); remoteSaved.delete(k); }
      setMode("cloud");
      return true;
    } catch (e) {
      if (userId === id) setMode("error");
      return false;
    }
  }
  // Les envois cloud passent l'un après l'autre (jamais deux écritures en même temps).
  function flush() {
    const p = chain.then(doFlush, doFlush);
    chain = p.catch(() => false);
    return p;
  }

  // Sauvegarde du compte connecté : immédiate en local (morceaux modifiés), différée (regroupée) vers le cloud.
  // Renvoie false si l'appareil n'a pas pu enregistrer.
  function save(data) {
    if (!userId) return false;
    lastData = data;
    if (held) return true;
    const ok = writeLocal(data);
    if (!ok) { setMode("error"); if (!localFullWarned) { localFullWarned = true; toast(t("save.localFull")); } }
    else localFullWarned = false;
    if (remote) {
      clearTimeout(timer);
      timer = setTimeout(() => { timer = null; flush(); }, CONFIG.SAVE_DELAY_MS);
    }
    return ok;
  }
  // Sauvegarde complète tout de suite (import par lots). Renvoie { local, remote } (true = réussi ou sans objet).
  async function saveNow(data) {
    if (!userId) return { local: false, remote: false };
    lastData = data;
    clearTimeout(timer); timer = null;
    const local = writeLocal(data);
    if (!local) { setMode("error"); return { local: false, remote: false }; }
    const r = remote ? await flush() : true;
    return { local: true, remote: r };
  }

  // Appli fermée ou mise en arrière-plan avant le délai : on envoie tout de suite.
  function flushNow() { if (timer) { clearTimeout(timer); timer = null; flush(); } }
  try {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNow(); });
    window.addEventListener("pagehide", flushNow);
  } catch (e) {}

  // Avant de changer de compte : envoie ce qui attend et attend la fin des écritures.
  async function flushWait() {
    flushNow();
    try { await chain; } catch (e) {}
  }

  return {
    connect, isCloud, onMode, getMode,
    loadAccounts, saveAccounts, readLegacy, readLegacyLocal, getSession, setSession,
    setUser, getUser, hold, release, readLocal, writeLocal, dropOldLocal, initRemote, save, saveNow, flushNow, flushWait
  };
})();

// === STATE ===
let state = emptyData();

// Toute modification des données passe par commit() : horodatage + sauvegarde + rafraîchissement.
function commit() {
  state.updatedAt = Date.now();
  Storage.save(state);
  render();
}

// === LEITNER ===
// Boîte 0 = nouveau ou pas su (revient dans la session). Boîtes 1 à 5 : 1, 3, 7, 14, 30 jours.
// Intervalles en jours calendaires : la carte redevient due à minuit (heure locale) du jour J+N.
const Leitner = (() => {
  const MAX_BOX = 5;
  function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ts, n) { const d = new Date(dayStart(ts)); d.setDate(d.getDate() + n); return d.getTime(); }
  function isDue(c, now) { return c.dueAt <= (now || Date.now()); }
  // "unknown" = Pas su (boîte 0), "review" = À revoir (1-2), "known" = Su (3-5)
  function category(c) { return c.box === 0 ? "unknown" : (c.box <= 2 ? "review" : "known"); }
  function logHistory(now, known) {
    const date = todayStr(new Date(now));
    let h = state.history.find(x => x.date === date);
    if (!h) { h = { date, reviewed: 0, correct: 0 }; state.history.push(h); }
    h.reviewed++;
    if (known) h.correct++;
  }
  // result : "known" (Su) | "review" (À revoir) | "unknown" (Pas su).
  // Modifie la carte et l'historique, sans sauvegarder (l'appelant fait commit()).
  function grade(c, result, now) {
    now = now || Date.now();
    const from = c.box;
    if (result === "known") {
      c.box = Math.min(MAX_BOX, c.box + 1);              // boîte 5 : reste en 5, revient dans 30 j
      c.dueAt = addDays(now, CONFIG.LEITNER_INTERVALS_DAYS[c.box]);
    } else if (result === "review") {
      c.dueAt = addDays(now, 1);                        // même boîte, revient demain
    } else {
      c.box = 0;
      c.dueAt = now;                                    // revient dans la session
    }
    c.stats.seen++;
    c.stats.lastSeen = now;
    if (result === "known") c.stats.correct++;
    if (result === "unknown") c.stats.wrong++;
    logHistory(now, result === "known");
    return { from, to: c.box, dueAt: c.dueAt };
  }
  return { dayStart, addDays, isDue, category, grade };
})();

// === AUDIO ===
// Synthèse vocale du navigateur : voix donnée par le champ tts de chaque langue (LANGUAGES).
// Le bouton haut-parleur n'est créé que si une voix existe (sinon rien, sans erreur).
// Plusieurs langues sur une face : lues l'une après l'autre. Une nouvelle carte coupe la lecture en cours.
// Lecture auto (state.settings.audio) : question lue à son apparition, réponse au retournement
// (ou après validation en mode Écrit), seulement pour les langues choisies (langue apprise / d'appui / les deux).
const Speech = (() => {
  const LANG = {};
  LANG_CODES.forEach(c => { LANG[c] = LANGUAGES[c].tts; });
  let voices = [], ready = false, token = 0;
  const synth = (() => { try { return window.speechSynthesis || null; } catch (e) { return null; } })();
  function load() { try { voices = (synth && synth.getVoices()) || []; } catch (e) { voices = []; } return voices.length > 0; }
  function voiceFor(lng) {
    const full = (LANG[lng] || "").toLowerCase(), base = full.slice(0, 2);
    const norm = v => String(v.lang || "").toLowerCase().replace("_", "-");
    return voices.find(v => norm(v) === full) || voices.find(v => norm(v).startsWith(base)) || null;
  }
  function has(lng) {
    return !!(synth && typeof SpeechSynthesisUtterance !== "undefined" && LANG[lng] && voiceFor(lng));
  }
  function stop() { token++; try { if (synth) synth.cancel(); } catch (e) {} }
  // items : [{ text, lng }] lus à la suite ; langues sans voix sautées. "voler / s'envoler" : lu avec une pause.
  function speakSeq(items) {
    const list = arr(items).filter(x => x && x.text && x.text !== "—" && has(x.lng));
    stop();
    if (!list.length) return false;
    const my = token;
    setTimeout(() => {                       // petit délai : certains navigateurs ignorent speak() juste après cancel()
      if (my !== token) return;
      list.forEach(x => {
        try {
          const u = new SpeechSynthesisUtterance(String(x.text).replace(/\s*\/\s*/g, ", "));
          u.lang = LANG[x.lng];
          u.voice = voiceFor(x.lng);
          synth.speak(u);
        } catch (e) {}
      });
    }, 60);
    return true;
  }
  function speak(text, lng) { return speakSeq([{ text, lng }]); }
  // Les voix arrivent souvent après le chargement : onReady est appelé une fois quand elles sont prêtes.
  function init(onReady) {
    if (!synth) return;
    if (load()) { ready = true; return; }
    const h = () => { if (!ready && load()) { ready = true; try { onReady(); } catch (e) {} } };
    try {
      if (synth.addEventListener) synth.addEventListener("voiceschanged", h);
      else synth.onvoiceschanged = h;
    } catch (e) {}
  }
  // "none" (pas de synthèse vocale) | "loading" (voix pas encore connues) | "ready"
  function status() { return !synth || typeof SpeechSynthesisUtterance === "undefined" ? "none" : (ready || load() ? "ready" : "loading"); }
  return { has, speak, speakSeq, stop, init, status };
})();

const SPK_ICON = '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
// Bouton haut-parleur qui lit items ([{ text, lng }]) à la suite, ou null si aucune de ces langues n'a de voix.

// --- Lecture auto pendant une session ---
function audioSettings() { return state.settings.audio || { auto: true, langs: "target" }; }
// Langue lue automatiquement selon le réglage (lg = langues de la carte).
function autoLangOk(lng, lg) {
  const m = audioSettings().langs;
  return m === "both" || (m === "target" ? lng === lg.target : lng !== lg.target);
}
// À appeler à l'affichage d'une carte : une nouvelle carte coupe la lecture en cours.
// Clé = nombre de réponses déjà données + id : une carte « Pas su » qui revient compte comme une nouvelle carte.
function audioCard(s, c) {
  const key = s.log.length + ":" + c.id;
  if (!s.audio || s.audio.key !== key) { Speech.stop(); s.audio = { key, done: new Set() }; }
}
// Lit une face (side = "q" ou "a") une seule fois par carte, si la lecture auto est active.
// Rien n'est marqué comme lu si aucune voix n'est encore prête (nouvel essai quand les voix arrivent).
function autoSpeak(s, side, items, lg) {
  if (!audioSettings().auto || !s || !s.audio || s.audio.done.has(side)) return;
  const list = arr(items).filter(x => autoLangOk(x.lng, lg));
  if (Speech.speakSeq(list)) s.audio.done.add(side);
}
// Interrupteur « Lecture auto » : toucher n'importe où sur la ligne, ou glisser le curseur à gauche / à droite.
function audioToggle() {
  const b = el("button", "au-switch");
  b.type = "button";
  b.setAttribute("role", "switch");
  const lbl = el("span", "au-lbl");
  lbl.innerHTML = SPK_ICON;
  lbl.appendChild(el("span", null, t("audio.auto")));
  const track = el("span", "au-track");
  track.appendChild(el("span", "au-knob"));
  b.append(lbl, track);
  const show = () => b.setAttribute("aria-checked", String(!!audioSettings().auto));
  const setOn = on => {
    if (!state.settings.audio) state.settings.audio = { auto: true, langs: "target" };
    if (state.settings.audio.auto === on) return;
    state.settings.audio.auto = on;
    if (!on) Speech.stop();
    show();
    commitQuiet(); // mémorisé, sans réafficher l'écran (la carte en cours reste)
  };
  let x0 = null, dragged = false;
  b.addEventListener("pointerdown", e => { x0 = e.clientX; dragged = false; });
  b.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 18) { dragged = true; setOn(dx > 0); }
  });
  b.addEventListener("pointercancel", () => { x0 = null; });
  b.addEventListener("click", () => { if (dragged) { dragged = false; return; } setOn(!audioSettings().auto); });
  show();
  return b;
}

// actions : [{ label, kind: "primary"|"danger"|"", onClick: () => (false pour garder ouverte) }]
function openModal(title, bodyNode, actions, opts) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const box = document.createElement("div");
  box.className = "modal";
  const h = document.createElement("h3");
  h.textContent = title;
  box.appendChild(h);
  if (bodyNode) box.appendChild(bodyNode);
  const btns = document.createElement("div");
  btns.className = "btns" + (actions.length === 2 ? " two" : "");
  btns.style.marginTop = "16px";
  const close = () => bg.remove();
  actions.forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.kind || "");
    b.textContent = a.label;
    b.addEventListener("click", () => { const keep = a.onClick ? a.onClick() === false : false; if (!keep) close(); });
    btns.appendChild(b);
  });
  box.appendChild(btns);
  bg.appendChild(box);
  if (!(opts && opts.locked)) bg.addEventListener("click", e => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  return close;
}
// Fenêtre avec barre de progression (ne se ferme pas en touchant le fond). Renvoie { set(fraction, texte), close }.
function openProgress(title, text, actions) {
  const wrap = document.createElement("div");
  const bar = document.createElement("div"); bar.className = "progress";
  const fill = document.createElement("div"); fill.className = "progress-fill";
  bar.appendChild(fill);
  bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", "100");
  const p = document.createElement("p"); p.className = "muted progress-text"; p.textContent = text || "";
  wrap.append(bar, p);
  const close = openModal(title, wrap, actions || [], { locked: true });
  const set = (frac, txt) => {
    const v = Math.max(0, Math.min(100, Math.round((frac || 0) * 100)));
    fill.style.width = v + "%"; bar.setAttribute("aria-valuenow", String(v));
    if (txt !== undefined) p.textContent = txt;
  };
  set(0);
  return { set, close };
}

function computeStreak() {
  const days = new Set(state.history.filter(h => h.reviewed > 0).map(h => h.date));
  const d = new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate() - 1); // la série tient encore si on a révisé hier
  let n = 0;
  while (days.has(todayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

}

// rv.phase : "config" (choix de la session) | "run" (session en cours)
// rv.cfg est gardé en mémoire tant que l'appli est ouverte (pas sauvegardé).
// Sens par carte, relatif à la liste de la carte : "toT" = langues d'appui → langue apprise, "fromT" = l'inverse.
// Une session peut mélanger des listes de langues différentes.

const NO_FOLDER = "__none__";

function defaultSessionCfg() {
  return { scope: "all", folderIds: [], listIds: [], tags: [], cat: "unknown", lang: accountLangs().target,
    onlyDue: true, dir: "toT", count: state.settings.sessionSize, mode: "cards" };
}
function allTags() {
  const s = new Set();
  state.cards.forEach(c => c.tags.forEach(tg => s.add(tg)));
  return [...s].sort((a, b) => a.localeCompare(b));
}
// Langues de chaque liste (calculées une fois pour tout un filtrage).
function langsByList() {
  const m = new Map();
  state.lists.forEach(l => m.set(l.id, listLangs(l)));
  return m;
}
// Langues apprises présentes dans les listes, dans l'ordre de LANGUAGES.
function targetLangsInUse() {
  const s = new Set(state.lists.map(l => listLangs(l).target));
  return LANG_CODES.filter(c => s.has(c));
}
function sessionPool(cfg) {
  const now = Date.now();
  const lgs = langsByList();
  const lists = new Map(state.lists.map(l => [l.id, l]));
  return state.cards.filter(c => {
    const lg = lgs.get(c.listId);
    if (!lg || !cardUsable(c, lg)) return false;
    if (cfg.scope === "folders") {
      const l = lists.get(c.listId);
      if (!cfg.folderIds.includes(l && l.folderId ? l.folderId : NO_FOLDER)) return false;
    }
    if (cfg.scope === "lists" && !cfg.listIds.includes(c.listId)) return false;
    if (cfg.scope === "tags" && !c.tags.some(tg => cfg.tags.includes(tg))) return false;
    if (cfg.scope === "cat" && Leitner.category(c) !== cfg.cat) return false;
    if (cfg.scope === "lang" && lg.target !== cfg.lang) return false;
    if (cfg.onlyDue && !Leitner.isDue(c, now)) return false;
    return true;
  });
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function toggleIn(a, v) { const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); }
